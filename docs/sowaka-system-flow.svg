<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc">
  <title id="title">Sowaka HRMS complete system flow</title>
  <desc id="desc">Architecture flow connecting employee and HR clients to the backend, business modules, MongoDB, ESSL attendance, S3, Zoho email, Firebase notifications, and hosted games.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fbf8f3"/><stop offset="1" stop-color="#f2ebe1"/></linearGradient>
    <linearGradient id="api" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#be5a36"/><stop offset="1" stop-color="#8f3e26"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#493a2e" flood-opacity=".13"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0l10 5-10 5z" fill="#75685b"/></marker>
    <marker id="arrowAccent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0l10 5-10 5z" fill="#be5a36"/></marker>
    <style>
      .title{font:800 32px 'Arial',sans-serif;fill:#352b24}.subtitle{font:400 15px 'Arial',sans-serif;fill:#786b60}.section{font:700 14px 'Arial',sans-serif;fill:#9b4a30;letter-spacing:1.4px}.h{font:700 18px 'Arial',sans-serif;fill:#3d322a}.b{font:400 13px 'Arial',sans-serif;fill:#6e6258}.white{fill:#fff}.wh{font:700 20px 'Arial',sans-serif;fill:#fff}.wb{font:400 13px 'Arial',sans-serif;fill:#f9e9df}.small{font:400 12px 'Arial',sans-serif;fill:#75685d}.node{fill:#fff;stroke:#dfd3c6;stroke-width:1.5;rx:16;filter:url(#shadow)}.module{fill:#fffaf5;stroke:#e0cbbd;stroke-width:1.4;rx:13}.external{fill:#f2f6f1;stroke:#afc3ad;stroke-width:1.5;rx:14}.line{fill:none;stroke:#75685b;stroke-width:2;marker-end:url(#arrow)}.accent{fill:none;stroke:#be5a36;stroke-width:2.4;marker-end:url(#arrowAccent)}.dash{fill:none;stroke:#9f9185;stroke-width:1.8;stroke-dasharray:7 6;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1600" height="1120" fill="url(#bg)"/>
  <text x="70" y="62" class="title">Sowaka HRMS — Complete System Flow</text>
  <text x="70" y="91" class="subtitle">Employee, manager and HR experiences connected through one secured API and shared operational data</text>

  <text x="70" y="137" class="section">USERS &amp; CLIENT APPLICATIONS</text>
  <rect class="node" x="70" y="158" width="315" height="138"/>
  <circle cx="112" cy="202" r="22" fill="#f4dfd4"/><path d="M103 203a9 9 0 1 1 18 0 9 9 0 0 1-18 0m-7 31c2-13 30-13 32 0" fill="none" stroke="#a6482c" stroke-width="3"/>
  <text x="148" y="194" class="h">Employee / Manager</text><text x="148" y="219" class="b">Flutter mobile app</text>
  <text x="96" y="258" class="small">Connect • Manage • Grow • Profile</text><text x="96" y="279" class="small">Requests • approvals • notifications • games</text>

  <rect class="node" x="455" y="158" width="315" height="138"/>
  <circle cx="497" cy="202" r="22" fill="#e3eadf"/><rect x="486" y="191" width="22" height="20" rx="2" fill="none" stroke="#567455" stroke-width="3"/><path d="M490 198h14m-14 6h9" stroke="#567455" stroke-width="2"/>
  <text x="533" y="194" class="h">HR / Dashboard User</text><text x="533" y="219" class="b">React + Vite web app</text>
  <text x="481" y="258" class="small">Org-wide views • employee setup • settings</text><text x="481" y="279" class="small">Games • HR decisions • administrative control</text>

  <path class="accent" d="M227 296v64h454"/><path class="accent" d="M612 296v64h69"/>
  <text x="356" y="348" class="small">HTTPS JSON / multipart + bearer token</text>

  <rect x="565" y="380" width="470" height="150" rx="20" fill="url(#api)" filter="url(#shadow)"/>
  <text x="800" y="424" text-anchor="middle" class="wh">Backend — Node.js / Express / TypeScript</text>
  <text x="800" y="451" text-anchor="middle" class="wb">Request ID → security middleware → authentication → authorization</text>
  <text x="800" y="477" text-anchor="middle" class="wb">Routes → controllers → domain services → MongoDB / integrations</text>
  <rect x="625" y="492" width="350" height="22" rx="11" fill="#fff" opacity=".15"/>
  <text x="800" y="508" text-anchor="middle" class="wb">Org scope • current reporting edge • no self-approval</text>

  <text x="70" y="582" class="section">DOMAIN FLOWS</text>
  <rect class="module" x="70" y="606" width="220" height="106"/><text x="92" y="637" class="h">Authentication</text><text x="92" y="662" class="b">Email OTP → hashed challenge</text><text x="92" y="683" class="b">Derived role → hashed session</text>
  <rect class="module" x="318" y="606" width="220" height="106"/><text x="340" y="637" class="h">People &amp; Reporting</text><text x="340" y="662" class="b">Employee master and org</text><text x="340" y="683" class="b">Manager relationship graph</text>
  <rect class="module" x="566" y="606" width="220" height="106"/><text x="588" y="637" class="h">Work Requests</text><text x="588" y="662" class="b">Leave • overtime • claims</text><text x="588" y="683" class="b">Attendance regularization</text>
  <rect class="module" x="814" y="606" width="220" height="106"/><text x="836" y="637" class="h">Talent</text><text x="836" y="662" class="b">Manager feedback</text><text x="836" y="683" class="b">Recognition nominations</text>
  <rect class="module" x="1062" y="606" width="220" height="106"/><text x="1084" y="637" class="h">Connect &amp; Games</text><text x="1084" y="662" class="b">Scoped social feed</text><text x="1084" y="683" class="b">Hosted games + leaderboard</text>
  <rect class="module" x="1310" y="606" width="220" height="106"/><text x="1332" y="637" class="h">Notifications</text><text x="1332" y="662" class="b">Persistent inbox + FCM</text><text x="1332" y="683" class="b">Immediate / batch / scheduled</text>

  <path class="line" d="M680 530v48H180v28"/><path class="line" d="M725 530v60H428v16"/><path class="line" d="M770 530v68H676v8"/><path class="line" d="M830 530v68h94v8"/><path class="line" d="M875 530v60h297v16"/><path class="line" d="M920 530v48h500v28"/>

  <text x="70" y="770" class="section">DATA &amp; EXTERNAL SERVICES</text>
  <rect x="530" y="792" width="540" height="124" rx="18" fill="#43382f" filter="url(#shadow)"/>
  <text x="800" y="828" text-anchor="middle" class="wh">MongoDB — Operational Source of Truth</text>
  <text x="800" y="856" text-anchor="middle" class="wb">users • companies • sessions • requests • feedback • Connect • games</text>
  <text x="800" y="879" text-anchor="middle" class="wb">attendance • notifications • device tokens • job batches / watermarks</text>
  <text x="800" y="900" text-anchor="middle" class="wb">Unique, TTL and query indexes created during backend startup</text>
  <path class="accent" d="M800 530v262"/>

  <rect class="external" x="70" y="792" width="200" height="124"/><text x="92" y="827" class="h">Zoho SMTP</text><text x="92" y="852" class="b">Login OTP delivery</text><text x="92" y="877" class="small">Required for real sign-in</text>
  <path class="dash" d="M180 712v80"/>

  <rect class="external" x="300" y="792" width="200" height="124"/><text x="322" y="827" class="h">ESSL SQL Server</text><text x="322" y="852" class="b">Biometric punch source</text><text x="322" y="877" class="small">Incremental import + watermark</text>
  <path class="dash" d="M400 792v-55h276v-25"/>
  <path class="line" d="M500 854h30"/>

  <rect class="external" x="1100" y="792" width="200" height="124"/><text x="1122" y="827" class="h">AWS S3</text><text x="1122" y="852" class="b">Private receipts and media</text><text x="1122" y="877" class="small">Presigned reads • encryption</text>
  <path class="dash" d="M1172 712v80"/>

  <rect class="external" x="1330" y="792" width="200" height="124"/><text x="1352" y="827" class="h">Firebase FCM</text><text x="1352" y="852" class="b">Push notification delivery</text><text x="1352" y="877" class="small">Invalid-token cleanup</text>
  <path class="dash" d="M1420 712v80"/>
  <path class="accent" d="M1530 854h35V227H770"/>

  <rect class="node" x="1040" y="964" width="490" height="94"/>
  <text x="1064" y="997" class="h">External HTTPS Hosted Game</text><text x="1064" y="1022" class="b">Mobile WebView injects window.Sowaka.submitScore(score)</text><text x="1064" y="1043" class="small">No session token is exposed to the hosted page; score travels through protected API</text>
  <path class="dash" d="M1172 712v252"/>
  <path class="accent" d="M1040 1010H350V296"/>

  <rect x="70" y="964" width="910" height="94" rx="16" fill="#fff" stroke="#ded2c5"/>
  <text x="94" y="994" class="h">Decision ownership</text>
  <text x="94" y="1019" class="b">Manager: direct-report leave, overtime and attendance corrections • HR: org-wide pending decisions and reimbursement final decision</text>
  <text x="94" y="1043" class="small">Schedulers: Connect lifecycle 07:00 IST • notification batches / reminders / digests • attendance import is externally scheduled</text>

  <text x="1530" y="1090" text-anchor="end" class="small">Current implementation map • 3 August 2026</text>
</svg>
