# Production nginx site for the API (/etc/nginx/sites-enabled/sowaka on the API server).
# Kept here so the live file has a reviewed source. Apply: copy over the live file, `nginx -t`, `systemctl reload nginx`.
#
# Changes from the file live before 23 Oct 2026:
#  - An upstream with `keepalive`: nginx reuses connections to Node instead of opening one per
#    request (thousands a minute during company events), and `Connection ""` lets it.
#  - `proxy_read_timeout` stays 60s (Suwi answers and reports can take a while); the backend itself
#    now fails a request that waits 15 s for a database connection, so requests no longer pile up.
# Also in /etc/nginx/nginx.conf (applied 23 Oct): worker_connections 8192; worker_rlimit_nofile 32768.

upstream sowaka_api {
    server 127.0.0.1:4000;
    keepalive 64;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    client_max_body_size 50m;

    location /connect/socket {
        proxy_pass http://sowaka_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    location / {
        proxy_pass http://sowaka_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
