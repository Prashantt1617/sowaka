  knock:()=>[0,.12].forEach(d=>{ tone(160,.1,{gain:.24,at:d,to:85}); hiss(.03,{at:d,gain:.05,freq:900,q:1.4}); }),

function roomSounds(prev,room,uid){ if(!soundOn||!prev)return;

  if(v.result&&!was.result){ const after=hypeOn()?Math.max(0,boardDoneAt(v)-Date.now())/1000:0;

/* The sounds' face to the page: update(prevRoom, room, myUserId) after each room view, toggle(), muted(), unlock() on a tap.

  toggle(){ soundOn=!soundOn; try{ localStorage.setItem(SOUND_KEY,soundOn?'on':'off'); }catch(e){} if(soundOn){ unlockAudio(); sfx('pop'); } },

const soundButton=()=>{ const off=!!(window.PokerSounds&&window.PokerSounds.muted()); return `<button class="tbtn snd" data-act="sound" aria-label="${off?'Muted: tap for sound':'Sound on: tap to mute'}">${off?'🔇':'🔊'}</button>`; };

/** On for this company and this table. (nextUi is the gate; it may be missing in an older page, so typeof.) */
const hypeOn=()=>typeof nextUi==='function'&&!!nextUi()&&state.mode==='rooms'&&!!(state.room&&state.room.big);
/** No more betting: two or more still in, all of them (or all but one) all in, nobody to act. The board then runs out. */

/* Your hand in words, worked out here from your two cards and the board: "Pair of Queens", "Two pair, Kings and Nines". */
const RANKS='23456789TJQKA', RNAME=['Two','Three','Four','Five','Six','Seven','Eight','Nine','Ten','Jack','Queen','King','Ace'];
const many=r=>r===4?'Sixes':RNAME[r]+'s';
/** The best five of these cards: {cat: 0 high card .. 9 royal flush, text}. */
function bestHand(cards){ const cs=cards.map(c=>({r:RANKS.indexOf(c[0]),s:c[1]})).filter(c=>c.r>=0);
  const cnt=Array(13).fill(0), suits={}; cs.forEach(c=>{ cnt[c.r]++; (suits[c.s]=suits[c.s]||[]).push(c.r); });
  const high=rs=>{ const has=new Set(rs); for(let h=12;h>=3;h--){ let ok=true; for(let k=0;k<5;k++){ const r=h-k; if(!has.has(r<0?12:r)){ ok=false; break; } } if(ok)return h; } return -1; };
  const fs=Object.keys(suits).find(s=>suits[s].length>=5);
  if(fs){ const h=high(suits[fs]); if(h===12)return {cat:9,text:'Royal flush'}; if(h>=0)return {cat:8,text:`Straight flush, ${RNAME[h].toLowerCase()} high`}; }
  const quads=[], trips=[], pairs=[]; for(let r=12;r>=0;r--){ if(cnt[r]===4)quads.push(r); else if(cnt[r]===3)trips.push(r); else if(cnt[r]===2)pairs.push(r); }
  if(quads.length)return {cat:7,text:`Four ${many(quads[0])}`};
  if(trips.length&&(trips.length>1||pairs.length)){ const p=Math.max(trips[1]==null?-1:trips[1],pairs[0]==null?-1:pairs[0]); return {cat:6,text:`Full house, ${many(trips[0])} full of ${many(p)}`}; }
  if(fs)return {cat:5,text:`Flush, ${RNAME[Math.max(...suits[fs])].toLowerCase()} high`};
  const st=high(cs.map(c=>c.r)); if(st>=0)return {cat:4,text:`Straight, ${RNAME[st].toLowerCase()} high`};
  if(trips.length)return {cat:3,text:`Three ${many(trips[0])}`};
  if(pairs.length>=2)return {cat:2,text:`Two pair, ${many(pairs[0])} and ${many(pairs[1])}`};
  if(pairs.length)return {cat:1,text:`Pair of ${many(pairs[0])}`};
  return {cat:0,text:`${RNAME[Math.max(...cs.map(c=>c.r))]} high`}; }
/** Your hand in words with what it might become: {text, tier 0..3}. Before the flop: "Pair of Queens", or "Ace King suited". */
function handWords(hole,board){ hole=(hole||[]).filter(Boolean); board=(board||[]).filter(Boolean); if(hole.length<2)return null;
  if(!board.length){ const [a,b]=hole.map(c=>RANKS.indexOf(c[0])).sort((x,y)=>y-x);
    if(a===b)return {text:`Pair of ${many(a)}`,tier:a>=8?2:1};
    return {text:`${RNAME[a]} ${RNAME[b]}${hole[0][1]===hole[1][1]?' suited':''}`,tier:0}; }
  const h=bestHand([...hole,...board]), tier=h.cat>=4?3:h.cat>=2?2:h.cat===1?1:0;
  let draw='';
  if(board.length<5&&h.cat<4){ const all=[...hole,...board];
    const fl=Object.entries(all.reduce((m,c)=>(m[c[1]]=(m[c[1]]||0)+1,m),{})).find(([s,n])=>n===4&&hole.some(c=>c[1]===s));
    const rs=new Set(all.map(c=>RANKS.indexOf(c[0]))), mineR=hole.map(c=>RANKS.indexOf(c[0]));
    let sd=false; for(let h2=12;h2>=3&&!sd;h2--){ const win=[0,1,2,3,4].map(k=>h2-k<0?12:h2-k); if(win.filter(r=>rs.has(r)).length===4&&win.some(r=>mineR.includes(r)))sd=true; }
    draw=fl?' · flush draw':sd?' · straight draw':''; }
  return {text:h.text+draw,tier}; }
function handPill(hole,board){ const h=handWords(hole,board); return h?`<div class="hand hs t${h.tier}">${esc(h.text)}</div>`:'<div class="hand"></div>'; }

  for(let k=0;k<n;k++)fx('hchip',a.x+(k%2?3:-3),a.y-k*2,{'--x':(b.x-a.x)+'px','--y':(b.y-a.y+k*2)+'px','--cc':color||'#d23c3c','--dl':(delay+k*55)+'ms','--ms':(ms||480)+'ms'},delay+k*55+(ms||480)+60); }

/** Where an h-high banner fits: on the felt (the widest that fits, nearest under the board), else on its side in the
    empty top of the dock beside the table. First clear of everything; failing that (a short phone) it may cover other
    players' faces, never a card, a bet, the pot or a winner's seat (`keep`). Null when nowhere. */
function bannerSpot(tb,h,keep){ const st=rectOf(tb.querySelector('.stage')); if(!st)return null;
  const boxes=sel=>[...tb.querySelectorAll(sel)].map(rectOf).filter(Boolean);
  const cards=boxes('.stage .seat .hole,.stage .seat .shown,.stage .seat .bet,.stage .seat .dealer,.board .row>*,.center .pot,.center .actpop');
  const all=cards.concat(boxes('.stage .seat .ring,.stage .seat .plate,.stage .seat .tag,.stage .seat .bubble'));
  const mustSee=cards.concat((keep||[]).flatMap(el=>[...el.querySelectorAll('.ring,.plate,.tag')].map(rectOf).filter(Boolean)));
  const board=rectOf(tb.querySelector('.board'))||st, areas=[{r:st,want:board.bottom+10}];

  if(dock&&first&&first.top-dock.top>h+12)areas.push({r:{left:dock.left,right:dock.right,width:dock.width,top:dock.top,bottom:first.top},want:dock.top+(first.top-dock.top-h)/2});
  for(const busy of [all,mustSee])for(const {r,want} of areas)for(const w of [r.width-12,320,280,240,200]){ if(w>r.width-12||w<180)continue; const x=r.left+(r.width-w)/2; let best=null;
    for(let y=r.top+6;y+h<=r.bottom-4;y+=3){ if(busy.some(b=>b.left-4<x+w&&b.right+4>x&&b.top-4<y+h&&b.bottom+4>y))continue;
      const d=Math.abs(y-want); if(!best||d<best.d)best={x,y,w,d}; }
    if(best)return best; }

/** Who won, by how much and how big a moment it is; played once the board is out. */
function celebrate(v,hand){ const res=v.result, tb=app.querySelector('#table.big.next'), cur=state.table;
  if(!tb||!res||!res.pots.length||!cur||`${cur.id}:${cur.handNo}`!==hand)return;
  celebrated(v,hand,tb,res); hypeSync(); }
function celebrated(v,hand,tb,res){
  const seatEls=[...tb.querySelectorAll('.stage .seat')], winners=[...new Set(res.pots.flatMap(p=>p.winners))];
  const won={}; res.pots.forEach(p=>p.winners.forEach(w=>{ won[w]=(won[w]||0)+Math.floor(p.amount/p.winners.length); }));
  const total=res.pots.reduce((a,p)=>a+p.amount,0), inPlay=Math.max(total,v.seats.reduce((a,s)=>a+(s.stack||0),0));
  const top=res.shown.find(s=>s.seat===res.pots[0].winners[0]), named=top&&top.best&&top.best.length===5?bestHand(top.best):null;
  const strong=!!named&&named.cat>=4, big=strong||total>=.4*inPlay, mine=v.mySeat!=null&&winners.includes(v.mySeat), hold=HYPE.hold;
  HYPE.win={hand,at:Date.now(),winners};
  const pot=HYPE.potRect||rectOf(tb.querySelector('.board')), H=mine?76:66, spot=big?bannerSpot(tb,H,winners.map(w=>seatEls[w]).filter(Boolean)):null;
  winners.forEach((w,i)=>{ const ring=rectOf(seatEls[w]&&seatEls[w].querySelector('.ring')); if(!ring)return;

    const m=midOf(ring); if(big)setTimeout(()=>confetti(m.x,m.y,26,90),520);
    fx('hplus'+(v.seats[w]&&v.seats[w].me?' me':'')+(hold?' hold':''),m.x,ring.top-6,{'--dl':(calm()?0:560+i*120)+'ms'},hold?3600e3:2600,`+${esc(fmt(won[w]))}`); });
  sfx('slide');
  if(mine){ sfx('win'); haptic('heavy'); const me=rectOf(seatEls[v.mySeat]&&seatEls[v.mySeat].querySelector('.ring')); if(me&&!big){ const m=midOf(me); setTimeout(()=>confetti(m.x,m.y,18,70),520); } }
  if(!big)return;
  sfx('fanfare');
  const names=winners.map(w=>v.seats[w]).map(s=>s.me?'You':/^bot:/.test(s.userId)?String(s.name).replace(/^House /,''):first(s.name));
  if(!spot)return;   // nowhere clear of the cards: the seat's confetti and "+amount" instead
  const head=strong?named.text.split(',')[0].toUpperCase():'BIG WIN';
  const line=`${names.join(' & ')} ${names.length>1?'split':names[0]==='You'?'win':'wins'} ${fmt(total)}${strong&&named.cat===6&&spot.w>=300?' · '+named.text.split(', ')[1]:''}`;
  const ms=hold?3600e3:mine?3000:2600, hf=Math.min(mine?31:26,Math.floor((spot.w-28)/(head.length*.8)));
  fx('hbanner'+(mine?' me':'')+(hold?' hold':''),spot.x,spot.y,{width:spot.w+'px',height:H+'px','--ms':ms+'ms','--hf':hf+'px'},ms,`<b>${esc(head)}</b><span>${esc(line)}</span>`);
  setTimeout(()=>confetti(spot.x+spot.w/2,spot.y+H/2,mine?44:30,mine?170:130),120); }

/** After every draw: what changed at the table since the last one, and the effects that go with it. */
function hypeSync(){
  const tb=app.querySelector('#table.big.next'), v=tb&&hypeOn()?(state.view==='watch'?state.watching:state.table):null;
  if(!v||!v.seats){ if(HYPE.prev){ hypeLayer().textContent=''; HYPE.prev=null; } return; }
  const t=Date.now(), p=HYPE.prev, hand=`${v.id}:${v.handNo}`, fresh=!p||p.id!==v.id, same=!fresh&&p.hand===hand;
  const seatEls=[...tb.querySelectorAll('.stage .seat')], quiet=calm();
  // a game-over box or a sheet in front of the table: nothing flies over it
  hypeLayer().classList.toggle('off',!!app.querySelector('.over,.sheet'));
  const potNow=rectOf(tb.querySelector('.center .pot'));
  const potAt=potNow||HYPE.potRect||rectOf(tb.querySelector('.board .row'));
  // chips: a bet made slides from the seat to its spot; at the end of a street the bets slide into the pot
  let swept=false;
  if(same)v.seats.forEach((s,i)=>{ const was=p.bets[i]||0, now=s.bet||0, el=seatEls[i]; if(!el)return;
    if(now>was&&now>0)chips(rectOf(el.querySelector('.ring')),rectOf(el.querySelector('.bet')),2,'#d23c3c',0,380);
    else if(was>0&&!now&&HYPE.betRects[i]){ chips(HYPE.betRects[i],potAt,3,'#d23c3c',i*30,460); swept=true; } });
  // someone just went all in
  if(same)v.seats.forEach((s,i)=>{ if(s.allIn&&!p.allIn[i]){ HYPE.allin[i]={hand,at:t}; sfx('allin'); } });
  // a new hand: the cards are dealt
  if(!fresh&&p.hand!==hand){ HYPE.deal={hand,at:t}; HYPE.allin={}; HYPE.win=null; }
  // the board runs out with everyone all in: the table dims round the board until the river is over
  const done=boardDoneAt(v);
  if(done>t&&runout(v)&&HYPE.dimKey!==hand){ HYPE.dimKey=hand; const st=rectOf(tb.querySelector('.stage')), bd=rectOf(tb.querySelector('.board'));
    if(st&&bd){ const ms=done-t+500, c=midOf(bd), cx=c.x-st.left, cy=c.y-st.top;
      fx('hdim',st.left-8,st.top,{width:(st.width+16)+'px',height:st.height+'px','--ms':ms+'ms',background:`radial-gradient(${Math.round(bd.width*.8)}px ${Math.round(bd.height*.85)}px at ${Math.round(cx+8)}px ${Math.round(cy)}px,rgba(0,0,0,0) 70%,rgba(2,8,5,.62) 100%)`},ms);
      if(!potNow&&HYPE.potRect){ const m=midOf(HYPE.potRect); fx('hlabel',m.x,m.y,{'--ms':ms+'ms'},ms,'ALL IN'); } } }
  // who won waits for the river; then the chips go over, the seat glows, and a big pot gets its banner
  if(v.result&&!HYPE.seen.has(hand)){ HYPE.seen.add(hand);
    if(same)HYPE.before={hand,stacks:p.stacks,busted:p.busted};
    if(!fresh){ const at=Math.max(t+(swept?420:0),done+150); setTimeout(()=>celebrate(v,hand),at-t); } }
  if(v.result&&done>t){ tb.classList.add('hhold'); if(HYPE.holdKey!==hand){ HYPE.holdKey=hand; setTimeout(()=>{ if(app.querySelector('#table.next'))render(); },done-t+40); }
    // the chips and who is out are as they were before the result, until the river is over
    const b=HYPE.before&&HYPE.before.hand===hand?HYPE.before:null;
    if(b)seatEls.forEach((el,i)=>{ if(b.busted[i]||!v.seats[i])return; const sp=el.querySelector('.plate span'); if(sp)sp.textContent=fmt(b.stacks[i]);
      if(v.seats[i].busted){ el.classList.remove('out'); const tag=el.querySelector('.tag'); if(tag){ tag.className='tag allin'; tag.textContent='ALL IN'; } } }); }
  // in the table: the deal, your turn, an all-in, the winners' glow, the last seconds on your clock
  const keep=(el,cls,at,len)=>{ const since=t-at; if(!el||since>=len||quiet)return false; el.classList.add(cls); el.style.setProperty('--hd',(-since)+'ms'); return true; };
  if(HYPE.deal.hand===hand){ const c=midOf(rectOf(tb.querySelector('.board'))||rectOf(tb.querySelector('.stage'))||{left:0,top:0,width:0,height:0});
    const n=v.seats.length, btn=Math.max(0,v.seats.findIndex(s=>s.button)), order=i=>(i-btn-1+n)%n;
    seatEls.forEach((el,i)=>{ const h=el.querySelector('.hole'); if(!h)return; const r=rectOf(h); if(!r)return; const m=midOf(r);
      if(keep(h,'hdeal',HYPE.deal.at+order(i)*70,560)){ h.style.setProperty('--fx',Math.round(c.x-m.x)+'px'); h.style.setProperty('--fy',Math.round(c.y-m.y)+'px'); } });
    tb.querySelectorAll('.mine .pc.big').forEach((el,k)=>{ const r=rectOf(el); if(!r)return; const m=midOf(r);
      if(keep(el,'hdeal',HYPE.deal.at+(order(v.mySeat||0)+k*n)*70,800)){ el.style.setProperty('--fx',Math.round(c.x-m.x)+'px'); el.style.setProperty('--fy',Math.round(c.y-m.y)+'px'); } }); }
  if(v.choices&&v.toAct!=null&&v.toAct===v.mySeat){ const key=`${hand}:${v.street}:${v.deadline}`; if(HYPE.turn.key!==key)HYPE.turn={key,at:t};
    keep(tb.querySelector('.abar'),'hturn',HYPE.turn.at,1600); }
  for(const i in HYPE.allin){ const a=HYPE.allin[i]; if(a.hand===hand)keep(seatEls[i],'hallin',a.at,1500); }
  if(HYPE.win&&HYPE.win.hand===hand&&v.result)HYPE.win.winners.forEach(w=>{ const el=seatEls[w]; if(!el)return; el.classList.add('hwin'); el.style.setProperty('--hd',(quiet?0:-(t-HYPE.win.at))+'ms'); });
  const myRing=tb.querySelector('.seat.me.toact .ring'); if(myRing)myRing.style.setProperty('--hp',(-(t%1400))+'ms');
  // for next time: where each bet and the pot are, and who had bet what
  HYPE.betRects=seatEls.map(el=>rectOf(el.querySelector('.bet')));
  if(potNow)HYPE.potRect=potNow;
  HYPE.prev={id:v.id,hand,bets:v.seats.map(s=>s.bet||0),allIn:v.seats.map(s=>!!s.allIn),stacks:v.seats.map(s=>s.stack||0),busted:v.seats.map(s=>!!s.busted)}; }

async function load(){ try{
    const [h,rh]=await Promise.all([P.request('poker:hello').catch(()=>({})),P.request('room:hello')]);
    state.ev=(h&&h.shared)||null; state.mine=(h&&h.mine)||state.mine; state.me=rh.me||state.me; state.rooms=rh.rooms||[]; state.invites=rh.invites||[];
    state.big=!!rh.big; state.tables=rh.tables||null; state.next=!!rh.next;
    /* At an event's table: that first. Else the group game (the event, if one is on, is a card in its lobby). */
    if(h&&h.table&&h.table.status==='playing'&&!rh.room){ state.mode='event'; state.shared=state.ev; state.table=h.table; state.view='table'; }
    else if(state.mode==='event'){ state.shared=state.ev; if(h&&h.table)state.table=h.table; }
    /* Opening the game while a Shootout's lobby is open, its rounds are on, or its results are up: straight to it (an old practice
       table is left, as below; a table with colleagues still comes first). */
    else if(!state.opened&&soShown(state.ev)&&!(rh.room&&!rh.room.practice)){ if(rh.room){ try{ await P.request('room:leave'); }catch(e){} }
      state.room=null; state.mode='event'; state.shared=state.ev; state.view='lobby'; if(h&&h.table)state.table=h.table; }
    /* Opening the game again (not a reconnect) is not a way back into an old
       practice table: that one is left, and the lobby shows. A table with
       colleagues is still yours to go back to. */
    else if(!state.opened&&rh.room&&rh.room.practice){ try{ await P.request('room:leave'); }catch(e){} onRoom(null); }
    /* Watching ends with the connection (the server lets go of a watcher whose page went): back, watch it again. */
    else if(!rh.room&&state.watchCode){ const code=state.watchCode;
      try{ onRoom(await P.request('room:watch',{code})); }catch(err){ state.watchCode=null; onRoom(null); toast(err.message); } }
    else onRoom(rh.room||null);
    state.opened=true;
  }catch(err){ toast(err.message); } }
