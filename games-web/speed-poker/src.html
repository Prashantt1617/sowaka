<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<!--POKER-TICKET-->
<title>Speed Poker</title>
<style>
:root{
  --bg:#081a12; --bg2:#0d2419; --panel:#112b20; --panel2:#163627; --line:rgba(255,255,255,.09);
  --ink:#eef5ef; --muted:#9db3a6; --faint:#6f877a;
  --felt1:#23744d; --felt2:#155238; --felt3:#0e3a28; --rail:#1b130c; --rail2:#3a2716;
  --gold:#e5b850; --gold2:#b88a2a; --red:#e0564b; --blue:#3f8cff; --green:#2fbf71; --club:#1f9d55; --diamond:#2f7de1;
  --fold:#5b2b2b; --fold2:#a8473f; --call:#1d5f8a; --call2:#2f8fd0; --raise:#8a5a12; --raise2:#e0a12f;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Roboto","Segoe UI",system-ui,sans-serif;
  --display:"Avenir Next","SF Pro Display","Roboto Condensed",-apple-system,system-ui,sans-serif;
  --mono:"SF Mono",ui-monospace,Menlo,Consolas,monospace;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.35;overscroll-behavior:none}
body{-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.hidden{display:none!important}
#app{position:fixed;inset:0;display:flex;flex-direction:column;padding-top:var(--safe-t)}

/* ---------- shared bits ---------- */
.chip{white-space:nowrap;flex:none;display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:700;letter-spacing:.02em;background:rgba(255,255,255,.08);color:var(--ink)}
.chip.gold{background:rgba(229,184,80,.16);color:var(--gold)}
.chip.red{background:rgba(224,86,75,.16);color:#ff8a7f}
.chip.green{background:rgba(47,191,113,.16);color:#6fe0a3}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:48px;border-radius:14px;padding:0 18px;font-weight:800;font-size:16px;letter-spacing:.01em}
.btn.primary{background:linear-gradient(180deg,#f2c95e,#d49c25);color:#2a1a02;box-shadow:0 6px 18px rgba(212,156,37,.25)}
.btn.ghost{background:rgba(255,255,255,.07);color:var(--ink)}
.btn.small{min-height:36px;font-size:14px;border-radius:10px;padding:0 12px}
.btn:disabled{opacity:.45}
.avatar.xs{width:24px;height:24px;font-size:9px}
.avatar.sm{width:30px;height:30px;font-size:11px}
.stack{display:flex;align-items:center}
.stack .avatar{margin-left:-7px;box-shadow:0 0 0 2px var(--panel)}
.stack .avatar:first-child{margin-left:0}
.pp{display:inline-flex;align-items:center;gap:6px;margin:4px 10px 4px 0;font-size:13px;color:#d3e3d9}
.opt .avatar{display:inline-flex;vertical-align:middle;margin-right:6px}
.opt{display:inline-flex;align-items:center}
.me-face{width:34px;height:34px}
.avatar{width:38px;height:38px;border-radius:50%;background:#2a4a3a center/cover no-repeat;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;color:#dfeee5;flex:none}
.toast{position:fixed;left:50%;bottom:calc(90px + var(--safe-b));transform:translateX(-50%);background:rgba(10,18,14,.95);border:1px solid var(--line);padding:10px 14px;border-radius:12px;font-size:14px;max-width:88vw;z-index:50;box-shadow:0 8px 30px rgba(0,0,0,.4);transition:opacity .2s}

/* ---------- lobby ---------- */
#lobby{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 16px calc(24px + var(--safe-b))}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.brand{display:flex;align-items:center;gap:10px}
.brand .mark{width:36px;height:36px;border-radius:10px;background:linear-gradient(160deg,var(--felt1),var(--felt3));display:flex;align-items:center;justify-content:center;font-size:20px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)}
.brand h1{margin:0;font-family:var(--display);font-size:20px;font-weight:800;letter-spacing:.01em}
.brand .sub{font-size:12px;color:var(--muted)}
.hero{background:radial-gradient(120% 140% at 50% 0%,var(--felt1),var(--felt3) 70%);border-radius:20px;padding:18px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08),0 10px 30px rgba(0,0,0,.25);position:relative;overflow:hidden}
.hero h2{margin:0 0 4px;font-family:var(--display);font-size:22px;font-weight:800}
.hero p{margin:0 0 14px;color:#cfe4d7;font-size:14px}
.hero .row{display:flex;gap:10px}
.hero .row .btn{flex:1}
.hero .count{font-family:var(--display);font-size:40px;font-weight:800;line-height:1}
.suits{position:absolute;right:-6px;top:-10px;font-size:84px;opacity:.07;letter-spacing:-8px;pointer-events:none}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0 4px}
.stat{background:var(--panel);border-radius:12px;padding:10px 8px;text-align:center}
.stat b{display:block;font-family:var(--display);font-size:18px;font-weight:800}
.stat span{font-size:11px;color:var(--muted)}
.tabs{display:flex;gap:6px;margin:16px 0 10px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:8px 14px;border-radius:999px;background:var(--panel);color:var(--muted);font-weight:700;font-size:13px;white-space:nowrap}
.tab.on{background:var(--ink);color:#0b1a12}
.card{background:var(--panel);border-radius:16px;padding:6px 0;margin-bottom:12px}
.card h3{margin:8px 14px 6px;font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.rowi{display:flex;align-items:center;gap:10px;padding:9px 14px}
.rowi+.rowi{border-top:1px solid var(--line)}
.rowi .rank{width:24px;text-align:right;font-weight:800;color:var(--muted);font-variant-numeric:tabular-nums}
.rowi .who{flex:1;min-width:0}
.rowi .who b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rowi .who span{font-size:12px;color:var(--muted)}
.rowi .pts{font-weight:800;font-variant-numeric:tabular-nums}
.rowi.me{background:rgba(229,184,80,.08)}
.bar{height:8px;border-radius:4px;background:rgba(255,255,255,.08);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold2),var(--gold))}
.empty{padding:16px 14px;color:var(--muted);font-size:14px}
.rules p{margin:0 14px 10px;font-size:14px;color:#d3e3d9}
.pickbox{padding:4px 14px 12px}
.pickbox .q{font-size:13px;color:var(--muted);margin:10px 0 6px}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opt{padding:8px 10px;border-radius:10px;background:var(--panel2);font-size:13px;font-weight:700}
.opt.on{background:var(--gold);color:#2a1a02}
.stake{display:flex;align-items:center;gap:8px;margin-top:10px}
.stake input{flex:1;accent-color:var(--gold)}

/* ---------- table ---------- */
#table{flex:1;display:flex;flex-direction:column;min-height:0;background:radial-gradient(140% 90% at 50% 40%,#0f2a1e,#06130d 70%)}
.tbar{display:flex;align-items:center;gap:10px;padding:8px 12px}
.tbar .back{width:36px;height:36px;border-radius:10px;background:rgba(255,255,255,.07);display:flex;align-items:center;justify-content:center;font-size:18px}
.tbar .title{flex:1;min-width:0}
.tbar .title b{display:block;font-size:15px}
.tbar .title span{font-size:12px;color:var(--muted)}
.tbar .clock{font-family:var(--mono);font-weight:700;font-size:15px;padding:6px 10px;border-radius:10px;background:rgba(0,0,0,.3)}
.tbar .clock.low{color:#ff8a7f}
.stage{flex:1;position:relative;min-height:0;margin:0 8px}
.felt{position:absolute;left:7%;right:7%;top:9%;bottom:15%;border-radius:999px;background:radial-gradient(100% 70% at 50% 45%,var(--felt1),var(--felt2) 60%,var(--felt3));box-shadow:0 0 0 10px var(--rail),0 0 0 12px var(--rail2),0 0 0 13px rgba(229,184,80,.25),0 20px 50px rgba(0,0,0,.55),inset 0 0 60px rgba(0,0,0,.35)}
.felt::after{content:"";position:absolute;inset:14px;border-radius:999px;border:1px solid rgba(255,255,255,.07)}
.landscape .felt{left:10%;right:10%;top:14%;bottom:16%}
.center{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:8px;z-index:3}
.pot{font-weight:800;font-size:14px;padding:4px 12px;border-radius:999px;background:rgba(0,0,0,.35);color:#f3e2b2}
.board{display:flex;flex-direction:column;align-items:center;gap:7px}
/* the flop on top, the turn and the river under it, with the deck and the burn pile either side of them */
.board .row{display:flex;gap:6px;align-items:center}
.board .pc,.board .flip{width:46px;height:64px}
.board .pc{border-radius:7px}
.board .pc .r{font-size:20px;left:5px;top:3px}.board .pc .s{font-size:25px;right:5px;bottom:2px}
.board .side{width:30px;height:42px;position:relative;margin:0 6px;flex:none}
.board .side .pc{position:absolute;inset:0;width:30px;height:42px;border-radius:5px}
.board .deck .pc:nth-child(2){transform:translate(-2px,-2px)}.board .deck .pc:nth-child(3){transform:translate(-4px,-4px)}
.board .burn .pc{transform:rotate(calc(var(--i,0) * 9deg - 9deg))}
.board .side .lbl{position:absolute;left:50%;top:100%;transform:translateX(-50%);margin-top:3px;font-size:9px;letter-spacing:.12em;color:rgba(255,255,255,.35);font-weight:700}
/* a card dealt to the board: off the deck face down, into its place, then turned over */
.flip{position:relative;perspective:600px;flex:none}
.flip .in{position:absolute;inset:0;transform-style:preserve-3d;animation:dealflip .9s cubic-bezier(.2,.7,.2,1) both;animation-delay:var(--d,0ms)}
.flip .in>.pc{position:absolute;inset:0;width:100%;height:100%;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.flip .in>.pc.back{transform:rotateY(180deg)}
@keyframes dealflip{0%{transform:translate(var(--fx,90px),var(--fy,40px)) rotateY(180deg) scale(.6);opacity:0}12%{opacity:1}55%{transform:translate(0,0) rotateY(180deg) scale(1)}100%{transform:translate(0,0) rotateY(0) scale(1)}}
.board .burn .pc.new{animation:burnin .45s ease-out both;animation-delay:var(--d,0ms)}
@keyframes burnin{from{transform:translate(170px,0) rotate(0);opacity:0}to{opacity:1}}
.watermark{position:absolute;left:50%;top:62%;transform:translate(-50%,-50%);font-family:var(--display);font-weight:800;font-size:13px;letter-spacing:.3em;color:rgba(255,255,255,.08);white-space:nowrap}

/* cards: a four-colour deck reads at a glance on a phone */
.pc{width:38px;height:54px;border-radius:6px;background:#fbfbf7;color:#111;position:relative;box-shadow:0 2px 6px rgba(0,0,0,.4);flex:none;font-family:var(--display)}
.pc .r{position:absolute;left:4px;top:2px;font-weight:800;font-size:17px;line-height:1}
.pc .s{position:absolute;right:4px;bottom:1px;font-size:22px;line-height:1}
.pc.h{color:#d62d2d}.pc.d{color:#1f6fd6}.pc.c{color:#178a44}.pc.s{color:#141414}
.pc.slot{background:rgba(255,255,255,.06);box-shadow:inset 0 0 0 1px rgba(255,255,255,.1)}
.pc.back{background:repeating-linear-gradient(45deg,#7a1f1f 0 4px,#8f2a2a 4px 8px);box-shadow:inset 0 0 0 2px #f3e9d0,0 2px 6px rgba(0,0,0,.4)}
.pc.big{width:58px;height:82px;border-radius:9px}
.pc.big .r{font-size:26px;left:6px;top:4px}.pc.big .s{font-size:34px;right:6px;bottom:2px}
.pc.mini{width:24px;height:34px;border-radius:4px}
.pc.mini .r{font-size:12px;left:3px;top:1px}.pc.mini .s{font-size:13px;right:2px;bottom:0}
.pc.win{box-shadow:0 0 0 2px var(--gold),0 0 14px rgba(229,184,80,.7)}
.pc.dim{filter:brightness(.55)}
.pc.deal{animation:deal .28s ease-out both}
@media (prefers-reduced-motion:reduce){.flip .in,.board .burn .pc.new{animation:none}}
@keyframes deal{from{transform:translateY(-14px) scale(.9);opacity:0}to{transform:none;opacity:1}}

.seat{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;width:92px;z-index:4;transition:opacity .2s}
.seat .ring{position:relative;width:56px;height:56px;border-radius:50%;padding:3px;background:rgba(0,0,0,.35)}
.seat .ring .avatar{width:50px;height:50px;font-size:16px;box-shadow:0 0 0 2px rgba(0,0,0,.5)}
.seat.toact .ring{background:conic-gradient(var(--gold) calc(var(--t,1)*360deg),rgba(0,0,0,.35) 0)}
.seat.toact.hurry .ring{background:conic-gradient(var(--red) calc(var(--t,1)*360deg),rgba(0,0,0,.35) 0)}
.seat .plate{margin-top:-8px;background:rgba(8,14,11,.92);border:1px solid rgba(255,255,255,.1);border-radius:10px;padding:3px 8px;min-width:78px;text-align:center;position:relative;z-index:2}
.seat .plate b{display:block;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:84px}
.seat .plate span{font-size:13px;font-weight:800;color:#f3e2b2;font-variant-numeric:tabular-nums}
.seat.me .plate{border-color:rgba(229,184,80,.6)}
.seat.folded{opacity:.45}
.seat.out{opacity:.3}
.seat .tag{position:absolute;top:-6px;left:50%;transform:translateX(-50%);font-size:10px;font-weight:800;padding:1px 6px;border-radius:6px;background:#000;color:#fff;letter-spacing:.04em;z-index:3;white-space:nowrap}
.seat .tag.allin{background:var(--red)}
.seat .tag.act{background:#1f2a24;color:#cfe;}
.seat .tag.bounty{background:var(--gold);color:#2a1a02}
.seat .hole{position:absolute;top:-4px;display:flex;gap:0;z-index:1}
/* tucked against the avatar, not out over the board */
.seat .hole.r{left:58px}.seat .hole.l{right:58px}
.seat .hole .pc.mini{width:20px;height:28px}
.seat .hole .pc.mini+.pc.mini{margin-left:-6px;transform:rotate(8deg)}
/* a short screen (the game inside the app): a smaller board, a little higher */
@media (max-height:720px){.board .pc,.board .flip{width:38px;height:53px}.board .pc .r{font-size:17px}.board .pc .s{font-size:20px}.center{top:48%;gap:6px}.board{gap:5px}.board .side .lbl{display:none}.pot{font-size:13px;padding:3px 10px}.board .row{gap:5px}.board .side,.board .side .pc{width:26px;height:36px}.watermark{display:none}}
.seat .shown{display:flex;gap:2px;margin-top:3px}
.bet{position:absolute;transform:translate(-50%,-50%);display:flex;align-items:center;gap:4px;font-size:12px;font-weight:800;color:#f3e2b2;z-index:3;white-space:nowrap}
.bet i{width:14px;height:14px;border-radius:50%;background:radial-gradient(circle at 50% 50%,#fff 0 22%,#d23c3c 23% 60%,#fff 61% 70%,#d23c3c 71%);box-shadow:0 1px 2px rgba(0,0,0,.5)}
.dealer{position:absolute;transform:translate(-50%,-50%);width:22px;height:22px;border-radius:50%;background:#f7f3e6;color:#111;font-weight:900;font-size:12px;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 4px rgba(0,0,0,.5);z-index:3}
.banner{position:absolute;left:50%;top:27%;transform:translate(-50%,-50%);background:rgba(8,14,11,.9);border:1px solid rgba(229,184,80,.5);color:#f6e7bd;padding:8px 14px;border-radius:12px;font-weight:700;font-size:14px;z-index:6;text-align:center;max-width:82%;animation:pop .25s ease-out}
@keyframes pop{from{transform:translate(-50%,-50%) scale(.9);opacity:0}}
.mine{display:flex;justify-content:center;gap:8px;padding:2px 0 6px;min-height:88px;align-items:flex-end}
.mine .hand{font-size:12px;color:var(--muted);text-align:center;margin-top:2px}

.actions{padding:8px 10px calc(10px + var(--safe-b));background:linear-gradient(180deg,rgba(6,19,13,0),rgba(6,19,13,.9) 30%)}
.abar{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.abtn{min-height:56px;border-radius:14px;font-weight:800;font-size:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1;box-shadow:inset 0 -3px 0 rgba(0,0,0,.25)}
.abtn small{font-size:12px;font-weight:700;opacity:.85}
.abtn.fold{background:linear-gradient(180deg,var(--fold2),var(--fold))}
.abtn.call{background:linear-gradient(180deg,var(--call2),var(--call))}
.abtn.raise{background:linear-gradient(180deg,var(--raise2),var(--raise));color:#fff}
.abtn:disabled{opacity:.4}
.raisepanel{background:rgba(10,20,15,.97);border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:8px}
.presets{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:10px}
.presets button{min-height:38px;border-radius:10px;background:var(--panel2);font-weight:800;font-size:13px}
.slide{display:flex;align-items:center;gap:10px}
.slide input[type=range]{flex:1;accent-color:var(--gold);height:32px}
.slide .val{min-width:84px;text-align:right;font-family:var(--display);font-weight:800;font-size:20px}
.slide .stepb{flex:none;width:36px;height:36px;border-radius:50%;background:var(--panel2);border:1px solid var(--line);font-size:22px;font-weight:800;line-height:1;display:flex;align-items:center;justify-content:center}
.slide .stepb:active{background:rgba(229,184,80,.35);transform:scale(.94)}
/* the big tables: the row fits a 360px-wide phone */
#table.big .slide{gap:6px}#table.big .slide input[type=range]{min-width:0}#table.big .slide .val{min-width:60px}#table.big .slide .stepb{width:32px;height:32px;font-size:20px}
.waiting{text-align:center;color:var(--muted);font-size:14px;min-height:56px;display:flex;align-items:center;justify-content:center;gap:8px}
.sitout{display:flex;align-items:center;justify-content:space-between;gap:10px;background:rgba(224,86,75,.14);border-radius:12px;padding:10px 12px;margin-bottom:8px;font-size:14px}

.over{position:absolute;inset:0;background:rgba(4,10,7,.82);z-index:20;display:flex;align-items:center;justify-content:center;padding:20px}
.over .box{background:var(--panel);border-radius:20px;padding:18px;width:100%;max-width:380px;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.over h2{margin:0 0 4px;font-family:var(--display);font-size:24px}
.over p{margin:0 0 12px;color:var(--muted)}

/* ---------- the group game: tables to join, a table's lobby ---------- */
.codebox{display:flex;gap:8px;margin-top:10px}
.codebox input{flex:1;min-width:0;height:48px;border-radius:14px;border:1px solid var(--line);background:rgba(0,0,0,.28);color:var(--ink);font:inherit;font-size:18px;font-weight:800;letter-spacing:.3em;text-align:center;-webkit-user-select:text;user-select:text}
.codebox input::placeholder{letter-spacing:.04em;font-weight:600;font-size:15px;color:var(--faint)}
.codebox .btn{flex:none}
.linkbtn{display:block;width:100%;text-align:center;padding:12px 0 2px;color:#cfe4d7;font-weight:700;font-size:14px}
.status{font-size:12px;font-weight:700}
.status.wait{color:#6fe0a3}.status.play{color:var(--gold)}.status.full{color:var(--muted)}
.invite{display:flex;align-items:center;gap:10px;background:linear-gradient(90deg,rgba(229,184,80,.18),rgba(229,184,80,.06));border:1px solid rgba(229,184,80,.35);border-radius:14px;padding:10px 12px;margin-bottom:10px}
.invite .who{flex:1;min-width:0;font-size:14px}
.invite .who b{display:block}
.invite .who span{font-size:12px;color:var(--muted)}
.rtop{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.rtop .back,.top .back{width:36px;height:36px;border-radius:10px;background:rgba(255,255,255,.07);display:flex;align-items:center;justify-content:center;font-size:18px;flex:none}
.rtop .title{flex:1;min-width:0}
.rtop .title b{display:block;font-family:var(--display);font-size:18px}
.rtop .title span{font-size:12px;color:var(--muted)}
.bigcode{font-family:var(--display);font-size:44px;font-weight:800;letter-spacing:.12em;line-height:1;margin:2px 0 6px}
.seats6{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}
.slot{position:relative;display:flex;align-items:center;gap:10px;background:var(--panel);border-radius:14px;padding:10px;min-height:60px;min-width:0}
.slot .who{flex:1;min-width:0}
.slot .who b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slot .who span{font-size:11px;color:var(--muted)}
.slot.off{opacity:.55}
.slot.emptyslot{background:transparent;border:1px dashed rgba(255,255,255,.14);justify-content:center;color:var(--faint);font-size:13px;font-weight:700}

/* the all-in run-out: the river turns over slowly, after a beat face down */

/* ---------- the Speed Poker Shootout: its own look (dark felt, gold, Lilita One headings) ---------- */
#lobby.so{background:#07140E;display:flex;flex-direction:column;gap:14px;padding:16px 16px calc(24px + var(--safe-b))}
#lobby.so>*{flex:none}
.so .lil,.so-top .t,.so-clock .n,.so-big,.so-cta,.so-stat b,.so-mid .n{font-family:'Lilita One',var(--display);font-weight:400}
.so-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.so-top .t{display:flex;align-items:center;gap:8px;min-width:0;font-size:21px;letter-spacing:.02em;color:#F2B632;line-height:1}
.so-top .back{width:30px;height:30px;border-radius:9px;background:rgba(255,255,255,.07);display:flex;align-items:center;justify-content:center;font-size:18px;flex:none;color:var(--ink);font-family:var(--font)}
.so-pill{flex:none;background:#F2B632;color:#1A1405;font-weight:800;font-size:11px;letter-spacing:.08em;padding:6px 10px;border-radius:99px;white-space:nowrap}
.so-pill.lobby{background:#6FD3F2;color:#07140E}.so-pill.live{background:#F07167;color:#2A0906}.so-pill.done{background:#73E7BF;color:#04150B}.so-pill.mute{background:#1D3A2B;color:#C9D8CF}
.so-pill.green{background:#2FBF71;color:#04150B;font-size:11px;letter-spacing:.06em;padding:5px 9px}.so-pill.dark{background:#1D3A2B;color:#EEF5EF;letter-spacing:.06em;padding:5px 9px}
.so-nav{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px;background:#10241A;border-radius:14px;padding:5px}
.so-nav button{font-weight:600;font-size:15px;padding:11px 0;border-radius:10px;color:#C9D8CF}
.so-nav button.on{background:#F2B632;color:#1A1405;font-weight:700}
.so-k{font-size:12px;font-weight:700;letter-spacing:.1em;color:#C9D8CF;text-transform:uppercase}
.so-k.m{color:#9DB5A7;letter-spacing:.12em}
.so-clock{display:flex;flex-direction:column;align-items:center;gap:4px;padding:4px 0 2px;text-align:center}
.so-clock .n{font-size:60px;line-height:1;color:#F2B632;font-variant-numeric:tabular-nums}
.so-clock .s{font-size:14px;color:#C9D8CF}
.so-card{background:#10241A;border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:14px;color:#EEF5EF}
.so-card.gold{border:2px solid #F2B632}.so-card.edge{border:2px solid #1F3A2C}.so-card.red{border:2px solid #F07167}
.so-card.mid{align-items:center;text-align:center;gap:6px;padding:20px 18px}
.so-card.list{gap:2px;padding:14px 16px}
.so-card .hd{display:flex;align-items:center;justify-content:space-between;gap:8px}
.so-card.list .hd{align-items:baseline;padding-bottom:8px}
.so-card .hd .c{font-size:12px;color:#9DB5A7}
.so-big{font-size:44px;line-height:1.05;color:#F2B632}
.so-big.green{color:#73E7BF}.so-big.red{color:#F07167}.so-big.md{font-size:36px}.so-big.sm{font-size:32px}
.so-txt{font-size:15px;color:#C9D8CF;line-height:1.5}.so-txt b{color:#EEF5EF}
.so-txt.s{font-size:14px}.so-txt.w{color:#EEF5EF}
.so-cta{display:block;width:100%;background:#F2B632;color:#1A1405;text-align:center;font-size:22px;letter-spacing:.04em;padding:15px 0;border-radius:14px;box-shadow:0 4px 0 #B7851C}
.so-cta.sm{font-size:20px}
.so-cta:disabled{background:#1D3A2B;color:#9DB5A7;box-shadow:none;opacity:1;font-size:19px}
.so-out{display:block;width:100%;border:2px solid #2B4637;color:#EEF5EF;text-align:center;font-weight:700;font-size:15px;padding:11px 0;border-radius:12px;margin-top:10px}
.so-link{font-size:14px;font-weight:600;color:#C9D8CF;text-decoration:underline;padding:4px 8px}
.so-center{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.so-faces{display:flex;align-items:center;justify-content:center;gap:10px;font-size:14px;color:#C9D8CF}.so-faces b{color:#EEF5EF}
.so-faces .stack .avatar{width:28px;height:28px;font-size:10px;box-shadow:0 0 0 2px #10241A;margin-left:-8px}.so-faces .stack .avatar:first-child{margin-left:0}
.so-step{display:flex;gap:12px;align-items:flex-start;font-size:15px;line-height:1.45}
.so-step i{flex:none;width:24px;height:24px;border-radius:7px;background:#F2B632;color:#1A1405;font-weight:800;font-size:13px;font-style:normal;display:flex;align-items:center;justify-content:center}
.so-dots{display:flex;flex-direction:column;gap:10px}
.so-dots div{display:flex;gap:10px;align-items:center;font-size:15px}.so-dots div::before{content:"";flex:none;width:8px;height:8px;border-radius:50%;background:#F2B632}
/* the table from above: the felt, the seats round it */
.so-oval{position:relative;width:100%;max-width:300px;aspect-ratio:300/170;align-self:center;margin:4px 0}

<body>
<div id="app"><div id="boot" style="flex:1;display:flex;align-items:center;justify-content:center;color:var(--muted)">Shuffling up…</div></div>
<!--SOCKET-IO-->
<script>
/* ---------- the connection: Tile Up's live bootstrap, for the /poker namespace ----------
   The server puts a signed ticket in the page (window.__POKER = {ticket, hopTicket}); the app loads a catalog page with connect-src 'none',
   so the page first reloads itself once at ?ticket=<hop> (the server answers with a policy that allows its own socket). An office screen's
   page carries {tv, eventId} instead and watches only. Without either (a browser preview) the page runs its demo. */
(function(){
const T=window.__POKER;
window.Poker={live:false};
if(!T||typeof T!=='object'||typeof window.io!=='function')return;
function blockedByPolicy(){ for(const m of document.querySelectorAll('meta[http-equiv]')){ if(String(m.httpEquiv).toLowerCase()!=='content-security-policy')continue;
    const c=String(m.content||''), d=c.split(';').map(s=>s.trim()).find(s=>/^connect-src\s/i.test(s))||c.split(';').map(s=>s.trim()).find(s=>/^default-src\s/i.test(s));
    if(d&&/'none'/.test(d))return true; } return false; }
if(T.ticket&&blockedByPolicy()){
  const here=location.protocol==='https:'||location.protocol==='http:';
  if(/[?&]ticket=/.test(location.search)||!here){ window.Poker.fatal='Speed Poker could not reach the game server. Close and reopen it.'; return; }
  location.replace(location.origin+location.pathname+'?ticket='+encodeURIComponent(T.hopTicket||T.ticket)); window.Poker.hopping=true; return; }
const auth=T.tv?{tv:String(T.tv)}:{ticket:String(T.ticket)};
const sock=window.io(location.origin+'/poker',{path:'/connect/socket',auth,transports:['websocket','polling'],tryAllTransports:true,reconnection:true,reconnectionDelay:800,reconnectionDelayMax:5000,randomizationFactor:.3,timeout:10000});
const handlers={};
const emit=(type,p)=>{ (handlers[type]||[]).forEach(f=>{ try{f(p)}catch(e){console.error(e)} }); };
function request(event,payload){ return new Promise((resolve,reject)=>{
  const go=()=>sock.timeout(8000).emit(event,payload||{},(err,res)=>{
    if(err)return reject(new Error('No answer from the server. Try again.'));
    if(!res||res.ok===false)return reject(Object.assign(new Error((res&&res.message)||'Something went wrong. Try again.'),{status:res&&res.status}));
    resolve(res.data||{}); });
  if(sock.connected)go(); else { const t=setTimeout(()=>reject(new Error('Not connected. Try again in a moment.')),8000); sock.once('connect',()=>{clearTimeout(t);go();}); } }); }
let ever=false;
sock.on('connect',()=>{ emit('connection',{online:true,again:ever}); ever=true; });
sock.on('disconnect',r=>{ if(r==='io server disconnect')emit('fatal',{message:'The game server closed this connection. Close and reopen Speed Poker.'}); else emit('connection',{online:false}); });
sock.on('connect_error',err=>{ const code=String((err&&err.data&&err.data.code)||(err&&err.message)||''); if(/ticket|not_allowed/i.test(code))emit('fatal',{message:/expired/.test(code)?'This Speed Poker session has expired. Close and reopen it.':'Speed Poker could not sign you in. Close and reopen it.'}); else emit('connection',{online:false}); });
['lobby:shared','table:state','table:seated','poker:toast','poker:fatal','room:state','room:feed','room:invite','room:kicked'].forEach(ev=>sock.on(ev,p=>emit(ev,p)));
window.Poker={live:true,tv:!!T.tv,on:(type,f)=>{(handlers[type]=handlers[type]||[]).push(f)},request};
})();
</script>
<script>
/* ---------- the game ---------- */
(function(){
'use strict';
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>Number(n||0).toLocaleString('en-IN');
const P=window.Poker;
const app=$('#app');
const S=window.Sowaka||{};
const haptic=k=>{ try{ (window.Sowaka&&window.Sowaka.haptic)&&window.Sowaka.haptic(k||'light'); }catch(e){} };

const state={mode:'rooms',room:null,rooms:[],invites:[],me:null,ev:null,picker:null,leaveAsk:false,codeInput:'',shared:null,mine:null,table:null,view:'lobby',watching:null,tab:'board',raiseOpen:false,raiseTo:0,offset:0,lastHand:0,banner:null,offline:false,tv:!!P.tv,tvTables:{},pick:{},
  /* the big tables: from room:hello (the company's table), the chat sheet, and the table being watched */
  big:false,tables:null,chatOpen:false,chatDraft:'',chatSeen:0,chatRoom:null,watchCode:null,bubbles:{},bubbleRoom:null,chatIds:null,
  next:false,focusChat:false,resultHand:null,
  /* the Shootout: Home or Watch, the "you're through" screens already seen (by round), the whole standings list */
  soTab:'home',soAck:{},soAll:false,soHtml:''};
const nextUi=()=>!!state.next;
const now=()=>Date.now()+state.offset;
const me=()=>(state.mode==='rooms'&&state.me&&state.me.userId)||(state.mine&&state.mine.userId)||(state.me&&state.me.userId);
const initials=n=>String(n||'?').trim().split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase();
const first=n=>String(n||'').trim().split(/\s+/)[0]||'Someone';
const clockOf=ms=>{ ms=Math.max(0,ms); const s=Math.floor(ms/1000); const h=Math.floor(s/3600), m=Math.floor(s%3600/60), x=s%60; return h?`${h}:${String(m).padStart(2,'0')}:${String(x).padStart(2,'0')}`:`${m}:${String(x).padStart(2,'0')}`; };
const hhmm=iso=>{ if(!iso)return ''; const d=new Date(iso); return d.toLocaleTimeString('en-IN',{hour:'numeric',minute:'2-digit',timeZone:'Asia/Kolkata'}); };
function toast(msg){ document.querySelectorAll('.toast').forEach(x=>x.remove()); const t=document.createElement('div'); t.className='toast'; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>{t.style.opacity='0'; setTimeout(()=>t.remove(),250);},2600); }
const pic=id=>(state.shared&&state.shared.photos&&state.shared.photos[id])||(state.mine&&state.mine.userId===id&&state.mine.photoUrl)||(state.me&&state.me.userId===id&&state.me.photoUrl)||null;
function avatarHtml(name,photo,extra){ return `<div class="avatar ${extra||''}" ${photo?`style="background-image:url('${esc(photo)}')"`:''}>${photo?'':esc(initials(name))}</div>`; }

/* ---------- cards ---------- */
const SUIT={s:'♠',h:'♥',d:'♦',c:'♣'};
function card(c,size,cls){ if(!c)return `<div class="pc slot ${size||''}"></div>`; const r=c[0]==='T'?'10':c[0], s=c[1];
  return `<div class="pc ${s} ${size||''} ${cls||''}"><span class="r">${r}</span><span class="s">${SUIT[s]}</span></div>`; }
const back=size=>`<div class="pc back ${size||''}"></div>`;

/* ---------- the board, dealt as at a real table ----------
   Each street burns a card face down onto the pile, then its cards come off
   the deck face down and turn over one by one: the flop's three, then the
   turn, then the river. The table is drawn again on every update, so each
   card keeps the moment it was dealt and the animation carries on from
   there (a negative delay) instead of starting over. Joining a hand already
   under way shows its board as it is, without dealing it again. */
const BOARD_ANIM_MS=900, BURN_MS=420, FLIP_GAP_MS=230;
/* next look: when everyone is all in the board runs out slowly: a beat, each card a second apart, the river turning over last */
const RUN_LEAD_MS=700, RUN_GAP_MS=1100, RIVER_MS=1900;
const boardDelay=(slow,k)=>slow?RUN_LEAD_MS+k*RUN_GAP_MS:BURN_MS+k*FLIP_GAP_MS;
function boardHtml(v,winCards){
  const key=`${v.id}:${v.handNo}`, n=(v.board||[]).filter(Boolean).length, t=Date.now();
  let a=state.boardAnim&&state.boardAnim.key===key?state.boardAnim:null;
  if(!a){ a=state.boardAnim={key,seen:n,at:{},burnAt:{},dur:{}};
    // The preview's ?deal=1 deals its board from the deck, street by street.
    if(state.demoDeal){ a.seen=0; const t0=t; [[3,0],[4,1400],[5,2400]].forEach(([upTo,delay])=>{ if(n>=upTo){ a.burnAt[upTo<=3?1:upTo===4?2:3]=t0+delay; for(let i=upTo===3?0:upTo-1;i<upTo;i++)a.at[i]=t0+delay+BURN_MS+(i-(upTo===3?0:upTo-1))*FLIP_GAP_MS; } }); a.seen=n; } }
  if(n>a.seen){
    // A new street: the burn first, then each new card a beat apart.
    a.burnAt[n<=3?1:n===4?2:3]=t;
    const slow=hypeOn()&&runout(v);
    for(let i=a.seen;i<n;i++){ a.at[i]=t+boardDelay(slow,i-a.seen); if(slow&&i===4)a.dur[i]=RIVER_MS; }
    if(slow)a.slow=true;
    a.seen=n; }
  const tone=c=>c&&winCards.size?(winCards.has(c)?'win':'dim'):'';
  const slot=i=>{ const c=v.board[i]; if(!c)return card(null);
    const at=a.at[i], since=at==null?Infinity:t-at, dur=a.dur[i]||BOARD_ANIM_MS;
    if(since>=dur)return card(c,'',tone(c));
    if(since<0&&a.slow&&calm())return card(null);   // reduced motion: no flip to hide a run-out card that is not due yet
    // From the deck (right of the turn and river) to this card's place.
    const fx=i<3?(2-i)*52+40:(i===3?110:58), fy=i<3?70:0;
    return `<div class="flip${dur>BOARD_ANIM_MS?' slow':''}" style="--d:${-since}ms;--fx:${fx}px;--fy:${fy}px"><div class="in">${card(c,'',tone(c))}${back('')}</div></div>`; };
  const burns=n>=5?3:n>=4?2:n>=3?1:0;
  const burnPile=Array.from({length:burns},(_,k)=>{ const at=a.burnAt[k+1], since=at==null?Infinity:t-at;
    return `<div class="pc back ${since<BURN_MS+100?'new':''}" style="--i:${k};--d:${since<BURN_MS+100?-since:0}ms"></div>`; }).join('');
  const inHand=v.status!=='over'&&(n>0||v.street&&v.street!=='done'||(v.seats||[]).some(s=>s.inHand));
  const deck=inHand&&n<5?`<div class="side deck" aria-hidden="true">${back('')}${back('')}${back('')}<span class="lbl">DECK</span></div>`:'<div class="side" aria-hidden="true"></div>';
  const burn=`<div class="side burn" aria-hidden="true">${burnPile}${burns?'<span class="lbl">BURN</span>':''}</div>`;
  return `<div class="board" aria-label="Board: ${(v.board||[]).filter(Boolean).map(c=>c).join(' ')||'no cards yet'}">
    <div class="row">${slot(0)}${slot(1)}${slot(2)}</div>
    <div class="row">${burn}${slot(3)}${slot(4)}${deck}</div></div>`; }

/* ---------- phase words ---------- */
/** A practice that runs for days is the casual game: tables any time, no points, no finals. */
const casual=sh=>Boolean(sh.event.practice)&&Date.parse(sh.event.practice.to)-Date.parse(sh.event.practice.from)>36*3600e3;
function phaseWords(sh){ const e=sh.event, g=e.game, t=now();
  if(soOn(sh)){ const so=sh.shootout; switch(e.phase){
    case 'upcoming': return {chip:'Starts soon',cls:'',line:`The Shootout lobby opens at ${hhmm(so.lobbyFrom)}`};
    case 'lobby': return {chip:'Lobby open',cls:'green',line:`Shootout lobby open: seats are drawn at ${hhmm(so.startAt)}`};
    case 'shootout': return {chip:'Shootout live',cls:'red',line:'The Shootout is on. Watch the tables live.'};
    default: return {chip:'Finished',cls:'',line:so.status==='cancelled'?'Called off: not enough players joined.':sh.champion?`${sh.champion.name} is the champion.`:'Thanks for playing.'}; } }
  if(casual(sh)&&e.phase==='practice')return {chip:'Just for fun',cls:'green',line:'No points. Sit down any time and play.'};
  switch(e.phase){
    case 'upcoming': return {chip:'Starts soon',cls:'',line:e.practice?`Practice day opens ${hhmm(e.practice.from)}`:`Tables open ${hhmm(g.openFrom)}`};
    case 'practice': return {chip:'Practice day',cls:'green',line:`No points today. Tables close at ${hhmm(e.practice.to)}.`};
    case 'between': return {chip:'Game day next',cls:'',line:`Tables open ${new Date(g.openFrom).toLocaleDateString('en-IN',{weekday:'long',day:'numeric',month:'short',timeZone:'Asia/Kolkata'})} at ${hhmm(g.openFrom)}`};
    case 'open': return sh.powerHour?{chip:`Power hour ×${e.rules.powerMultiplier}`,cls:'gold',line:`Every table counts double until ${hhmm(g.powerTo)}.`}:{chip:'Open play',cls:'green',line:`Tables close at ${hhmm(g.openTo)}. Best ${e.rules.bestOf} of your tables count.`};
    case 'semis-soon': return {chip:'Semifinals next',cls:'gold',line:`Semifinals at ${hhmm(g.semisAt)}. Picks open 15 minutes before.`};
    case 'semis': return {chip:'Semifinals live',cls:'red',line:'Two tables, top three from each go to the final.'};
    case 'final-soon': return {chip:'Final next',cls:'gold',line:`The final at ${hhmm(g.finalAt)}.`};
    case 'final': return {chip:'Final live',cls:'red',line:'Six players, one champion.'};
    case 'over': return {chip:'Finished',cls:'',line:sh.champion?`${sh.champion.name} is the champion.`:'Thanks for playing.'};
    default: return {chip:'',cls:'',line:''};
  } }
const canSit=sh=>!sh.event.paused&&(sh.event.phase==='open'||sh.event.phase==='practice');

/* ---------- lobby ---------- */
function renderLobby(){
  const sh=state.shared;
  if(!sh){ if(!state.tv){ state.mode='rooms'; return render(); } app.innerHTML=`<div id="lobby"><div class="empty" style="text-align:center;margin-top:30vh">Speed Poker is not on at your company right now.</div></div>`; return; }
  if(state.tv)return renderTv();
  if(soOn(sh))return renderShootout(sh);
  const ph=phaseWords(sh), uid=me(), t=now();
  const qi=sh.queue.findIndex(q=>q.userId===uid), seatedAt=sh.seated[uid], cool=(sh.cooldownUntil[uid]||0)-t;
  const myRow=sh.board.find(r=>r.userId===uid);
  let hero='';
  const stageLive=sh.event.phase==='semis'||sh.event.phase==='final';
  if(seatedAt){ hero=`<h2>You are at a table</h2><p>Your cards are waiting.</p><div class="row"><button class="btn primary" data-act="mytable">Back to your table</button></div>`; }
  else if(qi>=0){ const n=sh.queue.length, need=Math.max(0,sh.event.rules.tableSize-n);
    hero=`<h2>Finding your table</h2><div class="count num">${n}</div><p>${n===1?'person':'people'} waiting · you are #${qi+1}. ${need?`A table starts when ${need} more sit down${sh.event.rules.minPlayers<=n?`, or with ${n} in ${clockOf(sh.event.rules.fallbackMs-(t-Math.min(...sh.queue.map(q=>q.since))))}`:''}.`:'Seating now…'}</p><div class="row"><button class="btn ghost" data-act="leave">Leave the queue</button></div>`; }
  else if(stageLive){ const st=sh.event.phase==='semis'?sh.semis:sh.final;
    hero=`<h2>${sh.event.phase==='semis'?'Semifinals':'The final'} are live</h2><p>${ph.line}</p><div class="row">${(st?st.tables:[]).filter(x=>x.tableId).map(x=>`<button class="btn primary" data-watch="${esc(x.tableId)}">Watch ${x.label==='F'?'the final':'table '+esc(x.label)}</button>`).join('')}</div>`; }
  else if(canSit(sh)){
    hero=cool>0?`<h2>Good table</h2><p>You can sit again in a moment.</p><div class="row"><button class="btn primary" disabled>Next seat in ${clockOf(cool)}</button></div>`
      :`<h2>${casual(sh)?'Sit down and play':sh.event.phase==='practice'?'Practice day':'Sit down and play'}</h2><p>${casual(sh)?`Just for fun, no points. A table starts the moment ${sh.event.rules.tableSize} people sit down, or with ${sh.event.rules.minPlayers} after ${Math.round(sh.event.rules.fallbackMs/60000)} minutes.`:sh.event.phase==='practice'?'Same tables as game day, no points. A table starts the moment six people sit down.':`${sh.event.rules.minutes.open} minute tables. A table starts the moment six sit down.`}</p><div class="row"><button class="btn primary" data-act="sit">Sit me down</button><button class="btn ghost" data-act="practice" style="flex:.6">Practice</button></div>`; }
  else { hero=`<h2>${esc(ph.chip)}</h2><p>${esc(ph.line)}</p>${sh.event.phase!=='over'&&sh.event.phase!=='draft'?`<div class="row"><button class="btn ghost" data-act="practice">Practice vs the house</button></div>`:''}`; }
  const stats=sh.event.phase==='practice'||sh.event.phase==='upcoming'?'':`<div class="stats">
    <div class="stat"><b class="num">${myRow?myRow.played:0}/${sh.event.rules.countedTables}</b><span>tables</span></div>
    <div class="stat"><b class="num">${myRow?fmt(myRow.score):0}</b><span>score</span></div>
    <div class="stat"><b class="num">${myRow?'#'+myRow.rank:'—'}</b><span>rank</span></div>
    <div class="stat"><b class="num">${myRow?myRow.knockouts:0}</b><span>knockouts</span></div></div>`;
  const tabs=casual(sh)?[['tables','Live tables'],['rules','How it works']]:[['board','Board'],['offices','Offices'],['tables','Live tables'],...(sh.semis||sh.final?[['finals','Finals']]:[]),...(sh.event.rules.picks.on&&(sh.semis||sh.final)?[['picks','Picks']]:[]),['rules','How it works']];
  if(!tabs.some(x=>x[0]===state.tab))state.tab=tabs[0][0];
  app.innerHTML=`<div id="lobby">
    <div class="top"><div class="brand"><button class="back" data-act="rooms" aria-label="Back to the tables">‹</button><div><h1>${esc(sh.event.name)}</h1><div class="sub">${esc(ph.line)}</div></div></div><div style="display:flex;align-items:center;gap:8px"><span class="chip ${ph.cls}"><span class="dot"></span>${esc(ph.chip)}</span>${state.mine?avatarHtml(state.mine.name,pic(state.mine.userId),'me-face'):''}</div></div>
    <div class="hero"><div class="suits">♠♥♦♣</div>${hero}</div>
    ${stats}
    <div class="tabs">${tabs.map(([k,l])=>`<button class="tab ${state.tab===k?'on':''}" data-tab="${k}">${l}</button>`).join('')}</div>
    <div id="tabbody">${tabBody(sh)}</div></div>`;
}
function boardRows(sh,limit){ const uid=me();
  if(!sh.board.length)return `<div class="empty">No scores yet. The board fills as tables finish.</div>`;
  let rows=sh.board.slice(0,limit); const mine=sh.board.find(r=>r.userId===uid); if(mine&&!rows.includes(mine))rows=[...rows,mine];
  return rows.map(r=>`<div class="rowi ${r.userId===uid?'me':''}"><div class="rank">${r.rank}</div>${avatarHtml(r.name,pic(r.userId))}<div class="who"><b>${esc(r.name)}${sh.bounties.includes(r.userId)?' <span class="chip gold" style="padding:1px 6px;font-size:10px">BOUNTY</span>':''}</b><span>${esc(r.office||'')}${r.office?' · ':''}${r.played} table${r.played===1?'':'s'} · best ${r.best.map(fmt).join(' / ')}</span></div><div class="pts">${fmt(r.score)}</div></div>`).join(''); }
function tabBody(sh){
  switch(state.tab){
    case 'board': return `<div class="card"><h3>Today's board</h3>${boardRows(sh,30)}</div>`;
    case 'offices': { const top=Math.max(1,...sh.league.map(o=>o.average));
      return `<div class="card"><h3>Office league · average best ${sh.event.rules.bestOf}</h3>${sh.league.length?sh.league.map((o,i)=>`<div class="rowi"><div class="rank">${i+1}</div><div class="who"><b>${esc(o.office)}</b><span>${o.players} player${o.players===1?'':'s'}</span><div class="bar"><i style="width:${Math.round(o.average/top*100)}%"></i></div></div><div class="pts">${fmt(o.average)}</div></div>`).join(''):'<div class="empty">No offices on the board yet.</div>'}</div>`; }
    case 'tables': return `<div class="card"><h3>Playing now</h3>${sh.tables.length?sh.tables.map(t=>`<div class="rowi"><div class="who"><b>${t.round==='semi'?'Semifinal '+esc(t.label):t.round==='final'?'The final':t.round==='practice'?'Practice table':'Table'}${t.power?' · ×2':''}</b><span>${t.players.map(p=>esc(first(p.name))).join(', ')} · ${clockOf(t.endsAt-now())} left</span><div class="stack" style="margin-top:6px">${t.players.map(p=>avatarHtml(p.name,pic(p.userId),'sm')).join('')}</div></div><button class="btn small ghost" data-watch="${esc(t.id)}">Watch</button></div>`).join(''):'<div class="empty">No tables running right now.</div>'}</div>`;
    case 'finals': return finalsBody(sh);
    case 'picks': return picksBody(sh);
    default: return rulesBody(sh);
  } }
function finalsBody(sh){ const name=id=>sh.names[id]||'Player';
  const stage=(title,st)=>st?`<div class="card"><h3>${title}${st.startedAt?(st.endedAt?' · over':' · live'):' · '+(title==='Final'?hhmm(sh.event.game.finalAt):hhmm(sh.event.game.semisAt))}</h3>${st.tables.map(t=>`<div class="rowi"><div class="who"><b>${t.label==='F'?'Final table':'Table '+esc(t.label)}</b><div>${t.players.map(p=>`<span class="pp">${avatarHtml(name(p),pic(p),'xs')}${esc(name(p))}</span>`).join('')}</div></div>${t.tableId&&!st.endedAt?`<button class="btn small ghost" data-watch="${esc(t.tableId)}">Watch</button>`:''}</div>`).join('')}</div>`:'';
  return (sh.champion?`<div class="card"><h3>Champion</h3><div class="rowi">${avatarHtml(sh.champion.name,pic(sh.champion.userId))}<div class="who"><b>${esc(sh.champion.name)}</b><span>${esc(sh.event.name)}</span></div><div class="pts">🏆</div></div></div>`:'')+stage('Final',sh.final)+stage('Semifinals',sh.semis); }
function picksBody(sh){ const m=state.mine||{picks:[],picksLeft:{semi:0,final:0},picksOpen:{}}; const r=sh.event.rules.picks, name=id=>sh.names[id]||'Player';
  const stageBox=(stage,st)=>{ if(!st)return ''; const open=m.picksOpen&&m.picksOpen[stage]; const left=m.picksLeft[stage];
    const mineHere=m.picks.filter(p=>p.stage===stage);
    const sel=state.pick[stage]||{};
    const kinds=[['winner',`Wins the table · pays ${r.winnerOdds}×`],['firstOut',`First one out · pays ${r.firstOutOdds}×`],...(stage==='final'?[['fullTime',`Goes the full time · pays ${r.fullTimeOdds}×`]]:[])];
    return `<div class="card"><h3>${stage==='semi'?'Semifinal picks':'Final picks'} · ${open?`${fmt(left)} points left`:st.startedAt?'closed':'opens 15 min before'}</h3>
      ${open?`<div class="pickbox">
        ${st.tables.length>1?`<div class="q">Table</div><div class="opts">${st.tables.map(t=>`<button class="opt ${sel.table===t.label?'on':''}" data-pick="${stage}|table|${t.label}">Table ${t.label}</button>`).join('')}</div>`:''}
        <div class="q">Your call</div><div class="opts">${kinds.map(([k,l])=>`<button class="opt ${sel.kind===k?'on':''}" data-pick="${stage}|kind|${k}">${l}</button>`).join('')}</div>
        ${sel.kind?`<div class="q">${sel.kind==='fullTime'?'Will the final run its full time?':'Who'}</div><div class="opts">${sel.kind==='fullTime'?['yes','no'].map(v=>`<button class="opt ${sel.choice===v?'on':''}" data-pick="${stage}|choice|${v}">${v==='yes'?'Yes, to the clock':'No, someone wins it'}</button>`).join(''):(st.tables.find(t=>t.label===(sel.table||st.tables[0].label))||{players:[]}).players.map(p=>`<button class="opt ${sel.choice===p?'on':''}" data-pick="${stage}|choice|${p}">${avatarHtml(name(p),pic(p),'xs')}${esc(name(p))}</button>`).join('')}</div>`:''}
        <div class="stake"><input id="stake-${stage}" type="range" min="${r.minStake}" max="${Math.max(r.minStake,left)}" step="10" value="${Math.min(left,sel.stake||Math.min(100,left))}"><b class="num" id="stakev-${stage}">${fmt(Math.min(left,sel.stake||Math.min(100,left)))}</b></div>
        <button class="btn primary" style="width:100%;margin-top:10px" data-act="pick" data-stage="${stage}" ${left<r.minStake?'disabled':''}>Place pick</button></div>`:''}
      ${mineHere.length?mineHere.map(p=>`<div class="rowi">${p.kind==='fullTime'?'':avatarHtml(name(p.choice),pic(p.choice),'sm')}<div class="who"><b>${p.kind==='winner'?'Wins':p.kind==='firstOut'?'First out':'Full time'}: ${esc(p.kind==='fullTime'?(p.choice==='yes'?'Yes':'No'):name(p.choice))}</b><span>${p.stage==='semi'?'Table '+esc(p.table)+' · ':''}${fmt(p.stake)} points</span></div><div class="pts">${p.payout===null?'—':p.payout>0?'+'+fmt(p.payout):'0'}</div></div>`).join(''):''}</div>`; };
  return `${stageBox('final',sh.final)}${stageBox('semi',sh.semis)}<div class="card"><h3>Picks board · top ten in the gift draw</h3>${sh.picksBoard.length?sh.picksBoard.slice(0,10).map((p,i)=>`<div class="rowi ${p.userId===me()?'me':''}"><div class="rank">${i+1}</div>${avatarHtml(p.name,pic(p.userId))}<div class="who"><b>${esc(p.name)}</b><span>${fmt(p.staked)} staked</span></div><div class="pts">${fmt(p.won)}</div></div>`).join(''):'<div class="empty">No picks settled yet.</div>'}</div>
  <div class="card rules"><h3>About picks</h3><p>Pick points are handed out free before each round and only count on the picks board. Nothing can be bought, moved or cashed. Players cannot pick on their own round.</p></div>`; }
function rulesBody(sh){ const r=sh.event.rules;
  if(casual(sh))return `<div class="card rules"><h3>How it works</h3>
  <p><b>The game.</b> No-limit Texas Hold'em. Two cards each, five shared, best five of seven wins.</p>
  <p><b>Tables.</b> ${r.minutes.practice||r.minutes.open} minutes, up to ${r.tableSize} players, 1,500 chips each. Blinds double every two minutes. 15 seconds to act.</p>
  <p><b>Seating.</b> Tap Sit me down. A table starts the moment ${r.tableSize} are waiting, or with ${r.minPlayers} after ${Math.round(r.fallbackMs/60000)} minutes. Practice plays a table against the house on your own.</p>
  <p><b>Just for fun.</b> No points, no board, no finals. Chips are only for the table. No fees, no buying, no cash.</p></div>`;
  return `<div class="card rules"><h3>How it works</h3>
  <p><b>The game.</b> No-limit Texas Hold'em. Two cards each, five shared, best five of seven wins.</p>
  <p><b>Tables.</b> ${r.minutes.open} minutes, up to ${r.tableSize} players, 1,500 chips each. Blinds double every two minutes. 15 seconds to act.</p>
  <p><b>Seating.</b> Tap Sit me down. A table starts the moment ${r.tableSize} are waiting, or with ${r.minPlayers} after ${Math.round(r.fallbackMs/60000)} minutes. People who have played fewer tables sit first.</p>
  <p><b>Points.</b> Your chips at the end of a table, plus ${r.knockoutPoints} for every player you knock out${sh.event.game.bountiesFrom?` (${r.bountyPoints} for a bounty from ${hhmm(sh.event.game.bountiesFrom)})`:''}. Busting scores zero for chips. Your best ${r.bestOf} of your first ${r.countedTables} tables make your score.${sh.event.game.powerFrom?` Power hour ${hhmm(sh.event.game.powerFrom)}–${hhmm(sh.event.game.powerTo)} counts double.`:''}</p>
  <p><b>Finals.</b> At ${hhmm(sh.event.game.openTo)} the top ${r.semifinalists} go to two semifinals (${r.minutes.semi} minutes) at ${hhmm(sh.event.game.semisAt)}. The top ${r.advancePerSemi} from each play the final (${r.minutes.final} minutes) at ${hhmm(sh.event.game.finalAt)}.</p>
  <p><b>No money.</b> Chips and points are for the boards only. No fees, no buying, no cash.</p></div>`; }

/* ---------- the Speed Poker Shootout ----------
   An event whose shared view carries `shootout` is a Shootout, not a game day: a lobby (queue:join puts you in it), then
   rounds that seat themselves (a qualifier when the headcount needs one, knockouts keeping the last 4 at each table, the
   final table). Its tables are the ordinary event tables (table:seated, table:state); everything around them is drawn
   here from shared.shootout, with Home and Watch along the top. */
const soOn=sh=>!!(sh&&sh.shootout);
/** On opening the game, a Shootout with its lobby open, its rounds on, or its results takes the player straight to it. */
const soShown=sh=>soOn(sh)&&['lobby','shootout','over'].includes(sh.event.phase);
const SO_MIN=3; // SHOOTOUT.MIN_PLAYERS on the server
const soOne=n=>/^Final/.test(n||'')?'Final':String(n||'').replace(/s$/,'');            // "Semi-finals" → "Semi-final"
const soShort=r=>r.kind==='final'?'FINAL':r.kind==='qualifier'?'QUALIFIER':/^Semi/.test(r.name)?'SEMIS':/^Quarter/.test(r.name)?'QUARTERS':String(r.name).toUpperCase();
const soLower=r=>r.kind==='final'?'final':soOne(r.name).toLowerCase();                // "semi-final", "final"
const soThe=r=>r.kind==='final'?'the final':r.name.toLowerCase();                      // "the final", "semi-finals"
const soIs=r=>r.kind==='final'?'is':/s$/.test(r.name)?'are':'is';
const soTab=t=>String(t.label||'').split('· ').pop();                                 // "Qualifier · Table 2" → "Table 2"
const soList=a=>a.length<2?a.join(''):a.slice(0,-1).join(', ')+' and '+a[a.length-1];
const soChips=(t,id)=>t.live?(t.live.stacks[id]||0):t.final?(t.final.survivors[id]||0):(t.stacks[id]||0);
const soLost=(t,id)=>{ const b=t&&t.final&&t.final.busts.find(x=>x.id===id); return b?b.stackBefore:null; };
const soOrder=t=>t.result?t.result.order:t.live?t.live.order:[];
const soThrough=t=>t.result?t.result.through:t.live?t.live.through:[];
const soDone=t=>!!(t.result||t.final||(t.live&&t.live.status==='over'));

function soCtx(sh){ const so=sh.shootout, uid=me(), rounds=so.rounds||[], ci=rounds.length-1, cur=rounds[ci]||null;
  let mi=-1; rounds.forEach((r,i)=>{ if(r.players.includes(uid))mi=i; });
  const name=id=>id===uid?'You':(sh.names[id]||(so.lobby.find(p=>p.userId===id)||{}).name||'Player');
  const tableOf=(r,id)=>(r&&r.tables.find(t=>t.players.includes(id||uid)))||null;
  const nextOf=i=>rounds[i+1]||null, planNext=i=>(so.plan||[])[i+1]||null;
  const rankOf=r=>r.ranking||(r===cur?so.liveRanking:null)||[];
  return {sh,so,uid,rounds,ci,cur,mi,name,tableOf,nextOf,planNext,rankOf}; }

/** Which screen, and for which round. */
function soScreen(c){ const {so,cur,ci,mi,uid,sh}=c;
  if(so.status==='cancelled')return ['cancelled'];
  if(so.status==='upcoming')return ['upcoming'];
  if(so.status==='lobby')return [so.lobby.some(p=>p.userId===uid)?'inlobby':'lobby'];
  if(so.status==='done'||!cur)return [so.standings?'standings':'spectator'];
  if(mi<0)return ['spectator'];
  if(mi<ci)return [c.rounds[mi].kind==='qualifier'?'qualcut':'koout',mi];
  if(!cur.startedAt){ const prev=c.rounds[ci-1];
    if(prev&&!state.soAck[ci])return [prev.kind==='qualifier'?'qualthrough':'kothrough',ci-1];
    return ['seat',ci]; }
  if(sh.seated[uid])return ['seat',ci];
  if(cur.kind==='qualifier')return ['qualwait',ci];
  if(cur.kind==='final')return ['finalout',ci];
  const t=c.tableOf(cur);
  return [t&&soThrough(t).includes(uid)?'kothrough':'koout',ci]; }

function soPill(c,scr){ const {so,cur}=c;
  if(so.status==='cancelled')return ['CALLED OFF','mute'];
  if(so.status==='upcoming')return ['STARTS SOON','mute'];
  if(so.status==='lobby')return ['LOBBY OPEN','lobby'];
  if(so.status==='done')return ['FINAL RESULTS','done'];
  if(!cur)return ['SEATS DRAWN',''];
  if(scr==='qualthrough')return ['QUALIFIER DONE',''];
  if(!cur.startedAt)return [cur.kind==='final'?'FINAL TABLE':cur.kind==='qualifier'?'SEATS DRAWN':soShort(cur)+' DRAWN',''];
  return [soShort(cur)+' LIVE','live']; }

function soFace(c,id,cls){ return id===c.uid&&!pic(id)?`<div class="avatar so-you ${cls||''}">You</div>`:avatarHtml(c.name(id)==='You'?(state.mine&&state.mine.name)||'You':c.name(id),pic(id),cls); }
/** The table from above: seats round the felt, the viewer's at the top. `seat(id)` gives each seat's class and label. */
function soOval(c,ids,mid,seat,n){ n=Math.max(n||ids.length,ids.length); const i0=ids.indexOf(c.uid); const order=i0>0?ids.slice(i0).concat(ids.slice(0,i0)):ids.slice();
  const spots=Array.from({length:n},(_,k)=>{ const a=-Math.PI/2+k*2*Math.PI/n, x=(150+135*Math.cos(a))/3, y=(85+72*Math.sin(a))/1.7;
    const id=order[k], s=id===undefined?{empty:'?'}:seat(id)||{};
    const inner=s.empty!=null?`<span class="q ${s.empty?'':'e'}">${esc(s.empty)}</span>`:soFace(c,id);
    return `<span class="so-seat ${id===c.uid?'me':''} ${s.cls||''}" style="left:${x.toFixed(1)}%;top:${y.toFixed(1)}%">${inner}${s.label?`<span class="l">${esc(s.label)}</span>`:''}</span>`; }).join('');
  return `<div class="so-oval"><div class="felt2"></div><div class="so-mid">${mid}</div>${spots}</div>`; }

function soHead(c,scr){ const p=soPill(c,scr);
  return `<div class="so-top"><div class="t"><button class="back" data-act="rooms" aria-label="Back to the tables">‹</button><span>SPEED POKER SHOOTOUT</span></div><span class="so-pill ${p[1]}">${esc(p[0])}</span></div>
    <nav class="so-nav"><button class="${state.soTab!=='watch'?'on':''}" data-sotab="home">${scr==='standings'?'Results':'Home'}</button><button class="${state.soTab==='watch'?'on':''}" data-sotab="watch">Watch</button></nav>`; }
const soClock=(k,ms,sub)=>`<section class="so-clock"><div class="so-k m">${esc(k)}</div><div class="n">${clockOf(ms)}</div>${sub?`<div class="s">${sub}</div>`:''}</section>`;
const soStat=(v,l,cls)=>`<div class="so-stat"><b class="${cls||''}">${v}</b><span>${l}</span></div>`;

function renderShootout(sh){
  const c=soCtx(sh), [scr,ri]=soScreen(c);
  const body=state.soTab==='watch'?soWatch(c):soHome(c,scr,ri);
  const html=`<div id="lobby" class="so">${soHead(c,scr)}${body}</div>`;
  const old=app.querySelector('#lobby.so');
  if(old&&state.soHtml===html)return;
  const top=old?old.scrollTop:0; state.soHtml=html; app.innerHTML=html;
  if(old){ const now=app.querySelector('#lobby.so'); if(now)now.scrollTop=top; } }

function soHome(c,scr,ri){ const {so,sh,uid}=c, t=now();
  switch(scr){
  case 'cancelled': return `<section class="so-card edge mid"><div class="so-k">THE SHOOTOUT IS OFF</div><div class="so-big red sm">NOT ENOUGH PLAYERS JOINED</div>
      <div class="so-txt">${so.joined?`${so.joined} joined the lobby. `:''}It needs at least ${SO_MIN} to play, so it is called off this time.</div></section>
    <button class="so-cta sm" data-act="rooms">PLAY A GAME INSTEAD</button>`;
  case 'upcoming': return `${soClock('LOBBY OPENS IN',Date.parse(so.lobbyFrom)-t,`Seats are drawn at ${hhmm(so.startAt)}`)}
    <section class="so-card gold"><div class="so-k">THE LOBBY OPENS AT ${esc(hhmm(so.lobbyFrom))}</div><div class="so-txt w">Join it any time before ${esc(hhmm(so.startAt))}. Only people in it get a seat.</div></section>${soHow()}`;
  case 'lobby': { const n=so.lobby.length;
    return `${soClock('LOBBY CLOSES IN',Date.parse(so.startAt)-t,`Seats are drawn at ${hhmm(so.startAt)}`)}
    <section class="so-card gold"><div class="so-k">YOU'RE NOT IN YET</div><button class="so-cta" data-act="sojoin">JOIN THE LOBBY</button>
      <div class="so-faces">${n?`<div class="stack">${so.lobby.slice(-3).reverse().map(p=>avatarHtml(p.name,pic(p.userId))).join('')}</div>`:''}<div><b>${n}</b> in the lobby</div></div></section>${soHow()}`; }
  case 'inlobby': { const n=so.lobby.length, size=Math.min(8,Math.max(n,SO_MIN));
    return `${soClock('SEATS DRAWN IN',Date.parse(so.startAt)-t,`at ${hhmm(so.startAt)}`)}
    <section class="so-card gold"><div class="hd"><div class="so-k">YOU'RE IN</div><span class="so-pill green">IN THE LOBBY</span></div>
      ${soOval(c,[uid],`<b style="font-size:13px">Your table of ${size}</b>`,()=>null,size)}
      <button class="so-cta" disabled>YOUR SEAT OPENS AT ${esc(hhmm(so.startAt)).toUpperCase()}</button></section>
    <section class="so-center"><div class="so-txt s"><b>${n}</b> in the lobby</div><div class="so-txt s" style="max-width:32ch">When the lobby closes, everyone is seated at random. Your tablemates show up here.</div><button class="so-link" data-act="soleave">Leave the lobby</button></section>`; }
  case 'seat': return soSeat(c,ri);
  case 'qualwait': return soQualWait(c,ri);
  case 'qualthrough': return soQualThrough(c,ri);
  case 'qualcut': return soQualCut(c,ri);
  case 'kothrough': return soKoThrough(c,ri);
  case 'koout': return soKoOut(c,ri);
  case 'finalout': return soFinalOut(c,ri);
  case 'standings': return soStandings(c);
  default: { const cur=c.cur;
    return `<section class="so-card edge mid"><div class="so-k">${cur?esc(cur.name.toUpperCase()):'THE SHOOTOUT'}</div><div class="so-big md">${so.joined} PLAYING</div>
      <div class="so-txt">You're not in this one: it was for the people in the lobby when it closed. Every table is live to watch.</div></section>
    ${soLiveBlock(c)}<button class="so-cta sm" data-sotab="watch">WATCH THE TABLES</button>`; }
  } }

function soHow(){ return `<section class="so-card"><div class="so-k m">HOW IT WORKS</div>
  <div class="so-step"><i>1</i><div>Join the lobby. Only people in it get a seat.</div></div>
  <div class="so-step"><i>2</i><div>When the numbers need one, round 1 is a qualifier. The players with the most chips across tables go through, until there are exactly enough for full tables of 8.</div></div>
  <div class="so-step"><i>3</i><div>From round 2, be one of the last 4 at your table to go through. The table winner starts the next round with 1,500 chips.</div></div>
  <div class="so-step"><i>4</i><div>More than 128 players? There is no qualifier: everyone is through to round 1, and the last 4 at every table go through, round after round, to the final table.</div></div></section>`; }

/* Screens 3, 8 and 12: your seat in the round about to deal (or dealt: back to it). */
function soSeat(c,ri){ const r=c.rounds[ri], tb=c.tableOf(r), t=now(), uid=c.uid, seated=!!c.sh.seated[uid], next=c.planNext(ri);
  if(!tb)return '';
  const stage=soOne(r.name).toUpperCase();
  const clock=r.startedAt?(tb.live?soClock(`${stage} LIVE`,tb.live.endsAt-t,'left at your table'):''):soClock(`${stage} STARTS IN`,r.startsAt-t);
  const cta=seated?`<button class="so-cta" data-act="mytable">${r.startedAt?'BACK TO YOUR TABLE':'TAKE YOUR SEAT'}</button>`
    :`<button class="so-cta" disabled>${r.startsAt>t?`YOUR SEAT OPENS IN ${clockOf(r.startsAt-t)}`:'DEALING…'}</button>`;
  const big=id=>(tb.stacks[id]||0)>1000;
  if(r.kind==='final'){
    const ids=tb.players.slice().sort((a,b)=>(tb.stacks[b]||0)-(tb.stacks[a]||0));
    return `${clock}<section class="so-card gold"><div class="so-k">THE LAST ${tb.players.length} · PLAYS TO ONE CHAMPION</div>
      <div class="so-fgrid">${ids.map(id=>`<div class="so-p ${big(id)?'w':''} ${id===uid?'me':''}">${soFace(c,id)}<div><div class="nm">${esc(id===uid?'You':first(c.name(id)))}</div><div class="ck">${fmt(tb.stacks[id])}${big(id)?' · winner':''}</div></div></div>`).join('')}</div>${cta}</section>
      <section class="so-note"><b>No stopping at 4.</b> The final plays until one player has every chip. If the clock runs out first, most chips wins. Places go by the order players bust.</section>`; }
  const others=tb.players.filter(id=>id!==uid), wins=tb.players.filter(big);
  const mid=r.kind==='qualifier'?`<div><b>1,000</b> chips each<br>${tb.players.length} at this table</div>`
    :`<div><b>Last ${r.advance}</b><br>go ${next&&next.kind==='final'?'to the final':'through'}</div>`;
  const oval=soOval(c,tb.players,mid,id=>big(id)?{cls:'w',label:fmt(tb.stacks[id])}:null);
  const stats=r.kind==='qualifier'
    ?soStat(c.so.joined,'joined the lobby')+soStat(r.tables.length,`table${r.tables.length===1?'':'s'} playing at once`)+soStat(r.advance,`go through to ${next?soThe(next):'the next round'}`,'g')
    :soStat(fmt(big(uid)?tb.stacks[uid]:1000),big(uid)?'your chips: you won your table':wins.length?`chips each · ${wins.length} start${wins.length===1?'s':''} on 1,500`:'chips for everyone')
      +soStat(r.advance,next&&next.kind==='final'?'go to the final':'go through')+soStat('1,500',`for the table winner in ${next?soThe(next):'the next round'}`,'g');
  const note=r.kind==='qualifier'?`<b>How the qualifier works:</b> one normal Speed Poker game. When the clock ends, players with chips rank first, most chips highest. Busted players rank below them, by the stack they lost with.`
    :`<b>Once ${r.advance} are left,</b> all ${r.advance} are through. Keep playing: whoever wins the table starts ${next?soThe(next):'the next round'} with 1,500 chips.`;
  return `${clock}<section class="so-card gold"><div class="hd"><div class="so-k">YOUR TABLE · ${esc(stage)}</div><span class="so-pill dark">${esc(soTab(tb).toUpperCase())}</span></div>
    ${oval}<div class="so-txt s" style="text-align:center;font-size:13px">${esc(soList(others.map(id=>first(c.name(id))+(big(id)?` (${fmt(tb.stacks[id])})`:''))))}</div>${cta}</section>
    <section class="so-stats">${stats}</section><section class="so-note">${note}</section>`; }

/* A ranking with the viewer's place and the cut line: the rows round you, the rows round the cut, dots between. */
function soRanking(c,r,ids,cut){ const uid=c.uid, n=ids.length, me0=ids.indexOf(uid), show=new Set();
  if(n<=12)ids.forEach((_,i)=>show.add(i)); else { [me0-1,me0,me0+1].forEach(i=>show.add(i)); for(let i=cut-3;i<=cut+1;i++)show.add(i); }
  const val=id=>{ const t=c.tableOf(r,id); if(!t)return ''; const ch=soChips(t,id); if(ch>0)return fmt(ch);
    const lost=soLost(t,id); return `<span class="x">out${lost!=null?` · lost with ${fmt(lost)}`:''}</span>`; };
  let out='', last=-1;
  [...show].filter(i=>i>=0&&i<n).sort((a,b)=>a-b).forEach(i=>{ if(last>=0&&i>last+1)out+='<div class="so-gap">···</div>';
    if(i===cut&&cut>0)out+='<div class="so-cut"><i></i><b>CUT LINE</b><i></i></div>';
    const id=ids[i]; out+=`<div class="so-row ${id===uid?'me':''} ${i>=cut?'dim':''}"><span class="r">${i+1}</span><span>${esc(c.name(id))}</span><span>${val(id)}</span></div>`; last=i; });
  return out; }

function soStill(c,r,mine){ const t=now();
  return r.tables.filter(x=>x!==mine&&x.tableId&&x.live&&x.live.status==='playing').map(x=>`<button class="so-still" data-watch="${esc(x.tableId)}"><span>${esc(soTab(x))} is still playing</span><b>${clockOf(x.live.endsAt-t)} left</b></button>`).join(''); }

/* Screen 5: your qualifier table is done (or you are out of chips); everyone across the tables, as it stands. */
function soQualWait(c,ri){ const r=c.rounds[ri], tb=c.tableOf(r), uid=c.uid, ids=c.rankOf(r), place=ids.indexOf(uid)+1, n=r.players.length, chips=soChips(tb,uid);
  const busted=chips<=0, over=soDone(tb);
  return `<section class="so-card edge mid"><div class="so-k">${over?'YOUR TABLE IS DONE':'YOU\'RE OUT OF CHIPS'}</div>
      <div class="so-txt s">${busted?'You busted. Players with chips rank above you.':`You finished with <b>${fmt(chips)} chips</b>`}</div>
      <div class="so-big">${place?`${ordinal(place)} of ${n}`:'—'}</div><div class="so-txt s">for now. Top ${r.advance} go through.</div></section>
    ${soStill(c,r,tb)}
    <section class="so-card list"><div class="hd"><div class="so-k m">LIVE RANKING · ALL TABLES</div><div class="c">${n} players</div></div>${soRanking(c,r,ids,r.advance)}</section>
    <div class="so-txt s" style="text-align:center;font-size:13px;color:#9DB5A7;padding:0 8px">Players with chips rank first. Busted players rank by the stack they lost with.</div>`; }

function soPath(c,ri,outAt){ const plan=c.so.plan||[];
  return `<section class="so-card"><div class="so-k m">YOUR PATH</div><div class="so-path">${plan.map((p,i)=>{ const nm=soOne(p.name);
    if(outAt!=null&&i===outAt)return `<span class="x">${esc(nm)} ✕</span>`;
    return i<ri?`<span class="d">${esc(nm)} ✓</span>`:i===ri?`<span class="n">${esc(nm)}</span>`:`<span class="f">${esc(nm)}</span>`; }).join('')}</div></section>`; }

/* Screen 6: through the qualifier; the next round is drawn. */
function soQualThrough(c,ri){ const q=c.rounds[ri], nx=c.rounds[ri+1], tb=c.tableOf(q), ids=c.rankOf(q), place=ids.indexOf(c.uid)+1, n=q.players.length, went=(q.next||[]).length;
  const nnext=c.planNext(ri+1), size=Math.max(...nx.tables.map(t=>t.players.length));
  const dots=[`${nx.tables.length===1?'One table':nx.tables.length+' tables'} of ${size}, seats drawn at random`,'Everyone starts fresh with 1,000 chips',
    nx.kind==='final'?'Plays to one champion':`Last ${nx.advance} at each table go ${nnext&&nnext.kind==='final'?'to the final':'through'}`];
  return `<section class="so-card edge mid"><div class="so-k">QUALIFIER</div><div class="so-big green">YOU'RE THROUGH!</div><div class="so-txt">${ordinal(place)} of ${n} · <b>${fmt(soChips(tb,c.uid))} chips</b></div></section>
    <section class="so-card gold"><div class="so-k">NEXT · ${esc(nx.kind==='final'?'FINAL TABLE':nx.name.toUpperCase())}</div><div class="so-dots">${dots.map(d=>`<div>${esc(d)}</div>`).join('')}</div>
      <button class="so-cta sm" data-act="soack" data-ri="${ri+1}">${nx.kind==='final'?'SEE THE FINAL TABLE':`SEE MY ${esc(soOne(nx.name).toUpperCase())} TABLE`}</button></section>
    ${soPath(c,ri+1)}
    <section class="so-stats two">${soStat(went,'through','gr')}${soStat(n-went,'cut in the qualifier','r')}</section>`; }

/* The round on now, table by table: how many are left, a bar of the seats. */
function soLiveBlock(c){ const r=c.cur, t=now(); if(!r||r.endedAt)return '';
  if(!r.startedAt)return `<section class="so-card"><div class="so-k m">UP NEXT · ${esc(r.name.toUpperCase())}</div><div class="so-txt w">${esc(r.name)} start${soIs(r)==='is'?'s':''} in ${clockOf(r.startsAt-t)}.</div></section>`;
  const rows=r.tables.filter(x=>x.live).map(x=>{ const left=x.live.left, n=x.players.length, over=x.live.status==='over';
    const need=r.kind==='knockout'&&left>r.advance?left-r.advance:0, nx=c.planNext(c.ci);
    const say=over?'done':r.kind==='knockout'?(need?`${left} left · ${need} bust${need===1?'':'s'} to ${nx&&nx.kind==='final'?'the final':'go through'}`:`${left} left · all through`):`${left} left`;
    return `<div class="so-live"><div class="t"><b>${esc(soTab(x))}</b><span class="${need===1?'hot':''}">${esc(say)}</span></div><div class="so-bar">${Array.from({length:n},(_,i)=>`<i class="${i<left?'on':''}"></i>`).join('')}</div></div>`; }).join('');
  return rows?`<section class="so-card"><div class="so-k m">LIVE NOW · ${esc(r.name.toUpperCase())}</div>${rows}</section>`:''; }

/* Screen 7: cut in the qualifier. */
function soQualCut(c,ri){ const q=c.rounds[ri], tb=c.tableOf(q), ids=c.rankOf(q), place=ids.indexOf(c.uid)+1, n=q.players.length, lost=soLost(tb,c.uid), chips=soChips(tb,c.uid), cur=c.cur, nx=c.planNext(c.ci);
  const now2=cur&&cur!==q?` ${cur.name} ${soIs(cur)} ${cur.startedAt?'live now':'up next'}${cur.startedAt&&nx?` and ${soThe(nx)} ${soIs(nx)} up next`:''}.`:'';
  return `<section class="so-card edge mid"><div class="so-k">QUALIFIER</div><div class="so-big red">CUT AT ${ordinal(place).toUpperCase()}</div>
      <div class="so-txt" style="max-width:30ch">${lost!=null?`You lost your last hand with ${fmt(lost)} chips.`:chips>0?`You finished with ${fmt(chips)} chips.`:'You ran out of chips.'} The cut was ${ordinal(q.advance)}.</div></section>
    <section class="so-card" style="gap:8px"><div class="so-k m">YOUR RUN</div><div class="so-txt w">${n-place>0?`You lasted longer than ${n-place} player${n-place===1?'':'s'}.`:'Thanks for playing.'}${esc(now2)}</div></section>
    ${soLiveBlock(c)}`; }

/** A knockout or final table's finishing order, with who went through and its winner. */
function soOrderRows(c,tb,adv,showWin){ const order=soOrder(tb), thr=soThrough(tb); let out='';
  order.forEach((id,i)=>{ if(i===adv&&adv<order.length)out+='<div class="so-cut"><i></i><b>OUT</b><i></i></div>';
    const tag=i<adv?(i===0&&showWin?'<span class="win">WINNER · 1,500</span>':thr.includes(id)?'<span class="thr">THROUGH</span>':''):'';
    out+=`<div class="so-row ${id===c.uid?'me':''} ${i===0&&showWin?'first':''} ${i>=adv?'dim':''}"><span class="r">${i+1}</span><span>${esc(c.name(id))}</span>${tag||'<span></span>'}</div>`; });
  return out; }

/* Screen 9: through a knockout table. */
function soKoThrough(c,ri){ const r=c.rounds[ri], tb=c.tableOf(r), place=soOrder(tb).indexOf(c.uid)+1, nx=c.rounds[ri+1], pn=c.planNext(ri), win=soDone(tb);
  const to=pn?(pn.kind==='final'?'THE FINAL':soOne(pn.name).toUpperCase()+'S'):'THE NEXT ROUND';
  const still=r.tables.filter(x=>x!==tb&&x.live&&x.live.status==='playing').map(soTab);
  return `<section class="so-card edge mid"><div class="so-k">${esc(String(tb.label).toUpperCase())}</div><div class="so-big green md">THROUGH TO ${esc(to)}!</div>
      <div class="so-txt">You finished <b>${place?ordinal(place):'—'}</b> at your table</div></section>
    <section class="so-card list"><div class="so-k m" style="padding-bottom:8px">YOUR TABLE · FINISHING ORDER</div>${soOrderRows(c,tb,r.advance,win)}</section>
    ${nx?`<button class="so-cta sm" data-act="soack" data-ri="${ri+1}">SEE ${nx.kind==='final'?'THE FINAL TABLE':'MY '+esc(soOne(nx.name).toUpperCase())+' TABLE'}</button>`
      :`<button class="so-cta sm" disabled>SEE ${pn&&pn.kind==='final'?'THE FINAL TABLE':'YOUR NEXT TABLE'}</button>`}
    ${still.length?`<div class="so-txt s" style="text-align:center;font-size:13px;color:#9DB5A7">${esc(soList(still))} ${still.length===1?'is':'are'} still playing. ${pn?esc(pn.kind==='final'?'The final':pn.name):'The next round'} start${pn&&pn.kind!=='final'&&/s$/.test(pn.name)?'':'s'} when ${still.length===1?'it ends':'they end'}.</div>`:''}`; }

/** Your rounds, one line each: the qualifier's place of all, a table's place. */
function soRun(c,upTo){ const rows=[];
  for(let i=0;i<=upTo&&i<c.rounds.length;i++){ const r=c.rounds[i]; if(!r.players.includes(c.uid))continue; const tb=c.tableOf(r);
    const went=(r.next||[]).includes(c.uid)||(tb&&soThrough(tb).includes(c.uid));
    if(r.kind==='qualifier'){ const ids=c.rankOf(r), p=ids.indexOf(c.uid)+1; rows.push([r.name,`${p?ordinal(p):'—'} of ${r.players.length}${went?' · through':''}`]); }
    else { const p=soOrder(tb).indexOf(c.uid)+1; rows.push([tb.label,`${p?ordinal(p):'—'} at the table${went&&r.kind!=='final'?' · through':''}`]); } }
  return rows; }

/** Where you finished in all, once the round you went out in is settled: everyone further on ranks above you. */
function soOverall(c,ri){ const r=c.rounds[ri], nx=c.rounds[ri+1]; if(!r.endedAt)return null;
  if(c.so.standings){ const p=c.so.standings.indexOf(c.uid)+1; return p||null; }
  const above=nx?nx.players.length:0, out=[];
  if(r.kind==='qualifier'){ const ids=c.rankOf(r); return ids.indexOf(c.uid)+1||null; }
  for(const t of r.tables){ const o=soOrder(t); o.forEach((id,place)=>{ if(!(r.next||[]).includes(id))out.push({id,place,stack:soLost(t,id)??Infinity}); }); }
  out.sort((a,b)=>a.place-b.place||b.stack-a.stack); const k=out.findIndex(x=>x.id===c.uid); return k<0?null:above+k+1; }

/* Screen 10: knocked out of a knockout table. */
function soKoOut(c,ri){ const r=c.rounds[ri], tb=c.tableOf(r), place=soOrder(tb).indexOf(c.uid)+1, pn=c.planNext(ri), from=place-r.advance;
  const run=soRun(c,ri), all=soOverall(c,ri), total=(c.rounds[0]||r).players.length;
  if(all)run.push(['Overall',`<span class="g">${ordinal(all)} of ${total}</span>`]);
  const cur=c.cur, live=cur&&cur!==r;
  const upnext=!live&&pn?`<section class="so-card"><div class="so-k m">UP NEXT · ${esc(pn.kind==='final'?'FINAL TABLE':pn.name.toUpperCase())}</div>
      <div class="so-txt w">${pn.kind==='final'?`The last ${pn.players} play for the title`:`The last ${pn.players} play on`} when ${r.tables.length===2?'both':'all the'} ${esc(r.name.toLowerCase())} are done. Watch every hand live.</div><button class="so-out" data-sotab="watch" style="margin-top:0">Watch the tables</button></section>`:'';
  return `<section class="so-card edge mid"><div class="so-k">${esc(String(tb.label).toUpperCase())}</div><div class="so-big red">KNOCKED OUT</div>
      <div class="so-txt">Out in <b>${place?ordinal(place):'—'}</b> at your table${from>0?`, ${from} bust${from===1?'':'s'} from ${pn&&pn.kind==='final'?'the final':'going through'}`:''}</div></section>
    <section class="so-card"><div class="so-k m">YOUR RUN</div><div class="so-run">${run.map(([a,b])=>`<span>${esc(a)}</span><span>${/^<span/.test(b)?b:esc(b)}</span>`).join('')}</div></section>
    ${live?soLiveBlock(c):upnext}`; }

/* Out of the final while it plays on. */
function soFinalOut(c,ri){ const r=c.rounds[ri], tb=c.tableOf(r), place=soOrder(tb).indexOf(c.uid)+1, run=soRun(c,ri);
  return `<section class="so-card edge mid"><div class="so-k">FINAL TABLE</div><div class="so-big red">OUT IN ${place?ordinal(place).toUpperCase():'THE FINAL'}</div>
      <div class="so-txt">The final plays on to one champion. Watch every hand live.</div></section>
    <section class="so-card"><div class="so-k m">YOUR RUN</div><div class="so-run">${run.map(([a,b])=>`<span>${esc(a)}</span><span>${esc(b)}</span>`).join('')}</div></section>
    ${tb.tableId&&tb.live&&tb.live.status==='playing'?`<button class="so-cta sm" data-watch="${esc(tb.tableId)}">WATCH THE FINAL</button>`:''}`; }

/* Screen 13: the standings, champion first, with the round each person reached. */
function soStandings(c){ const st=c.so.standings||[], uid=c.uid, rounds=c.rounds, fi=rounds.length-1, fin=rounds[fi];
  const reached=id=>{ let k=-1; rounds.forEach((r,i)=>{ if(r.players.includes(id))k=i; }); return k; };
  const champ=st[0], prev=rounds[fi-1];
  const how=champ&&prev&&prev.winners.includes(champ)?`Won ${c.tableOf(prev,champ).label} and started the final on 1,500`:champ&&prev?`Came through ${prev.name.toLowerCase()} and won the final`:`Won the final table of ${fin?fin.players.length:st.length}`;
  const pod=st.slice(1,3).map((id,i)=>`<div class="so-pod">${soFace(c,id)}<div><div class="p">${i?'3RD':'2ND'}</div><div class="nm">${esc(c.name(id))}</div></div></div>`).join('');
  const mine=st.indexOf(uid)+1, run=mine?rounds.map((r,i)=>{ if(!r.players.includes(uid))return null; const tb=c.tableOf(r);
    const p=r.kind==='qualifier'?c.rankOf(r).indexOf(uid)+1:soOrder(tb).indexOf(uid)+1; return `${soOne(r.name)} ${p?ordinal(p):'—'}`; }).filter(Boolean):[];
  const lim=state.soAll?st.length:Math.min(st.length,12); let rows='', lastK=null;
  st.slice(0,lim).forEach((id,i)=>{ const k=reached(id); if(lastK!==null&&k!==lastK)rows+='<div class="so-rule"></div>'; lastK=k;
    const lbl=i===0?'<span class="ch">CHAMPION</span>':`<span class="x" style="font-size:12px">${esc(k>=0?soOne(rounds[k].name):'')}</span>`;
    rows+=`<div class="so-row ${id===uid?'me':''} ${i===0?'first':''} ${k<fi?'dim':''}"><span class="r">${i+1}</span><span>${esc(c.name(id))}</span>${lbl}</div>`; });
  return `${champ?`<section class="so-card gold mid so-champ"><div class="so-k" style="color:#F2B632;letter-spacing:.12em">CHAMPION</div>${soFace(c,champ)}<div class="nm">${esc(c.name(champ))}</div><div class="so-txt s">${esc(how)}</div></section>`:''}
    ${pod?`<section class="so-stats two">${pod}</section>`:''}
    ${mine?`<section class="so-myrun"><div class="so-k">YOUR RUN</div><div class="r"><div>${esc(run.join(' · '))}</div><div class="lil">${ordinal(mine)}</div></div></section>`:''}
    <section class="so-card list"><div class="hd"><div class="so-k m">FINAL STANDINGS</div><div class="c">${st.length} players</div></div>${rows}
      ${st.length>12?`<button class="so-out" data-act="soall">${state.soAll?'Show the top 12':`Show all ${st.length}`}</button>`:''}</section>`; }

/* Screen 11: every table of the round now playing; a tap watches it as the event's tables are watched. */
function soWatch(c){ const r=c.cur, t=now();
  const live=r&&r.startedAt&&!r.endedAt?r.tables.filter(x=>x.tableId&&x.live&&x.live.status==='playing'):[];
  if(!live.length){ const msg=c.so.status==='done'?'The Shootout is over. The results are on the first tab.':c.so.status==='cancelled'?'The Shootout is off this time.':r&&!r.startedAt?`${r.name} start${soIs(r)==='is'?'s':''} in ${clockOf(r.startsAt-t)}. The tables show up here when they deal.`:c.so.status==='lobby'||c.so.status==='upcoming'?'The tables show up here once the lobby closes and they deal.':'No table is playing right now.';
    return `<section class="so-card edge mid"><div class="so-k">NOTHING LIVE YET</div><div class="so-txt">${esc(msg)}</div></section>`; }
  const nx=c.planNext(c.ci);
  return live.map(x=>{ const L=x.live, left=L.left, need=r.kind==='knockout'&&left>r.advance?left-r.advance:0;
    const sub=r.kind==='final'?'<span class="w ok">Plays to one champion</span>':r.kind==='qualifier'?`<span class="w ok">Top ${r.advance} of ${r.players.length} go through</span>`
      :need?`<span class="w">${need} bust${need===1?'':'s'} to ${nx&&nx.kind==='final'?'the final':'go through'}</span>`:`<span class="w ok">All through · playing for 1,500</span>`;
    const mid=`<span class="n">${left} LEFT</span>${sub}<span class="tm">${clockOf(L.endsAt-t)}</span>`;
    const oval=soOval(c,x.players,mid,id=>(L.stacks[id]||0)>0?{cls:L.through.includes(id)?'thru':'',label:fmt(L.stacks[id])}:{empty:''});
    return `<button class="so-card so-wt ${need===1?'red':'edge'}" data-watch="${esc(x.tableId)}"><div class="hd"><b>${esc(x.label)}</b><span class="go">Watch</span></div>${oval}</button>`; }).join(''); }

function onTable(v){ if(!v||!v.id)return; if(v.now)state.offset=v.now-Date.now();

const SFX={

  // chips landing on the felt: a few clinks (three metallic partials each), the stack's thud under them

  // the pot going to the winner: a cascade of chips, a bigger pile
