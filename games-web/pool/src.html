<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sowaka Pool</title>
<!--POOL-TICKET-->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="icon" href="data:,">
<script>if(window.SowakaShare||window.Sowaka)document.documentElement.classList.add('app')</script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@600;800&family=Figtree:wght@400;600;700&display=swap">
<style>
/* Sowaka Pool: a dark, felt-and-brass table in the shape of the pool games people know. Layout: a slim header, then the play
   area: the table (a canvas; the two side cards float over its top) with the power bar as a cue-shaped strip in its own
   column outside the table, and a control dock (spin ball, fine aim, the shot clock) in its own strip outside the canvas, so
   the cue never runs under a control: below the table in portrait, beside it in landscape. The home screen, the live lobby,
   the waiting room and every sheet are panes over the play area. One look only (an arcade screen). */
:root{color-scheme:dark;
  --bg:#0b1612;--panel:#132a20;--panel2:#1a3528;--line:rgba(255,255,255,.1);
  --felt:#1f7a52;--felt2:#145c3c;--rail:#4a2714;--rail2:#2d170b;--brass:#e5b850;--brass2:#b8893a;
  --ink:#f3efe4;--muted:#a8b9ae;--red:#d64b3b;--blue:#3f8bff;--ok:#5bd18a;
  --display:'Sora',system-ui,sans-serif;--body:'Figtree',system-ui,sans-serif;
  --padt:max(12px,env(safe-area-inset-top,0px));--padb:env(safe-area-inset-bottom,0px)}
html.app{--padt:10px}
html.hop body{visibility:hidden}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font:15px/1.35 var(--body);overflow:hidden;overscroll-behavior:none;touch-action:none;-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:disabled{opacity:.5;cursor:default}
input{-webkit-user-select:text;user-select:text}
#app{height:100%;display:flex;flex-direction:column;padding:var(--padt) max(10px,env(safe-area-inset-right,0px)) calc(6px + var(--padb)) max(10px,env(safe-area-inset-left,0px))}
.top{display:flex;align-items:center;gap:8px;height:40px;flex:none}
.top h1{margin:0;font:800 15px/1 var(--display);letter-spacing:.04em;background:var(--brass);color:#2a1a02;padding:7px 10px;border-radius:9px;transform:rotate(-2deg)}
.chip{width:34px;height:34px;border-radius:50%;background:var(--panel);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;flex:none}
.spacer{flex:1}
/* the GAMES logo as on the Games tab */
.swg-slot{flex:1 1 0;min-width:0;align-self:stretch;display:flex;align-items:center;justify-content:flex-end;padding:0 2px;overflow:hidden;container-type:inline-size}
.swg{--swg-h:22px;--u:calc(var(--swg-h) / 28.577);display:flex;align-items:center;flex:none;pointer-events:none}
@supports (width:1cqw){.swg-slot .swg{--swg-h:clamp(16px,calc(100cqw / 5),24px)}}
@container (max-width:79px){.swg{display:none}}
.swg-logo{height:calc(28*var(--u));padding:0 calc(10*var(--u)) 0 calc(6*var(--u));border-radius:calc(8*var(--u));background:#B23500;display:flex;align-items:center;color:#fff;font:800 calc(13*var(--u))/1 var(--display);letter-spacing:.02em}
.swg-box{width:calc(70.214*var(--u));height:calc(28.577*var(--u));margin-left:calc(-8*var(--u));display:flex;align-items:center;justify-content:center;flex:none}
.swg-games{height:calc(25*var(--u));padding:0 calc(10*var(--u));border-radius:calc(7*var(--u));background:#FFCC2E;box-shadow:0 calc(2*var(--u)) 0 #160D2C;transform:rotate(-3deg);display:flex;align-items:center;font:800 calc(13*var(--u))/1 var(--display);color:#160D2C;white-space:nowrap}
/* play area: the board (table + power bar column) and the dock */
#main{position:relative;flex:1;min-height:0;display:flex;flex-direction:column;margin-top:6px}
#board{flex:1;min-height:0;display:flex}
#stage{position:relative;flex:1;min-width:0;min-height:0}
canvas#table{position:absolute;inset:0;width:100%;height:100%;display:block}
#dock{flex:none;display:flex;align-items:center;gap:10px;height:66px;padding:8px 4px 0}
@media (orientation:landscape){#main{flex-direction:row}#dock{order:-1;flex-direction:column;width:66px;height:auto;padding:0 8px 0 0;gap:10px;justify-content:center}.fine{flex-direction:column}#dock .clock{margin-left:0;margin-top:4px}}
/* the side cards over the top of the table: my side on the left, theirs on the right */
.hud{position:absolute;left:0;right:0;top:0;display:flex;gap:6px;padding:0 2px;pointer-events:none}
.side{flex:1;min-width:0;background:rgba(10,22,16,.86);border:1px solid var(--line);border-radius:14px;padding:6px 8px;display:flex;align-items:center;gap:7px;transition:box-shadow .3s}
.side.on{box-shadow:0 0 0 2px var(--brass),0 6px 18px rgba(0,0,0,.4)}
.side.them{flex-direction:row-reverse;text-align:right}
.side .avs{display:flex;flex:none}
.side .av{width:34px;height:34px;border-radius:50%;background:var(--panel2) center/cover no-repeat;display:flex;align-items:center;justify-content:center;font:800 12px var(--display);position:relative;flex:none;border:2px solid rgba(255,255,255,.1)}
.side .av+.av{margin-left:-10px}
.side .av.shoot{z-index:1;border-color:var(--brass)}
.side .av.away{opacity:.45}
.side .av svg{position:absolute;inset:-6px;width:42px;height:42px;transform:rotate(-90deg)}
.side .who{min-width:0;flex:1}
.side .nm{font-weight:700;font-size:12.5px;line-height:1.15;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;color:var(--muted)}
.side .nm .now{color:var(--ink)}
.side .grp{display:flex;gap:3px;margin-top:4px;min-height:11px;flex-wrap:wrap}
.side.them .grp{justify-content:flex-end}
.side .grp i{width:11px;height:11px;border-radius:50%;display:block;border:1px solid rgba(0,0,0,.4);box-shadow:inset -2px -2px 3px rgba(0,0,0,.35)}
.side .grp i.s{background:linear-gradient(#fff 0 25%,var(--c) 25% 75%,#fff 75%)}
.side .grp i.done{opacity:.18}
.side .lbl{font-size:10.5px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (orientation:landscape){.side{padding:4px 8px}.side .av{width:30px;height:30px}.side .av svg{width:38px;height:38px}.side .grp{margin-top:2px}}
.msg{position:absolute;left:50%;top:84px;transform:translateX(-50%);background:rgba(229,184,80,.96);color:#2a1a02;font-weight:800;font-size:13px;padding:7px 14px;border-radius:999px;box-shadow:0 6px 18px rgba(0,0,0,.4);pointer-events:none;max-width:84%;text-align:center;opacity:0;transition:opacity .2s;z-index:5}
.msg.show{opacity:1}
.msg.bad{background:#f0d7d2;color:#5a1409}
/* feed lines from a live table ("Priya potted the 3") */
.toasts{position:absolute;left:50%;bottom:80px;transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;z-index:28;width:max-content;max-width:72%}
.toast{background:rgba(10,18,14,.95);border:1px solid var(--line);padding:8px 13px;border-radius:12px;font-size:13px;box-shadow:0 8px 30px rgba(0,0,0,.4);transition:opacity .25s;max-width:100%;text-align:center}
/* the power bar: a cue-shaped vertical strip in its own column beside the table; pull down and let go */
.pbar{display:none;flex:none;width:46px;margin-left:4px;position:relative;touch-action:none}
#board.play .pbar{display:block}
.pbar.off{visibility:hidden}
.pbar .cue{position:absolute;left:50%;top:8px;bottom:8px;width:34px;transform:translateX(-50%);border-radius:999px;background:rgba(10,22,16,.86);border:1px solid var(--line)}
.pbar .wrap{position:absolute;inset:5px 6px;clip-path:polygon(34% 0,66% 0,100% 100%,0 100%);background:rgba(255,255,255,.08)}
.pbar .fill{position:absolute;inset:0;background:linear-gradient(180deg,#fff 0%,#f1cf5c 40%,#e86a43 72%,#c62f2b 100%);clip-path:inset(0 0 100% 0)}
.pbar .knob{position:absolute;left:0;right:0;top:0;height:34px;border-radius:12px;background:var(--brass);box-shadow:0 2px 8px rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;font:800 9.5px var(--display);color:#2a1a02;letter-spacing:.04em}
.pbar.armed .knob{background:#fff}
/* the dock: the spin ball, fine aim, the clock */
.spin{width:54px;height:54px;border-radius:50%;background:radial-gradient(circle at 38% 34%,#fff 0 55%,#cfcfcf 56% 100%);box-shadow:inset 0 -4px 10px rgba(0,0,0,.25),0 6px 16px rgba(0,0,0,.45);border:2px solid rgba(229,184,80,.7);touch-action:none;position:relative;flex:none}
.spin .dot{position:absolute;width:12px;height:12px;border-radius:50%;background:var(--red);border:2px solid #fff;left:50%;top:50%;transform:translate(-50%,-50%);pointer-events:none}
.spin.off,.fine.off{visibility:hidden}
.fine{display:flex;gap:8px;touch-action:none}
.fine button{width:42px;height:42px;border-radius:50%;background:rgba(10,22,16,.86);border:1px solid var(--line);font-size:17px;font-weight:800;touch-action:none}
.clock{margin-left:auto;font:800 14px var(--display);color:var(--muted);background:rgba(10,22,16,.86);border:1px solid var(--line);border-radius:999px;padding:7px 12px;flex:none}
.clock.low{color:#ffb4a8}
.wait{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);font-size:12px;color:var(--muted);background:rgba(10,22,16,.86);border:1px solid var(--line);border-radius:999px;padding:6px 12px;white-space:nowrap;max-width:70%;overflow:hidden;text-overflow:ellipsis;pointer-events:none}
/* sheets */
.sheet{position:absolute;inset:0;background:rgba(5,12,9,.78);display:flex;align-items:flex-end;justify-content:center;z-index:30}
.sheet .box{width:100%;max-width:520px;background:var(--panel);border:1px solid var(--line);border-radius:22px 22px 0 0;padding:16px 16px calc(16px + var(--padb));max-height:92%;overflow:auto;touch-action:pan-y}
.sheet h2{margin:0 0 6px;font:800 20px/1.1 var(--display)}
.sheet p{margin:6px 0 12px;color:var(--muted);font-size:13.5px}
.sheet input.q{width:100%;min-height:44px;border-radius:12px;border:1px solid var(--line);background:rgba(0,0,0,.25);color:var(--ink);font:600 15px var(--body);padding:0 12px;outline:none;margin-bottom:8px}
.sheet input.q:focus{border-color:var(--brass)}
.sheet .list{max-height:42vh;overflow:auto;touch-action:pan-y}
.btn{display:flex;align-items:center;justify-content:center;min-height:48px;border-radius:14px;font-weight:800;font-size:15px;background:var(--panel2);border:1px solid var(--line);width:100%;gap:8px}
.btn.primary{background:var(--brass);color:#2a1a02;border-color:transparent}
.btn.big{min-height:56px;font-size:17px;box-shadow:0 8px 24px rgba(229,184,80,.25)}
.btn small{font-size:12px;font-weight:700;opacity:.75}
.btn+.btn{margin-top:8px}
.seg{display:flex;gap:4px;background:rgba(0,0,0,.25);padding:4px;border-radius:12px;margin:8px 0 12px}
.seg button{flex:1;min-height:38px;border-radius:9px;font-weight:800;font-size:13px;color:var(--muted);padding:0 6px}
.seg button.on{background:var(--ink);color:#0b1612}
.seg.mini{margin:8px 0 0;padding:3px}
.seg.mini button{min-height:28px;font-size:11.5px;border-radius:7px}
/* the home screen: the table is the hero behind it; one primary button, the modes as a row of cards, stats as chips */
.menu{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end;padding:10px;background:linear-gradient(180deg,rgba(11,22,18,0) 0%,rgba(11,22,18,.94) 48%);z-index:20;overflow:auto;touch-action:pan-y}
.home{width:100%;max-width:520px;margin:0 auto;flex:none}
.chips{display:flex;gap:6px;margin-bottom:10px;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chipi{flex:none;display:flex;align-items:center;gap:6px;background:rgba(19,42,32,.96);border:1px solid var(--line);border-radius:999px;padding:6px 11px;font-size:12px;color:var(--muted);white-space:nowrap}
.chipi b{color:var(--ink);font:800 13px var(--display)}
.chipi.act{color:var(--brass);font-weight:700}
.home .title{font:800 30px/1 var(--display);letter-spacing:-.01em;margin:0 0 3px}
.home .sub{color:var(--muted);font-size:13px;margin:0 0 10px}
.modes{display:flex;gap:8px;margin-top:10px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:none;scroll-snap-type:x proximity}
.modes::-webkit-scrollbar{display:none}
.mode{flex:none;width:138px;background:rgba(19,42,32,.96);border:1px solid var(--line);border-radius:16px;padding:10px 11px;text-align:left;display:flex;flex-direction:column;gap:3px;scroll-snap-align:start;min-height:96px}
.mode:active{background:var(--panel2)}
.mode .ic{width:28px;height:28px;margin-bottom:3px;color:var(--brass)}
.mode .ic svg{width:100%;height:100%;display:block}
.mode b{font:800 14px var(--display)}
.mode span{font-size:11.5px;color:var(--muted);line-height:1.25}
.mode.house{width:188px}
@media (max-height:460px){.menu{padding:6px}.home .title{font-size:20px}.home .sub{margin-bottom:6px}.chips{margin-bottom:6px}.btn.big{min-height:46px;font-size:15px}.mode{min-height:0;padding:8px 10px}.mode .ic{display:none}.modes{margin-top:6px}}
.result .score{font:800 44px/1 var(--display);margin:4px 0}
.stars{font-size:22px;letter-spacing:4px;margin-bottom:6px}
.board{list-style:none;margin:0;padding:0}
.board li{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.board li.me{color:var(--brass)}
.board li b{width:28px;color:var(--muted);font-weight:700}
.board li span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.howto ol{padding-left:18px;margin:0 0 12px;color:var(--ink);font-size:14px}
.howto li{margin:6px 0}
.names{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:4px 0 12px}
.names label{display:block;font-size:11px;color:var(--muted);margin-bottom:3px;font-weight:700}
.names input{width:100%;min-height:42px;border-radius:12px;border:1px solid var(--line);background:rgba(0,0,0,.25);color:var(--ink);font:600 14px var(--body);padding:0 10px;outline:none}
.names input:focus{border-color:var(--brass)}
.names .sidehdr{grid-column:1/-1;font:800 12px var(--display);color:var(--brass);margin-top:2px}
/* the live rooms: a pane over the table for the lobby and the waiting room */
.pane{position:absolute;inset:0;z-index:25;background:rgba(11,22,18,.97);overflow-y:auto;-webkit-overflow-scrolling:touch;padding:4px 2px calc(14px + var(--padb));touch-action:pan-y}
.pane .inner{max-width:560px;margin:0 auto}
.ptop{display:flex;align-items:center;gap:10px;margin:4px 0 12px}
.ptop .ttl{flex:1;min-width:0}
.ptop .ttl b{display:block;font:800 18px/1.1 var(--display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ptop .ttl span{display:block;font-size:12px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{font-size:11px;font-weight:800;padding:5px 9px;border-radius:999px;background:var(--panel2);border:1px solid var(--line);color:var(--muted);white-space:nowrap;flex:none}
.pill.on{background:rgba(91,209,138,.18);color:var(--ok);border-color:rgba(91,209,138,.4)}
.pill.off{background:rgba(214,75,59,.18);color:#ffb4a8;border-color:rgba(214,75,59,.4)}
.card2{background:rgba(19,42,32,.96);border:1px solid var(--line);border-radius:20px;padding:14px;margin-bottom:12px}
.card2 h3{margin:0 0 8px;font:800 15px var(--display)}
.card2 p{margin:4px 0 10px;color:var(--muted);font-size:13px}
.card2 p:last-child{margin-bottom:0}
.card2.hero{background:linear-gradient(160deg,rgba(31,122,82,.55),rgba(19,42,32,.96) 70%);border-color:rgba(229,184,80,.3)}
.row2{display:flex;gap:8px}
.row2 .btn{flex:1;margin:0;min-width:0}
.codebox{display:flex;gap:8px;margin-top:10px;align-items:center}
.codebox span{font-size:12px;color:var(--muted);flex:none}
.codebox input{flex:1;min-width:0;max-width:150px;min-height:40px;border-radius:10px;border:1px solid var(--line);background:rgba(0,0,0,.25);color:var(--ink);font:700 15px var(--body);padding:0 10px;letter-spacing:.1em;outline:none}
.codebox input:focus{border-color:var(--brass)}
.codebox .btn{width:auto;padding:0 16px;margin:0;flex:none;min-height:40px;font-size:13px}
.tables{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tcard{background:rgba(0,0,0,.22);border:1px solid var(--line);border-radius:16px;padding:10px;display:flex;flex-direction:column;align-items:center;gap:5px;text-align:center;min-width:0}
.tcard b{font-size:13px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tcard span{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.tcard .btn{min-height:36px;font-size:13px;margin-top:3px}
.rowi{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.rowi:last-child{border-bottom:0}
.rowi .who{flex:1;min-width:0}
.rowi .who b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rowi .who span{display:block;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rowi .btn{width:auto;min-height:38px;padding:0 14px;font-size:13px;margin:0;flex:none}
.face{width:38px;height:38px;border-radius:50%;background:var(--panel2) center/cover no-repeat;display:flex;align-items:center;justify-content:center;font:800 13px var(--display);color:#dfeee5;flex:none;border:1px solid var(--line)}
.face.lg{width:58px;height:58px;font-size:18px}
.face.off{opacity:.45}
.stack{display:flex;flex:none}
.stack .face{margin-left:-8px;box-shadow:0 0 0 2px var(--panel)}
.stack .face:first-child{margin-left:0}
.bigcode{font:800 44px/1 var(--display);letter-spacing:.12em;text-align:center;margin:6px 0 4px;color:var(--brass)}
.seats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.seat{background:rgba(0,0,0,.25);border:1px solid var(--line);border-radius:16px;padding:12px 8px;display:flex;flex-direction:column;align-items:center;gap:5px;text-align:center;min-height:118px;justify-content:center;min-width:0}
.seat b{font-size:13.5px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.seat span{font-size:11.5px;color:var(--muted)}
.seat.empty{border-style:dashed}
.sides{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.sidecol{display:flex;flex-direction:column;gap:8px;min-width:0}
.sidecol .sidelbl{font:800 12px var(--display);color:var(--brass);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sidecol .seat{min-height:104px;padding:10px 6px}
.vs{grid-column:1/-1;text-align:center;font:800 12px var(--display);color:var(--muted);margin:-4px 0}
.invite{display:flex;align-items:center;gap:10px;background:rgba(229,184,80,.12);border:1px solid rgba(229,184,80,.4);border-radius:16px;padding:10px 12px;margin-bottom:10px}
.invite .who{flex:1;min-width:0}
.invite .who b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.invite .who span{display:block;font-size:12px;color:var(--muted)}
.invite .btn{width:auto;min-height:38px;padding:0 14px;font-size:13px;margin:0;flex:none}
.empty{color:var(--muted);font-size:13px;text-align:center;padding:12px 0}
.linkbtn{display:block;margin:10px auto 0;color:var(--brass);font-weight:700;font-size:13px}
.hint{font-size:12px;color:var(--muted);text-align:center;margin-top:6px}
/* How to play: a sheet with a stage that shows one drawn scene at a time (the same pattern as Secret Squad's); the scene's
   parts animate in when it is shown. Motion runs under html.move only, which the page sets unless the person asked for less. */
.hw .grab{display:block;width:40px;height:5px;border-radius:999px;background:rgba(255,255,255,.18);margin:-4px auto 10px}
.hw .hh{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.hw .hh h2{margin:0}
.hw-stage{position:relative;height:250px;border-radius:24px;overflow:hidden;background:radial-gradient(circle at 50% 30%,#1b4a35 0%,#0f2e20 60%,#08190f 100%);flex:none;touch-action:pan-y;border:1px solid var(--line)}
.hw-scene{position:absolute;inset:0}
.hw-cap{min-height:62px;display:flex;align-items:center;justify-content:center;text-align:center;font:800 19px/1.25 var(--display);color:var(--ink);margin:10px 0 0;padding:0 6px}
.hw-dots{display:flex;justify-content:center;margin:0 0 6px}
.hw-dots button{width:40px;height:40px;display:grid;place-items:center}
.hw-dots button span{width:8px;height:8px;border-radius:999px;background:rgba(255,255,255,.2);transition:width .2s}
.hw-dots button[aria-current="step"] span{width:24px;background:var(--brass)}
/* the drawn parts: a little table, balls, a cue, a power bar, a spin ball, avatars, pockets */
.hw-table{position:absolute;left:50%;top:50%;width:270px;height:150px;margin:-75px 0 0 -135px;border-radius:14px;background:#4a2714;box-shadow:0 10px 24px rgba(0,0,0,.5),inset 0 0 0 1px rgba(229,184,80,.4)}
.hw-felt{position:absolute;inset:11px;border-radius:6px;background:radial-gradient(circle at 50% 50%,#2a8d5f,#15593a)}
.hw-pk{position:absolute;width:20px;height:20px;border-radius:50%;background:#120a04;box-shadow:inset 0 0 6px #000;margin:-10px 0 0 -10px}
.hw-pk.g{box-shadow:inset 0 0 6px #000,0 0 0 3px rgba(229,184,80,.9),0 0 18px 4px rgba(229,184,80,.55)}
.hw-ball{position:absolute;width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:50%;background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.75),rgba(255,255,255,0) 40%),var(--c,#f4f0e4);box-shadow:inset -3px -3px 6px rgba(0,0,0,.35),2px 3px 5px rgba(0,0,0,.4);display:grid;place-items:center;font:800 9px var(--body);color:#17130f}
.hw-ball.s{background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.75),rgba(255,255,255,0) 40%),linear-gradient(#f4f0e4 0 24%,var(--c) 24% 76%,#f4f0e4 76%)}
.hw-ball.n::after{content:attr(data-n);width:11px;height:11px;border-radius:50%;background:#faf6ec;display:grid;place-items:center;font-size:7px}
.hw-cue{position:absolute;left:0;top:50%;width:170px;height:7px;margin-top:-3.5px;border-radius:4px;background:linear-gradient(90deg,#3f8bff 0 2%,#f4ecdc 2% 5%,#c89a5b 5% 62%,#e5b850 62% 63%,#3a2414 63%);box-shadow:0 3px 6px rgba(0,0,0,.5);transform-origin:0 50%}
.hw-cue.flip{background:linear-gradient(270deg,#3f8bff 0 2%,#f4ecdc 2% 5%,#c89a5b 5% 62%,#e5b850 62% 63%,#3a2414 63%)}
.hw-pivot{position:absolute;left:0;top:0;width:0;height:0}
.hw-line{position:absolute;left:0;top:-1px;height:0;border-top:2px dashed rgba(255,255,255,.85);transform-origin:0 50%}
.hw-ghost{position:absolute;width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:50%;border:2px solid rgba(255,255,255,.85)}
.hw-touch{position:absolute;width:30px;height:30px;margin:-15px 0 0 -15px;border-radius:50%;background:rgba(255,255,255,.35);box-shadow:0 0 0 3px rgba(255,255,255,.6)}
.hw-bar{position:absolute;right:26px;top:30px;width:30px;height:190px;border-radius:999px;background:rgba(10,22,16,.86);border:1px solid var(--line)}
.hw-barfill{position:absolute;left:6px;right:6px;top:6px;bottom:6px;clip-path:polygon(34% 0,66% 0,100% 100%,0 100%);background:linear-gradient(180deg,#fff 0%,#f1cf5c 40%,#e86a43 72%,#c62f2b 100%);opacity:.22}
.hw-barfill.on{opacity:1;transform-origin:50% 0;transform:scaleY(.75)}
.hw-knob{position:absolute;left:-2px;right:-2px;top:0;height:30px;border-radius:10px;background:var(--brass);display:grid;place-items:center;font:800 8px var(--display);color:#2a1a02}
.hw-spin{position:absolute;left:50%;top:50%;width:120px;height:120px;margin:-60px 0 0 -60px;border-radius:50%;background:radial-gradient(circle at 38% 34%,#fff 0 55%,#cfcfcf 56% 100%);box-shadow:inset 0 -6px 14px rgba(0,0,0,.25),0 10px 24px rgba(0,0,0,.5);border:3px solid rgba(229,184,80,.7)}
.hw-sdot{position:absolute;left:50%;top:50%;width:18px;height:18px;margin:-9px 0 0 -9px;border-radius:50%;background:var(--red);border:3px solid #fff}
.hw-tag{position:absolute;left:50%;transform:translateX(-50%);background:var(--brass);color:#2a1a02;font:800 12px var(--display);padding:6px 12px;border-radius:999px;white-space:nowrap;box-shadow:0 6px 16px rgba(0,0,0,.4)}
.hw-tag.bad{background:#f0d7d2;color:#5a1409}
.hw-av{position:absolute;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font:800 14px var(--display);color:#fff;border:2px solid rgba(255,255,255,.15)}
.hw-av.on{border-color:var(--brass);box-shadow:0 0 0 3px rgba(229,184,80,.35)}
.hw-grp{position:absolute;display:flex;gap:3px}
.hw-grp i{width:11px;height:11px;border-radius:50%;background:var(--c);border:1px solid rgba(0,0,0,.4);display:block}
.hw-grp i.s{background:linear-gradient(#fff 0 25%,var(--c) 25% 75%,#fff 75%)}
.hw-ring{position:absolute;width:64px;height:64px}
.hw-ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.hw-badge{position:absolute;background:rgba(10,22,16,.9);border:1px solid var(--line);border-radius:14px;padding:8px 12px;text-align:center;font:800 12px var(--display);color:var(--muted)}
.hw-badge b{display:block;font-size:22px;color:var(--ink);line-height:1.1}

.move .hw-cap{animation:hwcap .45s ease-out both}
@keyframes hwcap{0%{transform:translateY(8px);opacity:0}100%{transform:none;opacity:1}}
.move .hw-aim{animation:hwaim 3.2s ease-in-out infinite alternate}
@keyframes hwaim{0%{transform:rotate(-24deg)}100%{transform:rotate(14deg)}}

@keyframes hwfill{0%{transform:scaleY(0);opacity:.22}15%{opacity:1}50%{transform:scaleY(.75);opacity:1}62%{transform:scaleY(0);opacity:.22}100%{transform:scaleY(0);opacity:.22}}

.move .hw-pot{animation:hwpot 2.4s ease-in 1 both}
@keyframes hwpot{0%{transform:translate(0,0) scale(1)}60%{transform:translate(var(--dx),var(--dy)) scale(1)}80%{transform:translate(var(--dx),var(--dy)) scale(.2);opacity:0}100%{transform:translate(var(--dx),var(--dy)) scale(.2);opacity:0}}
.move .hw-cueball.pot{animation:hwcuepot 2.4s ease-in 1 both}
@keyframes hwcuepot{0%{transform:translate(0,0)}60%{transform:translate(var(--dx),var(--dy))}70%{transform:translate(var(--dx),var(--dy)) scale(.2);opacity:0}100%{transform:translate(var(--dx),var(--dy)) scale(.2);opacity:0}}
.move .hw-late{animation:hwpop .5s var(--d,1.5s) cubic-bezier(.2,1.7,.4,1) both}
@keyframes hwpop{0%{transform:scale(0);opacity:0}100%{transform:scale(1);opacity:1}}
.move .hw-tag.late{animation:hwtagpop .5s var(--d,1.5s) cubic-bezier(.2,1.7,.4,1) both}
@keyframes hwtagpop{0%{transform:translateX(-50%) scale(0);opacity:0}100%{transform:translateX(-50%) scale(1);opacity:1}}
.move .hw-pk.g{animation:hwglow 1.4s ease-in-out infinite alternate}
@keyframes hwglow{0%{box-shadow:inset 0 0 6px #000,0 0 0 2px rgba(229,184,80,.5),0 0 8px 2px rgba(229,184,80,.3)}100%{box-shadow:inset 0 0 6px #000,0 0 0 3px rgba(229,184,80,1),0 0 22px 6px rgba(229,184,80,.6)}}

<!--POOL-ENGINE-->
<script>
/* LIVE: Sowaka Pool against the real server, Tile Up's live bootstrap for the /pool namespace.
   The server puts a signed ticket in the page it sends (window.__POOL = {ticket, hopTicket}: a socket ticket and a short token for the
   reload below; the reloaded copy carries ticket alone). This script opens a socket.io connection with it on the /pool namespace and gives
   the game the room API (window.Sowaka.room.* out, window.onSowakaRoom(evt) in). Without a ticket (a plain browser, the artifact) it does
   nothing: the single-player modes work as they are, and "Play a colleague" says it needs the Sowaka app.
   The app loads a catalog page with connect-src 'none', so a page that finds that policy first reloads itself once, in the same WebView,
   at the same address plus ?ticket=<hopTicket>; the server serves that copy with a policy that allows its own socket. */
(function(){
const T=window.__POOL;
window.__poolLive={state:'none'};
const L=window.__poolLive;
if(!T||typeof T!=='object'||!T.ticket||typeof window.io!=='function')return;
L.state='starting';
const deliver=evt=>{ try{ if(window.onSowakaRoom)window.onSowakaRoom(evt); }catch(e){ console.error('Sowaka Pool event failed',e); } };
const errOf=(status,message,code)=>Object.assign(new Error(message||'Something went wrong. Try again.'),{status:status|0,code:code||null});
const CLOSE_AND_REOPEN='Close and reopen Sowaka Pool to keep playing.';
let fatal=null, sock=null;
const waiters=[];
function die(message,code){ if(fatal)return; fatal={message:String(message||CLOSE_AND_REOPEN),code:code||'fatal'}; L.state='dead'; L.fatal=fatal;
  try{ if(sock){ sock.io.reconnection(false); sock.disconnect(); } }catch(e){}
  waiters.splice(0).forEach(w=>w.reject(errOf(0,fatal.message,fatal.code)));
  deliver({type:'fatal',message:fatal.message,code:fatal.code}); }

/* ---------- the policy hop ---------- */
function blockedByPolicy(){ for(const m of document.querySelectorAll('meta[http-equiv]')){ if(String(m.httpEquiv).toLowerCase()!=='content-security-policy')continue;
    const c=String(m.content||''), d=c.split(';').map(s=>s.trim()).find(s=>/^connect-src\s/i.test(s))||c.split(';').map(s=>s.trim()).find(s=>/^default-src\s/i.test(s));
    if(d&&/'none'/.test(d))return true; } return false; }
if(blockedByPolicy()){
  const here=location.protocol==='https:'||location.protocol==='http:';
  if(/[?&]ticket=/.test(location.search)||!here){ L.state='dead'; fatal={message:'Sowaka Pool could not reach the game server. '+CLOSE_AND_REOPEN,code:'blocked'}; L.fatal=fatal; return; }
  L.state='hopping'; L.hopping=true; document.documentElement.classList.add('hop');
  /* The URL carries the short hop token, never the socket ticket. */
  location.replace(location.origin+location.pathname+'?ticket='+encodeURIComponent(T.hopTicket||T.ticket)); return; }

/* ---------- the socket ---------- */
const origin=String(T.origin||location.origin).replace(/\/+$/,'');
sock=window.io(origin+'/pool',{path:T.path||'/connect/socket',auth:{ticket:String(T.ticket)},transports:['websocket','polling'],tryAllTransports:true,
  reconnection:true,reconnectionDelay:800,reconnectionDelayMax:5000,randomizationFactor:.3,timeout:10000});
L.socket=sock;
let room=null, everConnected=false, offline=false;
/* A call made while the socket is still connecting waits for it (up to 8 s) rather than failing at once. */
function ready(){ if(fatal)return Promise.reject(errOf(0,fatal.message,fatal.code)); if(sock.connected)return Promise.resolve();
  return new Promise((resolve,reject)=>{ const w={resolve,reject}; waiters.push(w);
    setTimeout(()=>{ const i=waiters.indexOf(w); if(i>=0){ waiters.splice(i,1); reject(errOf(0,'Not connected. Try again in a moment.')); } },8000); }); }
/* A request: an ack of {ok:true, data} or {ok:false, status, message}. */
function request(event,payload){ return ready().then(()=>new Promise((resolve,reject)=>{
  sock.timeout(8000).emit(event,payload||{},(err,res)=>{
    if(err)return reject(errOf(0,'No answer from the server. Try again.'));
    if(!res||typeof res!=='object')return reject(errOf(0,'Something went wrong. Try again.'));
    if(res.ok===false)return reject(errOf(res.status,res.message,res.code));
    resolve(res.data===undefined?{}:res.data); }); })); }
/* A server view: {room} from a push, or the view itself from a call. */
const viewOf=p=>p&&typeof p==='object'?('room' in p?(p.room||null):(p.code?p:null)):null;

sock.on('connect',()=>{ L.state='online'; waiters.splice(0).forEach(w=>w.resolve());
  const again=everConnected; everConnected=true;
  if(offline){ offline=false; deliver({type:'connection',online:true}); }
  /* Back after a drop: ask for the room again, in case the server's own push on connect is lost or late. */
  if(again&&room&&room.code){ const code=room.code;
    request('room:join',{code,rejoin:true}).then(d=>{ const r=viewOf(d); if(r){ room=r; deliver({type:'state',room:r}); } })
      .catch(e=>{ if(e.status===403){ room=null; deliver({type:'kicked',by:null}); } else if(e.status===404){ room=null; deliver({type:'state',room:null}); } }); } });
sock.on('disconnect',reason=>{ if(fatal)return; L.state='offline';
  if(reason==='io server disconnect'||reason==='io client disconnect'){ if(reason==='io server disconnect')die('The game server closed this connection. '+CLOSE_AND_REOPEN,'closed'); return; }
  if(!offline){ offline=true; deliver({type:'connection',online:false}); } });
sock.on('connect_error',err=>{ const code=String((err&&err.data&&err.data.code)||(err&&err.message)||'');
  if(/ticket|auth|forbidden|unauthori[sz]ed|not_allowed|offboard/i.test(code)){
    const expired=/expired/i.test(code);
    die((expired?'This Sowaka Pool session has expired. ':'Sowaka Pool could not sign you in. ')+CLOSE_AND_REOPEN,expired?'ticket_expired':'ticket_invalid'); return; }
  if(!offline){ offline=true; deliver({type:'connection',online:false}); } });
sock.on('room:state',p=>{ room=viewOf(p); deliver({type:'state',room}); });
sock.on('room:feed',p=>{ const item=p&&p.item&&typeof p.item==='object'?p.item:p; if(item&&typeof item==='object')deliver({type:'feed',item}); });
sock.on('room:kicked',p=>{ room=null; deliver({type:'kicked',by:(p&&p.by)||null}); });
/* A live invite, and the invites still waiting when the socket connects (one, a list, or {invites}). */
const invited=p=>{ const list=Array.isArray(p)?p:p&&Array.isArray(p.invites)?p.invites:[p];
  list.forEach(x=>{ if(x&&typeof x==='object'&&x.code)deliver({type:'invite',from:x.from||{},code:String(x.code),expiresAt:+x.expiresAt||null}); }); };
sock.on('room:invite',invited); sock.on('room:invited',invited);
sock.on('room:ticket',p=>{ if(p&&typeof p.ticket==='string'&&p.ticket)sock.auth.ticket=p.ticket; });
sock.on('room:fatal',p=>die((p&&p.message)||CLOSE_AND_REOPEN,(p&&p.code)||'fatal'));

/* ---------- the room API the page calls ---------- */
const keep=d=>{ const r=viewOf(d); if(r)room=r; return r; };
const num=v=>{ const n=Number(v); return Number.isFinite(n)?n:0; };
const sizeOf=s=>s===4?4:2;
const api={
  hello:()=>request('room:hello',{}).then(d=>{ if(d&&d.room)room=viewOf(d.room)||room; return d||{}; }),
  host:(open,size)=>request('room:host',{open:open!==false,size:sizeOf(size)}).then(keep),
  join:code=>request('room:join',{code:String(code||'').trim()}).then(keep),
  quick:size=>request('room:quick',size===2||size===4?{size}:{}).then(keep),
  leave:()=>{ const was=room; room=null; return request('room:leave',{}).catch(e=>{ if(!was)return {}; throw e; }); },
  invite:userId=>request('room:invite',{userId:String(userId)}),
  start:()=>request('room:start',{}),
  again:()=>request('room:again',{}),
  place:(x,y)=>request('pool:place',{x:num(x),y:num(y)}),
  shot:s=>request('pool:shot',{aim:num(s&&s.aim),power:num(s&&s.power),spin:{top:num(s&&s.spin&&s.spin.top),side:num(s&&s.spin&&s.spin.side)}}),
};
const S=window.Sowaka=window.Sowaka||{};
S.room=api; S.live=true;
const code=v=>{ const m=/^(?:room:)?([1-9]\d{3})$/i.exec(String(v||'').trim()); return m?m[1]:null; };
L.code=code;
/* The room an invite opened the game on: the app hands it over as startChallengeId ("room:4821"), whenever its bridge arrives. */
let startOwn=T.room&&code(T.room)?code(T.room):null;
try{ Object.defineProperty(S,'startRoomCode',{configurable:true,enumerable:true,get(){ return startOwn||code(S.startChallengeId); },set(v){ startOwn=code(v); }}); }
catch(e){ S.startRoomCode=startOwn; }
})();
</script>
<script>
(()=>{
'use strict';
/* ============================== basics ============================== */
const E=window.PoolEngine;
if(!E||typeof E.simulateShot!=='function')throw new Error('Sowaka Pool: the shared engine is missing. Build the page with games-web/pool/build.py');
const $=s=>document.querySelector(s);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const bridge=()=>(window.Sowaka&&window.Sowaka.native)?window.Sowaka:null;
const uid=()=>(bridge()&&bridge().userId)||'local';
const LS=k=>`pool.v1.${k}.${uid()}`;
const load=(k,d)=>{ try{ const v=localStorage.getItem(LS(k)); return v==null?d:JSON.parse(v); }catch(e){ return d; } };
const save=(k,v)=>{ try{ localStorage.setItem(LS(k),JSON.stringify(v)); }catch(e){} };
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const first=n=>String(n||'You').trim().split(/\s+/)[0];
const initials=n=>String(n||'?').trim().split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase();
let touched=false; document.addEventListener('pointerdown',()=>{ touched=true; },{capture:true,passive:true});
const buzz=k=>{ const b=bridge(); if(b&&b.haptic)b.haptic(k); else if(navigator.vibrate&&touched)try{ navigator.vibrate(k==='heavy'?40:k==='medium'?20:8); }catch(e){} };
/* Motion runs under html.move, set unless the person asked for less (the How to play scenes, the dots). */
const reduceMotion=()=>{ try{ return (window.Sowaka&&window.Sowaka.reduceMotion)||matchMedia('(prefers-reduced-motion: reduce)').matches; }catch(e){ return false; } };
document.documentElement.classList.toggle('move',!reduceMotion());
/* ============================== sound ============================== */
let audio=null, master=null, soundOn=load('sound',true);
function ctx(){ try{ audio=audio||new (window.AudioContext||window.webkitAudioContext)(); if(audio.state==='suspended')audio.resume().catch(()=>{}); if(!master){ master=audio.createGain(); master.gain.value=.5; const comp=audio.createDynamicsCompressor(); comp.threshold.value=-14; comp.knee.value=12; comp.ratio.value=6; comp.attack.value=.002; comp.release.value=.12; master.connect(comp); comp.connect(audio.destination); } return audio; }catch(e){ return null; } }
let noiseBuf=null;

    r.onEight=E.onEight(out.next,r.turn); r.message=out.message; r.replayUntil=at+Math.min(20000,res.steps/240*1000+300);

  function opponent(r){ clearTimeout(D.timer); const wait=Math.max(0,r.replayUntil-Date.now())+1800;
    D.timer=setTimeout(()=>{ if(D.room!==r||r.status!=='playing'||r.shooter===0)return; const seat=r.shooter;

  const refuse=(status,message)=>Object.assign(new Error(message),{status});

  const api={

    join:code=>{ const r=D.rooms.find(x=>x.code===code)||D.invites.find(x=>x.code===code); if(!r)return Promise.reject(refuse(404,'No table has that code at your company.')); const sz=r.size===4?4:2; if(r.players&&r.players.length>=sz)return Promise.reject(refuse(409,'That table is full.'));

    leave:()=>{ clearTimeout(D.timer); D.room=null; return delay({}); },

        setTimeout(()=>{ if(D.room!==r||r.players.length>=r.size)return; seatUp(r,p); r.invited=r.invited.filter(i=>i.userId!==p.userId); push(); feed({kind:'join',userId:p.userId,name:p.name}); },2500); } return delay({invited:true}); },
    start:()=>{ const r=D.room; if(!r)return Promise.reject(refuse(404,'You are not at a table.')); if(r.hostId!==ME.userId)return Promise.reject(refuse(403,'Only the host starts the game.')); if(r.players.length<r.size)return Promise.reject(refuse(409,r.size===4?'Need four players to start.':'Need two players to start.')); start(r,0); return delay(view()); },
    again:()=>{ const r=D.room; if(!r||r.status!=='over')return Promise.reject(refuse(409,'The game is still on.')); if(r.players.length<r.size){ r.status='lobby'; r.balls=[]; push(); } else start(r,1-r.result.winner); return delay(view()); },
    place:(x,y)=>{ const r=D.room; if(!r||r.status!=='playing'||r.shooter!==0)return Promise.reject(refuse(409,"It isn't your turn.")); if(!r.inHand)return Promise.reject(refuse(409,'You do not have ball in hand.')); const ok=E.placementOk(r.balls.map(b=>Object.assign({vx:0,vy:0},b)),x,y,r.kitchen); if(!ok)return Promise.reject(refuse(400,'The cue ball cannot go there.')); const cue=r.balls.find(b=>b.n===0); cue.x=x; cue.y=y; cue.on=true; push(); return delay(view()); },

  };
  D.everyone=people.slice(2).map((n,i)=>who(i+2)).concat(Array.from({length:70},(_,i)=>({userId:'c'+i,name:`${'ABCDEFGHIJKLMNOPQRSTUVWXYZ'[i%26]}${['arun','ita','ohan','eena'][i%4]} ${['Shah','Rao','Iyer'][i%3]}`,photoUrl:demoFace(i+2)}))).sort((a,b)=>a.name.localeCompare(b.name));

  const t=Date.now();

  D.invites=[{code:'5904',from:who(5),players:1,createdAt:t-30000,expiresAt:t+900000}];
  window.Sowaka=Object.assign(window.Sowaka||{},{live:true,room:api,colleagues:q=>new Promise(r=>setTimeout(()=>r({colleagues:D.everyone.filter(p=>!q||p.name.toLowerCase().includes(String(q).toLowerCase())).slice(0,50)}),120))});
  const size=four?4:2;
  if(mode==='waiting'){ D.room=mk('4821',true,ME,size); if(/guest/.test(location.search)){ D.room=mk('4821',false,OTHER,size); seatUp(D.room,ME); } else if(four)seatUp(D.room,OTHER); }
  if(mode==='online'||mode==='result'){ const r=D.room=mk('7350',true,ME,size); seatUp(r,OTHER); if(four){ seatUp(r,who(2)); seatUp(r,who(3)); } start(r,0);
    // a few shots in: solids to Tanvi's side, three balls down, Tanvi to shoot
    const brk={aim:0.004,power:1,spin:{top:0,side:0}}; const res=E.simulateShot(E.rack(),brk); r.balls=res.balls.map(strip); r.breakShot=false; r.inHand=false; r.kitchen=false;
    for(const n of [1,2,9]){ const b=r.balls.find(x=>x.n===n); b.on=false; } const cue=r.balls.find(b=>b.n===0); cue.on=true; cue.x=0.62; cue.y=0.48;
    D.rules={groups:['solid','stripe']}; r.open8=false; r.players.forEach((p,i)=>{ p.group=i%2?'stripe':'solid'; p.pottedCount=i%2?1:2; }); r.turn=0; r.shooter=0; D.ptr=[1,0]; r.shotClock={endsAt:Date.now()+30000}; r.replayUntil=Date.now(); r.wins=[1,0]; r.gameNo=2;
    r.lastShot={seq:(D.seq=3),by:1,aim:2.4,power:0.5,spin:{top:0,side:0},from:{x:0.7,y:0.4},events:[],balls:r.balls.map(strip),steps:600,at:Date.now()-4000};

  bootLive().then(()=>{ if(mode==='lobby')openLobby(); });
