<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- The font's stylesheet loads without holding up the first paint (the text swaps to Sora when it arrives). -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700;800&display=swap"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    </noscript>
    <title>Sowaka HRMS · HR Admin</title>
    <!-- Theme before first paint: the saved Light / Dark choice, else the system's. -->
    <script>
      try {
        var t = localStorage.getItem('sowaka.theme');
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    </script>
    <style>
      html { background: #ECEBE9; color-scheme: light; }
      @media (prefers-color-scheme: dark) { html:not([data-theme='light']) { background: #111113; color-scheme: dark; } }
      html[data-theme='dark'] { background: #111113; color-scheme: dark; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
