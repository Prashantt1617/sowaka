<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- A game, not a document: no pinch or double-tap zoom, and the page runs under the notch with its own safe-area padding. -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<!-- The app's channels are there from the first byte, so the page knows at once it sits under the app's bar. -->
<script>if(window.SowakaShare||window.Sowaka)document.documentElement.classList.add('app')</script>
<meta name="theme-color" content="#15122B">
<meta name="color-scheme" content="dark">
<title>Word Trip</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Figtree:wght@400;500;600;700;800&display=swap">
<style>
/* One arcade column: clock, score and combo on top, the wall of words found, then the tray and the letters under the thumbs. One dark look on purpose
   (the prototype's night palette), with Baloo 2 for the big words and Figtree for the rest; each stop repaints the accent in its own hue (--h).
   Sowaka: this one file is the whole game. The Sowaka app stores it in game_catalog and loads it into its own screen with a bridge (window.Sowaka) for the
   player's name, the company's leaderboard and colleague challenges; in a plain browser there is no bridge, scores stay on this device and there are no challenges.
   The shell (menu, sheets, challenges, picker, leaderboard) is the one in game-pages/odd-one-out.html and trails.html, so the games work the same way. */
[hidden]{display:none!important}
:root{
  color-scheme:dark; --h:45;
  --bg:#15122B; --panel:#211D42; --panel2:#2A2553; --line:#3B3668; --ink:#F6F1FF; --muted:#A9A3CC; --deep:#0B0918;
  --accent:hsl(var(--h) 95% 60%); --accent-deep:hsl(var(--h) 85% 40%); --accent-ink:#15122B; --tint:hsl(var(--h) 95% 72%);
  --tile:#FFF6DE; --tile-edge:#D2BC7E; --tile-ink:#2A2140;
  --good:#4BE39A; --bad:#FF6B6B; --gold:#FFD23F; --blue:#4C9BFF; --pink:#FF6FB5; --rare:#B6F36A;
  --c3:#39C6C0; --c4:#4C9BFF; --c5:#A77BFF; --c6:#FF6FB5; --c7:#FF9F43; --c8:#FF7A59;
  --display:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --small:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html{background:var(--bg);-webkit-text-size-adjust:100%;text-size-adjust:100%;touch-action:manipulation;overscroll-behavior:none}
body{margin:0;min-height:100vh;min-height:100dvh;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.35;
  padding:max(14px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) calc(32px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));
  touch-action:manipulation;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
input{-webkit-user-select:text;user-select:text}
/* main.app, not .app: the html element carries an `app` class of its own inside the Sowaka app. */
main.app{max-width:440px;margin-inline:auto;display:flex;flex-direction:column;gap:14px;position:relative}

/* The header: the game's name on a tilted badge in the accent, and the sound and how-to chips. */
header{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:40px}
h1{margin:0 0 0 2px;font-family:var(--display);font-weight:800;font-size:2.2rem;line-height:1;letter-spacing:.01em;white-space:nowrap;color:var(--accent)}
.hright{display:flex;align-items:center;gap:8px}
.pill{font-family:var(--body);font-weight:700;font-size:.86rem;line-height:1;height:34px;padding:0 14px;border-radius:30px;border:2px solid var(--line);
  background:var(--panel);color:var(--ink);cursor:pointer;white-space:nowrap}
.pill.q{width:34px;padding:0;font-family:var(--display);font-weight:800;font-size:1.15rem;color:var(--gold)}
.pill:active{transform:translateY(1px)}

/* The play HUD: the clock, the score, the streak, and the bar to the three stars. */
.hud{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center}
.clock{--pct:100%;width:66px;height:66px;border-radius:50%;display:grid;place-items:center;position:relative;box-shadow:0 4px 0 var(--deep);
  background:conic-gradient(var(--accent) var(--pct),var(--panel2) 0)}
.clock::before{content:"";position:absolute;inset:6px;border-radius:50%;background:var(--bg)}
.clock span{position:relative;font-family:var(--display);font-weight:800;font-size:1.45rem;letter-spacing:0;line-height:1;padding-top:3px;color:var(--ink);font-variant-numeric:tabular-nums}
.clock.low,.clock.hit{--accent:var(--bad)}
.scorebox{min-width:0;display:flex;flex-direction:column;align-items:flex-start}
.scorebox small,.combo small{display:block;font-family:var(--body);font-weight:800;font-size:.64rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);line-height:1.3}
.score{font-family:var(--display);font-weight:800;font-size:2.7rem;line-height:1;color:var(--ink);font-variant-numeric:tabular-nums;display:inline-block;transform-origin:left center}
.combo{position:relative;overflow:hidden;text-align:center;min-width:84px;padding:7px 10px 8px;border-radius:16px;background:var(--panel);border:2px solid var(--line);box-shadow:0 4px 0 var(--deep);transition:border-color .2s,box-shadow .2s}
.combo b{display:block;font-family:var(--display);font-weight:800;font-size:1.7rem;line-height:1;padding-top:3px;color:var(--ink)}
.combo u{position:absolute;left:0;bottom:0;height:4px;width:0;background:var(--gold);text-decoration:none}
.combo.hot{border-color:var(--gold);box-shadow:0 4px 0 var(--deep),0 0 18px -4px var(--gold)}
.combo.hot b,.combo.hot small{color:var(--gold)}
.goalrow{display:flex;justify-content:space-between;gap:10px;font-family:var(--small);font-size:.8rem;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.goal{position:relative;height:16px;border-radius:999px;background:var(--panel2);margin-top:12px}
.goal .fill{position:absolute;inset:0 auto 0 0;border-radius:999px;background:linear-gradient(90deg,var(--accent-deep),var(--accent));width:0;transition:width .3s cubic-bezier(.2,1.4,.4,1)}
.goal .st{position:absolute;top:50%;width:28px;margin:-15px 0 0 -14px;text-align:center;font-size:1.5rem;line-height:28px;color:var(--line);-webkit-text-stroke:1.4px var(--muted);paint-order:stroke fill}
.goal .st.on{color:var(--gold);-webkit-text-stroke-color:var(--gold);filter:drop-shadow(0 0 6px var(--gold))}
/* In a challenge the other player has already played: their score, the number to beat. */
.target{display:flex;align-items:baseline;justify-content:center;gap:8px;padding:8px 16px;border-radius:999px;background:var(--panel);border:2px solid var(--line);box-shadow:0 3px 0 var(--deep);transition:border-color .2s}
.target span{font-family:var(--body);font-weight:800;font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.target b{font-family:var(--display);font-weight:800;font-size:1.35rem;line-height:1;color:var(--gold);font-variant-numeric:tabular-nums}
.target small{font-family:var(--small);font-weight:700;font-size:.78rem;color:var(--muted)}
.target.done{border-color:var(--good)}
.target.done b{color:var(--good)}
.target.done b::after{content:" ✓"}

/* The play area: the prototype's wall of found words, the tray the word is built in, and the letters as chunky cream keys, then Delete, Shuffle
   and Enter under the thumbs. Each stop repaints the accent in its own hue (--h). */
.stage{position:relative}
.play{display:flex;flex-direction:column;gap:10px}
.wallhead{display:flex;justify-content:space-between;gap:10px;padding:0 4px 6px;font-family:var(--small);font-size:.8rem;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.wallhead b{color:var(--accent);font-weight:800}
.wall{height:96px;overflow-y:auto;overscroll-behavior:contain;background:var(--panel);border-radius:18px;padding:9px;display:flex;flex-wrap:wrap;align-content:flex-start;gap:6px;
  border:1.5px solid var(--line);box-shadow:0 4px 0 var(--deep)}
.wall:empty::before{content:"Your words go here";margin:auto;font-family:var(--small);font-weight:600;font-size:.88rem;color:var(--muted)}
.chip{font-family:var(--display);font-weight:800;font-size:1rem;line-height:1;padding:7px 10px 5px;border-radius:10px;color:var(--accent-ink);text-transform:uppercase;letter-spacing:.04em}
.chip.l3{background:var(--c3)}.chip.l4{background:var(--c4)}.chip.l5{background:var(--c5)}.chip.l6{background:var(--c6)}.chip.l7{background:var(--c7)}.chip.l8{background:var(--c8)}
.chip.full{background:linear-gradient(100deg,#FFB800,#FFF3A6 45%,#FFB800 60%);background-size:220% 100%;box-shadow:0 0 14px -2px var(--gold)}
.chip.rare{outline:2px solid var(--rare);outline-offset:1px}
.chip.flash{outline:3px solid var(--ink)}
.tray{height:58px;border-radius:18px;border:2px dashed var(--line);display:flex;align-items:center;justify-content:center;gap:6px;touch-action:none}
.tray:empty::before{content:"Tap the letters";font-family:var(--small);font-weight:600;font-size:.9rem;color:var(--muted)}
.tray button{font-family:var(--display);font-weight:800;font-size:1.55rem;line-height:1;width:38px;height:44px;padding:4px 0 0;border-radius:11px;border:0;
  background:var(--accent);color:var(--accent-ink);box-shadow:0 4px 0 var(--accent-deep);cursor:pointer;text-transform:uppercase}
.tray.ok button{background:var(--good);box-shadow:0 4px 0 #1f9a61}
.tray.gold button{background:var(--gold);box-shadow:0 4px 0 #b88a00}
.tray.no button{background:var(--bad);box-shadow:0 4px 0 #a83838}
.tiles{display:flex;flex-direction:column;gap:12px;align-items:center;padding:2px 0 6px;touch-action:none}
/* touch-action:none on the letters: the web view uses none of these touches for scrolling or zooming, so a second finger
   landing while the first is still down is a second letter, not the start of a pinch. */
.tiles .rowt{display:flex;gap:10px}
.tile{position:relative;font-family:var(--display);font-weight:800;font-size:2.1rem;line-height:1;width:72px;height:64px;padding:6px 0 0;border-radius:18px;border:0;background:var(--tile);color:var(--tile-ink);
  box-shadow:0 7px 0 var(--tile-edge),0 12px 18px -8px rgba(0,0,0,.6);cursor:pointer;text-transform:uppercase;touch-action:manipulation}
.tile:active{transform:translateY(5px);box-shadow:0 2px 0 var(--tile-edge)}
/* A letter in the word has left the rack: its socket stays, empty, so a tap on the letter in the word puts it back where it was. */
.tile.used,.tile.used:active{background:transparent;color:transparent;border:2px dashed var(--line);box-shadow:none;transform:none;cursor:default}
/* The gap between letters belongs to the nearer letter: a thumb landing just off a tile still gets it. */
.tile::before{content:"";position:absolute;inset:-6px -5px}
@media (max-width:370px){.tile{width:64px;height:58px;font-size:1.9rem}}
/* Under the letters: Delete, Shuffle and Enter, and a line for what a word did. */
.keys{display:grid;grid-template-columns:1fr 1fr 1.5fr;gap:8px}
.keys .btn{min-height:48px;font-size:1.1rem;border-radius:14px}
.keys .btn.go{font-size:1.35rem;min-height:48px}
.status{margin:-6px 0 0;min-height:1.35em;text-align:center;font-family:var(--small);font-weight:600;font-size:.88rem;line-height:1.35;color:var(--muted);text-wrap:balance}
.status.bad{color:var(--bad)}
.btn:focus-visible,.pill:focus-visible,.link:focus-visible,.mini:focus-visible,.person:focus-visible,.crow:focus-visible,.dl:focus-visible,.sx:focus-visible,.tile:focus-visible,.tray button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.clock.plus{--accent:var(--good)}
.sum{margin:-6px 0 0;text-align:center;font-family:var(--small);font-weight:700;font-size:.86rem;color:var(--muted)}
.sum b{color:var(--ink);font-weight:800;letter-spacing:.03em}
/* Over the board while it counts down; on the menu (.m) it is the menu itself. */
.cover{position:absolute;inset:-6px;border-radius:22px;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:12px;z-index:2;color:var(--ink)}
.cover:not(.m) h2{font-family:var(--display);font-weight:800;font-size:2.2rem;margin:0;line-height:1.05;color:var(--ink);text-wrap:balance}
.cover:not(.m) p{margin:0;color:var(--muted);max-width:30ch;font-size:.95rem}
.cover .n{font-family:var(--display);font-weight:800;font-size:8rem;line-height:1;color:var(--accent);text-shadow:0 7px 0 var(--accent-deep)}
.cover.m{position:static;inset:auto;background:none;border-radius:0;padding:0;align-items:stretch;justify-content:flex-start;gap:14px;text-align:left}

/* Buttons. The plain one: a panel with a line edge. Go: the accent, on its own deeper shade. */
.btn{font-family:var(--display);font-weight:800;font-size:1.15rem;line-height:1.1;min-height:50px;padding:8px 14px 4px;border-radius:16px;border:2px solid var(--line);
  background:var(--panel);color:var(--ink);cursor:pointer;box-shadow:0 4px 0 var(--deep);transition:transform .07s,box-shadow .07s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--deep)}
.btn.dark{background:var(--panel2)}
.btn.go{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-size:1.75rem;min-height:60px;letter-spacing:.01em;box-shadow:0 5px 0 var(--accent-deep)}
.btn.go:active{transform:translateY(4px);box-shadow:0 1px 0 var(--accent-deep)}
.btn.primary{background:var(--ink);border-color:var(--ink);color:var(--bg);font-size:1.25rem;box-shadow:0 4px 0 var(--muted)}
.btn.primary:active{box-shadow:0 1px 0 var(--muted)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.mini{font-family:var(--body);font-weight:700;font-size:.75rem;min-height:32px;padding:0 10px;border-radius:10px;border:2px solid var(--line);background:transparent;color:var(--ink);
  cursor:pointer;white-space:nowrap}
.mini.yes{font-family:var(--display);font-weight:800;font-size:1.15rem;min-height:42px;min-width:98px;padding:0 14px;border-radius:12px;background:var(--accent);border-color:var(--accent);
  color:var(--accent-ink);box-shadow:0 4px 0 var(--accent-deep)}
.mini.yes:active{transform:translateY(3px);box-shadow:0 1px 0 var(--accent-deep)}
.mini:disabled{opacity:.5}
.link{font-family:var(--body);font-weight:600;font-size:.82rem;color:var(--muted);background:none;border:0;padding:6px 0;text-decoration:underline;text-underline-offset:2px;cursor:pointer}
.links{display:flex;justify-content:center;gap:18px;flex-wrap:wrap}
.links .link{padding:2px 0}

/* The menu. Challenges for you first, each on its own card. */
.foryou{display:flex;flex-direction:column;gap:12px}
.chc{background:var(--panel);border:2px solid var(--gold);border-radius:20px;padding:12px 14px;display:flex;flex-direction:column;gap:10px;color:var(--ink);text-align:left;box-shadow:0 4px 0 var(--deep)}
.chc .lab{font-family:var(--body);font-weight:800;font-size:10px;line-height:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--gold)}
.chc .row{display:flex;gap:12px;align-items:flex-start}
.chc .tx{flex:1;min-width:0;display:flex;flex-direction:column;align-items:flex-start;gap:4px}
.chc .tx b{font-family:var(--body);font-weight:600;font-size:13px;line-height:16px;color:var(--ink)}
.chc .tx small{font-family:var(--body);font-size:11.5px;line-height:15px;color:var(--muted)}
.chc .bt{flex-shrink:0;padding-bottom:4px}
.dl{font-family:var(--body);font-weight:600;font-size:11.5px;color:var(--muted);background:none;border:0;padding:2px 0 0;text-decoration:underline;text-underline-offset:2px;cursor:pointer}
.dl:disabled{opacity:.5}
/* The game: its picture over a panel, with Play. */
.hero{background:var(--panel);border:2px solid var(--line);border-radius:20px;box-shadow:0 5px 0 var(--deep);overflow:hidden;display:flex;flex-direction:column;text-align:left}
.hero .art{height:132px;background:#CFC6FF;border-bottom:2px solid var(--line);display:grid;place-items:center;overflow:hidden}
.hero .art svg{width:auto;height:112px;display:block}
.hero .bd{padding:12px 14px 18px;display:flex;flex-direction:column;gap:10px}
.tag{align-self:flex-start;display:inline-flex;align-items:center;gap:4px;padding:3px 7px 3px 5px;border-radius:5px;background:var(--gold);
  font-family:var(--small);font-weight:800;font-size:.62rem;line-height:1;letter-spacing:.02em;text-transform:uppercase;color:var(--accent-ink)}
.tag svg{width:12px;height:12px;flex-shrink:0}
.hero h2{margin:-2px 0 2px;font-family:var(--display);font-weight:800;font-size:1.7rem;line-height:1;color:var(--ink)}
/* Your best, your rank at the company, and the leaderboard. */
.mine{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:12px 12px 16px;background:var(--panel);border:2px solid var(--line);border-radius:20px;box-shadow:0 4px 0 var(--deep)}
.stat{min-width:0;display:flex;flex-direction:column;gap:2px;padding:10px 12px;border-radius:14px;background:var(--panel2)}
.stat small{font-family:var(--body);font-weight:800;font-size:.62rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.stat b{font-family:var(--display);font-weight:800;font-size:2rem;line-height:1.05;color:var(--ink);font-variant-numeric:tabular-nums;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stat span{font-family:var(--small);font-weight:700;font-size:.78rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stat.dark b{color:var(--gold)}
.mine .btn{grid-column:1/-1;min-height:46px;background:var(--panel2)}
/* The rest of the inbox: waiting on them, and results. */
.inbox{display:flex;flex-direction:column;gap:8px;width:100%;text-align:left}
.sect{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;padding:0 1px}
.sect h3{margin:0;font-family:var(--display);font-weight:800;font-size:1.15rem;line-height:1.3;letter-spacing:.02em;color:var(--ink)}
.sect .link{padding:2px 0;text-decoration:none;font-weight:700;color:var(--accent)}
.sect.solo{justify-content:center}
.crow{font:inherit;color:var(--ink);display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:10px 12px;border-radius:16px;background:var(--panel);
  border:2px solid var(--line);text-align:left;width:100%}
div.crow.tap{cursor:pointer}
.crow p{margin:0;font-family:var(--body);font-size:.84rem;line-height:1.25;color:var(--ink);min-width:0}
.crow p small{display:block;font-family:var(--small);color:var(--muted);font-size:.75rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.crow .bt{display:flex;gap:6px;align-items:center}
.crow .pts{font-family:var(--display);font-weight:800;font-size:1.05rem;color:var(--gold);font-variant-numeric:tabular-nums;white-space:nowrap}
.crow .pts.zero{color:var(--muted);font-family:var(--small);font-weight:700;font-size:.75rem}
/* Someone's face: their photo, else their initial on a colour picked by the name. */
.av{--s:34px;width:var(--s);height:var(--s);border-radius:50%;display:grid;place-items:center;font-family:var(--small);font-weight:800;font-size:calc(var(--s)*.4);line-height:1;
  color:var(--accent-ink);background:hsl(var(--ah,45) 85% 72%);flex-shrink:0;overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover;display:block}

/* Inside the app the page sits under the app's own bar, which has already cleared the notch: no second top inset. */
html.app body{padding-top:14px}
html.app .sheet{padding-top:16px}
html.app .howto{padding-top:20px}

/* Sheets: a bottom sheet. A tap on the dimmed screen around it, or its ✕, closes it. */
.sheet{position:fixed;inset:0;background:rgba(8,6,20,.78);display:flex;flex-direction:column;align-items:center;cursor:pointer;
  padding:max(16px,env(safe-area-inset-top,0px)) 12px calc(14px + env(safe-area-inset-bottom,0px));z-index:9;overflow-y:auto;overscroll-behavior:contain}
/* Pushed to the bottom when it fits; when it is taller than the screen it starts at the top and the sheet scrolls. */
.card{background:var(--panel);color:var(--ink);border-radius:26px;padding:10px 18px 20px;width:100%;max-width:440px;display:flex;flex-direction:column;gap:14px;cursor:auto;outline:none;
  border:1.5px solid var(--line);margin-top:auto;margin-bottom:4px;flex-shrink:0}
.card::before{content:"";align-self:center;flex-shrink:0;width:44px;height:5px;border-radius:3px;background:var(--line);margin-bottom:-4px}
.card h2{font-family:var(--display);font-weight:800;font-size:1.8rem;margin:0;line-height:1.05;color:var(--ink);text-wrap:balance}
.shead{display:flex;align-items:flex-start;gap:12px}
.shead h2{flex:1;min-width:0}
.sx{flex-shrink:0;width:36px;height:36px;margin-top:-2px;display:grid;place-items:center;padding:0;border-radius:999px;cursor:pointer;
  background:var(--panel2);color:var(--ink);border:2px solid var(--line);box-shadow:0 3px 0 var(--deep);-webkit-tap-highlight-color:transparent}
.sx:active{transform:translateY(2px);box-shadow:0 1px 0 var(--deep)}
.sx svg{width:14px;height:14px;display:block}
.card .note{margin:0;font-family:var(--body);font-size:.86rem;line-height:1.4;color:var(--muted)}
.card .acts{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding-bottom:6px}
.card .acts.one{grid-template-columns:1fr}

     Sowaka.userId                      -> "u-…": the signed-in person's id, the key of this page's save and caches on the device

     Sowaka.submitScore(n)              -> Promise of the board after it, posted under the player's own session

     Sowaka.colleagues(query)           -> {colleagues:[{userId,name,designation,department,photoUrl}]}
     Sowaka.challenge(userId)           -> the new challenge
     Sowaka.challenges()                -> {incoming, outgoing, active, recent}: lists of challenges
     Sowaka.getChallenge(id)            -> one challenge
     Sowaka.acceptChallenge(id)         -> the challenge after it: answers a pending one (on an accepted one it changes nothing)
     Sowaka.declineChallenge(id)        -> the challenge after it: declines, withdraws (the challenger), calls off an accepted one neither has

    ask('colleagues',q).then(r=>{ searched.add(q.toLowerCase()); addPeople(((r&&Array.isArray(r.colleagues))?r.colleagues:[]).map(shapePerson)); })
      .catch(()=>{}).finally(()=>{ if(searching===q)searching=''; draw(); }); };
  input.addEventListener('input',()=>{ draw(); clearTimeout(t); t=setTimeout(search,300); });
  input.addEventListener('keydown',e=>{ if(e.key==='Enter'){ clearTimeout(t); search(); } });
  peopleKept(); draw();
  if(!PEOPLE.list||PEOPLE.loading||Date.now()-PEOPLE.at>60000)
    loadPeople().then(()=>draw()).catch(e=>{ if(!PEOPLE.list){ failed=errText(e); draw(); } });
}
function sendChallenge(p){ if(CH.sending||!p)return; CH.sending=true; sfx.horn(); openSheet('Challenging '+firstOf(p.name)+'…',[el('p','note','Sending…')],[]);
  ask('challenge',p.userId).then(v=>{ upsert(v); waitFor(v); renderInbox(); }).catch(challengeRefused).finally(()=>{ CH.sending=false; }); }
function challengeRefused(e){ const d=(e&&e.details)||{}, id=d.challengeId;
  if(id&&d.reason==='one_open'){ sfx.no(); openSheet('One at a time',[el('p','note',errText(e)+'.')],[['Open it',()=>openChallenge(String(id)),true]]); return; }
  if(id){ openChallenge(id); return; }
  sfx.no(); openSheet("Couldn't send it",[el('p','note',errText(e))],[['Back',openPicker,false]]); }
/* The challenger's wait for an answer. Still on screen when they accept, it opens the challenge, ready to play. */
function waitFor(v){ const n=firstOf(v.them.name);
  openSheet('Waiting for '+n,[el('p','note','Challenge sent. Once '+n+' accepts, you each play your round whenever you like, and the result shows when you have both played.'),el('p','note',leftText(v)+' if '+n+" doesn't answer.")],
    lobbyServer(v)?[['Withdraw',()=>askWithdraw(v),false]]:[]);
  CH.waiting=v.id; showing(v.id); }
function openChallenge(id){
  openSheet('Challenge',[el('p','note','Loading…')],[]);
  return ask('getChallenge',id).then(v=>{ upsert(v); renderInbox(); showChallenge(v); })
    .catch(e=>{ const known=findCh(id); if(known)showChallenge(known); else openSheet('Challenge',[el('p','note',errText(e))],[]); }); }
/* Which challenge the sheet on screen is about, for an event that changes it. */
function showing(id){ CH.showing={id,seq:sheetSeq}; }
const isShowing=id=>!!(CH.showing&&CH.showing.id===id&&CH.showing.seq===sheetSeq&&!$('sheet').hidden);
function showChallenge(v){ const n=firstOf(v.them.name);
  if(v.status==='pending'&&v.role==='opponent'){
    openSheet(v.them.name+' challenged you',[el('p','note','Same letters for both of you, '+ROUND_TEXT+'. The higher score wins, and the result shows once you have both played.'),el('p','note',leftText(v)+'.')],
      [['Decline',()=>decline(v.id),false],['Accept and play',()=>accept(v.id,true),true]]);
    return showing(v.id); }
  if(v.status==='pending')return waitFor(v);
  if(v.status==='accepted'&&v.me.score==null)return soloSheet(v);
  return showResult(v,null);
}
/* An accepted challenge this player has not played: their round, on the challenge's letters, against the other's score if it is in. */
function soloSheet(v,extra){ const n=firstOf(v.them.name);
  const line=v.them.score!=null?n+' scored '+fmtn(v.them.score)+'. Beat it.':n+" hasn't played yet. You can go first.";
  const body=[el('p','note',line),el('p','note','Same letters for both of you, '+ROUND_TEXT+'. The result shows once you have both played.')];
  if(extra)body.unshift(el('p','note',extra));
  if(lobbyServer(v)&&v.them.score==null)body.push(linkRow([['Call it off',()=>askCallOff(v)]]));
  openSheet('You vs '+n,body,[['Play',()=>startChallenge(v),true]]); showing(v.id); }
/* Accepting: from its card the challenge turns into "Your turn" on the menu; from its sheet ("Accept and play") the round starts at once. */
function accept(id,play){ if(CH.accepting)return; CH.accepting=true;
  ask('acceptChallenge',id).then(v=>{ upsert(v); closeSheet(); if(play&&v.status==='accepted')startChallenge(v); else renderInbox(); })
    .catch(e=>{ sfx.no(); const other=e&&e.details&&e.details.challengeId, close=()=>{dismiss();refreshChallenges();};
      openSheet("Couldn't accept it",[el('p','note',errText(e)+(other?'.':''))],other?[['Open it',()=>openChallenge(String(other)),true]]:[],close); })
    .finally(()=>{ CH.accepting=false; }); }
function decline(id){ ask('declineChallenge',id).then(v=>{ upsert(v); if(!$('sheet').hidden&&!CH.result)dismiss(); else renderInbox(); refreshOpenList(); })
  .catch(e=>{ openSheet("Couldn't decline it",[el('p','note',errText(e))],[],()=>{dismiss();refreshChallenges();}); }); }
/* Taking back a challenge nobody has answered, or calling off an accepted one neither has played: the server's decline does both, and tells the other player. */
function askWithdraw(v){ const n=firstOf(v.them.name);
  openSheet('Withdraw it?',[el('p','note','Your challenge to '+n+' is taken back, and '+n+' is told.')],[['Keep it',()=>openChallenge(v.id),false],['Withdraw',()=>endEarly(v,'withdraw'),true]]); }
function askCallOff(v){ const n=firstOf(v.them.name);
  openSheet('Call it off?',[el('p','note','The challenge with '+n+' ends with no result and no points, and '+n+' is told.')],[['Keep it',()=>openChallenge(v.id),false],['Call it off',()=>endEarly(v,'call_off'),true]]); }
function endEarly(v,how){ const n=firstOf(v.them.name), word=how==='withdraw'?'withdraw':'call off';
  openSheet(how==='withdraw'?'Withdrawing…':'Calling it off…',[el('p','note','One moment…')],[]);
  ask('declineChallenge',v.id).then(nv=>{ upsert(nv); renderInbox();
      openSheet(declinedTitle(nv),[el('p','note',declinedLine(nv)+'. No result and no points.')],[['Challenge someone',openPicker,true]]); })
    .catch(e=>{ sfx.no(); openSheet("Couldn't "+word+' it',[el('p','note',errText(e))],[['Open it',()=>openChallenge(v.id),true]],()=>{dismiss();refreshChallenges();}); }); }
/* Off this player's own list; nobody else's changes and nobody is told. */
function clearCh(id){ ask('declineChallenge',id).then(()=>{ forget(id); if(CH.result&&CH.result.id===id)dismiss(); else { renderInbox(); refreshOpenList(); } })
  .catch(e=>{ sfx.no(); openSheet("Couldn't clear it",[el('p','note',errText(e))],[],()=>{dismiss();refreshChallenges();}); }); }
function startChallenge(v){ if(mode==='count'||mode==='play')return; if(v.seed==null)return openChallenge(v.id);
  sfx.horn(); start({id:v.id,name:v.them.name,theirFinal:v.them.score},v.seed); }
function rematch(v){ openSheet('Challenging '+firstOf(v.them.name)+'…',[el('p','note','Sending…')],[]);
  ask('challenge',v.them.userId).then(nv=>{ upsert(nv); waitFor(nv); renderInbox(); }).catch(challengeRefused); }

/* The final score, retried until the server has it; kept on the device in case the page closes first. */
function sendFinish(id,sc,attempt){ attempt=attempt||0;
  const drop=()=>{ if(save.pendingFinish&&save.pendingFinish.id===id){ delete save.pendingFinish; store(); } };
  ask('finishChallenge',id,sc).then(v=>{ drop(); upsert(v); if(CH.result&&CH.result.id===id)showResult(v,CH.result.played); renderInbox(); })
    .catch(e=>{ const st=e&&+e.status;
      if(st>=400&&st<500&&st!==429){ drop(); if(CH.result&&CH.result.id===id){ CH.result.error=errText(e); showResult(CH.result.view,CH.result.played); } return; }
      if(attempt<4)setTimeout(()=>sendFinish(id,sc,attempt+1),1500*(attempt+1));
      else if(CH.result&&CH.result.id===id){ CH.result.error="Couldn't send your score yet. It goes the next time you open the game."; showResult(CH.result.view,CH.result.played); } }); }
function vsBlock(v){
  const w=el('div','vs'), side=(p,label,win)=>{ const s=el('div','side'+(win?' win':''));
    s.append(el('small','',label),el('b','',p.score!=null?fmtn(p.score):'—'),el('em','',p.score!=null?(v.status==='finished'?'final':'played'):'not played yet')); return s; };
  w.append(side(v.me||{},'You',v.outcome==='won'),el('span','mid','vs'),side(v.them||{},firstOf(v.them.name),v.outcome==='lost')); return w; }
/* What the challenge paid this player, or why nothing. */
function prizeLine(v){ const box=el('div','prize'), a=v.myAward, line=(l,r)=>box.append(el('span','',l),el('b','',r));
  if(v.status==='finished'){
    if(a&&a.points>0)line(a.kind==='win'?'You won':'For playing','+'+fmtn(a.points)+' point'+(a.points===1?'':'s'));
    else { box.classList.add('none'); line('No points',a&&a.reason?a.reason:'this time'); } }
  else if(v.status==='expired'){ box.classList.add('none'); line('No points','It expired before you both played'); }
  else if(v.status==='declined')return null;
  else { box.classList.add('none'); line('Points','once you have both played'); }
  return box; }
/* The challenge's card: who is still to play, or the result with both scores and the points. With `played` it is the end of this player's round too:
   stars, the score, and the leaderboard on a new best. Drawn again on every change. */
function showResult(v,played){
  const prev=CH.result&&CH.result.id===v.id?CH.result:null;
  CH.result={id:v.id,view:v,played,error:prev?prev.error:null};
  const n=firstOf(v.them.name), done=v.status==='finished';
  const title=done?(v.outcome==='won'?'You beat '+n+'!':v.outcome==='lost'?n+' wins this one':'A tie with '+n)
    :v.status==='expired'?'This challenge expired':v.status==='declined'?declinedTitle(v)
    :v.me&&v.me.score!=null?'Waiting for '+n+' to play':'You vs '+n;
  const body=[];
  let st=null, big=null;
  if(played){ st=starsEl(played.animate?0:played.stars); big=el('div','bigscore',played.animate?'0':fmtn(played.score)); body.push(st,big,sumLine()); }
  body.push(vsBlock(v)); body.push(prizeLine(v));
  if(v.status==='declined'&&(v.withdrawnBy||v.cancelledBy))body.push(el('p','note',declinedLine(v)+'. No result and no points.'));
  if(done&&v.myAward&&v.myAward.kind==='win'&&v.myAward.onlyOwnScore&&v.myAward.points>0)body.push(el('p','note',n+"'s score was too low to add to yours, so only your own counted toward points."));
  if(done&&v.outcome==='lost'&&v.theirAward&&v.theirAward.points>0)body.push(el('p','note',n+' won '+v.theirAward.points+' point'+(v.theirAward.points===1?'':'s')+'.'));
  if(done&&v.myAward&&v.myAward.points>0)body.push(el('p','note','Points go to your Sowaka rank.'));
  if(!done&&v.status==='accepted'&&v.me&&v.me.score!=null)body.push(el('p','note','You scored '+fmtn(v.me.score)+'. '+n+" plays the same letters; the result shows here when they do, and you get a notification if you have left."));
  if(CH.result.error)body.push(el('p','note',CH.result.error));
  if(played&&played.newBest){ played.box=played.box||boardBox(played.pending); body.push(played.box); }
  const over=isOver(v);
  if(!played&&over&&lobbyServer(v))body.push(linkRow([['Clear from my list',()=>clearCh(v.id)]]));
  const acts=over?[['Menu',()=>{closeSheet();menu();},false],['Rematch',()=>rematch(v),true]]
    :[['Menu',()=>{closeSheet();menu();},false],['Play solo',()=>start(null),true]];
  if(!played&&over)acts.shift();
  openSheet(title,body,acts);
  const celebrate=done&&!CH.celebrated[v.id]; if(celebrate)CH.celebrated[v.id]=true;
  const won=celebrate?v.outcome!=='lost':null;
  if(played&&played.animate){ played.animate=false; animateScore(st,big,played.score,played.stars,celebrate?(v.outcome==='lost'?false:true):null); }
  else if(celebrate){ if(won){ sfx.win(); const [x,y]=centre($('sh')); burst(x,y,120,COLS); } else sfx.lose(); }
}
/* What the app passes on from the server, as it happens. */
function onChallengeEvent(evt){
  if(!evt||typeof evt!=='object')return;
  if(evt.kind==='resync'){ refreshChallenges(); return; }
  const id=evt.challengeId;
  const v=evt.challenge; if(!v||!v.id)return; upsert(v); const n=firstOf(v.them.name), busy=mode==='play'||mode==='count';
  switch(evt.kind){
    case 'created': if(v.role==='opponent'&&!busy){ sfx.horn(); toast(n+' challenged you','feed'); } break;
    case 'accepted':
      if(CH.waiting===id){ CH.waiting=null; openChallenge(id); return; }
      if(v.role==='challenger'&&!busy)toast(n+' accepted. Your turn!','feed'); break;
    case 'declined':
      if(CH.waiting===id){ sfx.no(); openSheet(n+' declined',[el('p','note','Maybe another time. Challenge someone else, or play a round on your own.')],[['Challenge someone',openPicker,false],['Play solo',()=>start(null),true]]); return; }
      break;
    case 'withdrawn':
      if(isShowing(id)){ sfx.no(); openSheet(n+' withdrew it',[el('p','note','The challenge is off. Nothing to answer.')],[]); renderInbox(); return; }
      if(!busy)toast(n+' withdrew their challenge','feed'); break;
    case 'cancelled':
      if(isShowing(id)){ sfx.no(); openSheet(n+' called it off',[el('p','note','No result and no points.')],[['Challenge someone',openPicker,true]]); renderInbox(); return; }
      toast(n+' called off the challenge','feed'); break;
    case 'scored': if(duel&&duel.id===id&&v.them.score!=null){ duel.theirFinal=v.them.score; renderTarget(); toast(n+' finished on '+fmtn(v.them.score),'feed'); } break;
    case 'finished':
      /* Both have played. On the menu, the result comes up; a card already showing this challenge is redrawn below. */
      if(v.status==='finished'&&mode==='idle'&&$('sheet').hidden&&!(CH.result&&CH.result.id===id)){ showResult(v,null); renderInbox(); refreshOpenList(); return; }
      break;
    case 'expired':
      if(CH.waiting===id){ openSheet('No answer from '+n,[el('p','note','The challenge expired. Nobody wins an expired challenge.')],[['Challenge someone',openPicker,true]]); return; }
      break;
  }
  if(CH.result&&CH.result.id===id)showResult(v,CH.result.played);
  renderInbox(); refreshOpenList();
}
window.onSowakaChallenge=evt=>{ try{ onChallengeEvent(evt); }catch(e){} };
/* With the bridge: the lists, the colleagues (fetched now so the picker opens at once), a final that never landed, and the challenge a tapped notification opened the game for. */
function challengesReady(){ if(!canChallenge())return; if(mode==='idle'&&!$('chbtn'))menu(); refreshChallenges(); peopleKept(); loadPeople().catch(()=>{});
  if(save.pendingFinish&&save.pendingFinish.id)sendFinish(save.pendingFinish.id,save.pendingFinish.score);
  const want=bridge().startChallengeId; if(want&&!CH.opened){ CH.opened=true; openChallenge(String(want)); } }
/* Back on the screen, on the menu: the lists and the board again, for anything that changed meanwhile. */
document.addEventListener('visibilitychange',()=>{ if(!document.hidden&&mode==='idle'){ refreshChallenges(); refreshBoard(); } });
/* ---------- input ---------- */
$('del').onclick=()=>del();
$('shuf').onclick=()=>shuffle();
$('enter').onclick=()=>enter();
/* A keyboard plays too: letters, Enter, Backspace, and Space to shuffle. */
document.addEventListener('keydown',e=>{ if(mode!=='play'||!$('sheet').hidden||!$('howto').hidden||e.metaKey||e.ctrlKey||e.altKey)return;
  if(e.key==='Enter'){ e.preventDefault(); enter(); } else if(e.key==='Backspace'){ e.preventDefault(); del(); } else if(e.key===' '){ e.preventDefault(); shuffle(); }
  else if(/^[a-zA-Z]$/.test(e.key))typeLetter(e.key.toLowerCase()); });
$('snd').onclick=()=>{ save.sound=!save.sound; store(); sndLabel(); if(save.sound){audioChecked=false;unlockAudio();sfx.go();} };
$('help').onclick=()=>{ sfx.ui(); showHowTo(null); };
$('howok').onclick=()=>{ sfx.ui(); save.seenHowTo=true; store(); const then=howThen; hideHowTo(); if(then)then(); };
$('sheet').addEventListener('click',e=>{ if(e.target===e.currentTarget)sheetOutside(); });
$('sx').addEventListener('click',e=>{ e.stopPropagation(); sheetX(); });
document.addEventListener('keydown',e=>{ if(e.key!=='Escape')return;
  if(!$('howto').hidden){ if(!howThen)$('howok').click(); return; }
  if(!$('sheet').hidden&&mode!=='over')sheetOutside(); });
['gesturestart','gesturechange'].forEach(ev=>document.addEventListener(ev,e=>e.preventDefault(),{passive:false}));
addEventListener('sowaka-ready',()=>{ document.documentElement.classList.add('app'); if(loadSave()){ sndLabel(); if(mode==='idle')menu(); } refreshBoard(); challengesReady(); });
menu();
refreshBoard();
challengesReady();
</script>
