<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!--CUP-TICKET-->
<title>O-O-O Tournament</title>
<!-- One file, uploaded to game_catalog as `diwali-cup` (build.mjs inlines cup/play.js into it). The server puts
     window.__CUP = { ticket, eventId?, from, hopTicket? } where the marker above is; every call goes to /cup/api with the ticket. -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#15122B">
<meta name="color-scheme" content="dark">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap">
<style>
:root{--bg:#15122B;--p1:#221C44;--p2:#2A2350;--p3:#2E2652;--line:#3A3270;--y:#F5B82E;--yd:#B9861A;--yl:#FFD66B;--co:#FF6B57;--cod:#B8432F;--cy:#6FD3F2;--gr:#3DDC97;--tx:#F4F1FF;--mu:#B9B2D9;--mu2:#9C95C4;--hd:'Lilita One',system-ui,sans-serif}
*{box-sizing:border-box}
html{background:var(--bg);-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;background-color:var(--bg);background-image:radial-gradient(rgba(255,255,255,.06) 1px,transparent 1px);background-size:18px 18px;color:var(--tx);font-family:'Plus Jakarta Sans',system-ui,sans-serif;font-size:15px;line-height:1.4;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{cursor:default}
:focus-visible{outline:3px solid var(--cy);outline-offset:2px}
.hd{font-family:var(--hd);font-weight:400}
.wrap{max-width:560px;margin:0 auto;padding:0 0 calc(28px + env(safe-area-inset-bottom))}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;padding:calc(16px + env(safe-area-inset-top)) 20px 8px}
.wm{font-family:var(--hd);font-size:24px;letter-spacing:.5px;color:var(--y);flex:1 1 auto;min-width:0;max-width:100%;margin:0;font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.15}
.wm.l{font-size:20px}
/* The chips go under the name when both don't fit on one line (flex-wrap measures the name at its full width). */
.tr{display:flex;align-items:center;gap:8px;flex:none}.wm.xl{font-size:17px;white-space:normal;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
@media (max-width:380px){.wm{font-size:21px}.wm.l{font-size:18px}.wm.xl{font-size:15px}.top .pill{font-size:11px;padding:5px 9px}.top .bal{font-size:13px;padding:5px 10px 5px 5px}.top .coin{width:18px;height:18px}}
.pk{flex:none;font-size:10px;font-weight:800;letter-spacing:.8px;background:var(--y);color:var(--bg);border-radius:99px;padding:3px 8px}
.pill{font-size:12px;font-weight:800;letter-spacing:1px;color:var(--bg);background:var(--cy);border-radius:99px;padding:6px 12px;white-space:nowrap}
.pill.y{background:var(--y)}.pill.co{background:var(--co)}.pill.gr{background:var(--gr)}
.bal{display:flex;align-items:center;gap:8px;background:var(--p2);border-radius:99px;padding:6px 12px 6px 6px;font-weight:800;font-size:14px;white-space:nowrap}
.coin{width:22px;height:22px;border-radius:50%;background:var(--y);border:3px solid var(--yl);box-shadow:inset 0 -2px 0 #C98A12;flex:none}
.tabs{display:grid;grid-auto-flow:column;grid-auto-columns:auto;gap:6px;background:var(--p1);border-radius:18px;padding:6px;margin:8px 20px 0;position:sticky;top:6px;z-index:5;box-shadow:0 6px 16px rgba(10,8,25,.5)}
.tab{min-height:44px;border:0;border-radius:14px;background:transparent;font-weight:800;font-size:13px;color:var(--mu);padding:0 8px;position:relative;white-space:nowrap}
.tab.on{background:var(--y);color:var(--bg)}
.tab .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--co);margin-left:5px;vertical-align:1px}
@media (max-width:380px){.tabs{gap:4px}.tab{padding:0 6px}}
@media (max-width:340px){.tab{padding:0 4px;font-size:12px}}
.body{display:flex;flex-direction:column;gap:14px;padding:16px 20px 8px}
.card{background:var(--p1);border-radius:22px;padding:16px;display:flex;flex-direction:column;gap:12px}
.card.gold{border:3px solid var(--y)}
.card.edge{border:3px solid var(--line)}
.card.hi{background:var(--p3);border:3px solid var(--y)}
.lbl{font-size:11px;font-weight:800;letter-spacing:1px;color:var(--mu);text-transform:uppercase;margin:0}
.row{display:flex;align-items:center;gap:10px}
.sp{flex:1;min-width:0}
.mut{color:var(--mu)}
.t13{font-size:13px}.t12{font-size:12px}
p{margin:0}
h1,h2{margin:0;font-family:var(--hd);font-weight:400;line-height:1.1}
h1{font-size:34px}h2{font-size:26px}
.count{display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center}
.count small{font-size:12px;font-weight:800;letter-spacing:1px;color:var(--mu);text-transform:uppercase}
.count b{font-family:var(--hd);font-size:56px;font-weight:400;line-height:1;color:var(--y);font-variant-numeric:tabular-nums}
.count>span:not(.crown){font-size:13px;font-weight:700;color:var(--mu)}
.btn{min-height:56px;border-radius:16px;border:0;background:var(--y);color:var(--bg);font-family:var(--hd);font-size:21px;letter-spacing:.6px;box-shadow:0 6px 0 var(--yd);width:100%;padding:8px 14px}
.btn:active:not(:disabled){transform:translateY(3px);box-shadow:0 3px 0 var(--yd)}
.btn:disabled{background:var(--line);color:var(--mu);box-shadow:none}
.btn2{min-height:48px;border-radius:16px;border:2px solid var(--line);background:var(--p2);color:var(--tx);font-weight:800;font-size:15px;width:100%;padding:8px 14px}
.btn3{min-height:48px;border-radius:16px;border:2px solid var(--y);background:transparent;color:var(--y);font-weight:800;font-size:15px;width:100%;padding:8px 14px}
.link{min-height:44px;border:0;background:none;color:var(--mu);font-weight:700;font-size:14px;text-decoration:underline;padding:0 8px;align-self:center}
.vs{display:grid;grid-template-columns:minmax(0,1fr) 40px minmax(0,1fr);align-items:center;gap:4px}
.pl{display:flex;flex-direction:column;align-items:center;gap:5px;text-align:center;min-width:0}
.pl b{font-size:15px;font-weight:800;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pl small{font-size:12px;font-weight:700;color:var(--mu)}
.av{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font-family:var(--hd);font-size:24px;color:var(--bg);border:4px solid var(--bg);box-shadow:0 0 0 3px var(--line);flex:none}
.av.s{width:40px;height:40px;font-size:15px;border-width:0;box-shadow:none}
.av.xs{width:32px;height:32px;font-size:13px;border-width:0;box-shadow:none}
.av.tbd{background:transparent;border:2px dashed #6E66A0;box-shadow:none;color:var(--mu2)}
/* A photo sits in the same round frame, the player's colour as its ring; the initials stay underneath for when it fails. */
.av{position:relative;overflow:hidden}
.av>img{position:absolute;inset:0;width:100%;height:100%;border-radius:50%;object-fit:cover;background:var(--p2)}
.av.ph{border-color:var(--bg);box-shadow:0 0 0 3px var(--rc,var(--line))}
.av.s.ph,.av.xs.ph,.av.xxs.ph{border:2px solid var(--bg);box-shadow:0 0 0 2px var(--rc,var(--line))}
.av.xxs{width:24px;height:24px;font-size:10px;border-width:0;box-shadow:none}
.bp .av,.ln .av{flex:none!important;overflow:hidden!important}
.av.pd.ph{border:4px solid var(--bg);box-shadow:0 0 0 3px var(--rc)}
.pp .av{font-size:13px;color:var(--bg);margin:2px 0}
.vso{display:flex;align-items:center;justify-content:center;gap:8px}
.crown{position:relative;overflow:hidden}.crown>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:50%}
.x{width:40px;height:40px;border-radius:50%;background:var(--co);display:grid;place-items:center;font-family:var(--hd);font-size:15px;color:var(--bg);transform:rotate(-8deg);box-shadow:0 4px 0 var(--cod)}
.tagg{font-size:11px;font-weight:800;letter-spacing:.6px;color:var(--bg);background:var(--gr);border-radius:99px;padding:4px 9px;white-space:nowrap}
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.f{background:var(--p1);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:2px}
.f b{font-family:var(--hd);font-size:24px;font-weight:400}
.f span{font-size:11.5px;font-weight:700;color:var(--mu);line-height:1.3}
.steps{display:flex;align-items:center;gap:6px}
.st{flex:1;min-width:0;height:34px;border-radius:10px;background:var(--bg);display:grid;place-items:center;font-size:11.5px;font-weight:800;color:var(--mu2)}
.st.now{background:var(--y);color:var(--bg)}
.st.done{background:#1F3A35;color:var(--gr)}
.st.pass{background:var(--p3);color:var(--y);border:2px dashed var(--y)}
.st.gold{background:var(--p3);color:var(--y);border:2px solid var(--y);flex:1.4}
.rules{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:9px}
.rules li{display:flex;gap:10px;font-size:14px;font-weight:600;line-height:1.4;color:#E2DDF8}
.rules li b.n{flex:none;width:24px;height:24px;border-radius:8px;background:var(--y);color:var(--bg);display:grid;place-items:center;font-family:var(--hd);font-weight:400;font-size:14px}
.seed{display:flex;align-items:center;gap:14px}
.rank{width:60px;height:60px;border-radius:16px;background:var(--p3);border:2px solid var(--y);display:flex;flex-direction:column;align-items:center;justify-content:center;flex:none}
.rank small{font-size:10px;font-weight:800;color:var(--mu);letter-spacing:.6px}
.rank b{font-family:var(--hd);font-size:22px;font-weight:400;color:var(--y);line-height:1}
.seed p{font-size:14px;font-weight:600;line-height:1.45;color:#E2DDF8}
.seed p b{color:var(--tx)}
.ticket{position:relative;background:var(--y);color:var(--bg);border-radius:24px;padding:22px 24px;display:flex;flex-direction:column;align-items:center;gap:6px;box-shadow:0 8px 0 var(--yd);text-align:center}
.ticket:before,.ticket:after{content:'';position:absolute;top:50%;width:26px;height:26px;border-radius:50%;background:var(--bg);transform:translateY(-50%)}
.ticket:before{left:-13px}.ticket:after{right:-13px}
.ticket small{font-size:12px;font-weight:800;letter-spacing:1.4px}
.ticket b{font-family:var(--hd);font-size:32px;line-height:1;font-weight:400}
.ticket span{font-size:14px;font-weight:700}
.status{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:700}
.dotg{width:10px;height:10px;border-radius:50%;background:var(--gr);flex:none;box-shadow:0 0 0 4px rgba(61,220,151,.18)}
.doto{width:10px;height:10px;border-radius:50%;border:2px solid var(--mu2);flex:none}
.note{font-size:13px;font-weight:600;color:var(--mu);line-height:1.45}
.banner{border-radius:16px;padding:12px 14px;font-weight:700;font-size:14px;display:flex;gap:10px;align-items:center}
.banner.co{background:#3B1F33;border:2px solid var(--co);color:#FFD2CB}
.banner.cy{background:#1B2E44;border:2px solid var(--cy);color:#D5F3FC}
.res{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.res h1{color:var(--gr)}
.res.lost h1{color:var(--co)}
.res .sc{font-family:var(--hd);font-size:30px;font-variant-numeric:tabular-nums}
.bars{display:flex;flex-direction:column;gap:14px}
.br{display:flex;flex-direction:column;gap:7px}
.br .who{display:flex;align-items:center;gap:10px}
.br .nm{font-weight:800;font-size:15px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.br .nm small{font-weight:700;color:var(--mu);font-size:12px;margin-left:6px}
.br .sc{font-family:var(--hd);font-size:28px;line-height:1;font-variant-numeric:tabular-nums}
.bar{height:12px;border-radius:99px;background:var(--bg);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;transition:width .9s ease-out}
.lead{font-size:13px;font-weight:700;color:var(--gr);text-align:center}
.mini{display:flex;flex-direction:column;gap:8px}
.lm{display:flex;flex-direction:column;gap:6px;width:100%;text-align:left;background:var(--p1);border:2px solid transparent;border-radius:16px;padding:10px 12px;min-height:44px;content-visibility:auto;contain-intrinsic-size:auto 82px}
.lm.me{border-color:var(--y)}
.lm .ln{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:700;min-width:0}
.lm .ln span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lm .ln b{font-family:var(--hd);font-weight:400;font-size:18px;font-variant-numeric:tabular-nums}
.lm .tb{height:5px;border-radius:9px;background:var(--bg);overflow:hidden}
.lm .tb i{display:block;height:100%;transition:width .9s ease-out}
.sd{flex:none!important;min-width:30px;text-align:center;font-size:11px;font-weight:800;color:var(--mu);background:var(--bg);border-radius:6px;padding:2px 6px;flex:none;font-variant-numeric:tabular-nums}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:none;margin:0 -20px;padding-left:20px;padding-right:20px}
.chips::-webkit-scrollbar{display:none}
.chip{min-height:44px;min-width:52px;border-radius:14px;border:2px solid var(--line);background:var(--p1);font-weight:800;font-size:13px;color:var(--mu);padding:0 12px;flex:none;white-space:nowrap}
.chip.on{background:var(--y);border-color:var(--y);color:var(--bg)}
.chip .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--co);margin-left:5px;vertical-align:1px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--p1);border-radius:14px;padding:4px}
.seg button{min-height:44px;border:0;border-radius:11px;background:transparent;color:var(--mu);font-weight:800;font-size:13px}
.seg button.on{background:var(--p2);color:var(--tx);box-shadow:inset 0 0 0 2px var(--line)}
.search{width:100%;min-height:48px;border-radius:14px;border:2px solid var(--line);background:var(--bg);color:var(--tx);font:inherit;font-size:16px;font-weight:600;padding:0 14px}
.search::placeholder{color:var(--mu2)}
.bm{background:var(--p1);border-radius:16px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;content-visibility:auto;contain-intrinsic-size:auto 96px;border:2px solid transparent;width:100%;text-align:left}
button.bm{min-height:44px}
.bm.me{border-color:var(--y)}
.bm .bh{display:flex;justify-content:space-between;align-items:center;font-size:11px;font-weight:800;letter-spacing:.6px;color:var(--mu);text-transform:uppercase}
.bm .bp{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:700;min-height:22px}
.bm .bp span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bm .bp b{font-family:var(--hd);font-weight:400;font-size:17px;font-variant-numeric:tabular-nums}
.bm .bp.win span{color:var(--gr)}
.bm .bp.win b{color:var(--gr)}
.bm .bp.lose{color:var(--mu2)}
.bm .bp.tbd span{color:var(--mu2);font-style:italic;font-weight:600}
.sta{font-size:10.5px;font-weight:800;letter-spacing:.8px;border-radius:99px;padding:3px 8px;background:var(--bg);color:var(--mu)}
.sta.live{background:var(--co);color:var(--bg)}
.sta.done{background:#1F3A35;color:var(--gr)}
.sta.bet{background:var(--y);color:var(--bg)}
.passes{display:flex;flex-wrap:wrap;gap:6px}
.pass{font-size:12px;font-weight:800;background:var(--p3);color:var(--y);border:2px dashed var(--y);border-radius:10px;padding:4px 8px}
.pass.me{background:var(--y);color:var(--bg);border-style:solid}
.pick{position:relative;border:3px solid var(--line);background:var(--p1);border-radius:22px;padding:20px 8px 14px;display:flex;flex-direction:column;align-items:center;gap:5px;width:100%;min-width:0}
.pick.on{border-color:var(--y);background:var(--p3);box-shadow:0 0 0 4px rgba(245,184,46,.18)}
.pick:disabled{opacity:1}
.pick .tag{position:absolute;top:-13px;left:50%;transform:translateX(-50%);font-size:11px;font-weight:800;letter-spacing:1px;background:var(--y);color:var(--bg);border-radius:99px;padding:4px 10px;white-space:nowrap}
.pick .nm{font-weight:800;font-size:15px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pick .sdl{font-size:12px;font-weight:700;color:var(--mu)}
.pick .best{font-size:12px;font-weight:700;color:var(--tx);background:var(--bg);border-radius:99px;padding:4px 10px}
.split{display:flex;height:10px;border-radius:99px;overflow:hidden;background:var(--p2)}
.split i{display:block;height:100%;transition:width .6s}
.crowdh{display:flex;justify-content:space-between;gap:8px;font-size:12px;font-weight:700;color:var(--mu)}
.amt{font-family:var(--hd);font-size:44px;line-height:1;color:var(--y);font-variant-numeric:tabular-nums}
.amt span{font-size:20px;color:var(--mu);margin-left:6px}
.qs{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.q{min-height:44px;border-radius:14px;border:2px solid var(--line);background:var(--bg);font-weight:800;font-size:13px;padding:0 2px}
.q.all{border-color:var(--co);color:#FF9A8C}
.q:disabled{color:var(--mu2);border-color:var(--p2)}
.win{font-size:14px;font-weight:700;color:var(--gr)}
.why{font-size:13px;font-weight:700;color:#FFD2CB;text-align:center}
.fine{font-size:11.5px;font-weight:600;color:var(--mu2);text-align:center}
.lock{width:44px;height:44px;border-radius:14px;background:var(--y);display:grid;place-items:center;flex:none}
.betc{border:3px solid var(--y);border-radius:22px;padding:14px 16px;display:flex;align-items:center;gap:14px;background:var(--p3)}
.betc b{font-family:var(--hd);font-size:22px;color:var(--y);font-weight:400;display:block}
.betc span{font-size:13px;font-weight:700}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.stt{background:var(--p1);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:4px}
.stt b{font-family:var(--hd);font-size:24px;font-weight:400}
.stt span{font-size:12px;font-weight:700;color:var(--mu)}
.livec{display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:800;letter-spacing:1px;color:var(--bg);background:var(--co);border-radius:99px;padding:6px 12px}
.livec i{width:8px;height:8px;border-radius:50%;background:var(--bg);animation:blink 1.2s infinite}
@keyframes blink{50%{opacity:.25}}
.timer{font-family:var(--hd);font-size:34px;line-height:1;font-variant-numeric:tabular-nums}
.timer small{font-family:'Plus Jakarta Sans',system-ui,sans-serif;font-size:11px;font-weight:700;color:var(--mu);letter-spacing:.6px;margin-right:6px;text-transform:uppercase}
.burst{position:relative;width:240px;height:180px;display:grid;place-items:center;align-self:center}
.ring{position:absolute;inset:10px;border-radius:50%;border:3px dashed rgba(245,184,46,.45);animation:spin 18s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.bigc{width:146px;height:146px;border-radius:50%;background:var(--y);border:8px solid var(--yl);box-shadow:inset 0 -8px 0 #C98A12,0 0 0 8px rgba(245,184,46,.16);display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--bg);animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:scale(.4)}}
.bigc b{font-family:var(--hd);font-size:40px;line-height:1;font-weight:400}
.bigc span{font-size:13px;font-weight:800;letter-spacing:1px}
.bigc.lost{background:var(--p2);border-color:var(--line);box-shadow:none;color:var(--mu)}
.cn{position:absolute;border-radius:50%;background:var(--y);border:3px solid var(--yl);box-shadow:inset 0 -3px 0 #C98A12}
.spark{position:absolute;width:10px;height:10px;transform:rotate(45deg);border-radius:2px}
.pod{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));align-items:end;gap:10px;padding-top:8px}
.pod .p{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
.pod .p b{font-size:13px;font-weight:800;text-align:center;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.blk{width:100%;border-radius:16px 16px 6px 6px;display:flex;flex-direction:column;align-items:center;padding-top:10px;gap:2px;color:var(--bg)}
.blk strong{font-family:var(--hd);font-size:26px;font-weight:400;line-height:1}

.ct-cover[hidden]{display:none}
.ct-cover.end{background:rgba(21,18,43,.82)}
.ct-cover h2{margin:0;font-family:var(--disp);font-weight:400;font-size:2.2rem;line-height:1.05;text-transform:uppercase}
.ct-cover p{margin:0;color:var(--muted);font-size:.95rem;max-width:30ch}
.ct-cover .ct-n{font-family:var(--disp);font-size:8rem;line-height:1;color:var(--y);text-shadow:0 7px 0 var(--yd)}
.ct-cover .ct-in{font-family:var(--disp);font-size:3.4rem;line-height:1;color:var(--cy);font-variant-numeric:tabular-nums}
.ct-cover .ct-big{font-family:var(--disp);font-size:3.6rem;line-height:1;color:var(--y);font-variant-numeric:tabular-nums}
.ct-vs{display:flex;align-items:center;gap:10px;font-weight:700;font-size:1rem}
.ct-vs i{font-style:normal;font-family:var(--disp);font-size:.95rem;color:var(--muted)}
.ct-vs .a{color:var(--y)} .ct-vs .b{color:var(--co)}
.ct-ctl{flex-shrink:0;display:grid;grid-template-columns:1fr 1fr 1.35fr;gap:8px}
.ct-btn{font:inherit;font-family:var(--disp);font-weight:400;font-size:1.05rem;min-height:46px;border-radius:14px;border:2px solid var(--line);background:var(--panel);color:var(--ink);box-shadow:0 4px 0 var(--deep);cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.ct-btn:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 var(--deep)}
.ct-btn:disabled{opacity:.4;cursor:default}
.ct-btn.hint{border-color:var(--y);color:var(--y)}
.ct-say{flex-shrink:0;margin:0;min-height:1.3em;text-align:center;font-weight:700;font-size:.9rem;color:var(--muted)}
.ct-flash{position:absolute;inset:0;background:var(--y);opacity:0;pointer-events:none;z-index:6}
@keyframes ct-rise{0%{opacity:0;transform:translate(-50%,10px) scale(.7)}18%{opacity:1;transform:translate(-50%,0) scale(1.1)}100%{opacity:0;transform:translate(-50%,-56px) scale(1)}}
@keyframes ct-pop{0%{transform:scale(.3);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes ct-won{40%{transform:scale(1.025)}}
@keyframes ct-beat{50%{transform:scale(1.12)}}
@media (prefers-reduced-motion:no-preference){
  .ct-toast{animation:ct-rise 1s ease-out forwards} .ct-wrap.won{animation:ct-won .35s ease-out} .ct-c{transition:fill .12s}
  .ct-cover .ct-n{animation:ct-pop .45s} .ct-mid.low b{animation:ct-beat .5s infinite}
}
@media (prefers-reduced-motion:reduce){.ct-toast{opacity:1}}

        resume: progress[key] || null,
        onProgress: function (p) { progress[key] = p; store('cup-live', keepLast(progress, 6)); },
        onLive: function (score, p) {
          pending = Math.max(0, Math.round(Number(score) || 0)); pendingAt = p || null;
          if (!liveT) liveT = setTimeout(sendLive, Math.max(0, 260 - (Date.now() - lastLive)));
        },
        onFinal: function (score) { finishPlay(matchId, key, Math.max(0, Math.round(Number(score) || 0))); },
        getOpponentLive: function () { var mm = S && S.me && S.me.match; return mm && mm.id === matchId && mm.opponentLive != null ? mm.opponentLive : null; }
      });
    } catch (err) {
      console.error('CupPlay failed', err);
      stopPlay();
      ui.err = 'The game didn\'t start. Close this screen and open it again.';
    }
  }
  function finishPlay(matchId, key, score) {
    if (finals[key] != null) return;
    finals[key] = score;
    store('cup-finals', keepLast(finals, 20));
    if (progress[key]) { delete progress[key]; store('cup-live', progress); }
    postFinal(matchId, key, score);
    setTimeout(function () { if (ui.playing === key) stopPlay(); render(); }, 2200);
  }
  /* The final, kept on this phone (cup-finals) until the server has it, so a reload sends it again. */
  var posted = {};
  function postFinal(matchId, key, score) {
    if (posted[key]) return;
    posted[key] = true;
    var tries = 0;
    (function send() {
      api('/matches/' + encodeURIComponent(matchId) + '/final', { method: 'POST', body: { score: score } }).then(function (j) {
        if (j && j.match && S && S.me && S.me.match && S.me.match.id === matchId) Object.assign(S.me.match, j.match);
        poll();
      }).catch(function (e) {
        // 409: the match was decided without it (back too late; the live score counted). Nothing to tell, the result screen says it.
        if (e && e.status === 409) { poll(); return; }
        if (e && e.status >= 400 && e.status < 500) { toast(e.message, true); return; }
        if (++tries < 5) setTimeout(send, 1000 * tries); else { posted[key] = false; toast('Your score didn\'t reach the server. Keep this screen open.', true); }
      });
    })();
  }
  function stopPlay() {
    try { if (ui.handle && typeof ui.handle.stop === 'function') ui.handle.stop(); else if (ui.handle && typeof ui.handle.destroy === 'function') ui.handle.destroy(); } catch (e) {}
    ui.handle = null; ui.playing = null;
    $play.hidden = true; $play.innerHTML = '';
    document.body.style.overflow = ui.duel ? 'hidden' : '';
  }

  /* ---------- actions ---------- */
  function matchAction(kind) {
    var m = S.me.match;
    if (!m || ui.busy) return;
    ui.busy = kind; ui.err = ''; render();
    api('/matches/' + encodeURIComponent(m.id) + '/' + kind, { method: 'POST', body: {} }).then(function (j) {
      ui.busy = '';
      if (j.match) {
        var key = j.match.id + ':' + (j.match.attempt || 0);
        if (j.match.boardSeed) seeds[key] = j.match.boardSeed;
        if (S.me.match && S.me.match.id === j.match.id) {
          Object.assign(S.me.match, j.match);
          if (kind === 'join') S.me.match.joined = true;
        }
      }
      render(); poll();
    }).catch(function (e) { ui.busy = ''; ui.err = e.message; render(); });
  }
  /* Inside the tap, so iOS lets the round's countdown beep. */
  function unlock() { try { var P = roundPlay(); if (P && P.unlockAudio) P.unlockAudio(); } catch (e) {} }
  var ACT = {
    tab: function (v) {
      if (ui.tab === v) { window.scrollTo(0, 0); return; }
      ui.scroll[ui.tab] = window.scrollY;
      ui.tab = v; ui.q = ''; ui.all = false;
      render();
      requestAnimationFrame(function () { requestAnimationFrame(function () { window.scrollTo(0, ui.scroll[v] || 0); }); });
    },
    round: function (v) { ui.round = Number(v); ui.all = false; render(); },
    all: function (v) { ui.all = v === '1'; render(); },
    watchall: function () { ui.watchAll = true; render(); },
    standall: function () { ui.standAll = true; render(); },
    duel: function (v) { ui.duel = v; render(); },
    'duel-close': function () { ui.duel = null; render(); },
    retry: function () { netFail = 0; render(); poll(); },
    join: function () { unlock(); matchAction('join'); },
    lobby: function () {
      if (ui.busy) return;
      unlock(); ui.busy = 'lobby'; ui.err = ''; render();
      api('/lobby' + (eventId ? '?event=' + encodeURIComponent(eventId) : ''), { method: 'POST', body: {} }).then(function (j) {
        ui.busy = '';
        if (S && S.me) S.me.inLobby = true;
        if (S && S.event && j.lobbyCount != null) S.event.entrantCount = j.lobbyCount;
        render(); poll();
      }).catch(function (e) { ui.busy = ''; ui.err = e.message; render(); });
    },
    solo: function () { unlock(); matchAction('solo'); },
    reopen: function () { $play.hidden = false; },
    pick: function (v) { ui.pick = v; ui.betErr = ''; render(); },
    add: function (v) { ui.stake = Math.min((S.me.balance || 0), ui.stake + Number(v)); render(); },
    allin: function () { ui.stake = S.me.balance || 0; render(); },
    clear: function () { ui.stake = 0; render(); },
    seen: function (v) { if (seen.indexOf(v) < 0) seen.push(v); store('cup-seen-bets', seen.slice(-40)); render(); },
    ride: function (v, el) {
      var n = Number(el.getAttribute('data-n')) || 0;
      if (seen.indexOf(v) < 0) seen.push(v); store('cup-seen-bets', seen.slice(-40));
      var cur = S.current && findMatch(S.current.matchId);
      if (cur && ui.pickFor !== cur.id) { ui.pickFor = cur.id; ui.pick = null; }
      ui.stake = Math.min(n, S.me.balance || 0);
      render();
      toast('Stake set to ' + num(ui.stake) + '. Now pick who wins.');
    },
    lock: function () {
      var cur = S.current && findMatch(S.current.matchId);
      if (!cur || !ui.pick || !ui.stake || ui.betBusy) return;
      var stake = Math.min(ui.stake, S.me.balance || 0);
      ui.betBusy = true; ui.betErr = ''; render();
      api('/bets', { method: 'POST', body: { matchId: cur.id, pick: ui.pick, stake: stake } }).then(function (j) {
        ui.betBusy = false;
        if (j.balance != null) S.me.balance = j.balance;
        S.bets = S.bets || {}; S.bets.mine = S.bets.mine || [];
        var bet = j.bet || { matchId: cur.id, pick: ui.pick, stake: stake, status: 'held', payout: 0 };
        if (!myBet(bet.matchId)) S.bets.mine.push(bet);
        var p = cur.a.userId === bet.pick ? cur.a : cur.b;
        toast('Bet locked: ' + num(bet.stake) + ' on ' + first(p.name));
        poll();
      }).catch(function (e) { ui.betBusy = false; ui.betErr = e.message; render(); });
    }
  };
  $app.addEventListener('click', function (ev_) {
    var el = ev_.target.closest('[data-act]');
    if (!el || el.disabled) return;
    var f = ACT[el.getAttribute('data-act')];
    if (f) f(el.getAttribute('data-v'), el);
  });
  var qT = 0;
  $app.addEventListener('input', function (ev_) {
    var el = ev_.target;
    if (el.getAttribute('data-in') === 'q') { ui.q = el.value; clearTimeout(qT); qT = setTimeout(render, 120); }
  });
  document.addEventListener('keydown', function (ev_) { if (ev_.key === 'Escape' && ui.duel) { ui.duel = null; render(); } });

  render();
  if (!fatal) poll();
  window.__cupDebug = { get state() { return S; }, ui: ui, render: render };
})();
</script>
