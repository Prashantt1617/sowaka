<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Meow</title>
<script>if(window.SowakaShare||window.Sowaka)document.documentElement.classList.add('app')</script>
<meta name="theme-color" content="#FBF7F1">
<meta name="color-scheme" content="light">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;700;800&family=Fredoka:wght@500;600;700&display=swap">
<style>
/* Meow: one cat in every row, column and coloured region, and no two cats touching. The puzzle and its pixel look are the Pocket Puzzles
   design; around it, everything Odd One Out has in the Sowaka app: the company's leaderboard, colleague challenges on the same puzzle, how to play,
   sound and haptics.
   Sowaka: this one file is the whole game. The Sowaka app stores it in game_catalog and loads it into its own screen with a bridge (window.Sowaka) for the
   player's name, the company's leaderboard and colleague challenges; in a plain browser there is no bridge, scores stay on this device and there are no challenges. */
[hidden]{display:none!important}
:root{
  color-scheme:light; --padt:max(14px,env(safe-area-inset-top));
  --bg:#F6F1FF; --paper:#FFFFFF; --soft:#F4EFE7; --soft2:#EAE3D8; --ink:#2E2C29; --line:#E7E0D4; --muted:#79736A; --faint:#C9C1B4;
  --sh:0 1px 2px rgba(46,44,41,.06),0 6px 18px rgba(46,44,41,.08); --sh-press:0 1px 2px rgba(46,44,41,.08);
  --accent:#FF9431; --accent-hi:#FFA54F; --accent-deep:#DB6A12; --mint:#E6F2E1; --mint2:#B8D6AD; --good:#4E8B4F; --bad:#A22220; --gold:#F5AB4E; --pink:#E9896D;
  --pixel:'Fredoka','Sora',system-ui,-apple-system,'Segoe UI',sans-serif; --mono:'Figtree',system-ui,-apple-system,sans-serif; --body:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
}
*{box-sizing:border-box}
html{overflow-x:clip;background:linear-gradient(180deg,#FFF0F8 0%,#EEF2FF 45%,#E6F6FF 100%) fixed;-webkit-text-size-adjust:100%;text-size-adjust:100%;touch-action:manipulation;overscroll-behavior:none}
body{margin:0;min-height:100vh;min-height:100dvh;color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.35;
  background:transparent;
  padding:var(--padt) max(16px,env(safe-area-inset-right)) calc(32px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));
  touch-action:manipulation;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;touch-action:manipulation;-webkit-tap-highlight-color:transparent;cursor:pointer}
input{-webkit-user-select:text;user-select:text}
button:focus-visible,input:focus-visible,[role=button]:focus-visible{outline:3px solid #135F9F;outline-offset:2px}
main.app{max-width:440px;margin-inline:auto;display:flex;flex-direction:column;gap:14px;position:relative}
.icon{width:18px;height:18px;display:inline-block;vertical-align:middle;flex:none}
.face{width:30px;height:28px;display:inline-block;flex:none}

/* The header: the cat and the game's name in the pixel face, and the ? and sound squares. */
header{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:40px}
h1{margin:0;display:flex;align-items:center;gap:8px;font-family:var(--pixel);font-weight:800;font-size:19px;line-height:1;letter-spacing:-.02em;white-space:nowrap;color:var(--ink)}
h1 .face{width:26px;height:24px}
.hright{display:flex;align-items:center;gap:8px}
.sq{width:34px;height:34px;display:grid;place-items:center;padding:0;border:1px solid var(--line);border-radius:12px;background:var(--paper);box-shadow:var(--sh);
  font-family:var(--pixel);font-size:13px;color:var(--ink)}
.sq svg{width:18px;height:18px;display:block}
.sq.off{color:var(--muted)}
.sq:active{transform:translateY(1px);box-shadow:var(--sh)}

/* Panels and buttons, as the Pocket Puzzles page draws them: paper, a 2px ink line, a hard ink shadow. */
.panel{border:1px solid var(--line);border-radius:18px;background:var(--paper);box-shadow:var(--sh)}
.btn{font-family:var(--body);font-weight:700;font-size:15px;line-height:1.15;min-height:48px;padding:8px 14px;border-radius:14px;border:1px solid var(--line);
  background:var(--paper);color:var(--ink);box-shadow:var(--sh);display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .06s,box-shadow .06s}
.btn:active{transform:translateY(1px);box-shadow:var(--sh)}
.btn.go{background:linear-gradient(180deg,#FFB24F,#FF8A22);color:#fff;border-color:transparent;text-shadow:0 1px 0 rgba(170,70,0,.35);box-shadow:0 5px 0 var(--accent-deep),0 10px 18px rgba(219,106,18,.25)!important;font-family:var(--pixel);font-weight:800;font-size:16px;letter-spacing:0;min-height:58px}
.btn.go:active{transform:translateY(4px);box-shadow:0 1px 0 var(--accent-deep)!important}
.btn.primary{background:var(--ink);color:var(--paper)}
.btn:disabled{opacity:.45;cursor:default}
.mini{font-family:var(--body);font-weight:700;font-size:12px;min-height:32px;padding:0 10px;border-radius:12px;border:1px solid var(--line);background:var(--paper);color:var(--ink);white-space:nowrap}
.mini.yes{font-family:var(--pixel);font-weight:800;font-size:15px;min-height:40px;min-width:92px;padding:0 12px;background:linear-gradient(180deg,#FFB24F,#FF8A22);color:#fff;border-color:transparent;box-shadow:var(--sh)}
.mini.yes:active{transform:translateY(1px);box-shadow:var(--sh)}
.mini:disabled{opacity:.5}
.link{font-family:var(--body);font-weight:700;font-size:13px;color:var(--muted);background:none;border:0;padding:6px 0;text-decoration:underline;text-underline-offset:2px}
.links{display:flex;justify-content:center;gap:18px;flex-wrap:wrap}
.links .link{padding:2px 0}
.lab,.small{font:700 11px/1.4 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

/* Home: the meadow across the top of the page, under the header, with your rank and the leaderboard in it. */
.top{position:relative;margin:calc(-1*var(--padt)) calc(50% - 50vw) 0;padding:var(--padt) max(16px,env(safe-area-inset-right)) 16px max(16px,env(safe-area-inset-left));
  background:var(--paper);border-bottom:2px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:10px}
.top>*{position:relative;width:100%;max-width:440px}
.top .art{border-radius:22px;overflow:hidden;background:linear-gradient(135deg,#FFE3F2 0%,#F3ECFF 50%,#D9F1FF 100%)}
.top .art svg{display:block;width:100%;height:160px}
.top .tt{margin:2px 0 0;text-align:center;font-family:var(--pixel);font-weight:700;font-size:16px;line-height:1.4;letter-spacing:-.01em;color:var(--ink)}
.rankbar{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:stretch}
.rankbar.solo{grid-template-columns:1fr}
.rankbar.solo .lbbtn{flex-direction:row;min-height:44px;gap:8px}
.mystat{display:flex;align-items:center;gap:12px;min-width:0;padding:8px 12px;border:1px solid var(--line);border-radius:14px;background:var(--mint)}
.mystat .big{font-family:var(--pixel);font-size:20px;line-height:1;color:var(--ink);font-variant-numeric:tabular-nums;flex-shrink:0}
.mystat .big small{font-size:.6em;margin-right:2px}
.mystat .side{min-width:0;display:flex;flex-direction:column;gap:3px}
.mystat .side span{font:700 10px/1.3 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:#4A5640;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mystat .side b{font-size:13px;white-space:nowrap}
.mystat .side b em{font-style:normal;font-family:var(--pixel);font-size:11px;margin-left:3px}
.lbbtn{font-family:var(--body);font-weight:700;font-size:12px;line-height:1;white-space:nowrap;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;
  padding:6px 12px;border-radius:14px;border:1px solid var(--line);background:var(--accent);color:var(--ink);box-shadow:var(--sh)}
.lbbtn svg{width:22px;height:22px;flex-shrink:0}
.lbbtn:active{transform:translateY(1px);box-shadow:var(--sh)}
/* The two tabs under the meadow: Play now and Challenges (open by default). */
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:5px;border-radius:18px;background:var(--paper);border:1px solid var(--line);box-shadow:var(--sh)}
.tabs.one{grid-template-columns:1fr}
.tab{position:relative;font-family:var(--body);font-weight:700;font-size:14px;line-height:1;min-height:44px;border-radius:12px;border:0;background:transparent;color:var(--muted);
  display:flex;align-items:center;justify-content:center;gap:8px}
.tab.on{background:linear-gradient(180deg,#9A7BFF,#7457F0);color:#fff;box-shadow:0 3px 0 #5A3FD0}
.badge{min-width:22px;height:22px;padding:0 7px;border-radius:999px;background:var(--accent);color:var(--ink);font-weight:700;font-size:12px;display:grid;place-items:center;border:1px solid var(--line)}
.tab.on .badge{border-color:var(--paper)}
.pane{display:flex;flex-direction:column;gap:14px}
/* Play now: the rules, the board size, and Play, in one card. */
.playcard{display:flex;flex-direction:column;align-items:stretch;gap:14px;padding:14px}
.rules{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.rules div{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;line-height:1.25;color:var(--muted)}
.rules i{width:40px;height:40px;display:grid;place-items:center}
.rules svg{width:34px;height:34px}
.lvl{display:flex;align-items:center;gap:14px;padding:10px 12px;border:1px solid var(--line);border-radius:14px;background:var(--mint)}
.lvl>div:first-child{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:58px}
.lvl>div:first-child .lab{color:#4A5640}
.lvl>div:first-child b{font-family:var(--pixel);font-weight:800;font-size:26px;line-height:1}
.lvx{display:flex;flex-direction:column;gap:4px;min-width:0}
.lvx span{font-weight:700;font-size:14px}
.lvx small{font:700 10.5px/1.3 var(--mono);letter-spacing:.04em;color:#4A5640}
.lvbar{height:10px;border:1px solid var(--line);border-radius:3px;background:var(--soft);overflow:hidden;margin-top:-6px}
.lvbar i{display:block;height:100%;background:var(--accent)}
/* Challenges: the challenges for you, then Challenge a colleague, then history. */
.chlist{display:flex;flex-direction:column;gap:10px}
.chc{padding:12px 14px;display:flex;flex-direction:column;gap:10px;text-align:left}
.chc .lab{display:flex;justify-content:space-between;align-items:center;gap:8px;color:#B0592A}
.chc.turn .lab{color:var(--good)}
.chc .row{display:flex;gap:12px;align-items:flex-start}
.chc .tx{flex:1;min-width:0;display:flex;flex-direction:column;align-items:flex-start;gap:4px}
.chc .tx b{font-size:14px;line-height:1.2}
.chc .tx small{font-size:12px;line-height:1.3;color:var(--muted)}
.chc .bt{flex-shrink:0;padding-bottom:4px}
.dl{font-size:12px;color:var(--muted);background:none;border:0;padding:2px 0 0;text-decoration:underline;text-underline-offset:2px}
.dl:disabled{opacity:.5}
.clock2{display:inline-flex;align-items:center;gap:5px;padding:3px 8px 3px 6px;border-radius:4px;background:var(--soft);border:1px solid var(--faint);color:var(--ink);
  font:700 11px/1 var(--mono);letter-spacing:0;text-transform:none;font-variant-numeric:tabular-nums;white-space:nowrap}
.clock2 svg{width:12px;height:12px;flex-shrink:0}
.clock2.soon{background:#F8DAD3;color:var(--bad);border-color:#D9A49A}
.chlist .empty{margin:0;padding:22px 16px;border-radius:18px;border:2px dashed var(--faint);text-align:center;font-size:14px;color:var(--muted);background:rgba(252,250,240,.6)}
.btn.send{background:var(--accent);font-size:16px}

/* A round: the clock, what the puzzle is worth right now, and the cats placed. */
.hud{display:grid;grid-template-columns:1fr 1.25fr 1fr;gap:8px}
.hbox{padding:8px 10px;display:flex;flex-direction:column;gap:5px;min-width:0;border:1px solid var(--line);border-radius:14px;background:var(--paper);box-shadow:var(--sh)}
.hbox b{font-family:var(--pixel);font-weight:800;font-size:15px;line-height:1;font-variant-numeric:tabular-nums;white-space:nowrap}
.hbox.worth{background:var(--mint)}
.mist{font-weight:700;font-size:11.5px;color:var(--muted)}
.mist.on{color:var(--bad)}
.hbox.worth .lab{color:#4A5640}
.hstars{display:flex;gap:3px;font-size:13px;line-height:1;color:var(--faint)}
.hstars span.on{color:#FFB547}
.pips{display:flex;gap:3px;flex-wrap:wrap}
.pips i{width:8px;height:8px;border:1px solid #797B6C;background:#E9E6D8}
.pips i.on{background:var(--accent);border-color:var(--ink)}
/* In a challenge the other player has already played: their score, the number to beat. */
.target{display:flex;align-items:center;justify-content:center;gap:8px;padding:8px 14px;border:1px solid var(--line);border-radius:14px;background:var(--paper);box-shadow:var(--sh)}
.target span{font:700 10.5px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.target b{font-family:var(--pixel);font-weight:800;font-size:14px;line-height:1;font-variant-numeric:tabular-nums}
.target small{font-size:12px;color:var(--muted)}
.target.ahead{background:#E5EDD8}
.target.ahead b{color:var(--good)}
.target.behind{background:#F8E1D9}
.target.behind b{color:var(--bad)}

/* The board. */
.stage{position:relative}
.board{--n:6;display:grid;grid-template-columns:repeat(var(--n),1fr);grid-template-rows:repeat(var(--n),minmax(0,1fr));gap:calc(24px/var(--n));padding:calc(36px/var(--n));aspect-ratio:1;border:0;border-radius:22px;
  overflow:hidden;background:#fff;width:100%;box-shadow:0 2px 0 rgba(120,90,200,.10),0 12px 30px rgba(120,90,200,.18);touch-action:none}
.cell{position:relative;min-width:0;min-height:0;padding:0;border:0!important;border-radius:calc(70px/var(--n));display:grid;place-items:center;
  background:linear-gradient(180deg,rgba(255,255,255,.34) 0,rgba(255,255,255,.34) 32%,rgba(255,255,255,0) 33%),var(--color);box-shadow:inset 0 -4px 0 rgba(0,0,0,.13),inset 0 2px 0 rgba(255,255,255,.35);-webkit-user-select:none;user-select:none}
.cell:focus-visible{outline:3px dashed var(--ink);outline-offset:-5px;z-index:1}
.cell .face{width:78%;height:72%;pointer-events:none;filter:drop-shadow(0 2px 1px rgba(0,0,0,.18))}
.cell .mark{width:44%;height:44%;color:#fff;pointer-events:none;filter:drop-shadow(0 1.5px 1px rgba(0,0,0,.28))}
.cell.bad::after{content:'!';position:absolute;right:2px;top:2px;font:bold 12px/15px var(--mono);background:var(--bad);color:#fff;border-radius:50%;width:15px;height:15px;text-align:center}
.cell .pin{position:absolute;bottom:3px;right:3px;width:9px;height:9px;color:#55564B;line-height:9px;pointer-events:none}
.cell.hint{animation:hintflash .9s ease-out}
.cell.was{outline:3px solid #fff;outline-offset:-4px;box-shadow:0 0 0 3px var(--accent)}
/* Over the board while it counts down; on the menu (.m) it is the menu itself. */
.cover{position:absolute;inset:-4px;border-radius:22px;background:#F7F3FF;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:12px;z-index:2}
.cover:not(.m) h2{font-family:var(--pixel);font-weight:800;font-size:18px;margin:0;line-height:1.4}
.cover:not(.m) p{margin:0;color:var(--muted);max-width:30ch;font-size:14px}
.cover .n{font-family:var(--pixel);font-weight:700;font-size:110px;line-height:1;color:#FF9A2E;text-shadow:0 6px 0 var(--accent-deep)}
.cover .nb{font-family:var(--pixel);font-size:12px;color:var(--muted);letter-spacing:0}
.cover.m{position:static;inset:auto;background:none;border-radius:0;padding:0;align-items:stretch;justify-content:flex-start;gap:14px;text-align:left}
/* The tools under the board. */
.toolbar{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:stretch}
.taphelp{margin:-4px 0 0;text-align:center;font:700 10.5px/1.4 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.tool{display:inline-flex;align-items:center;justify-content:center;gap:7px;font-weight:700;font-size:14px;min-height:46px;padding:4px 8px;box-shadow:var(--sh);border:1px solid var(--line);border-radius:12px;background:var(--paper);white-space:nowrap;min-width:0}
.tool:active:not(:disabled){transform:translateY(1px);box-shadow:var(--sh)}
.tool:disabled{opacity:.4}
.tool small{font:700 10px var(--mono);color:var(--muted)}
.feedback{font-size:13px;line-height:1.4;margin:0;padding:9px 10px;background:var(--soft);border-radius:4px;border:1px dashed var(--faint);min-height:38px}
.feedback:empty{visibility:hidden}
.rowlinks{display:flex;justify-content:space-between;align-items:center;margin-top:-4px}
.foot{display:flex;justify-content:center;gap:12px;font:700 11px var(--mono);letter-spacing:.06em;color:var(--muted)}

/* Someone's face: their photo, else their initial on a colour picked by the name. */
.av{--s:34px;width:var(--s);height:var(--s);border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:calc(var(--s)*.42);line-height:1;color:var(--ink);
  background:hsl(var(--ah,25) 70% 78%);border:1px solid var(--line);flex-shrink:0;overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover;display:block}
/* The rest of the inbox: waiting on them, and results. */
.inbox{display:flex;flex-direction:column;gap:8px;width:100%;text-align:left}
.crow{color:var(--ink);display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:10px 12px;border-radius:14px;background:var(--paper);border:1px solid var(--line);text-align:left;width:100%}
div.crow.tap{cursor:pointer}
.crow p{margin:0;font-size:13.5px;line-height:1.25;min-width:0}
.crow p small{display:block;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.crow .bt{display:flex;gap:6px;align-items:center}
.crow .pts{font-family:var(--pixel);font-size:11px;color:#B0592A;white-space:nowrap}
.crow .pts.zero{font-family:var(--mono);font-weight:700;font-size:11px;color:var(--muted)}

/* Inside the app the page sits under the app's own bar, which has already cleared the notch: no second top inset. */
html.app{--padt:14px}
html.app .sheet{padding-top:16px}
html.app .howto{padding-top:20px}

/* Sheets: a bottom sheet. A tap on the dimmed screen around it, or its ✕, closes it. */
.sheet{position:fixed;inset:0;background:rgba(46,44,41,.42);display:flex;flex-direction:column;align-items:center;cursor:pointer;
  padding:max(16px,env(safe-area-inset-top,0px)) 12px calc(14px + env(safe-area-inset-bottom,0px));z-index:9;overflow-y:auto;overscroll-behavior:contain}
.card{background:var(--paper);color:var(--ink);border-radius:24px;padding:10px 18px 20px;width:100%;max-width:440px;display:flex;flex-direction:column;gap:14px;cursor:auto;outline:none;
  border:1px solid var(--line);box-shadow:var(--sh);margin-top:auto;margin-bottom:4px;flex-shrink:0}
.card::before{content:"";align-self:center;flex-shrink:0;width:44px;height:5px;border-radius:3px;background:var(--soft2);margin-bottom:-4px}
.card h2{font-family:var(--pixel);font-weight:800;font-size:15px;margin:0;line-height:1.5;letter-spacing:-.01em}
.shead{display:flex;align-items:flex-start;gap:12px}
.shead h2{flex:1;min-width:0;padding-top:6px}
.sx{flex-shrink:0;width:34px;height:34px;display:grid;place-items:center;padding:0;border-radius:12px;background:var(--paper);color:var(--ink);border:1px solid var(--line);box-shadow:var(--sh)}
.sx:active{transform:translateY(1px);box-shadow:var(--sh)}
.sx svg{width:13px;height:13px;display:block}
.card .note{margin:0;font-size:14px;line-height:1.45;color:#45473D}
.card .acts{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding-bottom:4px}
.card .acts.one{grid-template-columns:1fr}
.card .acts .btn.go{font-size:13px;min-height:50px}
/* The leaderboard: one list, the whole of it, in its own scroll. */
.lb{display:flex;flex-direction:column;gap:8px}
.lbh{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font:700 10.5px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.lbh .of{color:var(--ink)}
.ranks{display:flex;flex-direction:column;gap:5px;max-height:min(40vh,320px);overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;touch-action:pan-y;padding:2px 2px 4px;margin:0 -2px}
.lb.full .ranks{max-height:min(64vh,560px)}
.rank{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-shrink:0;padding:5px 12px 5px 5px;border-radius:12px;background:var(--soft);border:1px solid #D9D6C4;font-size:14px;font-variant-numeric:tabular-nums}
.rank>span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rank b{font-family:var(--pixel);font-weight:800;font-size:11px;flex-shrink:0}
.rank.me{background:var(--mint);border:1px solid var(--line)}
.rank.tap{cursor:pointer}.rank.tap:active{filter:brightness(.95)}
.lb .pos{font-style:normal;display:inline-grid;place-items:center;vertical-align:middle;min-width:28px;height:26px;padding:0 4px;margin-right:8px;border-radius:4px;
  background:var(--paper);border:1px solid var(--line);font-family:var(--pixel);font-size:9px;line-height:1}
.rank.p1 .pos{background:var(--accent)} .rank.p2 .pos{background:#F6C49B} .rank.p3 .pos{background:#EEDCA4}
.gap{text-align:center;color:var(--muted);font-family:var(--mono);font-weight:700;font-size:14px;line-height:.6;padding:2px 0 6px;letter-spacing:.3em;flex-shrink:0}
.pin2{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:6px 12px 6px 6px;border-radius:12px;background:var(--accent);border:1px solid var(--line);font-size:14px}
.pin2 b{font-family:var(--pixel);font-weight:800;font-size:11px}
.pin2.tap{cursor:pointer}.pin2.tap:active{filter:brightness(.95)}
.lb .wait{margin:0;font-size:14px;color:var(--muted)}
.card dl{margin:0;display:grid;grid-template-columns:1fr auto;gap:6px 12px;font-size:14px;font-variant-numeric:tabular-nums;padding:10px 12px;border:1px dashed var(--faint);border-radius:12px;background:var(--soft)}
.card dt{color:var(--muted)} .card dd{margin:0;text-align:right;font-weight:700}
/* The end of a round: stars stamped in and the score counted up. */
.stars{display:flex;justify-content:center;align-items:flex-end;gap:10px;font-size:44px;line-height:1;color:#DAD7C6;margin-top:2px}
.stars span{color:#EAE3D8}
.stars span:nth-child(2){font-size:1.3em;margin-bottom:6px}
.stars span.on{color:#FFB547}
.bigscore{font-family:var(--pixel);font-weight:800;font-size:46px;text-align:center;line-height:1.1;font-variant-numeric:tabular-nums}
/* A challenge's result: the two scores side by side, and what it paid. */
.vs{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;text-align:center}
.vs .side{padding:10px 6px;border-radius:14px;background:var(--soft);border:2px solid var(--faint);min-width:0}
.vs .side.win{border-color:var(--line);background:var(--mint);box-shadow:var(--sh)}
.vs .side small{display:block;font:700 10px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vs .side b{display:block;font-family:var(--pixel);font-weight:800;font-size:17px;line-height:1.6;font-variant-numeric:tabular-nums}
.vs .side em{display:block;font-style:normal;font-size:12px;color:var(--muted);font-weight:700}
.vs .mid{font-family:var(--pixel);font-size:11px;color:var(--muted)}
.prize{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 14px;border-radius:14px;background:var(--mint);border:1px solid var(--line);font-weight:700;font-size:14px}
.prize span{white-space:nowrap}
.prize b{font-family:var(--pixel);font-weight:800;font-size:13px;text-align:right}
.prize.none{background:var(--soft);border-color:var(--faint)}
.prize.none b{font-family:var(--body);font-weight:700;font-size:13px;color:var(--muted)}
/* Picking a colleague. */
.lrow input{font-family:var(--body);font-size:15px;font-weight:700;min-height:48px;padding:0 14px;border-radius:14px;border:1px solid var(--line);background:#fff;color:var(--ink);width:100%;min-width:0;outline:none}
.lrow input::placeholder{color:var(--faint)}
.people{display:flex;flex-direction:column;gap:6px;max-height:min(50vh,400px);overflow-y:auto;overscroll-behavior:contain;padding:2px 0 4px}
.person{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;text-align:left;padding:8px 10px;border-radius:14px;border:1.5px solid #D9D6C4;background:var(--soft);color:var(--ink);width:100%;flex-shrink:0}
.person:active{transform:translateY(1px)}
.person span{min-width:0}
.person b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.person small{display:block;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.person i{font-style:normal;font-family:var(--pixel);font-size:9px;color:#B0592A}
.shim{height:54px;flex-shrink:0;border-radius:14px;background:linear-gradient(90deg,var(--soft) 0%,var(--soft2) 50%,var(--soft) 100%);background-size:200% 100%}

/* How to play: full screen, once before a new player's first round, and from the ?. */
.howto{position:fixed;inset:0;z-index:12;overflow-y:auto;overscroll-behavior:contain;display:flex;flex-direction:column;align-items:center;
  background:var(--bg);
  padding:max(20px,env(safe-area-inset-top)) max(20px,env(safe-area-inset-right)) calc(24px + env(safe-area-inset-bottom)) max(20px,env(safe-area-inset-left))}
.hin{width:100%;max-width:400px;margin:auto 0;display:flex;flex-direction:column;gap:16px}
.howart{align-self:center;width:min(52vw,190px);transform:rotate(-2deg)}
.howart .board{--n:4}
.howto .kick{margin:4px 0 0;font:700 10.5px/1.5 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);text-align:center}
.howto h2{margin:-8px 0 0;font-family:var(--pixel);font-weight:800;font-size:20px;line-height:1.4;text-align:center}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.steps li{display:flex;gap:12px;align-items:center;padding:10px 12px;background:var(--paper);border:1px solid var(--line);border-radius:14px;box-shadow:var(--sh)}
.steps li>i{flex-shrink:0;width:34px;height:34px;display:grid;place-items:center}
.steps li>i svg{width:32px;height:32px}
.steps span{font-size:13.5px;line-height:1.35;color:var(--muted)}
.steps b{display:block;font-size:15px;line-height:1.3;color:var(--ink)}
.howto .btn.go{margin-top:2px}

/* Round feedback: points over the board, the flash and the confetti. */
.toasts{position:absolute;inset:0;pointer-events:none;z-index:3}
.toast{position:absolute;left:50%;top:-14px;font-family:var(--pixel);font-size:14px;white-space:nowrap;color:var(--ink);transform:translate(-50%,0);
  background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:6px 10px;box-shadow:var(--sh)}
.toast.bad{background:#F8E1D9;color:var(--bad)}
.toast.big{font-size:16px;top:38%;background:var(--accent)}
.toast.feed{font-family:var(--body);font-weight:700;font-size:13px;top:-46px}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:10}
.flash{position:fixed;inset:0;background:var(--accent);opacity:0;pointer-events:none;z-index:7}
@media (min-width:700px){.card{margin-block:auto}}
@keyframes blink{0%,95%,100%{opacity:0}96%,98%{opacity:1}}
@keyframes float{50%{transform:translateY(-3px)}}
@keyframes drift{to{transform:translateX(4px)}}
@keyframes rise{0%{opacity:0;transform:translate(-50%,10px) scale(.7)}18%{opacity:1;transform:translate(-50%,0) scale(1.08)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-44px) scale(1)}}
@keyframes pop{0%{transform:scale(.4);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes catpop{from{transform:scale(.73)}to{transform:scale(1)}}

@keyframes wave{0%,100%{transform:none}40%{transform:translateY(-14%) scale(1.12)}}
@keyframes hintflash{0%{filter:brightness(1.35)}100%{filter:none}}
@keyframes flashk{0%{opacity:.45}100%{opacity:0}}
@keyframes shim{0%{background-position:100% 0}100%{background-position:-100% 0}}
@keyframes up{0%{transform:translateY(28px);opacity:0}100%{transform:none;opacity:1}}
@media (prefers-reduced-motion:no-preference){
  .toast{animation:rise 1.1s ease-out forwards} .cell .face{animation:catpop .15s ease-out} .board.shake{animation:shake .3s}

}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important}.toast{opacity:1}}
.howart{width:min(52vw,190px)}

/* Levels: the 36 puzzles from easiest to hardest (by how much searching a solver needs): 1-12 are 6×6, 13-24 7×7, 25-36 8×8; after 36 the
   8×8s come round again. */
const ORDER=[1, 10, 4, 0, 3, 9, 2, 5, 11, 6, 8, 7, 15, 12, 16, 14, 22, 13, 21, 18, 20, 19, 23, 17, 28, 33, 27, 30, 35, 32, 25, 26, 29, 34, 31, 24];
const levelPuzzle=L=>L<=36?ORDER[L-1]:ORDER[24+((L-37)*5)%12];
const levelOf=idx=>ORDER.indexOf(idx)+1;
/* A solved puzzle is worth its level's base (425 at level 1, up 25 a level to 1,900 at level 60), plus up to as much again for speed (all of it
   at once, none at twice the par time), less 150 a hint, and never under a quarter of the base. Par in seconds, by size. Three stars at the par
   time with no hints. */
const PAR={6:90,7:150,8:240}, HINT_COST=150, MISTAKE_COST=50;
const baseFor=L=>400+25*Math.min(Math.max(1,L|0),60);
const fmtn=x=>Math.round(x).toLocaleString('en-IN');
const fmtt=t=>{ t=Math.max(0,Math.floor(t)); return String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0'); };
/* m: mistakes, cats put where they clash with another (−50 each; Undo doesn't give it back). */
function worthOf(n,t,h,L,m){ const b=baseFor(L), w=Math.round(b+b*Math.max(0,1-t/(2*PAR[n]))-h*HINT_COST-(m||0)*MISTAKE_COST); return Math.max(Math.round(b/4),w); }
const starsOf=(L,s)=>s>0?1+(s>=baseFor(L)*1.25?1:0)+(s>=baseFor(L)*1.5?1:0):0;

   A challenge's puzzle, from the server's seed: any of the 36, so two players given one seed get the same puzzle (scored at its level). */

      PEOPLE.list=list; PEOPLE.at=Date.now(); cachePut('people',{at:PEOPLE.at,list}); return list; })

function addPeople(found){ const have=new Set((PEOPLE.list||[]).map(p=>p.userId)), extra=found.filter(p=>p.userId&&!have.has(p.userId));

function openPicker(){

  const mine=sheetSeq, here=()=>mine===sheetSeq&&!$('sheet').hidden;
  const rows=new Map(); let drawn='', searching='', searched=new Set(), t=null, failed='';
  const rowFor=p=>{ let b=rows.get(p.userId); if(!b){ b=el('button','person'); b.type='button'; b.onclick=()=>sendChallenge(b._p); rows.set(p.userId,b); }

    if(b._sig!==sig){ b._sig=sig; const s=el('span'); s.append(el('b','',p.name),el('small','',[p.designation,p.department].filter(Boolean).join(' · ')||'Colleague'));
      b.replaceChildren(avatar(p.name,p.photoUrl),s,el('i','','Challenge')); }

    if(!all){ if(failed){ list.replaceChildren(); msg.hidden=false; msg.textContent=failed; return; }

    const people=ql?all.filter(p=>p.name.toLowerCase().includes(ql)):all, ids=people.map(p=>p.userId).join(',');

  const search=()=>{ const q=input.value.trim(); if(!q||searched.has(q.toLowerCase())||!PEOPLE.list||PEOPLE.list.length<PEOPLE_PAGE)return;

/* The final score, retried until the server has it; kept on the device in case the page closes first. */
function sendFinish(id,sc,attempt){ attempt=attempt||0;
  const drop=()=>{ if(save.pendingFinish&&save.pendingFinish.id===id){ delete save.pendingFinish; store(); } };
  ask('finishChallenge',id,sc).then(v=>{ drop(); upsert(v); if(CH.result&&CH.result.id===id)showResult(v,CH.result.played); renderInbox(); })
    .catch(e=>{ const st=e&&+e.status;
      if(st>=400&&st<500&&st!==429){ drop(); if(CH.result&&CH.result.id===id){ CH.result.error=errText(e); showResult(CH.result.view,CH.result.played); } return; }
      if(attempt<4)setTimeout(()=>sendFinish(id,sc,attempt+1),1500*(attempt+1));

/* The challenge's card: who is still to play, or the result with both scores and the points. With `played` it is the end of this player's round too. */
function showResult(v,played){
  const prev=CH.result&&CH.result.id===v.id?CH.result:null;
  CH.result={id:v.id,view:v,played,error:prev?prev.error:null};
  const n=firstOf(v.them.name), done=v.status==='finished';
  const title=done?(v.outcome==='won'?'You beat '+n+'!':v.outcome==='lost'?n+' wins this one':'A tie with '+n)
    :v.status==='expired'?'This challenge expired':v.status==='declined'?declinedTitle(v)
    :v.me&&v.me.score!=null?'Waiting for '+n+' to play':'You vs '+n;

  if(!done&&v.status==='accepted'&&v.me&&v.me.score!=null)body.push(el('p','note','You scored '+fmtn(v.me.score)+'. '+n+" solves the same puzzle; the result shows here when they do, and you get a notification if you have left."));

  const over=isOver(v);

    :[['Menu',()=>{ closeSheet(); menu(); },false],['Play solo',()=>start(null),true]];
  if(!played&&over)acts.shift();

  else if(celebrate){ if(won){ sfx.win(); const [x,y]=centre($('sh')); burst(x,y,120,COLS); } else sfx.lose(); }
}
/* What the app passes on from the server, as it happens. */
function onChallengeEvent(evt){
  if(!evt||typeof evt!=='object')return;
  if(evt.kind==='resync'){ refreshChallenges(); return; }
  const id=evt.challengeId, v=evt.challenge; if(!v||!v.id)return; upsert(v); const n=firstOf(v.them.name), busy=mode==='play'||mode==='count'||mode==='pause';
  switch(evt.kind){
    case 'created': if(v.role==='opponent'&&!busy){ sfx.horn(); toast(n+' challenged you','feed'); } break;
    case 'accepted':
      if(CH.waiting===id){ CH.waiting=null; openChallenge(id); return; }
      if(v.role==='challenger'&&!busy)toast(n+' accepted. Your turn!','feed'); break;
    case 'declined':
      if(CH.waiting===id){ sfx.no(); openSheet(n+' declined',[el('p','note','Maybe another time. Challenge someone else, or solve one on your own.')],[['Challenge someone',openPicker,false],['Play solo',()=>start(null),true]]); return; }
      break;
    case 'withdrawn':
      if(isShowing(id)){ sfx.no(); openSheet(n+' withdrew it',[el('p','note','The challenge is off. Nothing to answer.')],[]); renderInbox(); return; }
      if(!busy)toast(n+' withdrew their challenge','feed'); break;
    case 'cancelled':
      if(isShowing(id)){ sfx.no(); openSheet(n+' called it off',[el('p','note','No result and no points.')],[['Challenge someone',openPicker,true]]); renderInbox(); return; }
      if(!busy)toast(n+' called off the challenge','feed'); break;
    case 'scored': if(duel&&duel.id===id&&v.them.score!=null){ duel.theirFinal=v.them.score; if(round&&round.duel)round.duel.theirFinal=v.them.score; behindSaid=false; renderHud(); toast(n+' finished on '+fmtn(v.them.score),'feed'); } break;
    case 'finished':
      if(v.status==='finished'&&mode==='idle'&&$('sheet').hidden&&!(CH.result&&CH.result.id===id)){ showResult(v,null); renderInbox(); refreshOpenList(); return; }
      break;
    case 'expired':
      if(CH.waiting===id){ openSheet('No answer from '+n,[el('p','note','The challenge expired. Nobody wins an expired challenge.')],[['Challenge someone',openPicker,true]]); return; }
      break;
  }
  if(CH.result&&CH.result.id===id)showResult(v,CH.result.played);
  renderInbox(); refreshOpenList();
}

board.addEventListener('pointerdown',e=>{ const b=e.target.closest('.cell'); if(!b||mode!=='play')return; if(e.button&&e.button!==0)return; e.preventDefault();
  press={i:+b.dataset.i,id:e.pointerId,moved:false,done:new Set()}; });
board.addEventListener('pointermove',e=>{ if(!press||mode!=='play'||e.pointerId!==press.id)return; const i=cellAt(e.clientX,e.clientY); if(i<0||(i===press.i&&!press.moved))return;
  if(!press.moved){ press.moved=true; round.history.push(round.cells.slice()); if(round.history.length>60)round.history.shift(); slideMark(press.i); }
  slideMark(i); });
board.addEventListener('pointerup',()=>{ const p=press; press=null; if(!p||mode!=='play')return; if(p.moved){ message(''); keep(); paint(); return; } act(p.i); });
board.addEventListener('pointercancel',()=>{ const p=press; press=null; if(p&&p.moved){ keep(); paint(); } });
board.addEventListener('contextmenu',e=>e.preventDefault());
board.addEventListener('click',e=>{ if(e.detail!==0)return; const b=e.target.closest('.cell'); if(b)act(+b.dataset.i,true); });
board.addEventListener('keydown',e=>{ if(mode!=='play')return; const t=e.target.closest('.cell'); if(!t)return; const i=+t.dataset.i, n=pz().n; let j=i;
  if(e.key==='ArrowRight')j=Math.min(n-1,i%n+1)+Math.floor(i/n)*n; else if(e.key==='ArrowLeft')j=Math.max(0,i%n-1)+Math.floor(i/n)*n;
  else if(e.key==='ArrowUp')j=Math.max(i%n,i-n); else if(e.key==='ArrowDown')j=Math.min((n-1)*n+i%n,i+n);
  else return;
  e.preventDefault(); focusIndex=j; t.tabIndex=-1; board.children[j].tabIndex=0; board.children[j].focus(); });
$('undo').onclick=undo; $('hint').onclick=hint; $('giveup').onclick=giveUp;
$('snd').onclick=()=>{ save.sound=!save.sound; store(); sndLabel(); if(save.sound){ audioChecked=false; unlockAudio(); sfx.go(); } };
$('help').onclick=()=>{ sfx.ui(); showHowTo(null); };
$('howok').onclick=()=>{ sfx.ui(); save.seenHowTo=true; store(); const then=howThen; hideHowTo(); if(then)then(); };
$('sheet').addEventListener('click',e=>{ if(e.target===e.currentTarget)sheetOutside(); });
$('sx').addEventListener('click',e=>{ e.stopPropagation(); sheetX(); });
document.addEventListener('keydown',e=>{ if(e.key!=='Escape')return;
  if(!$('howto').hidden){ if(!howThen)$('howok').click(); return; }
  if(!$('sheet').hidden&&mode!=='over')sheetOutside(); });
['gesturestart','gesturechange'].forEach(ev=>document.addEventListener(ev,e=>e.preventDefault(),{passive:false}));
addEventListener('sowaka-ready',()=>{ document.documentElement.classList.add('app'); if(loadSave()){ sndLabel(); if(mode==='idle')menu(); } refreshBoard(); challengesReady(); });
menu();
refreshBoard();
challengesReady();
</script>
</body>
</html>
