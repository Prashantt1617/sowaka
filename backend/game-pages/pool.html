<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sowaka Pool</title>
<!--POOL-TICKET-->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="icon" href="data:,">
<script>if(window.SowakaShare||window.Sowaka)document.documentElement.classList.add('app')</script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@600;800&family=Figtree:wght@400;600;700&display=swap">
<style>
/* Sowaka Pool: a dark, felt-and-brass table. Layout: the table fills the screen between a slim header, the two player cards
   and a control strip; the power bar rides the right edge, the spin control the left. One look only (an arcade screen).
   The live rooms (play a colleague) add a pane over the table for the lobby and the waiting room, in the same look. */
:root{color-scheme:dark;
  --bg:#0b1612;--panel:#132a20;--panel2:#1a3528;--line:rgba(255,255,255,.1);
  --felt:#1f7a52;--felt2:#145c3c;--rail:#4a2714;--rail2:#2d170b;--brass:#e5b850;--brass2:#b8893a;
  --ink:#f3efe4;--muted:#a8b9ae;--red:#d64b3b;--blue:#3f8bff;--ok:#5bd18a;
  --display:'Sora',system-ui,sans-serif;--body:'Figtree',system-ui,sans-serif;
  --padt:max(12px,env(safe-area-inset-top,0px));--padb:env(safe-area-inset-bottom,0px)}
html.app{--padt:10px}
html.hop body{visibility:hidden}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font:15px/1.35 var(--body);overflow:hidden;overscroll-behavior:none;touch-action:none;-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:disabled{opacity:.5;cursor:default}
input{-webkit-user-select:text;user-select:text}
#app{height:100%;display:flex;flex-direction:column;padding:var(--padt) max(10px,env(safe-area-inset-right,0px)) calc(8px + var(--padb)) max(10px,env(safe-area-inset-left,0px))}
.top{display:flex;align-items:center;gap:8px;height:40px;flex:none}
.top h1{margin:0;font:800 15px/1 var(--display);letter-spacing:.04em;background:var(--brass);color:#2a1a02;padding:7px 10px;border-radius:9px;transform:rotate(-2deg)}
.chip{width:34px;height:34px;border-radius:50%;background:var(--panel);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;flex:none}
.spacer{flex:1}
/* the GAMES logo as on the Games tab */
.swg-slot{flex:1 1 0;min-width:0;align-self:stretch;display:flex;align-items:center;justify-content:flex-end;padding:0 2px;overflow:hidden;container-type:inline-size}
.swg{--swg-h:22px;--u:calc(var(--swg-h) / 28.577);display:flex;align-items:center;flex:none;pointer-events:none}
@supports (width:1cqw){.swg-slot .swg{--swg-h:clamp(16px,calc(100cqw / 5),24px)}}
@container (max-width:79px){.swg{display:none}}
.swg-logo{height:calc(28*var(--u));padding:0 calc(10*var(--u)) 0 calc(6*var(--u));border-radius:calc(8*var(--u));background:#B23500;display:flex;align-items:center;color:#fff;font:800 calc(13*var(--u))/1 var(--display);letter-spacing:.02em}
.swg-box{width:calc(70.214*var(--u));height:calc(28.577*var(--u));margin-left:calc(-8*var(--u));display:flex;align-items:center;justify-content:center;flex:none}
.swg-games{height:calc(25*var(--u));padding:0 calc(10*var(--u));border-radius:calc(7*var(--u));background:#FFCC2E;box-shadow:0 calc(2*var(--u)) 0 #160D2C;transform:rotate(-3deg);display:flex;align-items:center;font:800 calc(13*var(--u))/1 var(--display);color:#160D2C;white-space:nowrap}
/* play area */
#stage{position:relative;flex:1;min-height:0;margin-top:6px}
canvas#table{position:absolute;inset:0;width:100%;height:100%;display:block}
.hud{position:absolute;left:0;right:0;top:0;display:flex;gap:8px;padding:0 2px;pointer-events:none}
.pcard{flex:1;min-width:0;background:rgba(10,22,16,.86);border:1px solid var(--line);border-radius:14px;padding:7px 9px;display:flex;align-items:center;gap:8px;transition:box-shadow .3s}
@media (orientation:landscape){.pcard{padding:4px 9px}.pcard .av{width:30px;height:30px}.pcard .av svg{inset:-3px;width:36px;height:36px}}
.pcard.on{box-shadow:0 0 0 2px var(--brass),0 6px 18px rgba(0,0,0,.4)}
.pcard .av{width:34px;height:34px;border-radius:50%;background:var(--panel2) center/cover no-repeat;display:flex;align-items:center;justify-content:center;font:800 13px var(--display);position:relative;flex:none}
.pcard .av svg{position:absolute;inset:-4px;width:42px;height:42px;transform:rotate(-90deg)}
.pcard.away .av{opacity:.5}
.pcard .who{min-width:0;flex:1}
.pcard .nm{font-weight:700;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pcard .grp{display:flex;gap:3px;margin-top:4px;min-height:12px;flex-wrap:wrap}
.pcard .grp i{width:11px;height:11px;border-radius:50%;display:block;border:1px solid rgba(0,0,0,.4)}
.pcard .grp i.s{background:linear-gradient(#fff 0 25%,var(--c) 25% 75%,#fff 75%)}
.pcard .grp i.done{opacity:.2}
.pcard .lbl{font-size:10.5px;color:var(--muted);margin-top:3px}
.msg{position:absolute;left:50%;top:84px;transform:translateX(-50%);background:rgba(229,184,80,.96);color:#2a1a02;font-weight:800;font-size:13px;padding:7px 14px;border-radius:999px;box-shadow:0 6px 18px rgba(0,0,0,.4);pointer-events:none;max-width:84%;text-align:center;opacity:0;transition:opacity .2s;z-index:5}
.msg.show{opacity:1}
.msg.bad{background:#f0d7d2;color:#5a1409}
/* feed lines from a live table ("Priya potted the 3") */
.toasts{position:absolute;left:50%;bottom:calc(70px + var(--padb));transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;z-index:28;width:max-content;max-width:72%}
.toast{background:rgba(10,18,14,.95);border:1px solid var(--line);padding:8px 13px;border-radius:12px;font-size:13px;box-shadow:0 8px 30px rgba(0,0,0,.4);transition:opacity .25s;max-width:100%;text-align:center}
/* power bar, right edge */
.power{position:absolute;right:2px;top:50%;transform:translateY(-50%);width:40px;height:min(58%,340px);border-radius:999px;background:rgba(10,22,16,.86);border:1px solid var(--line);padding:5px;touch-action:none}
.power .track{position:relative;height:100%;border-radius:999px;background:linear-gradient(180deg,#fff 0%,#f1cf5c 40%,#e86a43 72%,#c62f2b 100%);opacity:.22}
.power .fill{position:absolute;left:5px;right:5px;top:5px;border-radius:999px;background:linear-gradient(180deg,#fff 0%,#f1cf5c 40%,#e86a43 72%,#c62f2b 100%);height:0;transition:none}
.power .knob{position:absolute;left:3px;right:3px;height:30px;border-radius:999px;background:var(--brass);box-shadow:0 2px 8px rgba(0,0,0,.5);top:5px;display:flex;align-items:center;justify-content:center;font:800 10px var(--display);color:#2a1a02;letter-spacing:.06em}
.power.armed .knob{background:#fff}
.power .hint{position:absolute;left:50%;bottom:-20px;transform:translateX(-50%);font-size:10px;color:var(--muted);white-space:nowrap}
/* spin control, left edge */
.spin{position:absolute;left:4px;bottom:12px;width:58px;height:58px;border-radius:50%;background:radial-gradient(circle at 38% 34%,#fff 0 55%,#cfcfcf 56% 100%);box-shadow:inset 0 -4px 10px rgba(0,0,0,.25),0 6px 16px rgba(0,0,0,.45);border:2px solid rgba(229,184,80,.7);touch-action:none}
.spin .dot{position:absolute;width:12px;height:12px;border-radius:50%;background:var(--red);border:2px solid #fff;left:50%;top:50%;transform:translate(-50%,-50%);pointer-events:none}
.spin .cap{position:absolute;left:50%;bottom:-18px;transform:translateX(-50%);font-size:10px;color:var(--muted);white-space:nowrap}
.fine{position:absolute;left:70px;bottom:18px;display:flex;gap:6px}
.fine button{width:38px;height:38px;border-radius:50%;background:rgba(10,22,16,.86);border:1px solid var(--line);font-size:16px;font-weight:800}
.clock{position:absolute;right:52px;bottom:16px;font:800 13px var(--display);color:var(--muted);background:rgba(10,22,16,.86);border:1px solid var(--line);border-radius:999px;padding:6px 10px}
.clock.low{color:#ffb4a8}
.wait{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);font-size:12px;color:var(--muted);background:rgba(10,22,16,.86);border:1px solid var(--line);border-radius:999px;padding:6px 12px;white-space:nowrap;max-width:60%;overflow:hidden;text-overflow:ellipsis;pointer-events:none}
/* sheets and menu */
.sheet{position:absolute;inset:0;background:rgba(5,12,9,.78);display:flex;align-items:flex-end;justify-content:center;z-index:30}
.sheet .box{width:100%;max-width:520px;background:var(--panel);border:1px solid var(--line);border-radius:22px 22px 0 0;padding:16px 16px calc(16px + var(--padb));max-height:88%;overflow:auto;touch-action:pan-y}
.sheet h2{margin:0 0 6px;font:800 20px/1.1 var(--display)}
.sheet p{margin:6px 0 12px;color:var(--muted);font-size:13.5px}
.sheet input.q{width:100%;min-height:44px;border-radius:12px;border:1px solid var(--line);background:rgba(0,0,0,.25);color:var(--ink);font:600 15px var(--body);padding:0 12px;outline:none;margin-bottom:8px}
.sheet input.q:focus{border-color:var(--brass)}
.sheet .list{max-height:42vh;overflow:auto;touch-action:pan-y}
.btn{display:flex;align-items:center;justify-content:center;min-height:48px;border-radius:14px;font-weight:800;font-size:15px;background:var(--panel2);border:1px solid var(--line);width:100%}
.btn.primary{background:var(--brass);color:#2a1a02;border-color:transparent}
.btn+.btn{margin-top:8px}
.seg{display:flex;gap:4px;background:rgba(0,0,0,.25);padding:4px;border-radius:12px;margin:8px 0 12px}
.seg button{flex:1;min-height:38px;border-radius:9px;font-weight:800;font-size:13px;color:var(--muted)}
.seg button.on{background:var(--ink);color:#0b1612}
.menu{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end;padding:14px;background:linear-gradient(180deg,rgba(11,22,18,0) 0%,rgba(11,22,18,.92) 42%);z-index:20;overflow:auto;touch-action:pan-y}
.menu .card{background:rgba(19,42,32,.96);border:1px solid var(--line);border-radius:20px;padding:16px;width:100%;max-width:520px;margin:0 auto;flex:none}
.menu .best{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.menu .best b{font:800 26px/1 var(--display)}
.menu .best span{display:block;font-size:12px;color:var(--muted)}
.menu .title{font:800 30px/1 var(--display);letter-spacing:-.01em;margin:0 0 4px}
.menu .sub{color:var(--muted);font-size:13px;margin:0 0 12px}
@media (max-height:460px){.menu{padding:8px}.menu .card{padding:10px 12px}.menu .title{font-size:22px}.menu .sub{margin-bottom:8px}.menu .best{margin-bottom:6px}.menu .best b{font-size:20px}.btn{min-height:40px;font-size:14px}.btn+.btn{margin-top:6px}.seg{margin:6px 0 8px}.seg button{min-height:32px}}
.result .score{font:800 44px/1 var(--display);margin:4px 0}
.stars{font-size:22px;letter-spacing:4px;margin-bottom:6px}
.board{list-style:none;margin:0;padding:0}
.board li{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.board li.me{color:var(--brass)}
.board li b{width:28px;color:var(--muted);font-weight:700}
.board li span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.howto ol{padding-left:18px;margin:0 0 12px;color:var(--ink);font-size:14px}
.howto li{margin:6px 0}
/* the live rooms: a pane over the table for the lobby and the waiting room */
.pane{position:absolute;inset:0;z-index:25;background:rgba(11,22,18,.97);overflow-y:auto;-webkit-overflow-scrolling:touch;padding:4px 2px calc(14px + var(--padb));touch-action:pan-y}
.pane .inner{max-width:560px;margin:0 auto}
.ptop{display:flex;align-items:center;gap:10px;margin:4px 0 12px}
.ptop .ttl{flex:1;min-width:0}
.ptop .ttl b{display:block;font:800 18px/1.1 var(--display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ptop .ttl span{display:block;font-size:12px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{font-size:11px;font-weight:800;padding:5px 9px;border-radius:999px;background:var(--panel2);border:1px solid var(--line);color:var(--muted);white-space:nowrap;flex:none}
.pill.on{background:rgba(91,209,138,.18);color:var(--ok);border-color:rgba(91,209,138,.4)}
.pill.off{background:rgba(214,75,59,.18);color:#ffb4a8;border-color:rgba(214,75,59,.4)}
.card2{background:rgba(19,42,32,.96);border:1px solid var(--line);border-radius:20px;padding:14px;margin-bottom:12px}
.card2 h3{margin:0 0 8px;font:800 15px var(--display)}
.card2 p{margin:4px 0 10px;color:var(--muted);font-size:13px}
.card2 p:last-child{margin-bottom:0}
.row2{display:flex;gap:8px}
.row2 .btn{flex:1;margin:0;min-width:0}
.codebox{display:flex;gap:8px;margin-top:10px}
.codebox input{flex:1;min-width:0;min-height:46px;border-radius:12px;border:1px solid var(--line);background:rgba(0,0,0,.25);color:var(--ink);font:700 16px var(--body);padding:0 12px;letter-spacing:.08em;outline:none}
.codebox input:focus{border-color:var(--brass)}
.codebox .btn{width:auto;padding:0 18px;margin:0;flex:none}
.rowi{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.rowi:last-child{border-bottom:0}
.rowi .who{flex:1;min-width:0}
.rowi .who b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rowi .who span{display:block;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rowi .btn{width:auto;min-height:38px;padding:0 14px;font-size:13px;margin:0;flex:none}
.face{width:38px;height:38px;border-radius:50%;background:var(--panel2) center/cover no-repeat;display:flex;align-items:center;justify-content:center;font:800 13px var(--display);color:#dfeee5;flex:none;border:1px solid var(--line)}
.face.lg{width:64px;height:64px;font-size:20px}
.face.off{opacity:.45}
.stack{display:flex;flex:none}
.stack .face{margin-left:-8px;box-shadow:0 0 0 2px var(--panel)}
.stack .face:first-child{margin-left:0}
.bigcode{font:800 46px/1 var(--display);letter-spacing:.12em;text-align:center;margin:6px 0 4px;color:var(--brass)}
.seats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.seat{background:rgba(0,0,0,.25);border:1px solid var(--line);border-radius:16px;padding:14px 10px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;min-height:132px;justify-content:center;min-width:0}
.seat b{font-size:14px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.seat span{font-size:12px;color:var(--muted)}
.seat.empty{border-style:dashed}
.invite{display:flex;align-items:center;gap:10px;background:rgba(229,184,80,.12);border:1px solid rgba(229,184,80,.4);border-radius:16px;padding:10px 12px;margin-bottom:10px}
.invite .who{flex:1;min-width:0}
.invite .who b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.invite .who span{display:block;font-size:12px;color:var(--muted)}
.invite .btn{width:auto;min-height:38px;padding:0 14px;font-size:13px;margin:0;flex:none}
.empty{color:var(--muted);font-size:13px;text-align:center;padding:12px 0}
.linkbtn{display:block;margin:10px auto 0;color:var(--brass);font-weight:700;font-size:13px}
.hint{font-size:12px;color:var(--muted);text-align:center;margin-top:6px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<main id="app">
  <header class="top">
    <button class="chip" id="leaveBtn" aria-label="Leave the table" hidden>‹</button>
    <h1>SOWAKA POOL</h1>
    <div class="swg-slot"><span class="swg" role="img" aria-label="Sowaka Games"><span class="swg-logo">sowaka</span><span class="swg-box"><span class="swg-games">GAMES</span></span></span></div>
    <button class="chip" id="howtoBtn" aria-label="How to play">?</button>
    <button class="chip" id="soundBtn" aria-label="Sound">🔊</button>
  </header>
  <section id="stage">
    <canvas id="table"></canvas>
    <div class="hud" id="hud"></div>
    <div class="msg" id="msg"></div>
    <div class="power" id="power" hidden><div class="track"></div><div class="fill" id="pfill"></div><div class="knob" id="pknob">PULL</div><div class="hint">pull · release</div></div>
    <div class="spin" id="spin" hidden><div class="dot" id="spindot"></div><div class="cap">spin</div></div>
    <div class="fine" id="fine" hidden><button id="fineL" aria-label="Aim a little left">‹</button><button id="fineR" aria-label="Aim a little right">›</button></div>
    <div class="clock" id="clock" hidden>30</div>
    <div class="wait" id="wait" hidden></div>
    <div class="toasts" id="toasts"></div>
    <div class="menu" id="menu"></div>
    <div class="pane" id="pane" hidden></div>
    <div id="sheetHost"></div>
  </section>
</main>

function enterOnline(room){ Object.assign(G,{online:true,hotseat:false,practice:false,mode:'play',result:null,fouls:[0,0],started:Date.now(),shotAnim:null,motion:null,shooting:false,replaying:false,aim:0,power:0,spin:{top:0,side:0},calledPocket:null,lastFoul:null});

/* ---------- a colleague's shot, replayed ---------- */
function startReplay(ls){ const cue=G.balls.find(b=>b.n===0); if(!cue)return finishReplay();
  if(ls.from&&Number.isFinite(+ls.from.x)){ cue.x=+ls.from.x; cue.y=+ls.from.y; } cue.on=true; cue.sink=0; cue.vx=0; cue.vy=0;

  const shot={aim:+ls.aim||0,power:+ls.power||0,spin:{top:ls.spin?+ls.spin.top||0:0,side:ls.spin?+ls.spin.side||0:0}};
  const snap=(ls.balls||[]).map(b=>({n:b.n,x:+b.x,y:+b.y,on:b.on!==false}));
  const who=G.players[ls.by|0]?G.players[ls.by|0].name:'They';
  swingTo(shot.aim,()=>{ if(!G.online||!G.replaying)return finishReplay();

  left:(win,o)=>win?`${o} left the table`:'You left the table',away:(win,o)=>win?`${o} went offline`:'You were offline too long'};
function onlineResult(){ const r=LIVE.room; if(!r||r.status!=='over'||!r.result)return; const me=G.me, win=r.result.winner===me, opp=G.players[1-me]||{name:'Your colleague'}, gone=r.players.length<2;
  const why=REASON[r.result.reason]?REASON[r.result.reason](win,opp.name):String(r.result.reason||'');
  const pts=G.potted[me]*100+(win?1000:0);
  sheet(`<div class="result"><h2>${win?'You win!':`${esc(opp.name)} wins`}</h2><div class="stars">${win?'★★★':'☆☆☆'}</div><div class="score">${pts}</div><p>${esc(why)}.${r.wins?` Games at this table ${r.wins[me]|0} – ${r.wins[1-me]|0}.`:''}</p>
    <button class="btn primary" data-act="rematch" ${gone||LIVE.againSent||LIVE.offline?'disabled':''}>${gone?`${esc(opp.name)} left`:LIVE.againSent?`Waiting for ${esc(opp.name)}…`:'Rematch'}</button><button class="btn" data-act="leave">Leave the table</button></div>`,{stay:true}); }

async function joinRoom(code){ const c=String(code||'').trim(); if(!/^[1-9]\d{3}$/.test(c)){ show('A table code is four digits',true); return; }
  await act(async()=>{ const r=await LIVE.api.join(c); LIVE.codeInput=''; const v=roomOf(r); if(v)onRoomState(v); }); }

function startCode(){ const S=window.Sowaka||{}; const m=/^(?:room:)?([1-9]\d{3})$/i.exec(String(S.startRoomCode||S.startChallengeId||'').trim()); return m?m[1]:null; }

  try{ const h=await api.hello(); LIVE.rooms=Array.isArray(h.rooms)?h.rooms:[]; LIVE.invites=Array.isArray(h.invites)?h.invites.map(i=>({code:String(i.code),from:i.from||{},players:i.players,expiresAt:i.expiresAt||null})):[];
    const room=roomOf(h.room), code=startCode();
    if(room)onRoomState(room); else if(code)await joinRoom(code); else if(screen==='menu')menu(); }

function skinsSheet(){ const row=(kind,label)=>`<p style="margin:10px 0 6px;color:var(--ink);font-weight:700">${label}</p><div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px">${Object.entries(SKINS[kind]).map(([k,v])=>{ const locked=G.wins<v.need, on=G.skin[kind]===k; const sw=kind==='felt'?`background:linear-gradient(135deg,${v.a},${v.b})`:`background:linear-gradient(90deg,${v.tip} 0 18%,${v.shaft} 18% 55%,${v.butt} 55%)`;
    return `<button data-skin="${kind}:${k}" ${locked?'disabled':''} style="border-radius:12px;padding:8px;background:var(--panel2);border:2px solid ${on?'var(--brass)':'var(--line)'};opacity:${locked?.45:1}"><div style="height:34px;border-radius:8px;${sw}"></div><div style="font-size:12px;font-weight:700;margin-top:6px">${v.name}</div><div style="font-size:10.5px;color:var(--muted)">${locked?`${v.need} win${v.need===1?'':'s'}`:on?'In use':'Tap to use'}</div></button>`; }).join('')}</div>`;
  sheet(`<h2>Skins</h2><p>Win games against the house to unlock more. ${G.wins} win${G.wins===1?'':'s'} so far.</p>${row('felt','Table')}${row('cue','Cue')}<button class="btn" data-act="close" style="margin-top:14px">Done</button>`); }
function showResult(){ const r=G.result; if(!r||G.online)return; const stars=r.win?(G.score>=1500?'★★★':G.score>=1100?'★★☆':'★☆☆'):'☆☆☆'; sheet(`<div class="result"><h2>${G.hotseat?`${G.players[r.winner].name} wins!`:r.win?(G.practice?'Table cleared!':'You win!'):`${G.players[1].name} wins`}</h2><div class="stars">${stars}</div><div class="score">${G.hotseat?`${G.potted[0]} – ${G.potted[1]}`:G.score}</div><p>${G.hotseat?'balls potted':G.potted[0]+' potted'} · ${G.fouls[0]} foul${G.fouls[0]===1?'':'s'}${r.win?' · win bonus':''}</p><button class="btn primary" data-act="again">Play again</button><button class="btn" data-act="menu">Menu</button></div>`); }
/* A sheet over the table. stay: no closing by a tap outside; keep: the sheet is redrawn in place (the invite list while typing). */
function sheet(html,o){ o=o||{}; const host=$('#sheetHost'); const open=host.querySelector('.sheet .box');
  if(o.keep&&open){ open.innerHTML=html; return; }
  host.innerHTML=`<div class="sheet" ${o.stay?'':'data-act="close"'}><div class="box">${html}</div></div>`; }
function howto(){ sheet(`<div class="howto"><h2>How to play</h2><ol><li><b>Aim:</b> drag anywhere on the table to turn the cue. Drag far from the cue ball for fine control, or use ‹ ›.</li><li><b>Shoot:</b> pull the power bar down and let go. Further is harder.</li><li><b>Spin:</b> tap or drag on the small cue ball: top for follow, bottom for draw, sides for side spin. Double-tap to clear.</li><li><b>8-ball rules:</b> the first ball you pot after the break gives you solids or stripes. Pot all of yours, then call a pocket by tapping it and sink the 8. Scratch, hitting the wrong ball first, or nothing reaching a cushion is a foul: your opponent gets ball in hand (drag the cue ball). Sink the 8 early or in the wrong pocket and you lose.</li><li><b>Colleagues:</b> Play a colleague opens a live table: invite someone, share the 4-digit code, or take a Quick game. 30 seconds a shot.</li><li><b>Score:</b> 100 a ball, a win bonus, faster is better, fouls cost 50.</li></ol><button class="btn primary" data-act="close">Got it</button></div>`); }

  else { const l=load('local',[]); sheet(`<h2>Your best on this device</h2><ol class="board">${l.map((e,i)=>`<li><b>#${i+1}</b><span>${new Date(e.at).toLocaleDateString()}</span><b style="width:auto;color:inherit">${e.score}</b></li>`).join('')||'<li>No games yet</li>'}</ol><button class="btn" data-act="close" style="margin-top:12px">Close</button>`); } }
document.addEventListener('click',e=>{ const b=e.target.closest('[data-act],[data-diff],[data-skin],[data-join],[data-inv],[data-open]'); if(!b)return; if(b.classList.contains('sheet')&&e.target!==b)return;
  if(b.dataset.skin){ const [kind,k]=b.dataset.skin.split(':'); if(G.wins<SKINS[kind][k].need)return; G.skin[kind]=k; save('skin',G.skin); SFX.tick(); buzz('light'); skinsSheet(); return; }
  if(b.dataset.diff){ G.diff=b.dataset.diff; save('diff',G.diff); menu(); SFX.tick(); return; }
  if(b.dataset.open!=null){ LIVE.hostOpen=b.dataset.open==='1'; renderLobby(); SFX.tick(); return; }

  if(b.dataset.inv){ const id=b.dataset.inv; buzz('light'); act(async()=>{ await LIVE.api.invite(id); if(LIVE.picker){ LIVE.picker.sent.push(id); pickerSheet(); } show('Invite sent'); }); return; }
  const act_=b.dataset.act; buzz('light');
  switch(act_){
    case 'play': $('#menu').hidden=true; $('#sheetHost').innerHTML=''; newGame({diff:G.diff}); break;
    case 'practice': $('#menu').hidden=true; $('#sheetHost').innerHTML=''; newGame({practice:true}); break;
    case 'hotseat': $('#menu').hidden=true; $('#sheetHost').innerHTML=''; newGame({hotseat:true}); break;
    case 'skins': skinsSheet(); break;
    case 'again': $('#sheetHost').innerHTML=''; newGame({diff:G.diff,practice:G.practice,hotseat:G.hotseat}); break;
    case 'menu': $('#sheetHost').innerHTML=''; menu(); break;
    case 'board': boardSheet(); break;
    case 'close': $('#sheetHost').innerHTML=''; break;
    case 'colleague': openLobby(); break;
    case 'back': clearTimeout(LIVE.helloT); menu(); break;
    case 'quick': act(async()=>{ const v=roomOf(await LIVE.api.quick()); if(v)onRoomState(v); }); break;
    case 'host': act(async()=>{ const v=roomOf(await LIVE.api.host(LIVE.hostOpen)); if(v)onRoomState(v); }); break;
    case 'code': joinRoom(LIVE.codeInput||($('#code')||{}).value); break;
    case 'invite': openPicker(); break;
    case 'pickclose': LIVE.picker=null; $('#sheetHost').innerHTML=''; break;
    case 'start': act(async()=>{ const v=roomOf(await LIVE.api.start()); if(v)onRoomState(v); }); break;
    case 'rematch': LIVE.againSent=true; onlineResult(); act(async()=>{ try{ const v=roomOf(await LIVE.api.again()); if(v)onRoomState(v); }catch(err){ LIVE.againSent=false; onlineResult(); throw err; } }); break;
    case 'leave': if(LIVE.room&&LIVE.room.status==='playing'&&G.online){ leaveAskSheet(); break; } leaveRoom(); break;
    case 'leave-now': leaveRoom(); break;
    case 'fatal-ok': $('#sheetHost').innerHTML=''; LIVE.room=null; LIVE.api=null; LIVE.on=false; menu(); break; } });

/* ============================== the demo (a browser preview with no server) ==============================
   ?demo=lobby | waiting | online | result: a stand-in for the Sowaka server behind the same window.Sowaka.room API, so every live
   screen can be checked with nobody else around. The colleague across the table shoots with the house's shot choice. */
function demoFace(i){ const bg=['#3d5a80','#7a4a6e','#4a7a5e','#8a5a2b','#2f5f6f','#6b4f9a','#9a4f4f','#3f6b3f'][i%8], skin=['#f1c7a3','#d9a47a','#b97a52','#8d5a3b','#e8b896'][i%5], hair=['#2b1d14','#4a2e1a','#111','#6b3e1f','#1f1f1f'][(i*3)%5];
  const svg=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80"><rect width="80" height="80" fill="${bg}"/><ellipse cx="40" cy="78" rx="28" ry="20" fill="${['#e0e0e0','#2d3e50','#c9962b','#5a7d9a','#a33'][i%5]}"/><rect x="34" y="50" width="12" height="12" fill="${skin}"/><circle cx="40" cy="36" r="17" fill="${skin}"/><path d="M23 34c0-12 8-19 17-19s17 7 17 19c-3-6-9-9-17-9s-14 3-17 9z" fill="${hair}"/><circle cx="34" cy="38" r="1.8" fill="#222"/><circle cx="46" cy="38" r="1.8" fill="#222"/><path d="M35 45q5 4 10 0" stroke="#7a3b2a" stroke-width="1.6" fill="none" stroke-linecap="round"/></svg>`;
  return 'data:image/svg+xml;utf8,'+encodeURIComponent(svg); }
function demoLive(mode){
  const people=['Tanvi Shah','Priya Sharma','Rahul Mehta','Arjun Deshpande','Meera Iyer','Kabir Rao','Tanya Bhatia','Ishaan Kapoor','Nikhil Verma','Pooja Nair'];
  const who=i=>({userId:'u'+i,name:people[i],photoUrl:demoFace(i)});
  const ME=who(0), OTHER=who(1);
  const D={room:null,seq:0,timer:null,rules:null};
  const strip=b=>({n:b.n,x:b.x,y:b.y,on:b.on!==false});
  const view=()=>D.room?JSON.parse(JSON.stringify(Object.assign({},D.room,{serverNow:Date.now()}))):null;
  const push=ms=>setTimeout(()=>{ if(window.onSowakaRoom)window.onSowakaRoom({type:'state',room:view()}); },ms||40);
  const feed=(item,ms)=>setTimeout(()=>{ if(window.onSowakaRoom)window.onSowakaRoom({type:'feed',item}); },ms||60);
  const player=p=>Object.assign({},p,{online:true,group:null,pottedCount:0});
  const mk=(code,open,host)=>({code,status:'lobby',you:ME.userId,hostId:(host||ME).userId,open:open!==false,players:[player(host||ME)],invited:[],turn:0,balls:[],inHand:false,kitchen:false,open8:true,breakShot:true,onEight:false,calledPocket:null,shotClock:null,replayUntil:0,lastShot:null,message:null,result:null,gameNo:0,wins:[0,0]});
  function start(r,breaker){ r.status='playing'; r.gameNo++; r.turn=breaker|0; r.balls=E.rack().map(strip); r.inHand=true; r.kitchen=true; r.breakShot=true; r.open8=true; r.calledPocket=null; r.onEight=false; r.lastShot=null; r.message=null; r.result=null;
    r.players.forEach(p=>{ p.group=null; p.pottedCount=0; }); D.rules={groups:[null,null]}; r.replayUntil=Date.now(); r.shotClock={endsAt:Date.now()+30000}; push(); if(r.turn===1)opponent(r); }
  function finish(r,winner,reason){ r.status='over'; r.result={winner,reason}; r.wins[winner]++; r.shotClock=null; r.turn=winner; }
  function shot(r,s,by){ const st={balls:r.balls.map(b=>Object.assign({vx:0,vy:0},b)),turn:by,groups:D.rules.groups,open:r.open8,inHand:r.inHand,kitchen:r.kitchen,breakShot:r.breakShot,calledPocket:r.calledPocket};
    const cue=r.balls.find(b=>b.n===0); const from={x:cue.x,y:cue.y}; const res=E.simulateShot(st.balls,s); const out=E.resolve(st,res.balls,res.events); const at=Date.now();
    r.lastShot={seq:++D.seq,by,aim:s.aim,power:s.power,spin:s.spin,from,events:res.events,balls:res.balls.map(strip),steps:res.steps,at};
    r.balls=out.next.balls.map(strip); r.turn=out.next.turn; D.rules.groups=out.next.groups; r.open8=out.next.open; r.inHand=out.next.inHand; r.kitchen=out.next.kitchen; r.breakShot=false; r.calledPocket=null;
    r.players.forEach((p,i)=>{ p.group=out.next.groups[i]; }); r.players[by].pottedCount+=out.potted.filter(n=>out.next.groups[by]==null||groupOf(n)===out.next.groups[by]).length;
    r.onEight=E.onEight(out.next,r.turn); r.message=out.message; r.replayUntil=at+Math.min(20000,res.steps/240*1000+300);
    const name=r.players[by].name;
    if(out.foul)feed({kind:'foul',userId:r.players[by].userId,name,text:`${first(name)}: ${out.foul}`},res.steps/240*1000+400);
    if(out.winner!=null)finish(r,out.winner,out.foul?'foul':'eight'); else r.shotClock={endsAt:r.replayUntil+30000};
    push(); if(r.status==='playing'&&r.turn===1)opponent(r); }
  function opponent(r){ clearTimeout(D.timer); const wait=Math.max(0,r.replayUntil-Date.now())+1800;
    D.timer=setTimeout(()=>{ if(D.room!==r||r.status!=='playing'||r.turn!==1)return;
      const plan=planShot({balls:r.balls,turn:1,groups:D.rules.groups,open:r.open8,breakShot:r.breakShot,kitchen:r.kitchen,inHand:r.inHand,diff:'medium'});
      if(plan.place){ const cue=r.balls.find(b=>b.n===0); cue.x=plan.place.x; cue.y=plan.place.y; cue.on=true; push(); }
      if(plan.called!=null){ r.calledPocket=plan.called; push(); }
      setTimeout(()=>{ if(D.room===r&&r.status==='playing'&&r.turn===1)shot(r,{aim:plan.aim,power:plan.power,spin:{top:0,side:0}},1); },700); },wait); }
  const refuse=(status,message)=>Object.assign(new Error(message),{status});
  const delay=v=>new Promise(res=>setTimeout(()=>res(v),120));
  const api={
    hello:()=>delay({room:view(),rooms:D.rooms,invites:D.invites}),
    host:open=>{ D.room=mk('4821',open); return delay(view()); },
    quick:()=>{ D.room=mk('7350',true,OTHER); D.room.players.push(player(ME)); setTimeout(()=>{ if(D.room&&D.room.code==='7350'&&D.room.status==='lobby')start(D.room,0); },1800); return delay(view()); },
    join:code=>{ const r=D.rooms.find(x=>x.code===code)||D.invites.find(x=>x.code===code); if(!r)return Promise.reject(refuse(404,'No table has that code at your company.')); if(r.players&&r.players.length>=2)return Promise.reject(refuse(409,'That table has two players already.'));
      const host=(r.host&&who(people.indexOf(r.host.name)))||(r.from&&who(people.indexOf(r.from.name)))||OTHER; D.room=mk(code,true,host); D.room.players.push(player(ME)); D.invites=D.invites.filter(i=>i.code!==code);
      setTimeout(()=>{ if(D.room&&D.room.code===code&&D.room.status==='lobby')start(D.room,0); },2200); return delay(view()); },
    leave:()=>{ clearTimeout(D.timer); D.room=null; return delay({}); },
    invite:userId=>{ const r=D.room; if(!r)return Promise.reject(refuse(404,'You are not at a table.')); const p=D.everyone.find(x=>x.userId===userId); if(p){ r.invited.push({userId:p.userId,name:p.name,photoUrl:p.photoUrl}); push();
        setTimeout(()=>{ if(D.room!==r||r.players.length>=2)return; r.players.push(player(p)); r.invited=r.invited.filter(i=>i.userId!==p.userId); push(); feed({kind:'join',userId:p.userId,name:p.name}); },2500); } return delay({invited:true}); },
    start:()=>{ const r=D.room; if(!r)return Promise.reject(refuse(404,'You are not at a table.')); if(r.hostId!==ME.userId)return Promise.reject(refuse(403,'Only the host starts the game.')); if(r.players.length<2)return Promise.reject(refuse(409,'The table needs two players.')); start(r,0); return delay(view()); },
    again:()=>{ const r=D.room; if(!r||r.status!=='over')return Promise.reject(refuse(409,'The game is still on.')); if(r.players.length<2){ r.status='lobby'; r.balls=[]; push(); } else start(r,1-r.result.winner); return delay(view()); },
    place:(x,y)=>{ const r=D.room; if(!r||r.status!=='playing'||r.turn!==0)return Promise.reject(refuse(409,"It isn't your turn.")); if(!r.inHand)return Promise.reject(refuse(409,'You do not have ball in hand.')); const ok=E.placementOk(r.balls.map(b=>Object.assign({vx:0,vy:0},b)),x,y,r.kitchen); if(!ok)return Promise.reject(refuse(400,'The cue ball cannot go there.')); const cue=r.balls.find(b=>b.n===0); cue.x=x; cue.y=y; cue.on=true; push(); return delay(view()); },
    call:pocket=>{ const r=D.room; if(!r||r.status!=='playing'||r.turn!==0)return Promise.reject(refuse(409,"It isn't your turn.")); if(!r.onEight)return Promise.reject(refuse(409,'You are not on the 8 yet.')); r.calledPocket=pocket; push(); return delay(view()); },
    shot:s=>{ const r=D.room; if(!r||r.status!=='playing'||r.turn!==0)return Promise.reject(refuse(409,"It isn't your turn.")); if(Date.now()<r.replayUntil)return Promise.reject(refuse(409,'The balls are still rolling.')); shot(r,{aim:+s.aim,power:+s.power,spin:{top:+s.spin.top||0,side:+s.spin.side||0}},0); return delay(view()); },
  };
  D.everyone=people.slice(2).map((n,i)=>who(i+2)).concat(Array.from({length:70},(_,i)=>({userId:'c'+i,name:`${'ABCDEFGHIJKLMNOPQRSTUVWXYZ'[i%26]}${['arun','ita','ohan','eena'][i%4]} ${['Shah','Rao','Iyer'][i%3]}`,photoUrl:demoFace(i+2)}))).sort((a,b)=>a.name.localeCompare(b.name));
  D.everyone.forEach((p,i)=>{ p.designation=['Designer','Engineer','Sales lead','HR partner'][i%4]; });
  const t=Date.now();
  D.rooms=[{code:'4821',host:{userId:'u2',name:people[2]},players:[who(2)],status:'lobby',seatFree:true,createdAt:t-120000},{code:'2196',host:{userId:'u3',name:people[3]},players:[who(3),who(4)],status:'playing',seatFree:false,createdAt:t-600000}];
  D.invites=[{code:'5904',from:who(5),players:1,createdAt:t-30000,expiresAt:t+900000}];
  window.Sowaka=Object.assign(window.Sowaka||{},{live:true,room:api,colleagues:q=>new Promise(r=>setTimeout(()=>r({colleagues:D.everyone.filter(p=>!q||p.name.toLowerCase().includes(String(q).toLowerCase())).slice(0,50)}),120))});
  if(mode==='waiting'){ D.room=mk('4821',true); if(/guest/.test(location.search)){ D.room=mk('4821',false,OTHER); D.room.players.push(player(ME)); } }
  if(mode==='online'||mode==='result'){ const r=D.room=mk('7350',true); r.players.push(player(OTHER)); start(r,0);
    // a few shots in: solids to Tanvi, three balls down, Tanvi to shoot
    const brk={aim:0.004,power:1,spin:{top:0,side:0}}; const res=E.simulateShot(E.rack(),brk); r.balls=res.balls.map(strip); r.breakShot=false; r.inHand=false; r.kitchen=false;
    for(const n of [1,2,9]){ const b=r.balls.find(x=>x.n===n); b.on=false; } const cue=r.balls.find(b=>b.n===0); cue.on=true; cue.x=0.62; cue.y=0.48;
    D.rules={groups:['solid','stripe']}; r.open8=false; r.players[0].group='solid'; r.players[1].group='stripe'; r.players[0].pottedCount=2; r.players[1].pottedCount=1; r.turn=0; r.shotClock={endsAt:Date.now()+30000}; r.replayUntil=Date.now(); r.wins=[1,0]; r.gameNo=2;
    r.lastShot={seq:(D.seq=3),by:1,aim:2.4,power:0.5,spin:{top:0,side:0},from:{x:0.7,y:0.4},events:[],balls:r.balls.map(strip),steps:600,at:Date.now()-4000};
    if(mode==='result'){ finish(r,/lose/.test(location.search)?1:0,/left/.test(location.search)?'left':/foul/.test(location.search)?'foul':'eight'); } }
  bootLive().then(()=>{ if(mode==='lobby')openLobby(); });
}

G.diff=load('diff','medium'); G.skin=Object.assign({felt:'green',cue:'classic'},load('skin',{})); G.wins=load('wins',0)||0; $('#soundBtn').textContent=soundOn?'🔊':'🔇';
layout(); spinDot(); menu();
const demoMode=!window.__POOL&&!roomApi()?new URLSearchParams(location.search).get('demo'):null;
if(demoMode)demoLive(demoMode); else { bootLive(); if(!load('seenHowTo',false)){ save('seenHowTo',true); setTimeout(howto,400); } }
requestAnimationFrame(loop);
window.__pool={G,LIVE,E,newGame,beginShot,houseTurn,planShot,rack,launch,onRoomState,applyRoom,startReplay,menu,screen:()=>screen};
})();
