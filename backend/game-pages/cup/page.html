<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!--CUP-TICKET-->
<title>O-O-O Tournament</title>
<!-- One file, uploaded to game_catalog as `diwali-cup` (build.mjs inlines cup/play.js into it). The server puts
     window.__CUP = { ticket, eventId?, from, hopTicket? } where the marker above is; every call goes to /cup/api with the ticket. -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#15122B">
<meta name="color-scheme" content="dark">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap">
<style>
:root{--bg:#15122B;--p1:#221C44;--p2:#2A2350;--p3:#2E2652;--line:#3A3270;--y:#F5B82E;--yd:#B9861A;--yl:#FFD66B;--co:#FF6B57;--cod:#B8432F;--cy:#6FD3F2;--gr:#3DDC97;--tx:#F4F1FF;--mu:#B9B2D9;--mu2:#9C95C4;--hd:'Lilita One',system-ui,sans-serif}
*{box-sizing:border-box}
html{background:var(--bg);-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;background-color:var(--bg);background-image:radial-gradient(rgba(255,255,255,.06) 1px,transparent 1px);background-size:18px 18px;color:var(--tx);font-family:'Plus Jakarta Sans',system-ui,sans-serif;font-size:15px;line-height:1.4;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{cursor:default}
:focus-visible{outline:3px solid var(--cy);outline-offset:2px}
.hd{font-family:var(--hd);font-weight:400}
.wrap{max-width:560px;margin:0 auto;padding:0 0 calc(28px + env(safe-area-inset-bottom))}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;padding:calc(16px + env(safe-area-inset-top)) 20px 8px}
.wm{font-family:var(--hd);font-size:24px;letter-spacing:.5px;color:var(--y);flex:1 1 auto;min-width:0;max-width:100%;margin:0;font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.15}
.wm.l{font-size:20px}
/* The chips go under the name when both don't fit on one line (flex-wrap measures the name at its full width). */
.tr{display:flex;align-items:center;gap:8px;flex:none}.wm.xl{font-size:17px;white-space:normal;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
@media (max-width:380px){.wm{font-size:21px}.wm.l{font-size:18px}.wm.xl{font-size:15px}.top .pill{font-size:11px;padding:5px 9px}.top .bal{font-size:13px;padding:5px 10px 5px 5px}.top .coin{width:18px;height:18px}}
.pk{flex:none;font-size:10px;font-weight:800;letter-spacing:.8px;background:var(--y);color:var(--bg);border-radius:99px;padding:3px 8px}
.pill{font-size:12px;font-weight:800;letter-spacing:1px;color:var(--bg);background:var(--cy);border-radius:99px;padding:6px 12px;white-space:nowrap}
.pill.y{background:var(--y)}.pill.co{background:var(--co)}.pill.gr{background:var(--gr)}
.bal{display:flex;align-items:center;gap:8px;background:var(--p2);border-radius:99px;padding:6px 12px 6px 6px;font-weight:800;font-size:14px;white-space:nowrap}
.coin{width:22px;height:22px;border-radius:50%;background:var(--y);border:3px solid var(--yl);box-shadow:inset 0 -2px 0 #C98A12;flex:none}
.tabs{display:grid;grid-auto-flow:column;grid-auto-columns:auto;gap:6px;background:var(--p1);border-radius:18px;padding:6px;margin:8px 20px 0;position:sticky;top:6px;z-index:5;box-shadow:0 6px 16px rgba(10,8,25,.5)}
.tab{min-height:44px;border:0;border-radius:14px;background:transparent;font-weight:800;font-size:13px;color:var(--mu);padding:0 8px;position:relative;white-space:nowrap}
.tab.on{background:var(--y);color:var(--bg)}
.tab .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--co);margin-left:5px;vertical-align:1px}
.body{display:flex;flex-direction:column;gap:14px;padding:16px 20px 8px}
.card{background:var(--p1);border-radius:22px;padding:16px;display:flex;flex-direction:column;gap:12px}
.card.gold{border:3px solid var(--y)}
.card.edge{border:3px solid var(--line)}
.card.hi{background:var(--p3);border:3px solid var(--y)}
.lbl{font-size:11px;font-weight:800;letter-spacing:1px;color:var(--mu);text-transform:uppercase;margin:0}
.row{display:flex;align-items:center;gap:10px}
.sp{flex:1;min-width:0}
.mut{color:var(--mu)}
.t13{font-size:13px}.t12{font-size:12px}
p{margin:0}
h1,h2{margin:0;font-family:var(--hd);font-weight:400;line-height:1.1}
h1{font-size:34px}h2{font-size:26px}
.count{display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center}
.count small{font-size:12px;font-weight:800;letter-spacing:1px;color:var(--mu);text-transform:uppercase}
.count b{font-family:var(--hd);font-size:56px;font-weight:400;line-height:1;color:var(--y);font-variant-numeric:tabular-nums}
.count>span:not(.crown){font-size:13px;font-weight:700;color:var(--mu)}
.btn{min-height:56px;border-radius:16px;border:0;background:var(--y);color:var(--bg);font-family:var(--hd);font-size:21px;letter-spacing:.6px;box-shadow:0 6px 0 var(--yd);width:100%;padding:8px 14px}
.btn:active:not(:disabled){transform:translateY(3px);box-shadow:0 3px 0 var(--yd)}
.btn:disabled{background:var(--line);color:var(--mu);box-shadow:none}
.btn2{min-height:48px;border-radius:16px;border:2px solid var(--line);background:var(--p2);color:var(--tx);font-weight:800;font-size:15px;width:100%;padding:8px 14px}
.btn3{min-height:48px;border-radius:16px;border:2px solid var(--y);background:transparent;color:var(--y);font-weight:800;font-size:15px;width:100%;padding:8px 14px}
.link{min-height:44px;border:0;background:none;color:var(--mu);font-weight:700;font-size:14px;text-decoration:underline;padding:0 8px;align-self:center}
.vs{display:grid;grid-template-columns:minmax(0,1fr) 40px minmax(0,1fr);align-items:center;gap:4px}
.pl{display:flex;flex-direction:column;align-items:center;gap:5px;text-align:center;min-width:0}
.pl b{font-size:15px;font-weight:800;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pl small{font-size:12px;font-weight:700;color:var(--mu)}
.av{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font-family:var(--hd);font-size:24px;color:var(--bg);border:4px solid var(--bg);box-shadow:0 0 0 3px var(--line);flex:none}
.av.s{width:40px;height:40px;font-size:15px;border-width:0;box-shadow:none}
.av.xs{width:32px;height:32px;font-size:13px;border-width:0;box-shadow:none}
.av.tbd{background:transparent;border:2px dashed #6E66A0;box-shadow:none;color:var(--mu2)}
/* A photo sits in the same round frame, the player's colour as its ring; the initials stay underneath for when it fails. */
.av{position:relative;overflow:hidden}
.av>img{position:absolute;inset:0;width:100%;height:100%;border-radius:50%;object-fit:cover;background:var(--p2)}
.av.ph{border-color:var(--bg);box-shadow:0 0 0 3px var(--rc,var(--line))}
.av.s.ph,.av.xs.ph,.av.xxs.ph{border:2px solid var(--bg);box-shadow:0 0 0 2px var(--rc,var(--line))}
.av.xxs{width:24px;height:24px;font-size:10px;border-width:0;box-shadow:none}
.bp .av,.ln .av{flex:none!important;overflow:hidden!important}
.av.pd.ph{border:4px solid var(--bg);box-shadow:0 0 0 3px var(--rc)}
.pp .av{font-size:13px;color:var(--bg);margin:2px 0}
.vso{display:flex;align-items:center;justify-content:center;gap:8px}
.crown{position:relative;overflow:hidden}.crown>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:50%}
.x{width:40px;height:40px;border-radius:50%;background:var(--co);display:grid;place-items:center;font-family:var(--hd);font-size:15px;color:var(--bg);transform:rotate(-8deg);box-shadow:0 4px 0 var(--cod)}
.tagg{font-size:11px;font-weight:800;letter-spacing:.6px;color:var(--bg);background:var(--gr);border-radius:99px;padding:4px 9px;white-space:nowrap}
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.f{background:var(--p1);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:2px}
.f b{font-family:var(--hd);font-size:24px;font-weight:400}
.f span{font-size:11.5px;font-weight:700;color:var(--mu);line-height:1.3}
.steps{display:flex;align-items:center;gap:6px}
.st{flex:1;min-width:0;height:34px;border-radius:10px;background:var(--bg);display:grid;place-items:center;font-size:11.5px;font-weight:800;color:var(--mu2)}
.st.now{background:var(--y);color:var(--bg)}
.st.done{background:#1F3A35;color:var(--gr)}
.st.pass{background:var(--p3);color:var(--y);border:2px dashed var(--y)}
.st.gold{background:var(--p3);color:var(--y);border:2px solid var(--y);flex:1.4}
.rules{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:9px}
.rules li{display:flex;gap:10px;font-size:14px;font-weight:600;line-height:1.4;color:#E2DDF8}
.rules li b.n{flex:none;width:24px;height:24px;border-radius:8px;background:var(--y);color:var(--bg);display:grid;place-items:center;font-family:var(--hd);font-weight:400;font-size:14px}
.seed{display:flex;align-items:center;gap:14px}
.rank{width:60px;height:60px;border-radius:16px;background:var(--p3);border:2px solid var(--y);display:flex;flex-direction:column;align-items:center;justify-content:center;flex:none}
.rank small{font-size:10px;font-weight:800;color:var(--mu);letter-spacing:.6px}
.rank b{font-family:var(--hd);font-size:22px;font-weight:400;color:var(--y);line-height:1}
.seed p{font-size:14px;font-weight:600;line-height:1.45;color:#E2DDF8}
.seed p b{color:var(--tx)}
.ticket{position:relative;background:var(--y);color:var(--bg);border-radius:24px;padding:22px 24px;display:flex;flex-direction:column;align-items:center;gap:6px;box-shadow:0 8px 0 var(--yd);text-align:center}
.ticket:before,.ticket:after{content:'';position:absolute;top:50%;width:26px;height:26px;border-radius:50%;background:var(--bg);transform:translateY(-50%)}
.ticket:before{left:-13px}.ticket:after{right:-13px}
.ticket small{font-size:12px;font-weight:800;letter-spacing:1.4px}
.ticket b{font-family:var(--hd);font-size:32px;line-height:1;font-weight:400}
.ticket span{font-size:14px;font-weight:700}
.status{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:700}
.dotg{width:10px;height:10px;border-radius:50%;background:var(--gr);flex:none;box-shadow:0 0 0 4px rgba(61,220,151,.18)}
.doto{width:10px;height:10px;border-radius:50%;border:2px solid var(--mu2);flex:none}
.note{font-size:13px;font-weight:600;color:var(--mu);line-height:1.45}
.banner{border-radius:16px;padding:12px 14px;font-weight:700;font-size:14px;display:flex;gap:10px;align-items:center}
.banner.co{background:#3B1F33;border:2px solid var(--co);color:#FFD2CB}
.banner.cy{background:#1B2E44;border:2px solid var(--cy);color:#D5F3FC}
.res{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.res h1{color:var(--gr)}
.res.lost h1{color:var(--co)}
.res .sc{font-family:var(--hd);font-size:30px;font-variant-numeric:tabular-nums}
.bars{display:flex;flex-direction:column;gap:14px}
.br{display:flex;flex-direction:column;gap:7px}
.br .who{display:flex;align-items:center;gap:10px}
.br .nm{font-weight:800;font-size:15px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.br .nm small{font-weight:700;color:var(--mu);font-size:12px;margin-left:6px}
.br .sc{font-family:var(--hd);font-size:28px;line-height:1;font-variant-numeric:tabular-nums}
.bar{height:12px;border-radius:99px;background:var(--bg);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;transition:width .9s ease-out}
.lead{font-size:13px;font-weight:700;color:var(--gr);text-align:center}
.mini{display:flex;flex-direction:column;gap:8px}
.lm{display:flex;flex-direction:column;gap:6px;width:100%;text-align:left;background:var(--p1);border:2px solid transparent;border-radius:16px;padding:10px 12px;min-height:44px;content-visibility:auto;contain-intrinsic-size:auto 82px}
.lm.me{border-color:var(--y)}
.lm .ln{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:700;min-width:0}
.lm .ln span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lm .ln b{font-family:var(--hd);font-weight:400;font-size:18px;font-variant-numeric:tabular-nums}
.lm .tb{height:5px;border-radius:9px;background:var(--bg);overflow:hidden}
.lm .tb i{display:block;height:100%;transition:width .9s ease-out}
.sd{flex:none!important;min-width:30px;text-align:center;font-size:11px;font-weight:800;color:var(--mu);background:var(--bg);border-radius:6px;padding:2px 6px;flex:none;font-variant-numeric:tabular-nums}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:none;margin:0 -20px;padding-left:20px;padding-right:20px}
.chips::-webkit-scrollbar{display:none}
.chip{min-height:44px;min-width:52px;border-radius:14px;border:2px solid var(--line);background:var(--p1);font-weight:800;font-size:13px;color:var(--mu);padding:0 12px;flex:none;white-space:nowrap}
.chip.on{background:var(--y);border-color:var(--y);color:var(--bg)}
.chip .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--co);margin-left:5px;vertical-align:1px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--p1);border-radius:14px;padding:4px}
.seg button{min-height:44px;border:0;border-radius:11px;background:transparent;color:var(--mu);font-weight:800;font-size:13px}
.seg button.on{background:var(--p2);color:var(--tx);box-shadow:inset 0 0 0 2px var(--line)}
.search{width:100%;min-height:48px;border-radius:14px;border:2px solid var(--line);background:var(--bg);color:var(--tx);font:inherit;font-size:16px;font-weight:600;padding:0 14px}
.search::placeholder{color:var(--mu2)}
.bm{background:var(--p1);border-radius:16px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;content-visibility:auto;contain-intrinsic-size:auto 96px;border:2px solid transparent;width:100%;text-align:left}
button.bm{min-height:44px}
.bm.me{border-color:var(--y)}
.bm .bh{display:flex;justify-content:space-between;align-items:center;font-size:11px;font-weight:800;letter-spacing:.6px;color:var(--mu);text-transform:uppercase}
.bm .bp{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:700;min-height:22px}
.bm .bp span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bm .bp b{font-family:var(--hd);font-weight:400;font-size:17px;font-variant-numeric:tabular-nums}
.bm .bp.win span{color:var(--gr)}
.bm .bp.win b{color:var(--gr)}
.bm .bp.lose{color:var(--mu2)}
.bm .bp.tbd span{color:var(--mu2);font-style:italic;font-weight:600}
.sta{font-size:10.5px;font-weight:800;letter-spacing:.8px;border-radius:99px;padding:3px 8px;background:var(--bg);color:var(--mu)}
.sta.live{background:var(--co);color:var(--bg)}
.sta.done{background:#1F3A35;color:var(--gr)}
.sta.bet{background:var(--y);color:var(--bg)}
.passes{display:flex;flex-wrap:wrap;gap:6px}
.pass{font-size:12px;font-weight:800;background:var(--p3);color:var(--y);border:2px dashed var(--y);border-radius:10px;padding:4px 8px}
.pass.me{background:var(--y);color:var(--bg);border-style:solid}
.pick{position:relative;border:3px solid var(--line);background:var(--p1);border-radius:22px;padding:20px 8px 14px;display:flex;flex-direction:column;align-items:center;gap:5px;width:100%;min-width:0}
.pick.on{border-color:var(--y);background:var(--p3);box-shadow:0 0 0 4px rgba(245,184,46,.18)}
.pick:disabled{opacity:1}
.pick .tag{position:absolute;top:-13px;left:50%;transform:translateX(-50%);font-size:11px;font-weight:800;letter-spacing:1px;background:var(--y);color:var(--bg);border-radius:99px;padding:4px 10px;white-space:nowrap}
.pick .nm{font-weight:800;font-size:15px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pick .sdl{font-size:12px;font-weight:700;color:var(--mu)}
.pick .best{font-size:12px;font-weight:700;color:var(--tx);background:var(--bg);border-radius:99px;padding:4px 10px}
.split{display:flex;height:10px;border-radius:99px;overflow:hidden;background:var(--p2)}
.split i{display:block;height:100%;transition:width .6s}
.crowdh{display:flex;justify-content:space-between;gap:8px;font-size:12px;font-weight:700;color:var(--mu)}
.amt{font-family:var(--hd);font-size:44px;line-height:1;color:var(--y);font-variant-numeric:tabular-nums}
.amt span{font-size:20px;color:var(--mu);margin-left:6px}
.qs{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.q{min-height:44px;border-radius:14px;border:2px solid var(--line);background:var(--bg);font-weight:800;font-size:13px;padding:0 2px}
.q.all{border-color:var(--co);color:#FF9A8C}
.q:disabled{color:var(--mu2);border-color:var(--p2)}
.win{font-size:14px;font-weight:700;color:var(--gr)}
.why{font-size:13px;font-weight:700;color:#FFD2CB;text-align:center}
.fine{font-size:11.5px;font-weight:600;color:var(--mu2);text-align:center}
.lock{width:44px;height:44px;border-radius:14px;background:var(--y);display:grid;place-items:center;flex:none}
.betc{border:3px solid var(--y);border-radius:22px;padding:14px 16px;display:flex;align-items:center;gap:14px;background:var(--p3)}
.betc b{font-family:var(--hd);font-size:22px;color:var(--y);font-weight:400;display:block}
.betc span{font-size:13px;font-weight:700}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.stt{background:var(--p1);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:4px}
.stt b{font-family:var(--hd);font-size:24px;font-weight:400}
.stt span{font-size:12px;font-weight:700;color:var(--mu)}
.livec{display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:800;letter-spacing:1px;color:var(--bg);background:var(--co);border-radius:99px;padding:6px 12px}
.livec i{width:8px;height:8px;border-radius:50%;background:var(--bg);animation:blink 1.2s infinite}
@keyframes blink{50%{opacity:.25}}
.timer{font-family:var(--hd);font-size:34px;line-height:1;font-variant-numeric:tabular-nums}
.timer small{font-family:'Plus Jakarta Sans',system-ui,sans-serif;font-size:11px;font-weight:700;color:var(--mu);letter-spacing:.6px;margin-right:6px;text-transform:uppercase}
.burst{position:relative;width:240px;height:180px;display:grid;place-items:center;align-self:center}
.ring{position:absolute;inset:10px;border-radius:50%;border:3px dashed rgba(245,184,46,.45);animation:spin 18s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.bigc{width:146px;height:146px;border-radius:50%;background:var(--y);border:8px solid var(--yl);box-shadow:inset 0 -8px 0 #C98A12,0 0 0 8px rgba(245,184,46,.16);display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--bg);animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:scale(.4)}}
.bigc b{font-family:var(--hd);font-size:40px;line-height:1;font-weight:400}
.bigc span{font-size:13px;font-weight:800;letter-spacing:1px}
.bigc.lost{background:var(--p2);border-color:var(--line);box-shadow:none;color:var(--mu)}
.cn{position:absolute;border-radius:50%;background:var(--y);border:3px solid var(--yl);box-shadow:inset 0 -3px 0 #C98A12}
.spark{position:absolute;width:10px;height:10px;transform:rotate(45deg);border-radius:2px}
.pod{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));align-items:end;gap:10px;padding-top:8px}
.pod .p{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
.pod .p b{font-size:13px;font-weight:800;text-align:center;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.blk{width:100%;border-radius:16px 16px 6px 6px;display:flex;flex-direction:column;align-items:center;padding-top:10px;gap:2px;color:var(--bg)}
.blk strong{font-family:var(--hd);font-size:26px;font-weight:400;line-height:1}
.blk span{font-size:11px;font-weight:800;letter-spacing:.6px}
.list{display:flex;flex-direction:column;gap:7px}
.lr{display:flex;align-items:center;gap:12px;background:var(--p1);border-radius:16px;padding:9px 14px;content-visibility:auto;contain-intrinsic-size:auto 54px}
.lr.me{background:var(--p3);border:2px solid var(--y)}
.lr .n{font-family:var(--hd);font-size:17px;min-width:26px;color:var(--mu)}

.pp{background:var(--p1);border-radius:16px;padding:10px 8px;display:flex;flex-direction:column;align-items:center;gap:3px;text-align:center;min-width:0}
.pp em{font-style:normal;font-family:var(--hd);font-size:18px}

.prog{height:8px;border-radius:99px;background:var(--bg);overflow:hidden}

.boards{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:start}
.bside{display:flex;flex-direction:column;align-items:center;gap:8px;min-width:0}

.duel .bside .bsc{font-size:32px}

.close{width:44px;height:44px;border-radius:14px;border:0;background:var(--p2);display:grid;place-items:center;padding:0;flex:none}
.duelp{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.duelp .sc{font-family:var(--hd);font-size:64px;line-height:1;font-variant-numeric:tabular-nums}
.duelp b{font-size:18px;font-weight:800}
.vbar{height:22px;border-radius:99px;background:var(--p1);overflow:hidden;width:100%}
.vbar i{display:block;height:100%;border-radius:99px;transition:width .9s ease-out}
.full{min-height:70vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;padding:24px}
.full .ic{width:84px;height:84px;border-radius:26px;background:var(--p2);display:grid;place-items:center;font-family:var(--hd);font-size:38px;color:var(--y)}
.full p{color:var(--mu);font-weight:600;max-width:320px}
.net{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom));z-index:40;background:#3B1F33;border:2px solid var(--co);color:#FFE3DE;border-radius:16px;padding:6px 6px 6px 14px;display:flex;align-items:center;gap:10px;font-weight:700;font-size:13px;width:max-content;max-width:calc(100% - 32px)}

.toast.err{background:var(--co)}

#play{position:fixed;inset:0;z-index:50;background:var(--bg)}
#play[hidden]{display:none}
.play-mount{position:absolute;inset:0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.wait{display:inline-flex;gap:4px}.wait i{width:7px;height:7px;border-radius:50%;background:var(--mu);animation:bob 1s infinite}.wait i:nth-child(2){animation-delay:.15s}.wait i:nth-child(3){animation-delay:.3s}
@keyframes bob{50%{transform:translateY(-5px);opacity:.5}}
@media (min-width:600px){.body{padding-top:20px}.count b{font-size:64px}}
@media (prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

<body>
<div id="app"></div>
<div id="play" hidden></div>
<div id="say" class="sr" aria-live="polite"></div>
<script id="cup-play">/*@CUP_PLAY@*/</script>
<script>
/* The tournament page (event.name; "O-O-O Tournament" until the state says). Polls /cup/api/state (since=version) every 1.5 s (2 s hidden), draws one of the screens from it,
   and patches the DOM in place (no rebuild: scroll, focus and the search box survive a poll). Countdowns run off the
   server's clock (serverNow). A match is played by window.CupPlay (cup/play.js) in the #play overlay. */
(function () {
  'use strict';
  var C = window.__CUP && typeof window.__CUP === 'object' ? window.__CUP : null;

  /* ---------- the policy hop (as Scribble): the copy the app loads as a string can't reach the server, so it
     reloads itself once at its own address with the short hop ticket; the server sends a copy that can. */
  function blockedByPolicy() {
    var metas = document.querySelectorAll('meta[http-equiv]');
    for (var i = 0; i < metas.length; i++) {
      if (String(metas[i].httpEquiv).toLowerCase() !== 'content-security-policy') continue;
      var parts = String(metas[i].content || '').split(';').map(function (s) { return s.trim(); });
      var d = parts.find(function (s) { return /^connect-src\s/i.test(s); }) || parts.find(function (s) { return /^default-src\s/i.test(s); });
      if (d && /'none'/.test(d)) return true;
    }
    return false;
  }
  var HOP_FAILED = false;
  if (C && blockedByPolicy()) {
    var here = location.protocol === 'https:' || location.protocol === 'http:';
    if (/[?&]ticket=/.test(location.search) || !here || !(C.hopTicket || C.hop)) HOP_FAILED = true;
    else {
      document.getElementById('app').innerHTML = '<div class="full"><div class="skel" style="width:100%"></div></div>';
      location.replace(typeof C.hop === 'string' && /^https?:\/\//.test(C.hop) ? C.hop : location.origin + location.pathname + '?ticket=' + encodeURIComponent(C.hopTicket));
      return;
    }
  }

  /* ---------- helpers ---------- */
  var $app = document.getElementById('app');
  var $play = document.getElementById('play');
  var $say = document.getElementById('say');
  var ESC = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return ESC[c]; }); }
  function num(n) { return (Math.round(Number(n) || 0)).toLocaleString('en-IN'); }
  function ms(t) { var v = typeof t === 'number' ? t : Date.parse(t); return isFinite(v) ? v : NaN; }
  var offset = 0;
  function now() { return Date.now() + offset; }
  function left(t) {
    var d = Math.max(0, Math.ceil((t - now()) / 1000));
    var h = Math.floor(d / 3600), m = Math.floor((d % 3600) / 60), s = d % 60;
    return (h ? h + ':' + (m < 10 ? '0' : '') : '') + m + ':' + (s < 10 ? '0' : '') + s;
  }
  function cd(t) { return '<span data-cd="' + t + '">' + left(t) + '</span>'; }
  var TF = null;
  try { TF = new Intl.DateTimeFormat('en-IN', { hour: 'numeric', minute: '2-digit', hour12: true }); } catch (e) {}
  function clock(t) { var d = new Date(ms(t)); return TF ? TF.format(d).toUpperCase().replace(/\s+/g, ' ') : d.toTimeString().slice(0, 5); }
  function first(name) { return String(name || '').split(/\s+/)[0] || 'Colleague'; }
  function initials(name) { var p = String(name || '?').trim().split(/\s+/); return ((p[0] || '?')[0] + (p.length > 1 ? p[p.length - 1][0] : '')).toUpperCase(); }
  var PAL = ['#FF8A7A', '#6FD3F2', '#B79CFF', '#3DDC97', '#FFD66B', '#F5B82E', '#FF9EC7'];
  function color(id) { var h = 0; id = String(id || ''); for (var i = 0; i < id.length; i++) h = (h * 31 + id.charCodeAt(i)) | 0; return PAL[Math.abs(h) % PAL.length]; }
  /* A player's face: their photo (state's photoUrl) in the round frame, ringed in their colour, over their initials,
     which show when there is no photo or it doesn't load (a failed URL is remembered, so a poll doesn't retry it). */
  var badPhoto = {}, photos = {};
  function photoOf(p) {
    if (!p) return '';
    var u = p.photoUrl || photos[p.userId] || '';
    if (u && !/^(https:|data:image\/|blob:|\/)/i.test(u)) u = '';
    return u && !badPhoto[u] ? u : '';
  }
  function av(p, cls, label, col, style) {
    if (!p) return '<span class="av tbd ' + (cls || '') + '" aria-hidden="true"' + (style ? ' style="' + style + '"' : '') + '>?</span>';
    var c = col || color(p.userId), u = photoOf(p);
    return '<span class="av ' + (cls || '') + (u ? ' ph' : '') + '" style="background-color:' + c + ';--rc:' + c + (style ? ';' + style : '') + '" aria-hidden="true">' + esc(label || initials(p.name)) +
      (u ? '<img src="' + esc(u) + '" alt="" loading="lazy" decoding="async" referrerpolicy="no-referrer" draggable="false">' : '') + '</span>';
  }
  document.addEventListener('error', function (e) {
    var t = e.target;
    if (!t || t.tagName !== 'IMG' || !t.parentNode || !t.parentNode.classList || !/(^|\s)(av|crown)(\s|$)/.test(t.parentNode.className)) return;
    badPhoto[t.getAttribute('src')] = 1;
    t.parentNode.classList.remove('ph');
    t.parentNode.removeChild(t);
  }, true);
  /* The tournament's name comes from the event (state's event.name); the last one seen covers the first paint. */
  /* The name last seen, with its event: used for the first paint only, and only for that event (or when the page doesn't say). */
  var NAME0 = 'O-O-O Tournament', lastName = '';
  try { var kept = JSON.parse(localStorage.getItem('cup-name') || 'null'); if (kept && kept.n && (!C || !C.eventId || kept.id === C.eventId)) lastName = String(kept.n); } catch (e) {}
  function cupName() { var e = S && S.event; var n = e && typeof e.name === 'string' ? e.name.replace(/\s+/g, ' ').trim() : ''; return n || (S ? NAME0 : lastName || NAME0); }
  function wordmark() { var n = cupName(); return '<h1 class="wm' + (n.length > 22 ? ' xl' : n.length > 13 ? ' l' : '') + '" title="' + esc(n) + '">' + esc(n.toUpperCase()) + '</h1>'; }
  /* Points won from bets can be below 0 (stakes lost): +120 / −30. */
  function signed(n) { n = Math.round(Number(n) || 0); return (n < 0 ? '−' : '+') + num(Math.abs(n)); }
  function plural(n, one, many) { return num(n) + ' ' + (n === 1 ? one : (many || one + 's')); }
  function say(text) { $say.textContent = ''; setTimeout(function () { $say.textContent = text; }, 30); }
  function store(key, val) { try { if (val === undefined) return JSON.parse(localStorage.getItem(key) || 'null'); localStorage.setItem(key, JSON.stringify(val)); } catch (e) { return null; } }

  /* ---------- the server ---------- */
  function api(path, opts) {
    opts = opts || {};
    return fetch('/cup/api' + path, {
      method: opts.method || 'GET', cache: 'no-store', credentials: 'same-origin',
      headers: { 'X-Cup-Ticket': C ? String(C.ticket) : '', 'Content-Type': 'application/json' },
      body: opts.body ? JSON.stringify(opts.body) : undefined
    }).then(function (r) {
      if (r.status === 204) return {};
      return r.json().catch(function () { return null; }).then(function (j) {
        if (!r.ok || !j || j.success === false) {
          var e = new Error((j && j.message) || (r.ok ? 'Something went wrong. Try again.' : 'The server said no (' + r.status + '). Try again.'));
          e.status = r.status; throw e;
        }
        return j;
      });
    });
  }

  /* ---------- state ---------- */
  var S = null, version = null, eventId = C && C.eventId ? String(C.eventId) : '';
  var fatal = HOP_FAILED ? 'This page could not reach its server. Close it and open it again from Sowaka.' : (!C || !C.ticket ? 'nocup' : null);
  var netFail = 0, pollT = 0, inflight = false;
  var seen = store('cup-seen-bets') || [];
  var ui = { tab: 'me', round: null, q: '', all: false, watchAll: false, standAll: false, duel: null, pick: null, pickFor: null, stake: 0, betBusy: false, betErr: '', busy: '', err: '', toast: null, playing: null, handle: null, scroll: {} };
  var finals = store('cup-finals') || {};
  /* The round in progress, kept on this phone after every find, so a reload mid-round carries on from it and resends it. */
  var progress = store('cup-live') || {};
  function keepLast(map, n) { var k = Object.keys(map); k.slice(0, Math.max(0, k.length - n)).forEach(function (x) { delete map[x]; }); return map; }
  var seeds = {};

  function poll() {
    clearTimeout(pollT);
    if (fatal) return;
    if (inflight) { pollT = setTimeout(poll, 500); return; }
    inflight = true;
    var t0 = Date.now();
    var q = [];
    if (eventId) q.push('event=' + encodeURIComponent(eventId));
    if (S && version != null) q.push('since=' + encodeURIComponent(version));
    api('/state' + (q.length ? '?' + q.join('&') : '')).then(function (j) {
      var t1 = Date.now(), sn = ms(j.serverNow);
      if (isFinite(sn)) {
        var off = sn - (t0 + t1) / 2;
        offset = Math.abs(off - offset) > 400 || !S ? off : offset * 0.7 + off * 0.3;
      }
      if (!j.unchanged) {
        S = j; version = j.version;
        indexPhotos(j);
        if (j.event && j.event.name) { var nm = cupName(); if (nm !== lastName) { lastName = nm; store('cup-name', { id: j.event.id, n: nm }); } if (document.title !== nm) document.title = nm; }
        if (j.event && j.event.id) eventId = j.event.id;
      }
      netFail = 0;
      render();
    }).catch(function (e) {
      if (e && (e.status === 401 || e.status === 403)) { fatal = e.message || 'reopen'; render(); return; }
      netFail++;
      render();
    }).then(function () {
      inflight = false;
      if (fatal) return;
      var wait = netFail ? Math.min(10000, 1500 * Math.pow(2, netFail - 1)) : (document.hidden ? 2000 : 1500);
      pollT = setTimeout(poll, wait);
    });
  }
  document.addEventListener('visibilitychange', function () { if (!document.hidden && !fatal) poll(); });
  var resizeT = 0;
  window.addEventListener('resize', function () { clearTimeout(resizeT); resizeT = setTimeout(render, 150); });

  /* Every photo the state names, by person: a list that leaves photoUrl off one player object still shows the face. */
  function indexPhotos(j) {
    function add(p) { if (p && p.userId && p.photoUrl) photos[p.userId] = p.photoUrl; }
    if (j.me) { add(j.me); if (j.me.match) add(j.me.match.opponent); }
    if (j.event) (j.event.rounds || []).forEach(function (r) { (r.matches || []).forEach(function (m) { add(m.a); add(m.b); }); });
    (j.tipsters || []).forEach(add); (j.standings || []).forEach(add);
  }

  /* ---------- reading the state ---------- */
  function ev() { return S && S.event; }
  function meId() { return S && S.me && S.me.userId; }
  function allMatches() { var e = ev(); if (!e) return []; var out = []; (e.rounds || []).forEach(function (r) { (r.matches || []).forEach(function (m) { out.push(m); }); }); return out; }
  function roundOf(n) { var e = ev(); return e && (e.rounds || []).find(function (r) { return r.n === n; }); }
  function findMatch(id) { return allMatches().find(function (m) { return m.id === id; }); }
  function isMine(m) { var u = meId(); return !!(m && u && ((m.a && m.a.userId === u) || (m.b && m.b.userId === u))); }
  function scoreOf(m, uid) {
    if (!m || !uid) return null;
    if (m.result && m.result[uid] != null) return m.result[uid];
    if (m.live && m.live[uid] != null) return m.live[uid];
    return null;
  }
  function isLive(m) { return m.status === 'live' || m.status === 'solo'; }
  function liveMatches() { var e = ev(); if (!e) return []; var r = roundOf(e.round); return r ? r.matches.filter(isLive) : []; }
  function myLastDone() {
    var u = meId(), e = ev(), best = null;
    if (!u || !e) return null;
    (e.rounds || []).forEach(function (r) { r.matches.forEach(function (m) { if (m.status === 'done' && isMine(m)) best = { m: m, r: r }; }); });
    return best;
  }
  function isTopN() { var e = ev(); var r = e && roundOf(e.round); return !!(r && r.kind === 'sequential'); }
  function orgPossessive() { var e = ev(); return e && e.orgName ? esc(e.orgName) + "'s" : 'the'; }
  function passesFor(n) { var units = Math.ceil(n / 2); var T = Math.pow(2, Math.floor(Math.log2(Math.max(1, units)))); return units > T ? 2 * T - units : 0; }
  function roundName(n) { var r = roundOf(n); return r ? r.label : 'Round ' + n; }
  function roundSec() { var e = ev(); return (e && e.roundSec) || 45; }
  function myBet(matchId) { var b = S && S.bets && S.bets.mine; return b ? b.find(function (x) { return x.matchId === matchId; }) : null; }
  function phaseChip() {
    var e = ev();
    if (!e) return '';
    if (e.phase === 'scheduled') return '<span class="pill y">LOBBY ' + clock(e.lobbyAt) + '</span>';
    if (e.phase === 'lobby') return '<span class="pill">LOBBY OPEN</span>';
    if (e.phase === 'done') return '<span class="pill gr">FINAL RESULTS</span>';
    var r = roundOf(e.round);
    return '<span class="pill co">' + esc(r ? (r.kind === 'sequential' ? (r.short === 'F' ? 'FINAL' : r.short) + ' ON STAGE' : r.short + ' LIVE') : 'LIVE') + '</span>';
  }
  function showBalance() { var e = ev(); return !!(e && S.me && S.me.balance != null && (isTopN() || (S.bets && S.bets.mine && S.bets.mine.length) || e.phase === 'done')); }

  /* ---------- pieces ---------- */
  function seedLbl(p) { return p && p.seed ? 'Seed ' + p.seed : ''; }
  function youOr(p) { return p && p.userId === meId() ? 'You' : (p ? esc(p.name) : 'To be decided'); }
  function vsBlock(me, opp, oppText) {
    return '<div class="vs">' +
      '<div class="pl">' + av(me, '', '') + '<b>You</b><small>' + esc(seedLbl(me)) + (me && me.best != null ? ' · Best ' + num(me.best) : '') + '</small></div>' +
      '<span class="x" aria-hidden="true">VS</span>' +
      '<div class="pl">' + av(opp) + '<b>' + (opp ? esc(opp.name) : esc(oppText || 'To be decided')) + '</b><small>' + (opp ? esc(seedLbl(opp)) + (opp.best != null ? ' · Best ' + num(opp.best) : ' · No best yet') : 'Winner of a match still on') + '</small></div>' +
      '</div>';
  }
  function raceRows(m, opts) {
    opts = opts || {};
    var a = m.a, b = m.b, sa = scoreOf(m, a && a.userId) || 0, sb = scoreOf(m, b && b.userId) || 0;
    var scale = Math.max(2000, sa, sb) * 1.15;
    function row(p, s, col) {
      var tag = opts.pick && p && opts.pick === p.userId ? '<span class="pk">PICK</span>' : '';
      var w = m.winnerId && p && m.winnerId === p.userId ? ' <span aria-label="winner">✓</span>' : '';
      return '<div class="br"><div class="who">' + av(p, 's', '', col) + '<span class="nm">' + youOr(p) + w + '<small>' + esc(seedLbl(p)) + '</small></span>' + tag + '<span class="sc" style="color:' + col + '">' + num(s) + '</span></div>' +
        '<div class="bar" role="img" aria-label="' + esc((p ? p.name : '') + ' ' + num(s)) + '"><i style="width:' + Math.min(100, (s / scale) * 100).toFixed(1) + '%;background-color:' + col + '"></i></div></div>';
    }
    return '<div class="bars">' + row(a, sa, '#FF8A7A') + row(b, sb, '#6FD3F2') + '</div>';
  }
  /* Both boards, as each player has them now (board N of the match's seed, from cup/play.js), when the server sends where they are. */
  function hasBoards(m) {
    return !!(m && isLive(m) && m.boardSeed != null && m.liveBoard && Object.keys(m.liveBoard).length && window.CupPlay && typeof window.CupPlay.boardHtml === 'function');
  }
  function boardSize(inDuel) {
    var w = Math.min(window.innerWidth || 360, 560) - (inDuel ? 40 : 72);
    return Math.max(80, Math.min(220, Math.floor(((w - 10) / 2 - 4) / 1.07)));
  }
  function boardsBlock(m, opts) {
    opts = opts || {};
    if (!hasBoards(m)) return '';
    var size = boardSize(opts.duel), sa = scoreOf(m, m.a && m.a.userId) || 0, sb = scoreOf(m, m.b && m.b.userId) || 0;
    function side(p, s, other, col) {
      var lb = p && m.liveBoard[p.userId], tag = opts.pick && p && opts.pick === p.userId ? '<span class="pk">PICK</span>' : '';
      var head = '<div class="bh">' + av(p, 'xxs', '', col) + '<span class="nm">' + (p ? (p.userId === meId() ? 'You' : esc(first(p.name))) : '') + '</span>' + tag + '</div><span class="bsc" style="color:' + col + '">' + num(s) + '</span>';

  /* ---------- screens: My Cup ---------- */

      return '<div class="lr' + (x.userId === u ? ' me' : '') + '" data-k="t' + esc(x.userId) + '"><span class="n"' + (x.userId === u ? ' style="color:var(--y)"' : '') + '>' + (i + 1 + Math.min(3, onPod)) + '</span>' + av(x, 'xs', x.userId === u ? 'YOU' : '') + '<div class="tx"><b>' + (x.userId === u ? 'You' : esc(x.name)) + '</b><span>' + x.right + ' of ' + x.of + ' right</span></div><em' + (x.won < 0 ? ' style="color:var(--co)"' : '') + '>' + signed(x.won) + '</em></div>';
    }).join('');
    var meIn = t.some(function (x) { return x.userId === u; });
    var r = roundOf(ev().round);
    return '<h1>Top tipsters</h1><p class="note" style="margin-top:-6px">Points won from bets so far' + (r ? ' · ' + esc(r.label.toLowerCase()) : '') + '</p><div class="pod">' + pod + '</div><div class="list">' + rest + '</div>' +
      (meIn ? '' : '<p class="note" style="text-align:center">You\'re not on the board yet. Back a winner on stage to get on it.</p>');
  }

  /* ---------- Final standings ---------- */
  function viewFinal() {
    var e = ev(), st = (S.standings || []).slice().sort(function (a, b) { return a.place - b.place || a.seed - b.seed; }), u = meId();
    var fr = roundOf((e.rounds || []).length), fm = fr && fr.matches[0];
    var champ = st[0];
    if (!champ) return '<div class="full"><h2>' + esc(cupName()) + ' is over</h2><p>Final standings are on their way.</p></div>';
    var ru = fm ? (fm.a.userId === champ.userId ? fm.b : fm.a) : st[1];
    var semis = st.filter(function (x) { return x.reached === 'Semi-final'; }).slice(0, 2);
    var mine = st.find(function (x) { return x.userId === u; });
    var tip = (S.tipsters || []).slice().sort(function (a, b) { return b.won - a.won; })[0];
    if (tip && !(tip.won > 0)) tip = null;
    var myTip = (S.tipsters || []).find(function (x) { return x.userId === u; });
    var list = ui.standAll ? st.slice(4) : st.slice(4, 24);
    var q = ui.q.trim().toLowerCase();
    if (q) list = st.filter(function (x) { return x.name.toLowerCase().indexOf(q) >= 0; });
    return '<section class="count" aria-label="Champion" style="gap:6px"><small>Champion</small><span class="crown" aria-hidden="true">' + esc(initials(champ.name)) + (photoOf(champ) ? '<img src="' + esc(photoOf(champ)) + '" alt="" decoding="async" referrerpolicy="no-referrer">' : '') + '</span><b style="font-size:30px;color:var(--tx)">' + (champ.userId === u ? 'You!' : esc(champ.name)) + '</b>' +
      (fm ? '<span>Beat ' + esc(ru.name) + ' ' + num(scoreOf(fm, champ.userId)) + ' to ' + num(scoreOf(fm, ru.userId)) + ' in the final · seed ' + champ.seed + '</span>' : '') + '</section>' +
      '<div class="pod" style="grid-template-columns:repeat(3,minmax(0,1fr));align-items:stretch">' +
      '<div class="pp"><em style="color:#B79CFF">2nd</em>' + av(ru, 'xs', '', '#B79CFF') + '<b>' + youOr(ru) + '</b><span>Runner-up</span></div>' +
      semis.map(function (s) { return '<div class="pp"><em style="color:#6FD3F2">3rd</em>' + av(s, 'xs', '', '#6FD3F2') + '<b>' + youOr(s) + '</b><span>Semi-finalist</span></div>'; }).join('') + '</div>' +
      (mine ? '<section class="betc" aria-label="Your result" style="border-width:2px"><div class="sp"><p class="lbl">Your run</p><b style="font-family:inherit;font-size:15px;font-weight:800;color:var(--tx)">' + (mine.reached === 'Champion' ? 'Champion!' : 'Reached ' + esc(mine.reached)) + ' · place ' + mine.place + ' of ' + num(st.length) + '</b></div>' + (myTip ? '<b style="color:' + (myTip.won < 0 ? 'var(--co)' : 'var(--gr)') + ';font-size:20px">' + signed(myTip.won) + ' pts</b>' : '') + '</section>' : '') +
      (tip ? '<div class="card" style="flex-direction:row;align-items:center"><div class="sp"><p class="lbl" style="color:var(--cy)">Top tipster</p><b>' + (tip.userId === u ? 'You' : esc(tip.name)) + ' · ' + tip.right + ' of ' + tip.of + ' right</b></div><b class="hd" style="color:var(--gr);font-size:20px">' + signed(tip.won) + '</b></div>' : '') +
      '<div class="row"><p class="lbl sp">Final standings</p><p class="lbl">' + plural(st.length, 'player') + '</p></div>' +
      '<label class="sr" for="sq">Find a player</label><input id="sq" class="search" type="search" placeholder="Find a player" autocomplete="off" data-in="q" value="' + esc(ui.q) + '">' +
      '<div class="list">' + list.map(function (x) { return '<div class="lr' + (x.userId === u ? ' me' : '') + '" data-k="s' + esc(x.userId) + '"><span class="n">' + x.place + '</span>' + av(x, 'xs') + '<div class="tx"><b>' + youOr(x) + '</b><span>Seed ' + x.seed + '</span></div><span class="mut t12" style="font-weight:700">' + esc(x.reached) + '</span></div>'; }).join('') + '</div>' +
      (!q && !ui.standAll && st.length > 24 ? '<button type="button" class="btn2" data-act="standall">Show all ' + num(st.length) + '</button>' : '');
  }

  /* ---------- the frame ---------- */
  function fullScreen(icon, title, text, btn) {
    return '<div class="wrap"><header class="top">' + wordmark() + '</header><div class="full"><div class="ic" aria-hidden="true">' + icon + '</div><h2>' + esc(title) + '</h2><p>' + esc(text) + '</p>' + (btn || '') + '</div></div>';
  }
  function frame() {
    if (fatal === 'nocup') return fullScreen('!', 'Open it from Sowaka', cupName() + ' opens from the Games tab or its post in your feed.');
    if (fatal) return fullScreen('↻', 'Close and open it again', fatal === 'reopen' || /^Close and reopen/i.test(fatal) ? 'Your pass has run out. Close this screen and open ' + cupName() + ' again from Sowaka.' : fatal);
    if (!S) {
      if (netFail) return fullScreen('!', 'Can\'t reach the server', 'Check your connection. We\'ll keep trying.', '<button type="button" class="btn" style="max-width:280px" data-act="retry">TRY AGAIN</button>');
      return '<div class="wrap"><header class="top">' + wordmark() + '</header><div class="body" aria-busy="true"><div class="skel"></div><div class="skel" style="height:200px"></div><div class="skel" style="height:80px"></div></div></div>';
    }
    var e = ev();
    if (!e) return fullScreen('✦', cupName() + ' isn\'t on right now', 'When it\'s switched on, your match, all the matches and the live games all show up here.');
    var tabs = [['me', e.phase === 'done' ? 'Results' : 'Home'], ['bracket', 'Matches'], ['watch', 'Watch &amp; Bet']];
    // Tipsters from the top N on (the server may send an empty list from the start).
    if (S.tipsters && (S.tipsters.length || isTopN() || e.phase === 'done')) tabs.push(['tipsters', 'Tipsters']);
    if (!tabs.some(function (t) { return t[0] === ui.tab; })) ui.tab = 'me';
    var liveN = liveMatches().length;
    var tabHtml = '<div class="tabs" role="tablist" aria-label="' + esc(cupName()) + '">' + tabs.map(function (t) {
      return '<button type="button" role="tab" id="tab-' + t[0] + '" aria-controls="panel" class="tab' + (ui.tab === t[0] ? ' on' : '') + '" aria-selected="' + (ui.tab === t[0]) + '" data-act="tab" data-v="' + t[0] + '">' + t[1] + (t[0] === 'watch' && liveN && ui.tab !== 'watch' ? '<span class="dot" aria-label="' + liveN + ' live"></span>' : '') + '</button>';
    }).join('') + '</div>';
    var body = ui.tab === 'bracket' ? viewBracket() : ui.tab === 'watch' ? viewWatch() : ui.tab === 'tipsters' ? viewTipsters() : viewMe();
    return '<div class="wrap"><header class="top">' + wordmark() + '<span class="tr">' + phaseChip() +
      (showBalance() ? '<span class="bal" aria-label="Your balance: ' + num(S.me.balance) + ' points"><span class="coin" aria-hidden="true"></span>' + num(S.me.balance) + '</span>' : '') + '</span></header>' +
      tabHtml + '<main class="body" id="panel" role="tabpanel" aria-labelledby="tab-' + ui.tab + '">' + body + '</main></div>' +
      (ui.duel ? viewDuel(ui.duel) : '') +
      (netFail ? '<div class="net" role="status">Connection lost. Retrying…<button type="button" data-act="retry">Retry now</button></div>' : '') +
      (ui.toast ? '<div class="toast' + (ui.toast.err ? ' err' : '') + '" role="status">' + esc(ui.toast.text) + '</div>' : '');
  }

  /* ---------- patching the DOM in place ---------- */
  function morph(root, html) {
    var t = document.createElement('template');
    t.innerHTML = html;
    patchKids(root, t.content);
  }
  function keyOf(n) { return n.nodeType === 1 ? n.getAttribute('data-k') : null; }
  function patchKids(a, b) {
    var keyed = {};
    for (var c = a.firstChild; c; c = c.nextSibling) { var k = keyOf(c); if (k) keyed[k] = c; }
    var cur = a.firstChild;
    var news = Array.prototype.slice.call(b.childNodes);
    for (var i = 0; i < news.length; i++) {
      var y = news[i], ky = keyOf(y), x = null;
      if (ky) { x = keyed[ky] || null; if (x) delete keyed[ky]; }
      else if (cur && !keyOf(cur) && cur.nodeType === y.nodeType && (cur.nodeType !== 1 || cur.nodeName === y.nodeName)) x = cur;
      if (x) {
        if (x !== cur) a.insertBefore(x, cur); else cur = cur.nextSibling;
        patchNode(x, y);
      } else a.insertBefore(y, cur);
    }
    while (cur) { var nx = cur.nextSibling; a.removeChild(cur); cur = nx; }
  }
  function patchNode(x, y) {
    if (x.nodeType !== 1) { if (x.nodeValue !== y.nodeValue) x.nodeValue = y.nodeValue; return; }
    var i, at;
    for (i = x.attributes.length - 1; i >= 0; i--) { at = x.attributes[i].name; if (!y.hasAttribute(at)) x.removeAttribute(at); }
    for (i = 0; i < y.attributes.length; i++) { at = y.attributes[i]; if (x.getAttribute(at.name) !== at.value) x.setAttribute(at.name, at.value); }
    if (x.nodeName === 'INPUT') { if (document.activeElement !== x && x.value !== (y.getAttribute('value') || '')) x.value = y.getAttribute('value') || ''; return; }
    if ('disabled' in x) x.disabled = y.hasAttribute('disabled');
    patchKids(x, y);
  }

  var renderQ = false;
  function render() {
    if (renderQ) return;
    renderQ = true;
    requestAnimationFrame(function () {
      renderQ = false;
      morph($app, frame());
      syncPlay();
      document.body.style.overflow = ui.duel || ui.playing ? 'hidden' : '';
    });
  }
  setInterval(function () {
    var els = document.querySelectorAll('[data-cd]');
    for (var i = 0; i < els.length; i++) { var t = left(Number(els[i].getAttribute('data-cd'))); if (els[i].textContent !== t) els[i].textContent = t; }
  }, 250);
  function toast(text, err) {
    ui.toast = { text: text, err: !!err };
    say(text);
    clearTimeout(toast.t);
    toast.t = setTimeout(function () { ui.toast = null; render(); }, 2600);
    render();
  }

  /* ---------- playing a match (cup/play.js) ---------- */
  function syncPlay() {
    if (!S || !S.me || !S.me.match) return;
    var m = S.me.match, key = m.id + ':' + (m.attempt || 0);
    var start = ms(m.startAt);
    if ((m.status === 'live' || m.status === 'solo') && finals[key] != null && !posted[key]) postFinal(m.id, key, finals[key]);
    var want = (m.status === 'live' || (m.status === 'solo' && m.startAt)) && isFinite(start) && finals[key] == null && now() < start + (roundSec() + 8) * 1000;
    /* Away (closed, reloaded) until after the end: what this phone had is the final. */
    if (!want && !ui.playing && (m.status === 'live' || m.status === 'solo') && m.startAt && finals[key] == null && progress[key] && now() >= start + roundSec() * 1000) {
      finals[key] = Math.max(0, Math.round(Number(progress[key].score) || 0)); store('cup-finals', keepLast(finals, 20));
      postFinal(m.id, key, finals[key]);
    }
    if (ui.playing && !want && finals[ui.playing] == null) stopPlay();
    if (!want || ui.playing === key) return;
    if (!window.CupPlay || typeof window.CupPlay.start !== 'function') return;
    if (ui.playing) stopPlay();
    ui.playing = key;
    $play.hidden = false;
    $play.innerHTML = '';
    var mount = document.createElement('div');
    mount.className = 'play-mount';
    $play.appendChild(mount);
    var matchId = m.id, opp = m.opponent || {};
    var lastLive = 0, liveT = 0, pending = null, pendingAt = null;
    function sendLive() {
      liveT = 0;
      if (pending == null) return;
      var body = { score: pending }, p = pendingAt;
      // Where the player is (board, last tap), for viewers drawing both boards; an older server ignores it.
      if (p && typeof p.board === 'number') { body.board = p.board; if (typeof p.tap === 'number') { body.tap = p.tap; body.ok = !!p.ok; } }
      pending = null; pendingAt = null; lastLive = Date.now();
      api('/matches/' + encodeURIComponent(matchId) + '/live', { method: 'POST', body: body }).catch(function () {});
    }
    try {
      ui.handle = window.CupPlay.start({
        mount: mount,
        boardSeed: m.boardSeed || seeds[key],
        startAt: start,
        serverNow: now(),
        clockOffset: offset,
        roundSec: roundSec(),
        attempt: m.attempt || 0,
        opponent: m.status === 'solo' ? null : { name: opp.name || 'Your opponent', seed: opp.seed, userId: opp.userId, photoUrl: photoOf(opp) || null },
        me: { name: S.me.name, seed: S.me.seed, photoUrl: photoOf(S.me) || null },
        solo: m.status === 'solo',
        resume: progress[key] || null,
        onProgress: function (p) { progress[key] = p; store('cup-live', keepLast(progress, 6)); },
        onLive: function (score, p) {
          pending = Math.max(0, Math.round(Number(score) || 0)); pendingAt = p || null;
          if (!liveT) liveT = setTimeout(sendLive, Math.max(0, 260 - (Date.now() - lastLive)));
        },
        onFinal: function (score) { finishPlay(matchId, key, Math.max(0, Math.round(Number(score) || 0))); },
        getOpponentLive: function () { var mm = S && S.me && S.me.match; return mm && mm.id === matchId && mm.opponentLive != null ? mm.opponentLive : null; }
      });
    } catch (err) {
      console.error('CupPlay failed', err);
      stopPlay();
      ui.err = 'The game didn\'t start. Close this screen and open it again.';
    }
  }
  function finishPlay(matchId, key, score) {
    if (finals[key] != null) return;
    finals[key] = score;
    store('cup-finals', keepLast(finals, 20));
    if (progress[key]) { delete progress[key]; store('cup-live', progress); }
    postFinal(matchId, key, score);
    setTimeout(function () { if (ui.playing === key) stopPlay(); render(); }, 2200);
  }
  /* The final, kept on this phone (cup-finals) until the server has it, so a reload sends it again. */
  var posted = {};
  function postFinal(matchId, key, score) {
    if (posted[key]) return;
    posted[key] = true;
    var tries = 0;
    (function send() {
      api('/matches/' + encodeURIComponent(matchId) + '/final', { method: 'POST', body: { score: score } }).then(function (j) {
        if (j && j.match && S && S.me && S.me.match && S.me.match.id === matchId) Object.assign(S.me.match, j.match);
        poll();
      }).catch(function (e) {
        // 409: the match was decided without it (back too late; the live score counted). Nothing to tell, the result screen says it.
        if (e && e.status === 409) { poll(); return; }
        if (e && e.status >= 400 && e.status < 500) { toast(e.message, true); return; }
        if (++tries < 5) setTimeout(send, 1000 * tries); else { posted[key] = false; toast('Your score didn\'t reach the server. Keep this screen open.', true); }
      });
    })();
  }
  function stopPlay() {
    try { if (ui.handle && typeof ui.handle.stop === 'function') ui.handle.stop(); else if (ui.handle && typeof ui.handle.destroy === 'function') ui.handle.destroy(); } catch (e) {}
    ui.handle = null; ui.playing = null;
    $play.hidden = true; $play.innerHTML = '';
    document.body.style.overflow = ui.duel ? 'hidden' : '';
  }

  /* ---------- actions ---------- */
  function matchAction(kind) {
    var m = S.me.match;
    if (!m || ui.busy) return;
    ui.busy = kind; ui.err = ''; render();
    api('/matches/' + encodeURIComponent(m.id) + '/' + kind, { method: 'POST', body: {} }).then(function (j) {
      ui.busy = '';
      if (j.match) {
        var key = j.match.id + ':' + (j.match.attempt || 0);
        if (j.match.boardSeed) seeds[key] = j.match.boardSeed;
        if (S.me.match && S.me.match.id === j.match.id) {
          Object.assign(S.me.match, j.match);
          if (kind === 'join') S.me.match.joined = true;
        }
      }
      render(); poll();
    }).catch(function (e) { ui.busy = ''; ui.err = e.message; render(); });
  }
  /* Inside the tap, so iOS lets the round's countdown beep. */
  function unlock() { try { if (window.CupPlay && window.CupPlay.unlockAudio) window.CupPlay.unlockAudio(); } catch (e) {} }
  var ACT = {
    tab: function (v) {
      if (ui.tab === v) { window.scrollTo(0, 0); return; }
      ui.scroll[ui.tab] = window.scrollY;
      ui.tab = v; ui.q = ''; ui.all = false;
      render();
      requestAnimationFrame(function () { requestAnimationFrame(function () { window.scrollTo(0, ui.scroll[v] || 0); }); });
    },
    round: function (v) { ui.round = Number(v); ui.all = false; render(); },
    all: function (v) { ui.all = v === '1'; render(); },
    watchall: function () { ui.watchAll = true; render(); },
    standall: function () { ui.standAll = true; render(); },
    duel: function (v) { ui.duel = v; render(); },
    'duel-close': function () { ui.duel = null; render(); },
    retry: function () { netFail = 0; render(); poll(); },
    join: function () { unlock(); matchAction('join'); },
    solo: function () { unlock(); matchAction('solo'); },
    reopen: function () { $play.hidden = false; },
    pick: function (v) { ui.pick = v; ui.betErr = ''; render(); },
    add: function (v) { ui.stake = Math.min((S.me.balance || 0), ui.stake + Number(v)); render(); },
    allin: function () { ui.stake = S.me.balance || 0; render(); },
    clear: function () { ui.stake = 0; render(); },
    seen: function (v) { if (seen.indexOf(v) < 0) seen.push(v); store('cup-seen-bets', seen.slice(-40)); render(); },
    ride: function (v, el) {
      var n = Number(el.getAttribute('data-n')) || 0;
      if (seen.indexOf(v) < 0) seen.push(v); store('cup-seen-bets', seen.slice(-40));
      var cur = S.current && findMatch(S.current.matchId);
      if (cur && ui.pickFor !== cur.id) { ui.pickFor = cur.id; ui.pick = null; }
      ui.stake = Math.min(n, S.me.balance || 0);
      render();
      toast('Stake set to ' + num(ui.stake) + '. Now pick who wins.');
    },
    lock: function () {
      var cur = S.current && findMatch(S.current.matchId);
      if (!cur || !ui.pick || !ui.stake || ui.betBusy) return;
      var stake = Math.min(ui.stake, S.me.balance || 0);
      ui.betBusy = true; ui.betErr = ''; render();
      api('/bets', { method: 'POST', body: { matchId: cur.id, pick: ui.pick, stake: stake } }).then(function (j) {
        ui.betBusy = false;
        if (j.balance != null) S.me.balance = j.balance;
        S.bets = S.bets || {}; S.bets.mine = S.bets.mine || [];
        var bet = j.bet || { matchId: cur.id, pick: ui.pick, stake: stake, status: 'held', payout: 0 };
        if (!myBet(bet.matchId)) S.bets.mine.push(bet);
        var p = cur.a.userId === bet.pick ? cur.a : cur.b;
        toast('Bet locked: ' + num(bet.stake) + ' on ' + first(p.name));
        poll();
      }).catch(function (e) { ui.betBusy = false; ui.betErr = e.message; render(); });
    }
  };
  $app.addEventListener('click', function (ev_) {
    var el = ev_.target.closest('[data-act]');
    if (!el || el.disabled) return;
    var f = ACT[el.getAttribute('data-act')];
    if (f) f(el.getAttribute('data-v'), el);
  });
  var qT = 0;
  $app.addEventListener('input', function (ev_) {
    var el = ev_.target;
    if (el.getAttribute('data-in') === 'q') { ui.q = el.value; clearTimeout(qT); qT = setTimeout(render, 120); }
  });
  document.addEventListener('keydown', function (ev_) { if (ev_.key === 'Escape' && ui.duel) { ui.duel = null; render(); } });

  render();
  if (!fatal) poll();
  window.__cupDebug = { get state() { return S; }, ui: ui, render: render };
})();
</script>
</body>
</html>
