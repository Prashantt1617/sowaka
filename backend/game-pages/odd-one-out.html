<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- A game, not a document: no pinch or double-tap zoom, and the page runs under the notch with its own safe-area padding. -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#15122B">
<meta name="color-scheme" content="dark">
<title>Odd One Out</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* One arcade column: clock, score and streak on top, a square board of emoji tiles under the thumbs. One dark look on purpose; the accent hue (--h) shifts as the grid grows.
   Sowaka: this one file is the whole game. The Sowaka app stores it in game_catalog and loads it into its own screen with a bridge (window.Sowaka) for the
   player's name, the company's leaderboard and colleague challenges; in a plain browser there is no bridge, scores stay on this device and there are no challenges. */
[hidden]{display:none!important}
:root{
  color-scheme:dark; --h:45;
  --bg:#15122B; --panel:#211D42; --panel2:#2A2553; --line:#3B3668; --ink:#F6F1FF; --muted:#A9A3CC;
  --tile:#FFF6DE; --tile-edge:#D2BC7E;
  --accent:hsl(var(--h) 95% 60%); --accent-deep:hsl(var(--h) 85% 40%); --accent-ink:#15122B;
  --good:#4BE39A; --bad:#FF6B6B; --gold:#FFD23F;
  --display:"Baloo 2","Trebuchet MS",system-ui,sans-serif; --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html{background:var(--bg);-webkit-text-size-adjust:100%;text-size-adjust:100%;touch-action:manipulation;overscroll-behavior:none}
body{margin:0;min-height:100vh;min-height:100dvh;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.4;
  padding:max(16px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) calc(36px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));
  touch-action:manipulation;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
button{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
input{-webkit-user-select:text;user-select:text}
.app{max-width:440px;margin-inline:auto;display:flex;flex-direction:column;gap:12px;position:relative}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
h1{font-family:var(--display);font-weight:800;font-size:2.1rem;line-height:.9;margin:0;color:var(--accent);text-wrap:balance}
.hright{display:flex;align-items:flex-end;gap:14px}
.bank{text-align:right}
.bank small,.scorebox small,.combo small{display:block;font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700}
.bank b{font-family:var(--display);font-size:1.5rem;font-weight:800;font-variant-numeric:tabular-nums;line-height:1;display:inline-block}
.pill{font:inherit;font-size:.8rem;font-weight:700;height:32px;padding:0 12px;border-radius:999px;border:2px solid var(--line);background:transparent;color:var(--ink);cursor:pointer;white-space:nowrap}
.hud{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center}
.clock{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:1.7rem;font-variant-numeric:tabular-nums;background:conic-gradient(var(--accent) var(--pct,100%),var(--panel2) 0);position:relative}
.clock::before{content:"";position:absolute;inset:6px;border-radius:50%;background:var(--bg)}
.clock span{position:relative}
.clock.low,.clock.hit{--accent:var(--bad)}
.scorebox{min-width:0}
.score{font-family:var(--display);font-weight:800;font-size:2.6rem;line-height:1;font-variant-numeric:tabular-nums;display:inline-block;transform-origin:left center}
.combo{font-family:var(--display);font-weight:800;text-align:center;min-width:86px;padding:6px 10px 8px;border-radius:16px;background:var(--panel);border:2px solid var(--line)}
.combo b{display:block;font-size:1.5rem;line-height:1}
.combo.hot{border-color:var(--gold);color:var(--gold);box-shadow:0 0 18px -4px var(--gold)}
.combo.hot small{color:var(--gold)}
.goal{position:relative;height:16px;border-radius:999px;background:var(--panel2);margin-top:8px}
.goal .fill{position:absolute;inset:0 auto 0 0;border-radius:999px;background:linear-gradient(90deg,var(--accent-deep),var(--accent));width:0;transition:width .3s cubic-bezier(.2,1.4,.4,1)}
.goal .st{position:absolute;top:-12px;transform:translateX(-50%);font-size:1.25rem;line-height:1;color:var(--line)}
.goal .st.on{color:var(--gold);filter:drop-shadow(0 0 6px var(--gold))}
.goalrow{display:flex;justify-content:space-between;font-size:.78rem;color:var(--muted);font-weight:600;font-variant-numeric:tabular-nums}
.rival{display:grid;grid-template-columns:minmax(64px,auto) 1fr auto;gap:6px 8px;align-items:center;font-size:.85rem;font-weight:700;padding:8px 12px;border-radius:16px;background:var(--panel);border:2px solid var(--line)}
.rival .rn{min-width:0;max-width:9.5em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;line-height:1.1}
.rival .rn small{display:block;font-size:.66rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700}
.rival .rn small.on{color:var(--good)}
.rival .bar{height:10px;border-radius:999px;background:var(--panel2);position:relative;overflow:hidden}
.rival .bar i{position:absolute;inset:0 auto 0 0;background:var(--bad);border-radius:999px;width:0;transition:width .4s}
.rival .bar.me i{background:var(--accent)}
.rival b{font-variant-numeric:tabular-nums;text-align:right;min-width:3.5ch}
.ranks{display:flex;flex-direction:column;gap:4px}
.rank{display:flex;justify-content:space-between;gap:10px;padding:6px 10px;border-radius:10px;background:var(--panel2);font-size:.9rem;font-weight:600;font-variant-numeric:tabular-nums}
.rank.me{outline:2px solid var(--accent)}
.rank span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stage{position:relative;container-type:inline-size}
.grid{--n:3;display:grid;grid-template-columns:repeat(var(--n),1fr);gap:calc(100cqw/var(--n)*.08);aspect-ratio:1;touch-action:manipulation}
.cell{font:inherit;font-size:calc(100cqw/var(--n)*.56);line-height:1;padding:0;border:0;border-radius:calc(100cqw/var(--n)*.2);background:var(--panel);box-shadow:0 calc(100cqw/var(--n)*.05) 0 #0d0b1d;cursor:pointer;display:grid;place-items:center;color:var(--ink);user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;min-width:0;min-height:0;overflow:hidden}
.cell i{font-style:normal;display:block;pointer-events:none}
.cell.flip i{transform:scaleX(-1)}
.cell.ok{background:var(--good)}
.cell.no{background:var(--bad)}
.cell.was{outline:4px solid var(--gold);outline-offset:-4px}
.cell:focus-visible,.btn:focus-visible,.pill:focus-visible,.link:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.cover{position:absolute;inset:-6px;border-radius:22px;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:12px;z-index:2}
.cover.m{position:static;padding:8px 0}
.cover h2{font-family:var(--display);font-weight:800;font-size:1.7rem;margin:0;line-height:1.05;text-wrap:balance}
.cover p{margin:0;color:var(--muted);max-width:30ch}
.cover .n{font-family:var(--display);font-weight:800;font-size:7rem;line-height:1;color:var(--accent)}
.demo{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:min(46cqw,190px)}
.demo span{aspect-ratio:1;border-radius:14px;background:var(--panel);display:grid;place-items:center;font-size:1.7rem;box-shadow:0 4px 0 #0d0b1d}
.demo span.odd{outline:3px solid var(--gold)}
.menu{display:grid;grid-template-columns:1fr;gap:8px;width:100%}
.menu .go{grid-column:1/-1}
.btn{font:inherit;font-weight:700;min-height:50px;padding:0 10px;border-radius:16px;border:2px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer}
.btn:active{transform:translateY(2px)}
.btn.go{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-family:var(--display);font-weight:800;font-size:1.6rem;min-height:60px;box-shadow:0 5px 0 var(--accent-deep)}
.btn.go:active{transform:translateY(4px);box-shadow:0 1px 0 var(--accent-deep)}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.toasts{position:absolute;inset:0;pointer-events:none;z-index:3}
.toast{position:absolute;left:50%;top:-18px;font-family:var(--display);font-weight:800;font-size:1.5rem;white-space:nowrap;text-shadow:0 2px 0 rgba(0,0,0,.45);color:var(--ink);transform:translate(-50%,0)}
.toast.big{font-size:2.3rem;color:var(--gold);top:30%}
.toast.bad{color:var(--bad)}
.toast.feed{font-size:.95rem;color:var(--muted);top:-40px;font-family:var(--body);font-weight:700}
.ticker{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-family:var(--display);font-weight:800;font-size:9rem;line-height:1;color:var(--bad);opacity:.3;pointer-events:none;z-index:1}
.foot{display:flex;justify-content:space-between;gap:12px;border-top:1px solid var(--line);padding-top:10px}
.link{font:inherit;font-size:.85rem;color:var(--muted);background:none;border:0;padding:6px 0;text-decoration:underline;cursor:pointer}
.sheet{position:fixed;inset:0;background:rgba(8,6,20,.78);display:flex;flex-direction:column;align-items:center;padding:max(16px,env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px));z-index:9;overflow-y:auto;overscroll-behavior:contain}
/* Pushed to the bottom when it fits; when it is taller than the screen it starts at the top and the sheet scrolls. */
.card{background:var(--panel);color:var(--ink);border-radius:24px;padding:22px;width:100%;max-width:440px;display:flex;flex-direction:column;gap:14px;border:1px solid var(--line);margin-top:auto;flex-shrink:0}
.lb{display:flex;flex-direction:column;gap:6px}
.lbh{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700}
.lb .ranks{gap:3px}
.lb .rank{padding:4px 10px;font-size:.85rem}
.lb .rank b{font-family:var(--display);font-weight:800;flex-shrink:0}
.lb .pos{font-style:normal;color:var(--muted);display:inline-block;min-width:2.4ch}
.lb .rank.me .pos{color:var(--accent)}
.lb .wait{margin:0;font-size:.85rem;color:var(--muted)}
.lb .link{align-self:center;padding:2px 0}
.card h2{font-family:var(--display);font-weight:800;font-size:1.9rem;margin:0;line-height:1.05;text-wrap:balance}
.card dl{margin:0;display:grid;grid-template-columns:1fr auto;gap:6px 12px;font-variant-numeric:tabular-nums}
.card dt{color:var(--muted)} .card dd{margin:0;text-align:right;font-weight:700}
.card .total dt,.card .total dd{color:var(--ink);font-weight:800;font-size:1.15rem;border-top:1px solid var(--line);padding-top:8px}
.card .note{margin:0;font-size:.88rem;color:var(--muted)}
.card .acts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.card .acts.one{grid-template-columns:1fr}
.stars{display:flex;justify-content:center;gap:10px;font-size:3rem;line-height:1;color:var(--line)}
.stars span.on{color:var(--gold);filter:drop-shadow(0 0 10px var(--gold))}
.bigscore{font-family:var(--display);font-weight:800;font-size:3.2rem;text-align:center;line-height:1;font-variant-numeric:tabular-nums}
/* Challenges: the inbox under the menu, the colleague picker, the two scores side by side, and what the result paid. */
.inbox{display:flex;flex-direction:column;gap:6px;width:100%;text-align:left}
.inbox .lbh .link{padding:0;font-size:.75rem;letter-spacing:0;text-transform:none}
.inbox .wait{margin:0;font-size:.85rem;color:var(--muted);max-width:none}
.crow{font:inherit;color:var(--ink);display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:8px 10px;border-radius:14px;background:var(--panel);border:2px solid var(--line);text-align:left;width:100%}
button.crow{cursor:pointer}
.crow.hot{border-color:var(--gold)}
.crow p{margin:0;font-size:.88rem;color:var(--ink);max-width:none;line-height:1.25;min-width:0}
.crow p small{display:block;color:var(--muted);font-size:.75rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crow .bt{display:flex;gap:6px;align-items:center}
div.crow.tap{cursor:pointer}
.crow .pts{font-family:var(--display);font-weight:800;color:var(--gold);font-variant-numeric:tabular-nums}
.crow .pts.zero{color:var(--muted)}
.mini{font:inherit;font-size:.8rem;font-weight:800;min-height:36px;padding:0 12px;border-radius:12px;border:2px solid var(--line);background:transparent;color:var(--ink);cursor:pointer;white-space:nowrap}
.mini.yes{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.mini:disabled{opacity:.5}
.mini:focus-visible,.person:focus-visible,.crow:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.av{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:.95rem;color:#15122B;background:hsl(var(--ah,45) 85% 72%);flex-shrink:0;overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.people{display:flex;flex-direction:column;gap:4px;max-height:min(44vh,360px);overflow-y:auto;overscroll-behavior:contain}
.person{font:inherit;display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;text-align:left;padding:8px 10px;border-radius:14px;border:2px solid transparent;background:var(--panel2);color:var(--ink);cursor:pointer;width:100%}
.person:active{transform:translateY(1px)}
.person span{min-width:0}
.person b{display:block;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.person small{display:block;color:var(--muted);font-size:.78rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.person i{font-style:normal;color:var(--accent);font-weight:800;font-size:.85rem}
.vs{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;text-align:center}
.vs .side{padding:10px 6px;border-radius:16px;background:var(--panel2);min-width:0;border:2px solid transparent}
.vs .side.win{border-color:var(--gold);box-shadow:0 0 18px -6px var(--gold)}
.vs .side small{display:block;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vs .side b{display:block;font-family:var(--display);font-weight:800;font-size:1.7rem;line-height:1.15;font-variant-numeric:tabular-nums}
.vs .side em{display:block;font-style:normal;font-size:.75rem;color:var(--muted);font-weight:700}
.vs .side em.on{color:var(--good)}
.vs .mid{font-family:var(--display);font-weight:800;color:var(--muted)}
.prize{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 14px;border-radius:14px;background:var(--panel2);font-weight:700}
.prize span{white-space:nowrap}
.prize b{font-family:var(--display);font-size:1.35rem;color:var(--gold);font-variant-numeric:tabular-nums;text-align:right}
.prize.none b{color:var(--muted);font-family:var(--body);font-size:.88rem}
.lrow{display:grid;grid-template-columns:1fr;gap:6px}
.lrow label{font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.lrow input{font:inherit;font-weight:600;min-height:46px;padding:0 12px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--ink);width:100%;min-width:0}
/* The menu: the player's best and the company's top list first, then Play and the challenges, then how to play. */
.top{display:flex;flex-direction:column;gap:8px;width:100%;text-align:left;padding:12px;border-radius:20px;background:var(--panel);border:2px solid var(--line)}
.mybest{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.mybest small{font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700}
.mybest b{font-family:var(--display);font-weight:800;font-size:2.1rem;line-height:1;color:var(--gold);font-variant-numeric:tabular-nums}
.mybest span{font-size:.85rem;color:var(--muted);font-weight:700}
.how{display:flex;flex-direction:column;align-items:center;gap:8px;padding-top:6px}
.how .demo{width:min(34cqw,140px);gap:6px}
.how .demo span{font-size:1.3rem;border-radius:10px}
.how h2{font-size:1.35rem}
/* The lobby: both players and where they are, a big Ready, and the ways out. */
.lobby{display:flex;flex-direction:column;gap:6px}
.lp{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:8px 10px;border-radius:14px;background:var(--panel2)}
.lp b{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lp em{font-style:normal;font-size:.72rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:4px 9px;border-radius:999px;border:2px solid var(--line);white-space:nowrap}
.lp em.joined{color:var(--ink);border-color:var(--ink)}
.lp em.ready{color:var(--accent-ink);background:var(--good);border-color:var(--good)}
.btn.go.unready{background:transparent;color:var(--ink);border-color:var(--line);box-shadow:0 5px 0 var(--line)}
.links{display:flex;justify-content:center;gap:18px;flex-wrap:wrap}
.links .link{padding:2px 0}
.shim{height:52px;border-radius:14px;background:linear-gradient(90deg,var(--panel2) 0%,var(--line) 50%,var(--panel2) 100%);background-size:200% 100%;opacity:.6}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:10}
.flash{position:fixed;inset:0;background:var(--gold);opacity:0;pointer-events:none;z-index:7}
@media (min-width:700px){.card{margin-block:auto}}
@keyframes rise{0%{opacity:0;transform:translate(-50%,10px) scale(.7)}18%{opacity:1;transform:translate(-50%,0) scale(1.1)}100%{opacity:0;transform:translate(-50%,-56px) scale(1)}}
@keyframes bump{40%{transform:scale(1.18)}}
@keyframes pop{0%{transform:scale(.3);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes okpop{50%{transform:scale(1.25)}100%{transform:scale(0);opacity:0}}
@keyframes shake{20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
@keyframes beat{50%{transform:scale(1.08)}}
@keyframes tickbeat{0%{transform:translate(-50%,-50%) scale(1.5);opacity:.6}100%{transform:translate(-50%,-50%) scale(1);opacity:.3}}
@keyframes flashk{0%{opacity:.5}100%{opacity:0}}
@keyframes hint{50%{transform:scale(1.12)}}
@keyframes shim{0%{background-position:100% 0}100%{background-position:-100% 0}}
@media (prefers-reduced-motion:no-preference){
  .toast{animation:rise 1s ease-out forwards} .score.bump,.combo.bump b,.bank b.bump{animation:bump .3s} .clock.low{animation:beat .5s infinite}
  .grid.in .cell{animation:pop .16s cubic-bezier(.2,1.6,.4,1) both} .cell.ok{animation:okpop .22s ease-in forwards} .cell.no{animation:shake .3s}
  .st.on{animation:pop .5s cubic-bezier(.2,1.8,.4,1)} .stars span.on{animation:pop .5s cubic-bezier(.2,1.8,.4,1) both} .flash.on{animation:flashk .5s ease-out} .cover .n{animation:pop .45s}
  .ticker.beat{animation:tickbeat .9s ease-out} .demo span.odd{animation:hint 1s ease-in-out infinite} .shim{animation:shim 1.2s linear infinite}
}
@media (prefers-reduced-motion:reduce){.toast{opacity:1}}
</style>
</head>
<body>
<main class="app">
  <header>
    <h1>Odd One Out</h1>
    <div class="hright"><button class="pill" id="snd" type="button" aria-pressed="true">Sound on</button></div>
  </header>
  <div class="hud" id="hud">
    <div class="clock" id="clock" role="timer" aria-label="Seconds left"><span id="secs">45</span></div>
    <div class="scorebox"><small>Score</small><span class="score" id="score">0</span></div>
    <div class="combo" id="combo"><b id="cx">×1</b><small id="streak">streak 0</small></div>
  </div>
  <div id="goalbox">
    <div class="goalrow"><span id="glabel">Fill the bar</span><span id="gnext"></span></div>
    <div class="goal"><div class="fill" id="gfill"></div><span class="st" id="st1">★</span><span class="st" id="st2">★</span><span class="st" id="st3">★</span></div>
  </div>
  <div class="rival" id="rival" hidden aria-live="off">
    <span class="rn">You<small>this round</small></span><div class="bar me"><i id="mbar"></i></div><b id="mscore">0</b>
    <span class="rn"><span id="rname"></span><small id="rstate"></small></span><div class="bar"><i id="rbar"></i></div><b id="rscore">0</b>
  </div>
  <div class="stage">
    <div class="grid" id="grid" aria-label="Find the tile that is different"></div>
    <div class="ticker" id="ticker" hidden></div>
    <div class="toasts" id="toasts" aria-live="polite"></div>
    <div class="cover" id="cover"></div>
  </div>

<script>
const $=id=>document.getElementById(id);
const ROUND=45, PENALTY=1, QUICK=1.0, MAXMULT=5, STARS=[400,1000,1800];
const bankFor=s=>Math.round(s/20), fmtn=x=>Math.round(x).toLocaleString('en-IN');
/* seeded-boards:start
   Everything a board depends on, and nothing else: board g of a round is a pure function of (seed, g), so two players given one seed see the same
   boards in the same order whatever they tap. A solo round takes a random seed; a challenge takes the server's. The Sowaka backend's check script
   (src/scripts/game-challenge-check.ts) runs this block on its own, so keep it free of anything outside it. */
const EASY=[['🐶','🐱'],['🍎','🍌'],['⭐','🌙'],['🚗','🚲'],['🌵','🌸'],['🐸','🐷'],['🍕','🍩'],['⚽','🎈'],['🐧','🦊'],['☕','🍦']];
const MED=[['🙂','🙃'],['🍊','🍑'],['🐭','🐹'],['🐻','🐨'],['🌲','🌳'],['👍','👎'],['🔒','🔓'],['🍋','🍐'],['🐯','🦁'],['🌞','🌝'],['🚕','🚗'],['👈','👉'],['🐰','🐭'],['🍓','🍒']];
const HARD=[['😀','😃'],['😐','😑'],['🕐','🕑'],['🌖','🌔'],['😮','😯'],['🔈','🔉'],['🙈','🙉'],['😺','😸'],['📪','📫'],['😛','😝'],['🕒','🕘'],['🌗','🌓'],['😄','😁'],['🐵','🙊']];
const MIRROR=['🐟','🦆','🐕','🚀','🐌','🦖','🏃','🐘','🚜','🦄','🐊','🐿'];
const sizeFor=g=>g<3?2:g<7?3:g<13?4:g<21?5:6;
function rng(a){ return ()=>{ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function boardAt(sd,g){
  const r=rng(sd*7919+g*104729+13), n=sizeFor(g), pick=a=>a[Math.floor(r()*a.length)];
  const roll=r(); let tier=g<4?'e':g<10?(roll<.5?'e':'m'):g<18?(roll<.5?'m':'h'):(roll<.45?'h':roll<.75?'x':'m');
  let base,odd,flip=false;
  if(tier==='x'){ base=odd=pick(MIRROR); flip=true; } else { const p=pick(tier==='e'?EASY:tier==='m'?MED:HARD); const sw=r()<.5; base=sw?p[1]:p[0]; odd=sw?p[0]:p[1]; }
  return {n,base,odd,flip,at:Math.floor(r()*n*n)};
}
/* seeded-boards:end */
const HUES=[45,200,330,150,265];
const MILE={5:'On fire!',10:'Unstoppable!',15:'Machine!',20:'Legend!',30:'Unreal!'};
let save={bank:0,best:0,rounds:0,sound:true,scores:[]};
try{const s=JSON.parse(localStorage.getItem('oddone.v1')||'null'); if(s&&typeof s.bank==='number') save=Object.assign(save,s);}catch(e){}
if(!Array.isArray(save.scores))save.scores=[];
const store=()=>{try{localStorage.setItem('oddone.v1',JSON.stringify(save));}catch(e){}};

/* ---------- Sowaka bridge ----------
   In the Sowaka app, window.Sowaka is there before this script runs (or arrives with a 'sowaka-ready' event):
     Sowaka.playerName()                -> "Tanvi Shah"
     Sowaka.submitScore(n)              -> Promise of the board after it, posted under the player's own session
     Sowaka.leaderboard()               -> Promise of {entries:[{rank,name,score,me}], me:{rank,score}|null, company, label}
   and for colleague challenges (each a Promise; a refusal rejects with .message, .status and sometimes .details):
     Sowaka.colleagues(query)           -> {colleagues:[{userId,name,designation,department,photoUrl}]}
     Sowaka.challenge(userId)           -> the new challenge
     Sowaka.challenges()                -> {incoming, outgoing, active, recent}: lists of challenges
     Sowaka.getChallenge(id)            -> one challenge
     Sowaka.acceptChallenge(id)         -> the challenge after it: answers a pending one; on an accepted one, says ready (or not ready) in its lobby
     Sowaka.declineChallenge(id)        -> the challenge after it: declines, withdraws (the challenger), calls off an accepted one neither has
                                           played, or clears a finished one from your own list, whichever fits
     Sowaka.reportLive(score, id)       -> the score mid-round, passed to the other player
     Sowaka.finishChallenge(id, score)  -> the challenge once this player's final is in
     Sowaka.startChallengeId            -> the challenge a tapped notification opened the game for, or null
   A challenge, as each player sees it: {id, seed (once accepted), status: pending|accepted|declined|expired|finished, role: challenger|opponent,
     me/them: {userId, name, score|null, live|null, liveAt}, outcome: won|lost|draw|null, myAward/theirAward: {kind, points, onlyOwnScore, reason}|null, expiresAt,
     withdrawnBy/cancelledBy: userId|null (a 'declined' one that was really withdrawn or called off),
     lobby: {open, me/them: away|joined|ready, startAt|null, serverNow}} — no `lobby` from a server older than it, and then each player starts on their own.
   The app calls window.onSowakaChallenge(evt) for each change: {kind: created|accepted|declined|withdrawn|cancelled|scored|finished|expired|lobby, challengeId, challenge},
     {kind:'start', challengeId, challenge, startAt, serverNow} when both are ready in the lobby,
     {kind:'live', challengeId, userId, score} for the other player's score mid-round, or {kind:'resync'} after a reconnection.
   In a plain browser there is no bridge: scores stay on this device, in localStorage, the board is your own, and there are no challenges. */
const LOCAL_TOP=10;
const bridge=()=>(window.Sowaka&&window.Sowaka.native)?window.Sowaka:null;
let board=null; /* the last board seen, for the best line under the grid */
function shapeBoard(r){ r=r||{}; const rows=(Array.isArray(r.entries)?r.entries:[]).map(x=>({rank:+x.rank||0,name:String(x.name||'Player'),score:+x.score||0,me:!!x.me}));
  const me=r.me&&typeof r.me.score==='number'?{rank:+r.me.rank||0,score:r.me.score}:null;
  return {rows,me,title:r.company?'Top at '+r.company:'Leaderboard',company:r.company?String(r.company):'',shared:true}; }
function localBoard(at){ const list=save.scores.slice(0,LOCAL_TOP);
  return {rows:list.map((x,i)=>({rank:i+1,name:'You',score:x.s,me:x.t===at})),me:null,title:'Your best on this device',shared:false}; }
function keepLocal(s){ const t=Date.now(); save.scores=save.scores.concat({s,t}).sort((a,b)=>b.s-a.s||a.t-b.t).slice(0,LOCAL_TOP); store(); return t; }
const Board={
  name(){ const b=bridge(); try{ const n=b&&b.playerName(); if(n)return String(n); }catch(e){} return ''; },
  first(){ return Board.name().trim().split(/\s+/)[0]||''; },
  /* Every round is kept on the device too, so a round played offline is not lost to the player. */
  submit(s){ const t=keepLocal(s), b=bridge(); if(!b)return Promise.resolve(localBoard(t));
    return Promise.resolve().then(()=>b.submitScore(s)).then(shapeBoard).catch(()=>Object.assign(localBoard(t),{offline:true})); },
  fetch(){ const b=bridge(); if(!b)return Promise.resolve(localBoard(-1)); return Promise.resolve().then(()=>b.leaderboard()).then(shapeBoard); },
};
/* A small cache on the device, one per player: the last leaderboard and colleague list, so the menu and the picker open with names at once. */
function cacheKey(k){ let h=7; for(const ch of Board.name()||'?')h=(h*31+ch.codePointAt(0))>>>0; return 'oddone.'+k+'.'+h.toString(36); }
function cacheGet(k){ try{ const v=JSON.parse(localStorage.getItem(cacheKey(k))||'null'); return v&&typeof v==='object'?v:null; }catch(e){ return null; } }
function cachePut(k,v){ try{ localStorage.setItem(cacheKey(k),JSON.stringify(v)); }catch(e){} }
function seeBoard(b){ if(!b||!b.shared)return; board=b; if(b.me&&b.me.score>save.best){save.best=b.me.score;store();}
  if(!b.offline)cachePut('board',{rows:b.rows,me:b.me,title:b.title,company:b.company}); renderTop(); }
function refreshBoard(){ if(!bridge())return;
  if(!board){ const kept=cacheGet('board'); if(kept&&Array.isArray(kept.rows)){ board=Object.assign({me:null,title:'Leaderboard',company:''},kept,{shared:true}); renderTop(); } }
  Board.fetch().then(seeBoard).catch(()=>{}); }
/* The board, drawn into box: the top `limit` and, when the player is further down, their own row under it. */
function drawBoard(box,b,limit){
  box.innerHTML=''; const h=el('div','lbh'); h.append(el('span','',b.title)); if(b.me&&b.shared)h.append(el('span','','You: #'+b.me.rank)); box.appendChild(h);
  if(b.offline)box.appendChild(el('p','wait','Could not reach the leaderboard. This round is kept on this device.'));
  if(!b.rows.length){ box.appendChild(el('p','wait','No scores yet. Yours will be the first.')); return; }
  const list=el('div','ranks'), row=(r,name)=>{ const w=el('div','rank'+(r.me?' me':'')), left=el('span'); left.append(el('i','pos',String(r.rank)),document.createTextNode(' '+name)); w.append(left,el('b','',fmtn(r.score))); list.appendChild(w); };
  const shown=b.rows.slice(0,limit); shown.forEach(r=>row(r,r.me&&b.shared?(r.name+' (you)'):r.name));
  if(b.me&&b.shared&&!shown.some(r=>r.me))row({rank:b.me.rank,score:b.me.score,me:true},(Board.name()||'You')+' (you)');
  box.appendChild(list);
  if(b.rows.length>limit){ const more=el('button','link','Show the top '+b.rows.length); more.type='button'; more.onclick=()=>{sfx.ui();drawBoard(box,b,b.rows.length);}; box.appendChild(more); }
}
function boardBox(pending){ const box=el('div','lb'); box.append(el('div','lbh','Leaderboard'),el('p','wait',bridge()?'Saving your score…':''));
  pending.then(b=>{seeBoard(b);drawBoard(box,b,5);}).catch(()=>{box.lastChild.textContent='Could not load the leaderboard.';}); return box; }
function openBoard(){ sfx.ui(); const box=el('div','lb'); box.appendChild(el('p','wait','Loading…'));
  openSheet('Leaderboard',[box],[['Close',closeSheet,true]]);
  Board.fetch().then(b=>{seeBoard(b);drawBoard(box,b,LOCAL_TOP);}).catch(()=>{box.innerHTML='';box.appendChild(el('p','wait','Could not load the leaderboard. Try again in a moment.'));}); }
let mode='idle', seed=1, gi=0, cur=null, score=0, shown=0, streak=0, bestStreak=0, miss=0, cleared=0, endAt=0, shownAt=0, timer=null, countTimer=null, lastSec=-1, locked=false, duel=null, resetArmed=false, starsNow=0;
const now=()=>performance.now()/1000;
const reduce=()=>window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const multFor=s=>Math.min(MAXMULT,1+Math.floor(Math.max(0,s-1)/3));
const makeGrid=g=>boardAt(seed,g);
/* ---------- sound ---------- */
let AC=null, OUT=null, audioMode='web', audioChecked=false, tagBlocked=false;
function ac(){ if(!save.sound)return null; if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();
    const comp=AC.createDynamicsCompressor(); OUT=AC.createGain(); OUT.gain.value=2.2; OUT.connect(comp); comp.connect(AC.destination);}catch(e){AC=null;return null;}}
  if(AC.state!=='running'){try{const p=AC.resume(); if(p&&p.catch)p.catch(()=>{});}catch(e){}} return AC; }
function webTone(a,f,d,o){ const t=a.currentTime+(o.at||0), os=a.createOscillator(), g=a.createGain();
  os.type=o.type||'triangle'; os.frequency.setValueAtTime(f,t); if(o.to)os.frequency.exponentialRampToValueAtTime(o.to,t+d);
  g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(o.vol||0.16,t+0.012); g.gain.exponentialRampToValueAtTime(0.0001,t+d);
  os.connect(g); g.connect(OUT); os.start(t); os.stop(t+d+0.03); }
const wavCache={};
function wav(f,d,to){ const k=Math.round(f)+'|'+d+'|'+(to||0); if(wavCache[k])return wavCache[k];
  const sr=11025, N=Math.floor(sr*d), buf=new Uint8Array(44+N), dv=new DataView(buf.buffer); const w=(o,s)=>{for(let i=0;i<s.length;i++)buf[o+i]=s.charCodeAt(i);};
  w(0,'RIFF'); dv.setUint32(4,36+N,true); w(8,'WAVEfmt '); dv.setUint32(16,16,true); dv.setUint16(20,1,true); dv.setUint16(22,1,true); dv.setUint32(24,sr,true); dv.setUint32(28,sr,true); dv.setUint16(32,1,true); dv.setUint16(34,8,true); w(36,'data'); dv.setUint32(40,N,true);
  let ph=0; for(let i=0;i<N;i++){ const x=i/N, fr=to?f*Math.pow(to/f,x):f; ph+=2*Math.PI*fr/sr; const env=Math.min(1,i/60)*Math.pow(1-x,1.5); buf[44+i]=128+Math.round(110*env*Math.sin(ph)); }
  let s=''; for(let i=0;i<buf.length;i++)s+=String.fromCharCode(buf[i]); return wavCache[k]='data:audio/wav;base64,'+btoa(s); }
function tagTone(f,d,o){ const go=()=>{ try{ const au=new Audio(wav(f,Math.max(0.08,d),o.to)); au.volume=Math.min(1,(o.vol||0.16)*4); const p=au.play(); if(p&&p.catch)p.catch(()=>{ if(!tagBlocked){tagBlocked=true;sndLabel();} }); }catch(e){} }; if(o.at)setTimeout(go,o.at*1000); else go(); }
function tone(f,d,o){ o=o||{}; if(!save.sound)return; if(audioMode==='tag')return tagTone(f,d,o); const a=ac(); if(!a)return tagTone(f,d,o); webTone(a,f,d,o); }
function sndLabel(){ const b=$('snd'); b.textContent=!save.sound?'Sound off':(tagBlocked?'Sound blocked':'Sound on'); b.setAttribute('aria-pressed',save.sound?'true':'false'); }
function unlockAudio(){ if(!save.sound||audioChecked)return; const a=ac();
  setTimeout(()=>{ if(audioChecked)return; audioChecked=true; if(!a||a.state!=='running'){ audioMode='tag'; tagTone(660,0.08,{vol:.12}); } },450); }
['pointerup','touchend','click','keydown'].forEach(ev=>document.addEventListener(ev,unlockAudio,true));
const SC=[0,2,4,7,9], nt=i=>261.63*Math.pow(2,(SC[i%5]+12*Math.min(2,Math.floor(i/5)))/12);
const sfx={
  pop(s,m){ const i=Math.min(s,14); tone(nt(i),0.12,{vol:.2}); tone(nt(i)*2,0.09,{type:'sine',vol:.09,at:.03}); if(m>1)tone(nt(i)*1.5,0.16,{type:'sine',vol:.05+m*.01,at:.05}); },
  quick(){tone(1568,0.06,{type:'sine',vol:.09,at:.06});tone(2093,0.1,{type:'sine',vol:.09,at:.11});},
  no(){tone(150,0.12,{type:'square',to:90,vol:.12});tone(110,0.16,{type:'square',to:70,vol:.1,at:.1});},
  mult(m){tone(440*Math.pow(1.122,m*2),0.18,{type:'sawtooth',to:880*Math.pow(1.122,m*2),vol:.07,at:.04});},
  lost(){tone(330,0.25,{type:'sine',to:165,vol:.09,at:.15});},
  grow(){[392,523,659,784].forEach((f,i)=>tone(f,0.1,{vol:.13,at:.08+i*.05}));},
  mile(){[523,659,784,1047,1319].forEach((f,i)=>tone(f,0.2,{vol:.18,at:i*.07}));[523,784,1047].forEach(f=>tone(f,0.8,{type:'sine',vol:.08,at:.4}));},
  star(k){tone(1047*Math.pow(1.26,k),0.5,{type:'sine',vol:.16});tone(2093*Math.pow(1.26,k),0.6,{type:'sine',vol:.08,at:.04});},
  tick(k){k=k||1;tone(700+k*70,0.05,{type:'square',vol:.07+k*.008});tone(350+k*35,0.09,{type:'sine',vol:.1,at:.02});},
  count(){tone(523,0.14,{vol:.18});},
  go(){tone(784,0.12,{vol:.2});tone(1047,0.3,{vol:.2,at:.1});},
  timeup(){tone(196,0.9,{type:'sine',to:98,vol:.22});tone(294,0.9,{type:'triangle',to:147,vol:.12});},
  coin(i){tone(1175+i*40,0.05,{type:'square',vol:.05});},
  win(){[523,659,784,1047].forEach((f,i)=>tone(f,0.2,{vol:.2,at:i*.1}));[523,659,784].forEach(f=>tone(f,0.9,{type:'sine',vol:.1,at:.42}));},
  lose(){[392,330,262,196].forEach((f,i)=>tone(f,0.24,{type:'sawtooth',vol:.08,at:i*.13}));},
  ui(){tone(700,0.05,{type:'sine',vol:.1});},
  horn(){tone(294,0.16,{type:'sawtooth',vol:.1});tone(440,0.3,{type:'sawtooth',vol:.1,at:.14});},
  ahead(){tone(880,0.09,{vol:.12});tone(1175,0.16,{vol:.12,at:.08});},
  behind(){tone(466,0.1,{type:'square',vol:.07});tone(370,0.2,{type:'square',vol:.07,at:.1});}
};
function buzz(p){try{if(navigator.vibrate)navigator.vibrate(p);}catch(e){}}

/* ---------- confetti ---------- */
const fx=$('fx'), fctx=fx.getContext('2d'); let parts=[], fxOn=false;
function fxSize(){fx.width=innerWidth;fx.height=innerHeight;} fxSize(); addEventListener('resize',fxSize);
function burst(x,y,n,cols){ if(reduce())return; for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2, sp=3+Math.random()*9; parts.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-5,s:4+Math.random()*6,r:Math.random()*6,vr:(Math.random()-.5)*.5,c:cols[i%cols.length],life:60+Math.random()*30});}
  if(!fxOn){fxOn=true;requestAnimationFrame(fxLoop);} }
function fxLoop(){ fctx.clearRect(0,0,fx.width,fx.height); parts=parts.filter(p=>p.life>0);
  for(const p of parts){p.vy+=0.35;p.x+=p.vx;p.y+=p.vy;p.vx*=.985;p.r+=p.vr;p.life--; fctx.save();fctx.translate(p.x,p.y);fctx.rotate(p.r);fctx.globalAlpha=Math.min(1,p.life/25);fctx.fillStyle=p.c;fctx.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6);fctx.restore();}
  if(parts.length)requestAnimationFrame(fxLoop); else {fxOn=false;fctx.clearRect(0,0,fx.width,fx.height);} }
const COLS=['#39C6C0','#4C9BFF','#A77BFF','#FF6FB5','#FFD23F','#4BE39A','#FFF6DE'];
function centre(el){const r=el.getBoundingClientRect();return [r.left+r.width/2,r.top+r.height/2];}

const el=(tag,cls,text)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(text!==undefined)e.textContent=text;return e;};
function toast(text,cls,xy){ const t=el('span','toast'+(cls?' '+cls:''),text); if(xy){ const r=$('toasts').getBoundingClientRect(); t.style.left=Math.max(84,Math.min(r.width-84,xy[0]-r.left))+'px'; t.style.top=Math.max(-10,xy[1]-r.top-40)+'px'; } $('toasts').appendChild(t); setTimeout(()=>t.remove(),1050); }

/* ---------- render ---------- */
/* The best line under the grid while playing, and on the menu the top card: the player's best, where it stands, and the company's top list. */
function renderTop(){ sndLabel(); $('best').textContent=mode!=='idle'&&save.best?'Your best: '+fmtn(save.best)+(board&&board.me?' · #'+board.me.rank+' here':''):'';
  const mb=$('mybest'); if(mb){ mb.textContent=save.best?fmtn(save.best):'—';
    $('myrank').textContent=board&&board.me?'#'+board.me.rank+(board.company?' at '+board.company:' here'):(save.best?'':'Play a round to set one'); }
  const box=$('toplb'); if(box){ const b=board||(bridge()?null:localBoard(-1));
    if(b)drawBoard(box,b,5); else if(!box.childElementCount)box.appendChild(el('p','wait','Loading the leaderboard…')); } }
function topCard(){ const t=el('div','top'), mb=el('div','mybest'), best=el('b'), rank=el('span'), lb=el('div','lb');
  best.id='mybest'; rank.id='myrank'; lb.id='toplb'; mb.append(el('small','','Your best'),best,rank); t.append(mb,lb); return t; }
function renderHud(instant){
  const left=mode==='play'?Math.max(0,endAt-now()):ROUND; $('secs').textContent=Math.ceil(left);
  $('clock').style.setProperty('--pct',Math.min(100,left/ROUND*100)+'%'); $('clock').classList.toggle('low',mode==='play'&&left<=10);

}
function renderGoal(){ const max=STARS[2]*1.08; $('gfill').style.width=Math.min(100,score/max*100)+'%';
  STARS.forEach((t,i)=>{const e=$('st'+(i+1)); e.style.left=(t/max*100)+'%'; e.classList.toggle('on',score>=t);});
  const nxt=STARS.find(t=>score<t); $('glabel').textContent=mode==='play'||mode==='over'?cleared+' found':'Fill the bar'; $('gnext').textContent=nxt?fmtn(nxt-score)+' to next star':'All three stars!'; }
/* The other player's score as this page last heard it: their final once it is in, else the last live one. */
function rivalScore(){ if(!duel)return 0; return duel.theirFinal!=null?duel.theirFinal:(duel.theirLive||0); }
const liveNow=d=>!!d.theirLiveAt&&Date.now()-d.theirLiveAt<8000;
function renderRival(){ const r=$('rival'); r.hidden=!duel; if(!duel)return; const rs=rivalScore(), max=STARS[2]*1.08;
  $('rname').textContent=duel.first; const st=$('rstate');
  st.textContent=duel.theirFinal!=null?'finished':(liveNow(duel)?'playing now':'not playing yet'); st.className=duel.theirFinal==null&&liveNow(duel)?'on':'';
  $('rscore').textContent=duel.theirFinal==null&&!duel.theirLive?'—':fmtn(rs); $('rbar').style.width=Math.min(100,rs/max*100)+'%';
  $('mscore').textContent=fmtn(score); $('mbar').style.width=Math.min(100,score/max*100)+'%'; }
function showGrid(){
  cur=makeGrid(gi); const g=$('grid'); g.style.setProperty('--n',cur.n); g.innerHTML=''; g.className='grid in';
  for(let i=0;i<cur.n*cur.n;i++){ const b=el('button','cell'+(cur.flip&&i===cur.at?' flip':'')); b.type='button'; b.setAttribute('aria-label','Tile '+(Math.floor(i/cur.n)+1)+', '+(i%cur.n+1)); b.appendChild(el('i','',i===cur.at?cur.odd:cur.base));

      if(isShowing(id)){ sfx.no(); openSheet(n+' withdrew it',[el('p','note','The challenge is off. Nothing to answer.')],[['Close',dismiss,true]]); renderInbox(); return; }
      if(!busy)toast(n+' withdrew their challenge','feed'); break;
    case 'cancelled':
      if(isShowing(id)){ sfx.no(); openSheet(n+' called it off',[el('p','note','No result and no points.')],[['Close',dismiss,false],['Challenge someone',openPicker,true]]); renderInbox(); return; }
      toast(n+' called off the challenge','feed'); break;
    case 'lobby':
      if(!busy&&v.me&&v.me.score==null&&inLobbyNow(v)&&!(before&&inLobbyNow(before))){ sfx.horn(); toast(n+' is in the lobby','feed'); }
      break;
    case 'start':
      /* Both were ready, but this page had left the lobby: offer the round, which starts late or on its own. */
      if(!busy&&v.status==='accepted'&&v.me.score==null){ const at=localStart(evt.startAt||(v.lobby&&v.lobby.startAt),evt.serverNow||(v.lobby&&v.lobby.serverNow));
        openSheet('Starting now',[el('p','note',n+' is ready and your round together is starting.')],[['Not now',dismiss,false],['Play',()=>synced(v,at),true]]); showing(id); return; }
      break;
    case 'scored': if(duel&&duel.id===id&&v.them.score!=null){ duel.theirFinal=v.them.score; renderRival(); toast(n+' finished on '+fmtn(v.them.score),'feed'); } break;
    case 'expired':
      if(CH.waiting===id){ openSheet('No answer from '+n,[el('p','note','The challenge expired. Nobody wins an expired challenge.')],[['Close',dismiss,false],['Challenge someone',openPicker,true]]); return; }
      break;
  }
  if(CH.result&&CH.result.id===id)showResult(v,CH.result.played);
  renderInbox(); refreshOpenList();
}
window.onSowakaChallenge=evt=>{ try{ onChallengeEvent(evt); }catch(e){} };
/* With the bridge: the lists, the colleagues (fetched now so the picker opens at once), a final that never landed, and the challenge a tapped notification opened the game for. */
function challengesReady(){ if(!canChallenge())return; if(mode==='idle'&&!$('chbtn'))menu(); refreshChallenges(); peopleKept(); loadPeople().catch(()=>{});
  if(save.pendingFinish&&save.pendingFinish.id)sendFinish(save.pendingFinish.id,save.pendingFinish.score);
  const want=bridge().startChallengeId; if(want&&!CH.opened){ CH.opened=true; openChallenge(String(want)); } }
/* Away from the screen with a ready given: taken back, so the round never starts without you. Back again: a heartbeat at once. */
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){ if(LB&&LB.v.lobby&&LB.v.lobby.me==='ready'&&!LB.busy)tapReady(); return; }
  if(LB)beat(LB.id); else if(mode==='idle'){ refreshChallenges(); refreshBoard(); } });
/* ---------- input ---------- */
$('snd').onclick=()=>{ save.sound=!save.sound; store(); sndLabel(); if(save.sound){audioChecked=false;unlockAudio();sfx.go();} };
$('reset').onclick=()=>{ if(!resetArmed){resetArmed=true;$('reset').textContent='Tap again to wipe your bank';setTimeout(()=>{resetArmed=false;$('reset').textContent='Start over';},3000);return;}
  resetArmed=false;$('reset').textContent='Start over';save=Object.assign(save,{bank:0,best:0,rounds:0});store();clearInterval(timer);clearInterval(countTimer);duel=null;menu(); };
document.addEventListener('keydown',e=>{ if(e.key==='Escape'&&!$('sheet').hidden&&mode!=='over')closeSheet(); });
$('lbopen').onclick=openBoard;
['gesturestart','gesturechange'].forEach(ev=>document.addEventListener(ev,e=>e.preventDefault(),{passive:false}));
addEventListener('sowaka-ready',()=>{ refreshBoard(); challengesReady(); });
menu();
refreshBoard();
challengesReady();
</script>
