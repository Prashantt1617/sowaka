<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<!--POKER-TICKET-->
<title>Speed Poker</title>
<style>
:root{
  --bg:#081a12; --bg2:#0d2419; --panel:#112b20; --panel2:#163627; --line:rgba(255,255,255,.09);
  --ink:#eef5ef; --muted:#9db3a6; --faint:#6f877a;
  --felt1:#23744d; --felt2:#155238; --felt3:#0e3a28; --rail:#1b130c; --rail2:#3a2716;
  --gold:#e5b850; --gold2:#b88a2a; --red:#e0564b; --blue:#3f8cff; --green:#2fbf71; --club:#1f9d55; --diamond:#2f7de1;
  --fold:#5b2b2b; --fold2:#a8473f; --call:#1d5f8a; --call2:#2f8fd0; --raise:#8a5a12; --raise2:#e0a12f;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Roboto","Segoe UI",system-ui,sans-serif;
  --display:"Avenir Next","SF Pro Display","Roboto Condensed",-apple-system,system-ui,sans-serif;
  --mono:"SF Mono",ui-monospace,Menlo,Consolas,monospace;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.35;overscroll-behavior:none}
body{-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.hidden{display:none!important}
#app{position:fixed;inset:0;display:flex;flex-direction:column;padding-top:var(--safe-t)}

/* ---------- shared bits ---------- */
.chip{white-space:nowrap;flex:none;display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:700;letter-spacing:.02em;background:rgba(255,255,255,.08);color:var(--ink)}
.chip.gold{background:rgba(229,184,80,.16);color:var(--gold)}
.chip.red{background:rgba(224,86,75,.16);color:#ff8a7f}
.chip.green{background:rgba(47,191,113,.16);color:#6fe0a3}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:48px;border-radius:14px;padding:0 18px;font-weight:800;font-size:16px;letter-spacing:.01em}
.btn.primary{background:linear-gradient(180deg,#f2c95e,#d49c25);color:#2a1a02;box-shadow:0 6px 18px rgba(212,156,37,.25)}
.btn.ghost{background:rgba(255,255,255,.07);color:var(--ink)}
.btn.small{min-height:36px;font-size:14px;border-radius:10px;padding:0 12px}
.btn:disabled{opacity:.45}
.avatar.xs{width:24px;height:24px;font-size:9px}
.avatar.sm{width:30px;height:30px;font-size:11px}
.stack{display:flex;align-items:center}
.stack .avatar{margin-left:-7px;box-shadow:0 0 0 2px var(--panel)}
.stack .avatar:first-child{margin-left:0}
.pp{display:inline-flex;align-items:center;gap:6px;margin:4px 10px 4px 0;font-size:13px;color:#d3e3d9}
.opt .avatar{display:inline-flex;vertical-align:middle;margin-right:6px}
.opt{display:inline-flex;align-items:center}
.me-face{width:34px;height:34px}
.avatar{width:38px;height:38px;border-radius:50%;background:#2a4a3a center/cover no-repeat;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;color:#dfeee5;flex:none}
.toast{position:fixed;left:50%;bottom:calc(90px + var(--safe-b));transform:translateX(-50%);background:rgba(10,18,14,.95);border:1px solid var(--line);padding:10px 14px;border-radius:12px;font-size:14px;max-width:88vw;z-index:50;box-shadow:0 8px 30px rgba(0,0,0,.4);transition:opacity .2s}

/* ---------- lobby ---------- */
#lobby{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 16px calc(24px + var(--safe-b))}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.brand{display:flex;align-items:center;gap:10px}
.brand .mark{width:36px;height:36px;border-radius:10px;background:linear-gradient(160deg,var(--felt1),var(--felt3));display:flex;align-items:center;justify-content:center;font-size:20px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)}
.brand h1{margin:0;font-family:var(--display);font-size:20px;font-weight:800;letter-spacing:.01em}
.brand .sub{font-size:12px;color:var(--muted)}
.hero{background:radial-gradient(120% 140% at 50% 0%,var(--felt1),var(--felt3) 70%);border-radius:20px;padding:18px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08),0 10px 30px rgba(0,0,0,.25);position:relative;overflow:hidden}
.hero h2{margin:0 0 4px;font-family:var(--display);font-size:22px;font-weight:800}
.hero p{margin:0 0 14px;color:#cfe4d7;font-size:14px}
.hero .row{display:flex;gap:10px}
.hero .row .btn{flex:1}
.hero .count{font-family:var(--display);font-size:40px;font-weight:800;line-height:1}
.suits{position:absolute;right:-6px;top:-10px;font-size:84px;opacity:.07;letter-spacing:-8px;pointer-events:none}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0 4px}
.stat{background:var(--panel);border-radius:12px;padding:10px 8px;text-align:center}
.stat b{display:block;font-family:var(--display);font-size:18px;font-weight:800}
.stat span{font-size:11px;color:var(--muted)}
.tabs{display:flex;gap:6px;margin:16px 0 10px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:8px 14px;border-radius:999px;background:var(--panel);color:var(--muted);font-weight:700;font-size:13px;white-space:nowrap}
.tab.on{background:var(--ink);color:#0b1a12}
.card{background:var(--panel);border-radius:16px;padding:6px 0;margin-bottom:12px}
.card h3{margin:8px 14px 6px;font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.rowi{display:flex;align-items:center;gap:10px;padding:9px 14px}
.rowi+.rowi{border-top:1px solid var(--line)}
.rowi .rank{width:24px;text-align:right;font-weight:800;color:var(--muted);font-variant-numeric:tabular-nums}
.rowi .who{flex:1;min-width:0}
.rowi .who b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rowi .who span{font-size:12px;color:var(--muted)}
.rowi .pts{font-weight:800;font-variant-numeric:tabular-nums}
.rowi.me{background:rgba(229,184,80,.08)}
.bar{height:8px;border-radius:4px;background:rgba(255,255,255,.08);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold2),var(--gold))}
.empty{padding:16px 14px;color:var(--muted);font-size:14px}
.rules p{margin:0 14px 10px;font-size:14px;color:#d3e3d9}
.pickbox{padding:4px 14px 12px}
.pickbox .q{font-size:13px;color:var(--muted);margin:10px 0 6px}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opt{padding:8px 10px;border-radius:10px;background:var(--panel2);font-size:13px;font-weight:700}
.opt.on{background:var(--gold);color:#2a1a02}
.stake{display:flex;align-items:center;gap:8px;margin-top:10px}
.stake input{flex:1;accent-color:var(--gold)}

/* ---------- table ---------- */
#table{flex:1;display:flex;flex-direction:column;min-height:0;background:radial-gradient(140% 90% at 50% 40%,#0f2a1e,#06130d 70%)}
.tbar{display:flex;align-items:center;gap:10px;padding:8px 12px}
.tbar .back{width:36px;height:36px;border-radius:10px;background:rgba(255,255,255,.07);display:flex;align-items:center;justify-content:center;font-size:18px}
.tbar .title{flex:1;min-width:0}
.tbar .title b{display:block;font-size:15px}
.tbar .title span{font-size:12px;color:var(--muted)}
.tbar .clock{font-family:var(--mono);font-weight:700;font-size:15px;padding:6px 10px;border-radius:10px;background:rgba(0,0,0,.3)}
.tbar .clock.low{color:#ff8a7f}
.stage{flex:1;position:relative;min-height:0;margin:0 8px}
.felt{position:absolute;left:7%;right:7%;top:9%;bottom:15%;border-radius:999px;background:radial-gradient(100% 70% at 50% 45%,var(--felt1),var(--felt2) 60%,var(--felt3));box-shadow:0 0 0 10px var(--rail),0 0 0 12px var(--rail2),0 0 0 13px rgba(229,184,80,.25),0 20px 50px rgba(0,0,0,.55),inset 0 0 60px rgba(0,0,0,.35)}
.felt::after{content:"";position:absolute;inset:14px;border-radius:999px;border:1px solid rgba(255,255,255,.07)}
.landscape .felt{left:10%;right:10%;top:14%;bottom:16%}
.center{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:8px;z-index:3}
.pot{font-weight:800;font-size:14px;padding:4px 12px;border-radius:999px;background:rgba(0,0,0,.35);color:#f3e2b2}
.board{display:flex;flex-direction:column;align-items:center;gap:7px}
/* the flop on top, the turn and the river under it, with the deck and the burn pile either side of them */
.board .row{display:flex;gap:6px;align-items:center}
.board .pc,.board .flip{width:46px;height:64px}
.board .pc{border-radius:7px}
.board .pc .r{font-size:20px;left:5px;top:3px}.board .pc .s{font-size:25px;right:5px;bottom:2px}
.board .side{width:30px;height:42px;position:relative;margin:0 6px;flex:none}
.board .side .pc{position:absolute;inset:0;width:30px;height:42px;border-radius:5px}
.board .deck .pc:nth-child(2){transform:translate(-2px,-2px)}.board .deck .pc:nth-child(3){transform:translate(-4px,-4px)}
.board .burn .pc{transform:rotate(calc(var(--i,0) * 9deg - 9deg))}
.board .side .lbl{position:absolute;left:50%;top:100%;transform:translateX(-50%);margin-top:3px;font-size:9px;letter-spacing:.12em;color:rgba(255,255,255,.35);font-weight:700}
/* a card dealt to the board: off the deck face down, into its place, then turned over */
.flip{position:relative;perspective:600px;flex:none}
.flip .in{position:absolute;inset:0;transform-style:preserve-3d;animation:dealflip .9s cubic-bezier(.2,.7,.2,1) both;animation-delay:var(--d,0ms)}
.flip .in>.pc{position:absolute;inset:0;width:100%;height:100%;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.flip .in>.pc.back{transform:rotateY(180deg)}
@keyframes dealflip{0%{transform:translate(var(--fx,90px),var(--fy,40px)) rotateY(180deg) scale(.6);opacity:0}12%{opacity:1}55%{transform:translate(0,0) rotateY(180deg) scale(1)}100%{transform:translate(0,0) rotateY(0) scale(1)}}
.board .burn .pc.new{animation:burnin .45s ease-out both;animation-delay:var(--d,0ms)}
@keyframes burnin{from{transform:translate(170px,0) rotate(0);opacity:0}to{opacity:1}}
.watermark{position:absolute;left:50%;top:62%;transform:translate(-50%,-50%);font-family:var(--display);font-weight:800;font-size:13px;letter-spacing:.3em;color:rgba(255,255,255,.08);white-space:nowrap}

/* cards: a four-colour deck reads at a glance on a phone */
.pc{width:38px;height:54px;border-radius:6px;background:#fbfbf7;color:#111;position:relative;box-shadow:0 2px 6px rgba(0,0,0,.4);flex:none;font-family:var(--display)}
.pc .r{position:absolute;left:4px;top:2px;font-weight:800;font-size:17px;line-height:1}
.pc .s{position:absolute;right:4px;bottom:1px;font-size:22px;line-height:1}
.pc.h{color:#d62d2d}.pc.d{color:#1f6fd6}.pc.c{color:#178a44}.pc.s{color:#141414}
.pc.slot{background:rgba(255,255,255,.06);box-shadow:inset 0 0 0 1px rgba(255,255,255,.1)}
.pc.back{background:repeating-linear-gradient(45deg,#7a1f1f 0 4px,#8f2a2a 4px 8px);box-shadow:inset 0 0 0 2px #f3e9d0,0 2px 6px rgba(0,0,0,.4)}
.pc.big{width:58px;height:82px;border-radius:9px}
.pc.big .r{font-size:26px;left:6px;top:4px}.pc.big .s{font-size:34px;right:6px;bottom:2px}
.pc.mini{width:24px;height:34px;border-radius:4px}
.pc.mini .r{font-size:12px;left:3px;top:1px}.pc.mini .s{font-size:13px;right:2px;bottom:0}
.pc.win{box-shadow:0 0 0 2px var(--gold),0 0 14px rgba(229,184,80,.7)}
.pc.dim{filter:brightness(.55)}
.pc.deal{animation:deal .28s ease-out both}
@media (prefers-reduced-motion:reduce){.flip .in,.board .burn .pc.new{animation:none}}
@keyframes deal{from{transform:translateY(-14px) scale(.9);opacity:0}to{transform:none;opacity:1}}

.seat{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;width:92px;z-index:4;transition:opacity .2s}
.seat .ring{position:relative;width:56px;height:56px;border-radius:50%;padding:3px;background:rgba(0,0,0,.35)}
.seat .ring .avatar{width:50px;height:50px;font-size:16px;box-shadow:0 0 0 2px rgba(0,0,0,.5)}
.seat.toact .ring{background:conic-gradient(var(--gold) calc(var(--t,1)*360deg),rgba(0,0,0,.35) 0)}
.seat.toact.hurry .ring{background:conic-gradient(var(--red) calc(var(--t,1)*360deg),rgba(0,0,0,.35) 0)}
.seat .plate{margin-top:-8px;background:rgba(8,14,11,.92);border:1px solid rgba(255,255,255,.1);border-radius:10px;padding:3px 8px;min-width:78px;text-align:center;position:relative;z-index:2}
.seat .plate b{display:block;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:84px}
.seat .plate span{font-size:13px;font-weight:800;color:#f3e2b2;font-variant-numeric:tabular-nums}
.seat.me .plate{border-color:rgba(229,184,80,.6)}
.seat.folded{opacity:.45}
.seat.out{opacity:.3}
.seat .tag{position:absolute;top:-6px;left:50%;transform:translateX(-50%);font-size:10px;font-weight:800;padding:1px 6px;border-radius:6px;background:#000;color:#fff;letter-spacing:.04em;z-index:3;white-space:nowrap}
.seat .tag.allin{background:var(--red)}
.seat .tag.act{background:#1f2a24;color:#cfe;}
.seat .tag.bounty{background:var(--gold);color:#2a1a02}
.seat .hole{position:absolute;top:-4px;display:flex;gap:0;z-index:1}
/* tucked against the avatar, not out over the board */
.seat .hole.r{left:58px}.seat .hole.l{right:58px}
.seat .hole .pc.mini{width:20px;height:28px}
.seat .hole .pc.mini+.pc.mini{margin-left:-6px;transform:rotate(8deg)}
/* a short screen (the game inside the app): a smaller board, a little higher */
@media (max-height:720px){.board .pc,.board .flip{width:38px;height:53px}.board .pc .r{font-size:17px}.board .pc .s{font-size:20px}.center{top:48%;gap:6px}.board{gap:5px}.board .side .lbl{display:none}.pot{font-size:13px;padding:3px 10px}.board .row{gap:5px}.board .side,.board .side .pc{width:26px;height:36px}.watermark{display:none}}
.seat .shown{display:flex;gap:2px;margin-top:3px}
.bet{position:absolute;transform:translate(-50%,-50%);display:flex;align-items:center;gap:4px;font-size:12px;font-weight:800;color:#f3e2b2;z-index:3;white-space:nowrap}
.bet i{width:14px;height:14px;border-radius:50%;background:radial-gradient(circle at 50% 50%,#fff 0 22%,#d23c3c 23% 60%,#fff 61% 70%,#d23c3c 71%);box-shadow:0 1px 2px rgba(0,0,0,.5)}
.dealer{position:absolute;transform:translate(-50%,-50%);width:22px;height:22px;border-radius:50%;background:#f7f3e6;color:#111;font-weight:900;font-size:12px;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 4px rgba(0,0,0,.5);z-index:3}
.banner{position:absolute;left:50%;top:27%;transform:translate(-50%,-50%);background:rgba(8,14,11,.9);border:1px solid rgba(229,184,80,.5);color:#f6e7bd;padding:8px 14px;border-radius:12px;font-weight:700;font-size:14px;z-index:6;text-align:center;max-width:82%;animation:pop .25s ease-out}
@keyframes pop{from{transform:translate(-50%,-50%) scale(.9);opacity:0}}
.mine{display:flex;justify-content:center;gap:8px;padding:2px 0 6px;min-height:88px;align-items:flex-end}
.mine .hand{font-size:12px;color:var(--muted);text-align:center;margin-top:2px}

.actions{padding:8px 10px calc(10px + var(--safe-b));background:linear-gradient(180deg,rgba(6,19,13,0),rgba(6,19,13,.9) 30%)}
.abar{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.abtn{min-height:56px;border-radius:14px;font-weight:800;font-size:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1;box-shadow:inset 0 -3px 0 rgba(0,0,0,.25)}
.abtn small{font-size:12px;font-weight:700;opacity:.85}
.abtn.fold{background:linear-gradient(180deg,var(--fold2),var(--fold))}
.abtn.call{background:linear-gradient(180deg,var(--call2),var(--call))}
.abtn.raise{background:linear-gradient(180deg,var(--raise2),var(--raise));color:#fff}
.abtn:disabled{opacity:.4}
.raisepanel{background:rgba(10,20,15,.97);border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:8px}
.presets{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:10px}
.presets button{min-height:38px;border-radius:10px;background:var(--panel2);font-weight:800;font-size:13px}
.slide{display:flex;align-items:center;gap:10px}
.slide input[type=range]{flex:1;accent-color:var(--gold);height:32px}
.slide .val{min-width:84px;text-align:right;font-family:var(--display);font-weight:800;font-size:20px}
.waiting{text-align:center;color:var(--muted);font-size:14px;min-height:56px;display:flex;align-items:center;justify-content:center;gap:8px}
.sitout{display:flex;align-items:center;justify-content:space-between;gap:10px;background:rgba(224,86,75,.14);border-radius:12px;padding:10px 12px;margin-bottom:8px;font-size:14px}

.over{position:absolute;inset:0;background:rgba(4,10,7,.82);z-index:20;display:flex;align-items:center;justify-content:center;padding:20px}
.over .box{background:var(--panel);border-radius:20px;padding:18px;width:100%;max-width:380px;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.over h2{margin:0 0 4px;font-family:var(--display);font-size:24px}
.over p{margin:0 0 12px;color:var(--muted)}

/* ---------- the group game: tables to join, a table's lobby ---------- */
.codebox{display:flex;gap:8px;margin-top:10px}
.codebox input{flex:1;min-width:0;height:48px;border-radius:14px;border:1px solid var(--line);background:rgba(0,0,0,.28);color:var(--ink);font:inherit;font-size:18px;font-weight:800;letter-spacing:.3em;text-align:center;-webkit-user-select:text;user-select:text}
.codebox input::placeholder{letter-spacing:.04em;font-weight:600;font-size:15px;color:var(--faint)}
.codebox .btn{flex:none}
.linkbtn{display:block;width:100%;text-align:center;padding:12px 0 2px;color:#cfe4d7;font-weight:700;font-size:14px}
.status{font-size:12px;font-weight:700}
.status.wait{color:#6fe0a3}.status.play{color:var(--gold)}.status.full{color:var(--muted)}
.invite{display:flex;align-items:center;gap:10px;background:linear-gradient(90deg,rgba(229,184,80,.18),rgba(229,184,80,.06));border:1px solid rgba(229,184,80,.35);border-radius:14px;padding:10px 12px;margin-bottom:10px}
.invite .who{flex:1;min-width:0;font-size:14px}
.invite .who b{display:block}
.invite .who span{font-size:12px;color:var(--muted)}
.rtop{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.rtop .back,.top .back{width:36px;height:36px;border-radius:10px;background:rgba(255,255,255,.07);display:flex;align-items:center;justify-content:center;font-size:18px;flex:none}
.rtop .title{flex:1;min-width:0}
.rtop .title b{display:block;font-family:var(--display);font-size:18px}
.rtop .title span{font-size:12px;color:var(--muted)}
.bigcode{font-family:var(--display);font-size:44px;font-weight:800;letter-spacing:.12em;line-height:1;margin:2px 0 6px}
.seats6{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}
.slot{position:relative;display:flex;align-items:center;gap:10px;background:var(--panel);border-radius:14px;padding:10px;min-height:60px;min-width:0}
.slot .who{flex:1;min-width:0}
.slot .who b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slot .who span{font-size:11px;color:var(--muted)}
.slot.off{opacity:.55}
.slot.emptyslot{background:transparent;border:1px dashed rgba(255,255,255,.14);justify-content:center;color:var(--faint);font-size:13px;font-weight:700}
.slot .x{width:28px;height:28px;border-radius:8px;background:rgba(255,255,255,.07);color:var(--muted);font-size:15px;flex:none}
.avatar.house{background:linear-gradient(160deg,#7a1f1f,#3a0f0f);color:#f3e9d0;font-size:18px}
.seg{display:flex;background:var(--panel2);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;min-height:34px;border-radius:9px;font-weight:800;font-size:13px;color:var(--muted);white-space:nowrap}
.seg button.on{background:var(--ink);color:#0b1a12}

/* the all-in run-out: the river turns over slowly, after a beat face down */
#table.next .flip.slow .in{animation:dealslow 1.9s cubic-bezier(.25,.7,.25,1) both;animation-delay:var(--d,0ms)}
@keyframes dealslow{0%{transform:translate(var(--fx,90px),var(--fy,40px)) rotateY(180deg) scale(.6);opacity:0}8%{opacity:1}30%{transform:translate(0,0) rotateY(180deg) scale(1.08)}62%{transform:translate(0,0) rotateY(160deg) scale(1.1)}100%{transform:translate(0,0) rotateY(0) scale(1)}}
/* held while the board runs out: who won waits for the river */
#table.next.hhold .seat .tag.bounty,#table.next.hhold .dock .result{visibility:hidden}
#table.next.hhold .board .pc.win{box-shadow:inset 0 0 0 1px rgba(60,40,10,.12),0 3px 7px rgba(0,0,0,.45)}
#table.next.hhold .board .pc.dim{filter:none}
/* the deal: your cards fly in face down and turn over; everyone's face-down cards fly from the middle */
#table.next .mine>div>div:first-child{justify-content:center}
#table.next .mine .pc.big.hdeal{z-index:6;animation:hdeal .75s cubic-bezier(.2,.75,.25,1) both;animation-delay:var(--hd,0ms)}
#table.next .mine .pc.big.hdeal::after{content:"";position:absolute;inset:0;border-radius:inherit;background:radial-gradient(circle,rgba(242,201,94,.85) 0 .8px,transparent 1.3px) 0 0/5px 5px,linear-gradient(155deg,#1f7a50,#0d3f2a);box-shadow:inset 0 0 0 1.5px #f3e3b4;animation:hdealback .75s steps(1,end) both;animation-delay:var(--hd,0ms)}
@keyframes hdeal{0%{transform:translate(var(--fx,0),var(--fy,-160px)) scale(.45);opacity:0}15%{opacity:1}62%{transform:translate(0,0) scale(1)}81%{transform:scaleX(0)}100%{transform:none}}
@keyframes hdealback{0%{opacity:1}81%{opacity:0}100%{opacity:0}}
#table.next .seat .hole.hdeal{animation:hdealm .5s cubic-bezier(.2,.75,.25,1) both;animation-delay:var(--hd,0ms)}
@keyframes hdealm{from{transform:translate(var(--fx,0),var(--fy,0)) scale(.6) rotate(-30deg);opacity:0}20%{opacity:1}}
/* your turn: a gold sweep round the action buttons; your ring pulses in its last third */
#table.next .abar.hturn{position:relative}
#table.next .abar.hturn::before{content:"";position:absolute;inset:0;border-radius:15px;pointer-events:none;box-shadow:0 0 0 3px rgba(6,19,13,.9),0 0 0 5px rgba(242,201,94,.95),0 0 28px 4px rgba(229,184,80,.6);animation:hturn 1.5s ease-out both;animation-delay:var(--hd,0ms)}
#table.next .abar.hturn .abtn{position:relative;overflow:hidden}
#table.next .abar.hturn .abtn::after{content:"";position:absolute;top:0;bottom:0;left:-60%;width:45%;pointer-events:none;background:linear-gradient(100deg,transparent,rgba(255,255,255,.38),transparent);transform:skewX(-18deg);animation:hsheen 1.1s ease-in-out both;animation-delay:var(--hd,0ms)}
@keyframes hturn{0%{opacity:0;transform:scale(.97)}18%{opacity:1;transform:scale(1)}70%{opacity:.85}100%{opacity:0}}
@keyframes hsheen{0%{left:-60%}100%{left:130%}}
#table.next .seat.me.toact.hurry .ring{animation:hhurry .7s ease-in-out infinite alternate;animation-delay:var(--hp,0ms)}
@keyframes hhurry{from{box-shadow:0 0 0 0 rgba(224,86,75,0)}to{box-shadow:0 0 0 4px rgba(224,86,75,.45),0 0 18px rgba(224,86,75,.55)}}
/* someone goes all in: two red rings burst from the avatar */
#table.next .seat.hallin .ring::before,#table.next .seat.hallin .ring::after{content:"";position:absolute;inset:-3px;border-radius:50%;pointer-events:none;box-shadow:0 0 0 3px var(--red),0 0 14px rgba(224,86,75,.8);animation:hallin 1.1s ease-out both;animation-delay:var(--hd,0ms)}
#table.next .seat.hallin .ring::after{animation-delay:calc(var(--hd,0ms) + .3s)}
@keyframes hallin{from{transform:scale(1);opacity:1}to{transform:scale(1.9);opacity:0}}
/* a winner's seat: a gold glow that pulses, then stays */
#table.next .seat.hwin .ring{box-shadow:0 0 0 2px var(--gold),0 0 18px rgba(229,184,80,.7);animation:hwin .9s ease-in-out 3 alternate both;animation-delay:var(--hd,0ms)}
#table.next .seat.hwin .plate{border-color:rgba(229,184,80,.9)}
@keyframes hwin{from{box-shadow:0 0 0 2px var(--gold),0 0 10px rgba(229,184,80,.5)}to{box-shadow:0 0 0 3px #f7da8a,0 0 30px 6px rgba(229,184,80,.85)}}

/* the layer over the table: chips in flight, "+1,840", the banner, confetti, the run-out's dimming */
#hype{position:fixed;inset:0;pointer-events:none;z-index:30;overflow:hidden}
#hype.off{visibility:hidden}
#hype>*{position:absolute}
.hchip{width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;background:radial-gradient(circle,#fff 0 22%,var(--cc,#d23c3c) 23% 60%,#fff 61% 70%,var(--cc,#d23c3c) 71%);box-shadow:0 1px 3px rgba(0,0,0,.6);animation:hchip var(--ms,500ms) cubic-bezier(.45,.05,.4,1) both;animation-delay:var(--dl,0ms)}
@keyframes hchip{0%{transform:translate(0,0) scale(.9);opacity:0}12%{opacity:1}88%{opacity:1}100%{transform:translate(var(--x),var(--y)) scale(1);opacity:0}}
.hplus{transform:translate(-50%,-50%);font-family:var(--display);font-weight:900;font-size:17px;color:#f7da8a;text-shadow:0 2px 6px rgba(0,0,0,.8),0 0 10px rgba(229,184,80,.6);white-space:nowrap;animation:hplus 1.8s ease-out both;animation-delay:var(--dl,0ms)}
.hplus.me{font-size:21px}
@keyframes hplus{0%{opacity:0;transform:translate(-50%,-30%) scale(.7)}15%{opacity:1;transform:translate(-50%,-60%) scale(1.08)}75%{opacity:1}100%{opacity:0;transform:translate(-50%,-170%) scale(1)}}
.hplus.hold{animation:hplusin .4s ease-out both}
@keyframes hplusin{from{opacity:0;transform:translate(-50%,-30%) scale(.7)}to{opacity:1;transform:translate(-50%,-125%)}}
.hconf{width:7px;height:11px;margin:-5px 0 0 -3px;border-radius:2px;background:var(--c);animation:hconf 1.7s cubic-bezier(.15,.6,.35,1) both;animation-delay:var(--dl,0ms)}
.hconf:nth-child(3n){width:9px;height:9px;border-radius:50%}
@keyframes hconf{0%{transform:translate(0,0) rotate(0) scale(.4);opacity:1}45%{transform:translate(var(--x),var(--y)) rotate(calc(var(--r) * .6)) scale(1);opacity:1}100%{transform:translate(calc(var(--x) * 1.15),calc(var(--y) + 150px)) rotate(var(--r)) scale(.9);opacity:0}}
.hbanner{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;border-radius:16px;overflow:hidden;text-align:center;background:linear-gradient(180deg,rgba(28,22,8,.94),rgba(8,12,9,.94));box-shadow:inset 0 0 0 1.5px rgba(242,201,94,.9),0 10px 30px rgba(0,0,0,.6),0 0 40px rgba(229,184,80,.35);animation:hbanner var(--ms,2600ms) cubic-bezier(.2,.8,.2,1) both}
.hbanner.hold{animation:hbannerin .45s cubic-bezier(.2,.8,.2,1.2) both}
.hbanner::before{content:"";position:absolute;left:50%;top:50%;width:520px;height:520px;margin:-260px 0 0 -260px;background:repeating-conic-gradient(from 0deg,rgba(242,201,94,.13) 0 10deg,transparent 10deg 20deg);animation:hrays 6s linear infinite;z-index:-1}
.hbanner b{position:relative;font-family:var(--display);font-weight:900;font-size:26px;line-height:1.05;letter-spacing:.06em;color:#f7da8a;background:linear-gradient(180deg,#fff4cf,#f2c95e 45%,#c9962b);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;filter:drop-shadow(0 2px 2px rgba(0,0,0,.55));white-space:nowrap}
.hbanner span{position:relative;font-size:13px;font-weight:800;color:#f6e7bd;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:94%}
.hbanner b{font-size:var(--hf,26px)}.hbanner.me b{font-size:var(--hf,31px)}
.hbanner.me{box-shadow:inset 0 0 0 2px #f7da8a,0 10px 30px rgba(0,0,0,.6),0 0 60px rgba(229,184,80,.55)}
@keyframes hbanner{0%{opacity:0;transform:scale(.6)}12%{opacity:1;transform:scale(1.06)}20%{transform:scale(1)}85%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(.96)}}
@keyframes hbannerin{0%{opacity:0;transform:scale(.6)}70%{opacity:1;transform:scale(1.06)}100%{transform:scale(1)}}
@keyframes hrays{to{transform:rotate(360deg)}}
.hdim{-webkit-mask-image:linear-gradient(#000 86%,transparent);mask-image:linear-gradient(#000 86%,transparent);animation:hdim var(--ms,3000ms) ease-in-out both}
@keyframes hdim{0%{opacity:0}12%{opacity:1}88%{opacity:1}100%{opacity:0}}
.hlabel{transform:translate(-50%,-50%);font-weight:900;font-size:12px;letter-spacing:.14em;color:#fff;background:var(--red);padding:3px 10px;border-radius:999px;box-shadow:0 0 18px rgba(224,86,75,.7);animation:hdim var(--ms,3000ms) ease-in-out both}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app"><div id="boot" style="flex:1;display:flex;align-items:center;justify-content:center;color:var(--muted)">Shuffling up…</div></div>

const state={mode:'rooms',room:null,rooms:[],invites:[],me:null,ev:null,picker:null,leaveAsk:false,codeInput:'',shared:null,mine:null,table:null,view:'lobby',watching:null,tab:'board',raiseOpen:false,raiseTo:0,offset:0,lastHand:0,banner:null,offline:false,tv:!!P.tv,tvTables:{},pick:{},
  /* the big tables: from room:hello (the company's table), the chat sheet, and the table being watched */
  big:false,tables:null,chatOpen:false,chatDraft:'',chatSeen:0,chatRoom:null,watchCode:null,bubbles:{},bubbleRoom:null,chatIds:null,

const initials=n=>String(n||'?').trim().split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase();

function renderRoomsMode(){ const r=R(); if(!r)return renderRooms(); if(r.status==='lobby'||!r.table)return renderRoomLobby(); return renderTable(); }
const ordinal=n=>n+(['th','st','nd','rd'][(n%100-20)%10]||['th','st','nd','rd'][n%100]||'th');

/* An open sheet (the invite list, Leave the table?) is kept as it is when the
   screen behind it is drawn again: the table updates every second or so, and
   a button rebuilt between a finger going down and coming up never gets its
   tap (and the search box lost the keyboard). Only a sheet that changed is
   replaced. */
let keptSheet={html:'',node:null};
/* The chat sheet (a big table) goes one step further: it is held outside #app,
   so the table drawn again under it never takes away the box being typed in
   (or the phone's keyboard). Only its [data-live] parts are brought up to date,
   the message list keeping its place unless it was at the newest line. */
function keepChat(fresh){
  const held=keptSheet.node&&keptSheet.node.dataset.keep==='chat'&&keptSheet.node.isConnected?keptSheet.node:null;
  const html=fresh.outerHTML;
  if(held){
    if(keptSheet.html!==html){ held.querySelectorAll('[data-live]').forEach(el=>{ const nu=fresh.querySelector(`[data-live="${el.dataset.live}"]`); if(!nu||nu.innerHTML===el.innerHTML)return;
        const atEnd=el.scrollHeight-el.scrollTop-el.clientHeight<48; el.innerHTML=nu.innerHTML; if(atEnd)el.scrollTop=el.scrollHeight; });
      keptSheet.html=html; }
    fresh.remove(); return; }
  let layer=document.getElementById('layer'); if(!layer){ layer=document.createElement('div'); layer.id='layer'; document.body.appendChild(layer); }
  layer.textContent=''; layer.appendChild(fresh); keptSheet={html,node:fresh};
  const m=fresh.querySelector('.msgs'); if(m)m.scrollTop=m.scrollHeight; }
function keepSheet(focused){
  const fresh=app.querySelector('.sheet');

  if(keptSheet.node&&keptSheet.node.dataset.keep==='chat'){ keptSheet.node.remove(); keptSheet={html:'',node:null}; }
  if(!fresh){ keptSheet={html:'',node:null}; return; }
  const html=fresh.outerHTML;
  if(keptSheet.node&&keptSheet.html===html)fresh.replaceWith(keptSheet.node);
  else keptSheet={html,node:fresh};

function render(){ if(state.fatal){ app.innerHTML=`<div id="lobby"><div class="empty" style="text-align:center;margin-top:30vh">${esc(state.fatal)}</div></div>`; keepSheet(null); return; }
  const focused=document.activeElement&&document.activeElement.closest&&document.activeElement.closest('.sheet')?document.activeElement:null;
  if(state.mode==='rooms')renderRoomsMode(); else if(state.view==='table'||state.view==='watch')renderTable(); else renderLobby();
  keepSheet(focused); placeChat();

/* The chat sheet stops at the action buttons (under the table upright, beside it on its side): a turn is never behind it. */

async function watchTable(id){ try{ const d=await P.request('table:watch',{tableId:id}); state.watching=d.table; state.view='watch'; render(); }catch(err){ toast(err.message); } }

/* ---------- from the server ---------- */
function onTable(v){ if(!v||!v.id)return; if(v.now)state.offset=v.now-Date.now();
  if(state.tv&&state.tvTables[v.id]){ state.tvTables[v.id]=v; return render(); }
  if(v.round==='casual')return;
  if(v.mySeat!=null){ const prev=state.mode==='event'?state.table:null; state.table=v;
    if(prev&&prev.id===v.id&&v.toAct===v.mySeat&&prev.toAct!==v.mySeat){ haptic('medium'); chime(); }
    if(!prev||prev.handNo!==v.handNo)state.raiseOpen=false;
    if(state.mode==='event'&&state.view==='table')renderTable(); else if(state.view==='lobby'&&v.status==='playing'&&(!prev||prev.id!==v.id)){ state.mode='event'; state.view='table'; renderTable(); } }
  else if(state.watching&&state.watching.id===v.id){ state.watching=v; if(state.view==='watch')renderTable(); } }
let audio=null;
/* ---------- sounds at a big table: made here with WebAudio, no files ----------
   Quiet by default (a low master level), muted with the top bar's 🔊, which is
   remembered. Phones start audio only from a tap, so the first tap anywhere
   makes (or wakes) the audio context. A classic table is as it was. */
const SOUND_KEY='speedPoker.sound';
let soundOn=(()=>{ try{ return localStorage.getItem(SOUND_KEY)!=='off'; }catch(e){ return true; } })();
let master=null, noiseBuf=null;
function ctx(){ try{ audio=audio||new (window.AudioContext||window.webkitAudioContext)(); if(audio.state==='suspended')audio.resume().catch(()=>{}); return audio; }catch(e){ return null; } }
const bigOn=()=>state.big||!!(state.room&&state.room.big);
function unlockAudio(){ if(!bigOn()||!soundOn||(audio&&audio.state==='running'))return; const a=ctx(); if(!a)return;
  try{ const s=a.createBufferSource(); s.buffer=a.createBuffer(1,1,22050); s.connect(a.destination); s.start(0); }catch(e){} }
['pointerdown','touchend','keydown'].forEach(ev=>document.addEventListener(ev,()=>{ if(window.PokerSounds)window.PokerSounds.unlock(); },{capture:true,passive:true}));
function bus(){ const a=ctx(); if(!a)return null; if(!master){ master=a.createGain(); master.gain.value=.45; master.connect(a.destination); } return a; }
function tone(freq,dur,o){ o=o||{}; const a=bus(); if(!a)return; const t=a.currentTime+(o.at||0), osc=a.createOscillator(), g=a.createGain();
  osc.type=o.type||'sine'; osc.frequency.setValueAtTime(freq,t); if(o.to)osc.frequency.exponentialRampToValueAtTime(o.to,t+dur);
  g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(o.gain||.1,t+(o.attack||.005)); g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  osc.connect(g).connect(master); osc.start(t); osc.stop(t+dur+.03); }
function hiss(dur,o){ o=o||{}; const a=bus(); if(!a)return;
  if(!noiseBuf){ noiseBuf=a.createBuffer(1,Math.floor(a.sampleRate*.5),a.sampleRate); const d=noiseBuf.getChannelData(0); for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1; }
  const t=a.currentTime+(o.at||0), s=a.createBufferSource(), f=a.createBiquadFilter(), g=a.createGain();
  s.buffer=noiseBuf; f.type='bandpass'; f.Q.value=o.q||1; f.frequency.setValueAtTime(o.freq||2000,t); if(o.to)f.frequency.exponentialRampToValueAtTime(o.to,t+dur);
  g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(o.gain||.1,t+(o.attack||.006)); g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  s.connect(f).connect(g).connect(master); s.start(t); s.stop(t+dur+.03); }
const SFX={
  card:at=>{ hiss(.07,{at,gain:.16,freq:3400,to:1600,q:.9}); tone(1100,.03,{at,gain:.025,type:'triangle'}); },
  chips:()=>[0,.05,.11].forEach(d=>{ tone(2500+Math.random()*1100,.055,{type:'triangle',gain:.06,at:d}); hiss(.035,{at:d,gain:.05,freq:5200,q:2.5}); }),
  knock:()=>[0,.12].forEach(d=>{ tone(160,.1,{gain:.24,at:d,to:85}); hiss(.03,{at:d,gain:.05,freq:900,q:1.4}); }),
  fold:()=>hiss(.3,{gain:.07,freq:1500,to:320,q:.6,attack:.05}),
  win:()=>[523.25,659.25,783.99,1046.5].forEach((f,i)=>tone(f,.34,{type:'triangle',gain:.08,at:.15+i*.09})),
  pop:()=>tone(430,.09,{gain:.09,to:900}),
  // your turn: two short low buzzes, like a phone
  buzz:()=>[0,.17].forEach(d=>{ tone(150,.12,{type:'square',gain:.07,at:d}); tone(300,.12,{type:'square',gain:.025,at:d}); }),
};
function sfx(name,at){ if(!bigOn()||!soundOn)return; try{ SFX[name](at||0); }catch(e){} }
/** What changed at the table since the last view, as sounds: the deal, the board, a bet, a check, a fold, a pot won, a chat line. */
function roomSounds(prev,room,uid){ if(!soundOn||!prev)return;
  const known=new Set((prev.chat||[]).map(l=>l.id));
  if((room.chat||[]).some(l=>!known.has(l.id)&&l.userId!==uid))sfx('pop');
  const was=prev.table, v=room.table; if(!was||!v||was.id!==v.id)return;
  if(was.handNo!==v.handNo){ if(v.handNo){ sfx('card',0); sfx('card',.13); } return; }
  const nb=(v.board||[]).filter(Boolean).length, ob=(was.board||[]).filter(Boolean).length;
  const slow=hypeOn()&&runout(v);
  for(let i=ob;i<nb;i++)sfx('card',boardDelay(slow,i-ob)/1000);
  // next look: the win sound comes with the celebration, once the board is out (hypeSync)
  if(v.result&&!was.result){ if(!hypeOn()&&v.mySeat!=null&&v.result.pots.some(p=>p.winners.includes(v.mySeat)))sfx('win'); return; }
  if((v.pot||0)>(was.pot||0))return sfx('chips');
  if(v.seats.some(s=>s.folded&&was.seats[s.seat]&&!was.seats[s.seat].folded))return sfx('fold');
  if(v.seats.some(s=>(s.lastAction==='check'||s.lastAction==='timeout')&&!s.folded&&was.seats[s.seat]&&was.seats[s.seat].lastAction!==s.lastAction))sfx('knock'); }
/* The sounds' face to the page: update(prevRoom, room, myUserId) after each room view, toggle(), muted(), unlock() on a tap.
   A module pasted at POKER-SOUNDS below may take this name over; the page only ever calls window.PokerSounds. */
window.PokerSounds={
  update(prev,room,uid){ if(!room||!room.big)return; roomSounds(prev&&prev.code===room.code?prev:null,room,uid); },
  toggle(){ soundOn=!soundOn; try{ localStorage.setItem(SOUND_KEY,soundOn?'on':'off'); }catch(e){} if(soundOn){ unlockAudio(); sfx('pop'); } },
  muted(){ return !soundOn; },
  unlock(){ unlockAudio(); },
};
const soundButton=()=>{ const off=!!(window.PokerSounds&&window.PokerSounds.muted()); return `<button class="tbtn snd" data-act="sound" aria-label="${off?'Muted: tap for sound':'Sound on: tap to mute'}">${off?'🔇':'🔊'}</button>`; };
function chime(){ if(bigOn()&&window.PokerSounds&&window.PokerSounds.muted())return; try{ audio=audio||new (window.AudioContext||window.webkitAudioContext)(); const o=audio.createOscillator(), g=audio.createGain(); o.type='sine'; o.frequency.value=880; g.gain.setValueAtTime(.0001,audio.currentTime); g.gain.exponentialRampToValueAtTime(.15,audio.currentTime+.02); g.gain.exponentialRampToValueAtTime(.0001,audio.currentTime+.35); o.connect(g).connect(audio.destination); o.start(); o.stop(audio.currentTime+.4); }catch(e){} }

/* ---------- next look: a designed deck, chips that move, the big moments ----------
   Only for a company with `next` on (nextUi(), from room:hello) and only at a big table (#table.next). The
   effects that fly over the table (chips, "+1,840", the banner, confetti, the run-out's dimming) are drawn in
   #hype, a layer of their own outside #app: the table is drawn again every second or so and the layer is not,
   so each one plays once, start to end. What happened is found by comparing each view of the table with the
   one before, after every draw (a MutationObserver on #app); a table just opened has no news. What lives in
   the table itself (a seat's glow, the deal, your turn) is keyed by when it began and carries on from there
   with a negative animation delay, as the board's cards do. */
/** On for this company and this table. (nextUi is the gate; it may be missing in an older page, so typeof.) */
const hypeOn=()=>typeof nextUi==='function'&&!!nextUi()&&state.mode==='rooms'&&!!(state.room&&state.room.big);
/** No more betting: two or more still in, all of them (or all but one) all in, nobody to act. The board then runs out. */
function runout(v){ if(!v||!v.seats)return false; const live=v.seats.filter(s=>s.inHand&&!s.folded&&!s.left);
  return live.length>=2&&live.filter(s=>!s.allIn).length<=1&&v.toAct==null; }
/** When the board's last card has turned over (0 when nothing is being dealt). */
function boardDoneAt(v){ const a=state.boardAnim; if(!a||a.key!==`${v.id}:${v.handNo}`)return 0; let m=0;
  for(const i in a.at)m=Math.max(m,a.at[i]+(a.dur[i]||BOARD_ANIM_MS)); return m; }
/** The board cards already face up (a card still on its way, or about to be dealt, is not). */
function shownBoard(v){ const b=(v.board||[]).filter(Boolean), a=state.boardAnim, t=Date.now();
  if(!a||a.key!==`${v.id}:${v.handNo}`)return b;
  return b.filter((c,i)=>i<a.seen&&(a.at[i]==null||t>=a.at[i]+(a.dur[i]||BOARD_ANIM_MS)*.8)); }

/* Your hand in words, worked out here from your two cards and the board: "Pair of Queens", "Two pair, Kings and Nines". */
const RANKS='23456789TJQKA', RNAME=['Two','Three','Four','Five','Six','Seven','Eight','Nine','Ten','Jack','Queen','King','Ace'];
const many=r=>r===4?'Sixes':RNAME[r]+'s';
/** The best five of these cards: {cat: 0 high card .. 9 royal flush, text}. */
function bestHand(cards){ const cs=cards.map(c=>({r:RANKS.indexOf(c[0]),s:c[1]})).filter(c=>c.r>=0);
  const cnt=Array(13).fill(0), suits={}; cs.forEach(c=>{ cnt[c.r]++; (suits[c.s]=suits[c.s]||[]).push(c.r); });
  const high=rs=>{ const has=new Set(rs); for(let h=12;h>=3;h--){ let ok=true; for(let k=0;k<5;k++){ const r=h-k; if(!has.has(r<0?12:r)){ ok=false; break; } } if(ok)return h; } return -1; };
  const fs=Object.keys(suits).find(s=>suits[s].length>=5);
  if(fs){ const h=high(suits[fs]); if(h===12)return {cat:9,text:'Royal flush'}; if(h>=0)return {cat:8,text:`Straight flush, ${RNAME[h].toLowerCase()} high`}; }
  const quads=[], trips=[], pairs=[]; for(let r=12;r>=0;r--){ if(cnt[r]===4)quads.push(r); else if(cnt[r]===3)trips.push(r); else if(cnt[r]===2)pairs.push(r); }
  if(quads.length)return {cat:7,text:`Four ${many(quads[0])}`};
  if(trips.length&&(trips.length>1||pairs.length)){ const p=Math.max(trips[1]==null?-1:trips[1],pairs[0]==null?-1:pairs[0]); return {cat:6,text:`Full house, ${many(trips[0])} full of ${many(p)}`}; }
  if(fs)return {cat:5,text:`Flush, ${RNAME[Math.max(...suits[fs])].toLowerCase()} high`};
  const st=high(cs.map(c=>c.r)); if(st>=0)return {cat:4,text:`Straight, ${RNAME[st].toLowerCase()} high`};
  if(trips.length)return {cat:3,text:`Three ${many(trips[0])}`};
  if(pairs.length>=2)return {cat:2,text:`Two pair, ${many(pairs[0])} and ${many(pairs[1])}`};
  if(pairs.length)return {cat:1,text:`Pair of ${many(pairs[0])}`};
  return {cat:0,text:`${RNAME[Math.max(...cs.map(c=>c.r))]} high`}; }
/** Your hand in words with what it might become: {text, tier 0..3}. Before the flop: "Pair of Queens", or "Ace King suited". */
function handWords(hole,board){ hole=(hole||[]).filter(Boolean); board=(board||[]).filter(Boolean); if(hole.length<2)return null;
  if(!board.length){ const [a,b]=hole.map(c=>RANKS.indexOf(c[0])).sort((x,y)=>y-x);
    if(a===b)return {text:`Pair of ${many(a)}`,tier:a>=8?2:1};
    return {text:`${RNAME[a]} ${RNAME[b]}${hole[0][1]===hole[1][1]?' suited':''}`,tier:0}; }
  const h=bestHand([...hole,...board]), tier=h.cat>=4?3:h.cat>=2?2:h.cat===1?1:0;
  let draw='';
  if(board.length<5&&h.cat<4){ const all=[...hole,...board];
    const fl=Object.entries(all.reduce((m,c)=>(m[c[1]]=(m[c[1]]||0)+1,m),{})).find(([s,n])=>n===4&&hole.some(c=>c[1]===s));
    const rs=new Set(all.map(c=>RANKS.indexOf(c[0]))), mineR=hole.map(c=>RANKS.indexOf(c[0]));
    let sd=false; for(let h2=12;h2>=3&&!sd;h2--){ const win=[0,1,2,3,4].map(k=>h2-k<0?12:h2-k); if(win.filter(r=>rs.has(r)).length===4&&win.some(r=>mineR.includes(r)))sd=true; }
    draw=fl?' · flush draw':sd?' · straight draw':''; }
  return {text:h.text+draw,tier}; }
function handPill(hole,board){ const h=handWords(hole,board); return h?`<div class="hand hs t${h.tier}">${esc(h.text)}</div>`:'<div class="hand"></div>'; }

const HYPE={prev:null,potRect:null,betRects:[],seen:new Set(),deal:{hand:'',at:0},turn:{key:'',at:0},allin:{},win:null,hold:false,holdKey:'',dimKey:''};
const calm=()=>{ try{ return matchMedia('(prefers-reduced-motion: reduce)').matches; }catch(e){ return false; } };
function hypeLayer(){ let l=document.getElementById('hype'); if(!l){ l=document.createElement('div'); l.id='hype'; l.setAttribute('aria-hidden','true'); document.body.appendChild(l); } return l; }
/** One effect in the layer, at (x, y) on screen, gone after ms. */
function fx(cls,x,y,vars,ms,html){ const d=document.createElement('div'); d.className=cls; d.style.left=x+'px'; d.style.top=y+'px';
  for(const k in vars||{})d.style.setProperty(k,vars[k]); if(html)d.innerHTML=html; hypeLayer().appendChild(d); setTimeout(()=>d.remove(),ms); return d; }
const midOf=r=>({x:r.left+r.width/2,y:r.top+r.height/2});
const rectOf=el=>{ const r=el&&el.getBoundingClientRect(); return r&&r.width?{left:r.left,top:r.top,width:r.width,height:r.height,right:r.right,bottom:r.bottom}:null; };
/** A few chips sliding from one box to another. */
function chips(from,to,n,color,delay,ms){ if(!from||!to||calm())return; const a=midOf(from), b=midOf(to);
  for(let k=0;k<n;k++)fx('hchip',a.x+(k%2?3:-3),a.y-k*2,{'--x':(b.x-a.x)+'px','--y':(b.y-a.y+k*2)+'px','--cc':color||'#d23c3c','--dl':(delay+k*55)+'ms','--ms':(ms||480)+'ms'},delay+k*55+(ms||480)+60); }
function confetti(x,y,n,spread){ if(calm())return; const cols=['#f2c95e','#f7da8a','#2fbf71','#e0564b','#3f8cff','#ffffff'];
  for(let i=0;i<n;i++){ const ang=i/n*Math.PI*2+Math.random()*.5, r=spread*(.45+Math.random()*.55);
    fx('hconf',x,y,{'--x':Math.round(Math.cos(ang)*r)+'px','--y':Math.round(Math.sin(ang)*r*.7-spread*.3)+'px','--r':Math.round(Math.random()*720-360)+'deg','--c':cols[i%cols.length],'--dl':Math.round(Math.random()*140)+'ms'},2000); } }
/** Where an h-high banner fits: on the felt (the widest that fits, nearest under the board), else on its side in the
    empty top of the dock beside the table. First clear of everything; failing that (a short phone) it may cover other
    players' faces, never a card, a bet, the pot or a winner's seat (`keep`). Null when nowhere. */
function bannerSpot(tb,h,keep){ const st=rectOf(tb.querySelector('.stage')); if(!st)return null;
  const boxes=sel=>[...tb.querySelectorAll(sel)].map(rectOf).filter(Boolean);
  const cards=boxes('.stage .seat .hole,.stage .seat .shown,.stage .seat .bet,.stage .seat .dealer,.board .row>*,.center .pot,.center .actpop');
  const all=cards.concat(boxes('.stage .seat .ring,.stage .seat .plate,.stage .seat .tag,.stage .seat .bubble'));
  const mustSee=cards.concat((keep||[]).flatMap(el=>[...el.querySelectorAll('.ring,.plate,.tag')].map(rectOf).filter(Boolean)));
  const board=rectOf(tb.querySelector('.board'))||st, areas=[{r:st,want:board.bottom+10}];
  const dock=tb.classList.contains('wide')&&rectOf(tb.querySelector('.dock')), first=dock&&rectOf(tb.querySelector('.dock>*'));
  if(dock&&first&&first.top-dock.top>h+12)areas.push({r:{left:dock.left,right:dock.right,width:dock.width,top:dock.top,bottom:first.top},want:dock.top+(first.top-dock.top-h)/2});
  for(const busy of [all,mustSee])for(const {r,want} of areas)for(const w of [r.width-12,320,280,240,200]){ if(w>r.width-12||w<180)continue; const x=r.left+(r.width-w)/2; let best=null;
    for(let y=r.top+6;y+h<=r.bottom-4;y+=3){ if(busy.some(b=>b.left-4<x+w&&b.right+4>x&&b.top-4<y+h&&b.bottom+4>y))continue;
      const d=Math.abs(y-want); if(!best||d<best.d)best={x,y,w,d}; }
    if(best)return best; }
  return null; }

SFX.fanfare=()=>{ [523.25,659.25,783.99].forEach((f,i)=>tone(f,.16,{type:'square',gain:.03,at:i*.09})); [523.25,659.25,783.99,1046.5].forEach(f=>tone(f,.95,{type:'triangle',gain:.045,at:.3})); hiss(.6,{at:.3,gain:.03,freq:7000,q:.8}); };
SFX.allin=()=>{ tone(110,.5,{type:'sawtooth',gain:.045,to:55}); hiss(.45,{gain:.06,freq:500,to:120,q:.7}); };
SFX.slide=()=>[0,.06,.12,.18].forEach(d=>{ tone(2200+Math.random()*900,.05,{type:'triangle',gain:.045,at:d}); hiss(.04,{at:d,gain:.04,freq:5000,q:2}); });

/** Who won, by how much and how big a moment it is; played once the board is out. */
function celebrate(v,hand){ const res=v.result, tb=app.querySelector('#table.big.next'), cur=state.table;
  if(!tb||!res||!res.pots.length||!cur||`${cur.id}:${cur.handNo}`!==hand)return;
  celebrated(v,hand,tb,res); hypeSync(); }
function celebrated(v,hand,tb,res){
  const seatEls=[...tb.querySelectorAll('.stage .seat')], winners=[...new Set(res.pots.flatMap(p=>p.winners))];
  const won={}; res.pots.forEach(p=>p.winners.forEach(w=>{ won[w]=(won[w]||0)+Math.floor(p.amount/p.winners.length); }));
  const total=res.pots.reduce((a,p)=>a+p.amount,0), inPlay=Math.max(total,v.seats.reduce((a,s)=>a+(s.stack||0),0));
  const top=res.shown.find(s=>s.seat===res.pots[0].winners[0]), named=top&&top.best&&top.best.length===5?bestHand(top.best):null;
  const strong=!!named&&named.cat>=4, big=strong||total>=.4*inPlay, mine=v.mySeat!=null&&winners.includes(v.mySeat), hold=HYPE.hold;
  HYPE.win={hand,at:Date.now(),winners};
  const pot=HYPE.potRect||rectOf(tb.querySelector('.board')), H=mine?76:66, spot=big?bannerSpot(tb,H,winners.map(w=>seatEls[w]).filter(Boolean)):null;
  winners.forEach((w,i)=>{ const ring=rectOf(seatEls[w]&&seatEls[w].querySelector('.ring')); if(!ring)return;
    chips(pot,ring,6,'#d4a63a',i*120,620);
    if(spot)return;   // the banner says how much
    const m=midOf(ring); if(big)setTimeout(()=>confetti(m.x,m.y,26,90),520);
    fx('hplus'+(v.seats[w]&&v.seats[w].me?' me':'')+(hold?' hold':''),m.x,ring.top-6,{'--dl':(calm()?0:560+i*120)+'ms'},hold?3600e3:2600,`+${esc(fmt(won[w]))}`); });
  sfx('slide');
  if(mine){ sfx('win'); haptic('heavy'); const me=rectOf(seatEls[v.mySeat]&&seatEls[v.mySeat].querySelector('.ring')); if(me&&!big){ const m=midOf(me); setTimeout(()=>confetti(m.x,m.y,18,70),520); } }
  if(!big)return;
  sfx('fanfare');
  const names=winners.map(w=>v.seats[w]).map(s=>s.me?'You':/^bot:/.test(s.userId)?String(s.name).replace(/^House /,''):first(s.name));
  if(!spot)return;   // nowhere clear of the cards: the seat's confetti and "+amount" instead
  const head=strong?named.text.split(',')[0].toUpperCase():'BIG WIN';
  const line=`${names.join(' & ')} ${names.length>1?'split':names[0]==='You'?'win':'wins'} ${fmt(total)}${strong&&named.cat===6&&spot.w>=300?' · '+named.text.split(', ')[1]:''}`;
  const ms=hold?3600e3:mine?3000:2600, hf=Math.min(mine?31:26,Math.floor((spot.w-28)/(head.length*.8)));
  fx('hbanner'+(mine?' me':'')+(hold?' hold':''),spot.x,spot.y,{width:spot.w+'px',height:H+'px','--ms':ms+'ms','--hf':hf+'px'},ms,`<b>${esc(head)}</b><span>${esc(line)}</span>`);
  setTimeout(()=>confetti(spot.x+spot.w/2,spot.y+H/2,mine?44:30,mine?170:130),120); }

/** After every draw: what changed at the table since the last one, and the effects that go with it. */
function hypeSync(){
  const tb=app.querySelector('#table.big.next'), v=tb&&hypeOn()?(state.view==='watch'?state.watching:state.table):null;
  if(!v||!v.seats){ if(HYPE.prev){ hypeLayer().textContent=''; HYPE.prev=null; } return; }
  const t=Date.now(), p=HYPE.prev, hand=`${v.id}:${v.handNo}`, fresh=!p||p.id!==v.id, same=!fresh&&p.hand===hand;
  const seatEls=[...tb.querySelectorAll('.stage .seat')], quiet=calm();
  // a game-over box or a sheet in front of the table: nothing flies over it
  hypeLayer().classList.toggle('off',!!app.querySelector('.over,.sheet'));
  const potNow=rectOf(tb.querySelector('.center .pot'));
  const potAt=potNow||HYPE.potRect||rectOf(tb.querySelector('.board .row'));
  // chips: a bet made slides from the seat to its spot; at the end of a street the bets slide into the pot
  let swept=false;
  if(same)v.seats.forEach((s,i)=>{ const was=p.bets[i]||0, now=s.bet||0, el=seatEls[i]; if(!el)return;
    if(now>was&&now>0)chips(rectOf(el.querySelector('.ring')),rectOf(el.querySelector('.bet')),2,'#d23c3c',0,380);

  const room={code:'4821',you:'s0',hostId:mode==='room-guest'?'s1':'s0',status:'lobby',open:true,minutes:20,minutesOptions:[10,20,30],house:1,houseNames:['House Ace'],min:2,max:6,serverNow:t,gameNo:0,
    players:[pl(0),pl(1),pl(2),pl(3,{online:false})],invited:[],removed:[],waiting:false,table:null,finishedAt:null};
  if(mode==='room-table'||mode==='room-over'){ const v=state.table; v.round='casual'; room.status=mode==='room-over'?'over':'playing'; room.house=0; room.houseNames=[]; room.gameNo=1;
    room.players=v.seats.map(s=>pl(s.seat,{atTable:true,busted:s.busted})); v.seats[5].left=true; v.seats[5].folded=true;
    if(mode==='room-over'){ Object.assign(v,{status:'over',standings:[{userId:'s0',name:people[0],stack:5420,busted:false,knockouts:['a','b'],place:1},{userId:'s1',name:people[1],stack:2100,busted:false,knockouts:[],place:2},{userId:'s4',name:people[4],stack:1480,busted:false,knockouts:[],place:3},{userId:'s2',name:people[2],stack:0,busted:true,knockouts:[],place:4}]}); }
    room.table=v; }
  if(mode!=='rooms')state.room=room;
  state.table=null;
  if(state.room)onRoom(state.room); else render();
  if(mode==='invite'){ /* Like the app: at most 50, A to Z, filtered by name on the server. */
    const everyone=[...people.slice(4),...Array.from({length:76},(_,i)=>`${'ABCDEFGHIJKLMNOPQRSTUVWXYZ'[i%26]}${['arun','ita','ohan','eena'][i%4]} ${['Shah','Rao','Iyer'][i%3]}`)].sort().map((n,i)=>({userId:'c'+i,name:n,photoUrl:demoFace(i+4),designation:['Designer','Engineer','Sales lead','HR partner'][i%4]}));
    window.Sowaka={colleagues:(q)=>new Promise(r=>setTimeout(()=>r({colleagues:everyone.filter(p=>!q||p.name.toLowerCase().includes(String(q).toLowerCase())).slice(0,50)}),120))}; openPicker().then(()=>{ state.picker.sent=['c1']; render(); }); }
}
/* The big tables' previews: ?demo=rooms8 (the list, a full table to watch), room-lobby8, room-table8 (&raise=1, &chat=1,
   &showdown=1, &n=2..8 seats), room-watch8 (&free=1 a seat to take, &over=1 the game over). Chat lines typed here are
   kept on the page, and the table is drawn again every second, as the server's updates would. */
function bigDemo(mode,t,people){
  const q=new URLSearchParams(location.search), watch=mode==='room-watch8';
  const n=Math.max(2,Math.min(8,+q.get('n')||(watch&&q.get('free')==='1'?7:8)));
  state.big=true; state.tables={seats:8,buyIn:1000}; state.next=new URLSearchParams(location.search).get('next')==='1';
  const mini=i=>({userId:'d'+i,name:people[i],photoUrl:demoFace(i)});
  state.rooms=[{code:'4821',host:mini(1),status:'lobby',minutes:20,house:0,players:[1,2,3].map(mini),seats:8,free:5,seatFree:true,endsAt:null,watchable:false,watchers:0},
    {code:'7350',host:mini(4),status:'playing',minutes:30,house:1,players:[4,5,6,7,3].map(mini),seats:8,free:2,seatFree:true,endsAt:t+600000,watchable:true,watchers:1},
    {code:'6170',host:mini(8),status:'playing',minutes:20,house:1,players:[8,9,10,11,12,13,1].map(mini),seats:8,free:0,seatFree:false,endsAt:t+540000,watchable:true,watchers:3}];
  state.invites=[];
  const said=[['s4','Meera Iyer','Who raised from the cutoff 😅'],['s1','Rahul Mehta','Me. Fold if you are scared'],['w9','Pooja Nair','This table is wild',1],['s6','Tanya Bhatia','😂😂'],['s3','Arjun Deshpande','All in with a draw, as you do'],['s2','Priya Sharma','GG'],
    ['w10','Siddharth Pillai','Watching from the pantry ☕',1],['s4','Meera Iyer','Nice hand'],['s0',people[0],'Blinds go up in a minute'],['s1','Rahul Mehta','🔥'],['w9','Pooja Nair','Save me a seat after this one',1],['s7','Ishaan Kapoor','👍']];
  const chat=said.map(([userId,name,text,w],i)=>Object.assign({id:'c'+i,userId,name,text,at:t-(said.length-i)*40000},w?{watching:true}:{}));
  const S=(i,userId,name,stack,extra)=>Object.assign({seat:i,userId,name,photoUrl:/^bot:/.test(userId)?null:demoFace(i),office:null,stack,bet:0,folded:false,allIn:false,sittingOut:false,busted:false,left:false,inHand:true,button:false,sb:false,bb:false,toAct:false,me:false,cards:null,knockouts:0,lastAction:null},extra||{});
  const id=i=>(watch?'w':'s')+i, nm=i=>people[watch?i+1:i];
  let seats=[S(0,id(0),nm(0),2140,watch?{bet:160,lastAction:'call'}:{me:true,cards:['Qs','Qd'],toAct:true}),S(1,id(1),nm(1),860,watch?{toAct:true}:{bet:160,lastAction:'raise'}),S(2,id(2),nm(2),1320,{folded:true,lastAction:'fold'}),
    S(3,id(3),nm(3),0,{allIn:true}),S(4,id(4),nm(4),1045,{bet:160,lastAction:'call'}),S(5,'bot:1','House Ace',990,{folded:true,lastAction:'fold',button:true}),S(6,id(6),nm(6),1210,{lastAction:'check'}),S(7,id(7),nm(7),700)].slice(0,n);
  if(watch)seats[2].bet=0;
  const v={id:'demo8',round:'casual',label:null,status:'playing',now:t,startedAt:t-420000,endsAt:t+780000,level:{sb:20,bb:40},levelIndex:2,nextLevelAt:t+64000,nextLevel:{sb:30,bb:60},actionMs:20000,handNo:9,street:'flop',board:['Jh','7c','2d'],pot:1280,
    toAct:watch?1:0,deadline:t+14000,mySeat:watch?null:0,choices:watch?null:{toCall:160,canCheck:false,canRaise:true,minRaiseTo:320,maxRaiseTo:2140,pot:1280,currentBet:160},seats,result:null,nextHandAt:null,standings:null};
  if(q.get('showdown')==='1'){ Object.assign(v,{street:'done',toAct:null,choices:null,board:['Jh','7c','2d','Qc','9s'],pot:0,result:{showdown:true,pots:[{amount:1840,winners:[0],hand:'Three of a kind'}],shown:[{seat:0,cards:watch?['Ad','Kd']:['Qs','Qd'],best:['Qs','Qd','Qc','Jh','9s'],hand:'Three of a kind'},{seat:1,cards:['Jc','Js'],best:['Jc','Js','Jh','Qc','9s'],hand:'Three of a kind'}],busted:[]}});
    seats.forEach(s=>{ s.bet=0; s.toAct=false; }); seats[1].cards=['Jc','Js']; if(watch)seats[0].cards=['Ad','Kd']; }
  if(q.get('over')==='1'){ Object.assign(v,{status:'over',toAct:null,choices:null,standings:seats.filter(s=>!s.allIn).slice(0,5).map((s,i)=>({userId:s.userId,name:s.name,stack:[3420,2100,1480,700,0][i],busted:i===4,knockouts:i?[]:['a'],place:i+1}))}); }
  if(!watch&&mode==='room-table8')hypeDemo(q,v);
  const pl=s=>({userId:s.userId,name:s.name,photoUrl:s.photoUrl,online:true,atTable:true,busted:s.busted});
  const house=seats.filter(s=>/^bot:/.test(s.userId)).length;
  const room={code:watch?'6170':'7350',you:'s0',hostId:watch?'w1':'s0',status:v.status==='over'?'over':'playing',open:true,minutes:20,minutesOptions:[10,20,30],house,houseNames:['House Ace'].slice(0,house),min:2,max:8,buyIn:1000,big:true,serverNow:t,gameNo:2,
    players:seats.filter(s=>!/^bot:/.test(s.userId)).map(pl),invited:[],removed:[],waiting:false,table:v,finishedAt:null,watching:watch,
    watchers:watch?[mini(0),mini(9),mini(10)].map(w=>Object.assign(w,{userId:w.userId==='d0'?'s0':w.userId})):[mini(9)],chat};
  if(mode==='room-lobby8')Object.assign(room,{code:'4821',status:'lobby',table:null,house:1,houseNames:['House Ace'],gameNo:0,watching:false,watchers:[],chat:chat.slice(-4),
    players:[0,1,2,3].map(i=>({userId:'s'+i,name:people[i],photoUrl:demoFace(i),online:i!==3,atTable:false,busted:false}))});
  P.request=(ev,p)=>{ const r=state.room;
    if(ev==='room:chat'&&r){ r.chat=[...(r.chat||[]),Object.assign({id:'c'+Date.now(),userId:'s0',name:people[0],text:String(p.text).slice(0,200),at:Date.now()},r.watching?{watching:true}:{})].slice(-40); setTimeout(()=>onRoom(Object.assign({},r)),80); return Promise.resolve({}); }
    if(ev==='room:unwatch')return Promise.resolve({});
    return Promise.reject(new Error('Demo: nothing is sent.')); };
  state.table=null;
  if(q.get('pop')==='1')state.actionPop={text:'Ishaan raised to 1,480',until:Date.now()+3600e3};
  if(q.get('bubbles')==='1'&&room.table){ const far=Date.now()+3600e3, say=['Nice hand!','All in?? 😂','GG','I fold, too rich for me','🔥🔥']; room.table.seats.slice(0,5).forEach((x,i)=>{ state.bubbles[x.userId]={text:say[i],until:far}; }); }
  if(mode!=='rooms8'){ state.room=room; state.chatOpen=q.get('chat')==='1'; onRoom(room);
    if(q.get('raise')==='1'&&!watch){ state.raiseOpen=true; state.raiseTo=480; render(); }
    // Someone says something: the unread count (or, with the chat open, a new line).
    setTimeout(()=>{ const r=state.room; if(!r)return; r.chat=[...r.chat,{id:'in1',userId:'s4',name:'Meera Iyer',text:'Your turn, take your time',at:Date.now()}]; onRoom(Object.assign({},r)); },state.chatOpen?2500:700);
    setInterval(()=>{ if(state.room)onRoom(Object.assign({},state.room)); },1000); }
  else render();
}
/*POKER-SOUNDS*/
start();
})();
