<style>
:root{
  --ink:#160D2C;--ink2:#150C2E;--night:#2D1D55;--nightBorder:#50368B;--rowBorder:#4A3A8C;
  --page:#FFF9ED;--pageDot:#FFEEBA;--cream:#FFF8E3;--cream2:#FFF6E5;--yellow:#FFCC2E;--yellow2:#FFC531;
  --pink:#FF5094;--pink2:#FF5C93;--lilac:#C7BDDE;--purpleArt:#8FA0FF;
  --blue:#5CC8FF;--blueArt:#BCEDFF;--mint:#73E7BF;--mintArt:#E6FFF6;--green:#2EE6A6;--ctaInk:#078442;
  --muted:#4A4266;--secondary:#484848;
  /* The Connect look (12 Oct 2026): cream cards with a soft shadow, Sora for reading text. Lilita One
     stays for game names and headings so it still feels like Games. */
  --card:#FFFCF4;--line:#EADCBE;--text:#1D1B2C;--sub:#6B6A7B;--soft:0 3px 0 #EADCBE;--well:#F3E9D2;
  --lil:'Lilita One','Arial Rounded MT Bold','Trebuchet MS',system-ui,sans-serif;
  --sora:'Sora',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --fig:'Figtree',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --eo:cubic-bezier(0,0,.58,1);--eoc:cubic-bezier(.215,.61,.355,1);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--page);color:var(--text);
  -webkit-text-size-adjust:100%;text-size-adjust:100%;-webkit-font-smoothing:antialiased}
body{font-family:var(--sora);-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  /* The page's dot grid (3575:28025): 3pt dots every 18.2pt, from 9.5pt in. */
  background-image:radial-gradient(circle at 9.1px 9.1px,var(--pageDot) 1.5px,transparent 1.75px);
  background-size:18.2px 18.2px;background-position:.4px .4px}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;-webkit-appearance:none;appearance:none}
img{-webkit-user-drag:none}
svg{overflow:visible}
.lil{font-family:var(--lil);font-weight:400}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tab{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
[hidden]{display:none!important}

#app{position:fixed;inset:0;display:flex;flex-direction:column}
.panes{position:relative;flex:1;min-height:0}
.pane{position:absolute;inset:0;overflow-x:hidden;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain}

/* ---------------------------------------------------------------- header */
#hdr{flex:none;padding:0 16px}
.hdr-top{height:58px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.brand{display:flex;align-items:center;min-width:0}
.brand-badge{height:26px;padding:0 10px;border-radius:8px;background:#B23500;color:#fff;display:flex;align-items:center;
  font:800 12px/15.12px var(--sora)}
.brand-logo{height:26px;padding:4px 8px;border-radius:8px;background:#fff;border:1px solid rgba(22,13,44,.1);display:flex;align-items:center}
.brand-logo img{height:18px;width:auto;display:block}
.games-box{width:70.214px;height:28.577px;margin-left:-8px;display:flex;align-items:center;justify-content:center;flex:none}
.games-badge{height:25px;padding:0 10px;border-radius:7px;background:var(--yellow);box-shadow:0 2px 0 var(--ink);
  transform:rotate(-3deg);display:flex;align-items:center;font:15px/17.14px var(--lil);color:var(--ink);white-space:nowrap}
.pts{height:32px;padding:0 12px;border-radius:30px;background:var(--card);border:1px solid var(--line);box-shadow:var(--soft);
  display:flex;align-items:center;justify-content:center;font:800 14px/18px var(--sora);letter-spacing:-.16px;color:var(--text);white-space:pre;flex:none}
/* the GAMES / LEADERBOARD switch: a segmented control in a well */
.switch{margin-top:4px;height:48px;padding:4px;border-radius:14px;background:var(--well);display:flex;align-items:center;gap:4px}
.sw-act,.sw-tap{flex:1;height:40px;border-radius:11px;display:flex;align-items:center;justify-content:center;
  font:700 15px/20px var(--sora);white-space:nowrap}
.sw-act{padding:0 10px;gap:7px;background:var(--card);box-shadow:0 1px 3px rgba(20,16,40,.12);color:var(--text)}
.sw-act.board{padding:0 12px}
.sw-tap{min-width:0;color:#7A6F5C}
.sw-tap.board{gap:7px}.sw-tap.games{gap:6px}
.gp{width:16px;height:16px;flex:none;display:block}
.rank{padding:1px 7px;border-radius:8px;background:var(--yellow);color:var(--ink);font:800 11px/16px var(--sora);flex:none}

/* ---------------------------------------------------------------- shared */
.face{position:relative;display:inline-flex;align-items:center;justify-content:center;border-radius:50%;flex:none;overflow:hidden;
  font-family:var(--fig);font-weight:800;color:var(--ink2);line-height:1.2}
.face img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:50%}
.cta{position:relative;display:block;flex:none;touch-action:manipulation}
.cta-in{position:absolute;inset:0;transition:transform 70ms linear;pointer-events:none}
.cta:active:not(:disabled) .cta-in{transform:translateY(3%)}
.cta:disabled{opacity:.55;cursor:default}
.cta img{position:absolute;display:block;left:1.2227%;top:10.9583%;width:96.9547%;height:80.1385%}
.cta.small img{left:5.3555%;top:17.758%;width:89.25%;height:64.488%}
.cta-l{position:absolute;left:0;right:0;top:calc(var(--lc,.446) * 100% - var(--fs));height:calc(var(--fs) * 2);display:flex;align-items:center;justify-content:center;
  font:700 var(--fs)/var(--fs) var(--sora);letter-spacing:-.16px;color:var(--ctaInk);white-space:nowrap;overflow:hidden}

/* ---------------------------------------------------------------- games pane */
.gbody{padding-bottom:24px}

/* the pulsing LIVE badge that heads the live section */
.live-h{padding:4px 16px 12px;display:flex}
.live-b{display:inline-flex;align-items:center;gap:7px;padding:5px 12px 5px 10px;border-radius:999px;background:#16C172;
  font:800 13px/18px var(--sora);color:#fff;letter-spacing:.14em;box-shadow:0 0 0 0 rgba(22,193,114,.5);
  animation:livebadge 1.6s ease-in-out infinite}
.live-d{position:relative;width:8px;height:8px;border-radius:50%;background:#fff;flex:none}
.live-d::after{content:"";position:absolute;inset:0;border-radius:50%;background:#fff;animation:liveping 1.6s ease-out infinite}
@keyframes liveping{0%{transform:scale(1);opacity:.85}80%,100%{transform:scale(2.6);opacity:0}}
@keyframes livebadge{0%,100%{box-shadow:0 0 0 0 rgba(22,193,114,.5)}50%{box-shadow:0 0 0 7px rgba(22,193,114,0)}}
#app.paused .live-b,#app.paused .live-d::after{animation-play-state:paused}
#app.still .live-b,#app.still .live-d::after{animation:none}

/* live cards (3755:28496), one under the other, and the challenge cards in the same frame */
.live,.chs{display:flex;flex-direction:column;gap:12px;padding:0 16px 2px}
.lc{position:relative;flex:none;width:100%;min-height:196px;border-radius:20px;background:var(--card);box-shadow:var(--soft);
  overflow:hidden;display:flex;flex-direction:column;text-align:left;isolation:isolate}
.lc::after{content:"";position:absolute;inset:0;border:1.5px solid var(--line);border-radius:20px;pointer-events:none;z-index:3}
.strip{position:relative;flex:none;background:#FBF2DE;border-radius:20px 20px 0 0;padding:6px 10px;border-bottom:1px solid var(--line);display:flex;align-items:center}
.strip .who{flex:1;min-width:0;padding:3px 4px;display:flex;align-items:center;gap:6px}
.strip .who span{font:600 11px/16px var(--sora);color:var(--sub)}
.strip .clk{padding:3px 8px;flex:none;font:800 12.5px/18px var(--sora);letter-spacing:.3px;color:var(--text);white-space:nowrap}
.intro{margin-top:12px;padding:0 16px;display:flex;align-items:flex-start;gap:5px;flex:0 1 auto;min-height:0}
.lt{flex:1;min-width:0;padding-left:6px;overflow:hidden}
.lt-t{font-family:var(--lil);font-size:26px;line-height:31px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lt-t.two{white-space:normal;overflow-wrap:anywhere;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2}
.lt-d{margin-top:2px;font:500 13px/18px var(--sora);color:var(--sub);display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;overflow:hidden}
.foot{margin-top:10px;padding:2px 16px 14px;display:flex;align-items:flex-start;flex:none}
.foot .l{flex:1;min-width:0;padding-bottom:3px;display:flex;align-items:center}
.foot .arw{width:20px;height:20px;flex:none;transform:scaleX(-1);display:block;color:var(--sub)}
.foot.cta-foot{align-items:center;padding:0 12px 12px 16px}
.foot.cta-foot .l{padding-bottom:0}
.foot.cta-foot .pile{height:28px}
.ft{display:flex;align-items:center;gap:8px;min-width:0}
.ft.g6{gap:6px}
.ft-t{font:500 12px/16px var(--sora);color:var(--sub);min-width:0}
.ft-t.vs{font-weight:700;font-size:13px;color:var(--text)}
.pile{position:relative;height:24px;flex:none}
.pile>*{position:absolute;top:0}
.more{width:24px;height:24px;border-radius:50%;background:var(--text);border:1.5px solid #fff;display:flex;align-items:center;justify-content:center;
  font:400 10px/12.6px var(--sora);color:#fff}

/* the live card's picture (3690:43101) */
.it{width:92px;height:92px;flex:none;display:flex;align-items:center;justify-content:center}
.tile{width:84px;height:84px;border:2px solid var(--ink);border-radius:20px;box-shadow:0 3px 0 var(--ink);overflow:hidden;position:relative;transform:rotate(5deg)}
.tile-in{position:absolute;inset:0;border-radius:21.5px;overflow:hidden}
.tile-fit{position:absolute;inset:var(--pad,6px);display:flex}
.tile-fit>svg{width:100%;height:100%;display:block}
.tile-fill{position:absolute;inset:0;display:flex}
.tile-fill>.pic{width:100%;height:100%}
.pa{position:absolute;left:0;top:0;width:88.392px;height:90.641px}
.pa>*{position:absolute;display:block}
.pa svg{width:100%;height:100%;display:block}
.cyc{position:absolute;left:0;top:0;width:85px;height:85px;overflow:hidden}
.cyc-i{position:absolute;inset:0}
.cyc-i>img{width:100%;height:100%;object-fit:cover;display:block}
.cyc-pic{position:absolute;left:0;top:0;width:85px;height:85px;object-fit:cover;display:block}
.cap{position:absolute;inset:0;padding:8px 7px 7px;display:flex;flex-direction:column;align-items:center;text-align:center}
.cap.over{background:linear-gradient(rgba(0,0,0,.25),rgba(0,0,0,.55))}
.cap-q{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
.cap-q span{font:800 10.5px/12.6px var(--fig);color:var(--ink);display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:4;overflow:hidden;overflow-wrap:anywhere}
.cap-n{font:700 9px/10.8px var(--fig);color:var(--ink2);max-width:100%}
.cap.over .cap-q span,.cap.over .cap-n{color:#fff;text-shadow:0 0 3px rgba(0,0,0,.6)}
.ml{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 4px}
.ml-f{width:46px;height:46px;border-radius:50%;background:var(--cream);border:2px solid var(--ink);display:flex;align-items:center;justify-content:center;overflow:hidden;
  font:20px/22.86px var(--lil);color:var(--ink);position:relative}
.ml-f img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ml-n{margin-top:5px;font:800 11px/13.2px var(--fig);color:var(--ink);max-width:100%}
.pic{display:flex;align-items:center;justify-content:center;overflow:hidden}
.pic>img{width:100%;height:100%;object-fit:cover;display:block}
.pic>svg{width:100%;height:100%;display:block}
.pic .ph{font:40px/45.7px var(--lil);color:var(--ink2)}

/* motion (Figma 3573:61034's 1.5 s loop) */
@keyframes rock{0%{transform:rotate(5deg);animation-timing-function:var(--eo)}50%{transform:rotate(-10deg);animation-timing-function:var(--eo)}100%{transform:rotate(5deg)}}
@keyframes land{0%{transform:scale(1.2);animation-timing-function:var(--eo)}33.333%{transform:scale(1)}100%{transform:scale(1)}}
@keyframes blink{0%{opacity:0;animation-timing-function:var(--eo)}5.908%{opacity:1}100%{opacity:1}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.55}}
@keyframes spin{to{transform:rotate(360deg)}}
.rock{animation:rock 1.5s infinite}
.land{animation:land 1.5s infinite}
.blink{animation:blink 1.5s infinite}
#app.paused .rock,#app.paused .land,#app.paused .blink,#app.paused .sk{animation-play-state:paused}
#app.still .rock,#app.still .land,#app.still .blink,#app.still .sk{animation:none}

/* all games: an app-store style list (games you have played first, with your rank) */
.gl-wrap{padding:10px 16px 0}
.gl-h{padding:8px 1px 10px}
.gl-h .t{font:19px/26px var(--lil);letter-spacing:.2px;color:var(--text)}
.gl{background:var(--card);border:1.5px solid var(--line);border-radius:20px;box-shadow:var(--soft);padding:2px 14px}
.gl-r{display:flex;align-items:center;gap:12px;padding:12px 0;position:relative}
.gl-r+.gl-r::before{content:"";position:absolute;top:0;left:84px;right:0;height:1px;background:var(--line)}
.gl-i{width:72px;height:72px;flex:none;display:flex;align-items:center;justify-content:center}
.gl-i .it{width:72px;height:72px}
.gl-i .tile{width:64px;height:64px;border-radius:16px;transform:none}
.gl-i .tile-in{border-radius:14px}
.gl-i .pic .ph{font-size:30px}
.gl-m{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.gl-l{font:600 11px/14px var(--sora);color:var(--sub)}
.gl-n{display:flex;align-items:center;gap:6px;min-width:0;font:19px/24px var(--lil);color:var(--text)}
.gl-n .ell{min-width:0}
.gl-rk{flex:none;padding:1px 7px;border-radius:8px;background:var(--yellow);border:1px solid rgba(22,13,44,.2);font:800 11.5px/17px var(--sora);color:var(--ink);white-space:nowrap}
.gl-rk i{font-style:normal;font-weight:600;opacity:.7}
.gl-s{display:flex;align-items:center;gap:6px;min-width:0;margin-top:2px;font:500 12.5px/17px var(--sora);color:var(--sub)}
.gl-s .ell{min-width:0}
.get{flex:none;min-width:68px;height:32px;padding:0 16px;border-radius:999px;background:var(--well);font:800 14px/32px var(--sora);color:var(--ctaInk);text-align:center}
.get:active:not(:disabled){transform:scale(.96)}
.get:disabled{opacity:.5}
.gl-empty{padding:18px 4px;font:500 13px/18px var(--sora);color:var(--sub);text-align:center}
.pn{padding:16px 0 20px}
.pn-in{height:42px;padding:5px 12px;border-radius:999px;border:1.1px solid var(--rowBorder);display:flex;align-items:center;justify-content:center;gap:8px}
.pn-f{position:relative;height:20px;flex:none}
.pn-f b{position:absolute;top:0;width:20px;height:20px;border-radius:50%;border:1.1px solid var(--ink2);display:flex;align-items:center;justify-content:center;
  font:800 7px/8.75px var(--fig);color:var(--ink2)}
.pn-t{font:400 9.5px/11.875px var(--fig);color:var(--secondary);min-width:0}

/* loading and failure */
.err{padding:110px 32px 24px;text-align:center}
.err p{margin:0;font:400 14px/20px var(--sora);color:var(--secondary)}
.err button{margin-top:14px;padding:10px 12px;font:700 14px/18px var(--sora);color:var(--night)}
.sk{animation:pulse 1.4s ease-in-out infinite}
.sk-b{background:#F1EAE0;border-radius:20px}
.spin{width:26px;height:26px;margin:0 auto;border-radius:50%;border:2.4px solid rgba(45,29,85,.14);border-top-color:var(--night);animation:spin .8s linear infinite}
#app.still .spin{animation-duration:2.4s}

/* pull to refresh */
.ptr{position:absolute;left:50%;top:0;width:36px;height:36px;margin-left:-18px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.18);
  display:flex;align-items:center;justify-content:center;transform:translateY(-44px);z-index:5;pointer-events:none;opacity:0}
.ptr i{width:20px;height:20px;border-radius:50%;border:2.4px solid rgba(45,29,85,.14);border-top-color:var(--night);display:block}
.ptr.go i{animation:spin .8s linear infinite}

/* ---------------------------------------------------------------- leaderboard (3623:31816) */
.lb{padding-bottom:24px}
/* the last rows scroll clear of the sticky rank card */
#app:has(#sticky:not([hidden])) .lb{padding-bottom:112px}
.lb.has-me{padding-bottom:104px}
.hero{position:relative;height:115px}
.hero div{position:absolute;left:0;right:0;height:65px;display:flex;align-items:center;justify-content:center;font:22px/27.43px var(--lil);color:var(--text);white-space:nowrap}
.hero .a{top:12px;text-shadow:0 3px 0 #C9C3FF}
.hero .b{top:50px}
.period{width:263px;height:44px;margin:0 auto;padding:4px;border-radius:12px;background:var(--well);display:flex;align-items:center;justify-content:space-between}
.seg{flex:1;padding:8px 0;text-align:center;font:700 13px/16.38px var(--sora);color:#7A6F5C;white-space:nowrap}
.seg.on{border-radius:9px;background:var(--card);color:var(--text);box-shadow:0 1px 3px rgba(20,16,40,.12)}
/* the podium: the top five, 4 · 2 · 1 · 3 · 5, so the winner stands in the middle */
.podium{margin:14px 16px 0;position:relative;border-radius:18px;background:#EAF3FF;overflow:hidden}
.podium::after{content:"";position:absolute;inset:0;border:1px solid var(--line);border-radius:18px;pointer-events:none}
.rays{position:absolute;left:.06%;top:-32.3%;width:100%;height:147.99%;opacity:.18;display:block}
.pod-in{position:relative;padding:18px 8px 12px;display:flex;flex-direction:column;align-items:center}
.top3{font:700 11px/13.86px var(--sora);color:var(--secondary)}
.places{margin-top:12px;width:100%;display:flex;align-items:flex-end;gap:5px}
.place{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center}
.medal{width:32px;height:32px;display:flex;align-items:center;justify-content:center;font-size:18px;line-height:22px}
.medal.one{border-radius:50%;background:#FFF3B8}
.medal.one img{width:18px;height:18px;display:block}
.medal .pos{width:22px;height:22px;border-radius:50%;background:var(--card);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;
  font:800 11px/1 var(--sora);color:var(--sub)}
.place.p4 .medal,.place.p5 .medal{height:26px}
.frame{margin-top:8px;border-radius:50%;background:#fff;border:3px solid;box-shadow:0 5px 10px rgba(40,52,90,.13);display:flex}
.pl-n{margin-top:8px;max-width:100%;font:700 11.5px/15px var(--sora);color:#202236;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{margin-top:8px;width:100%;padding:10px 4px 0;border-radius:12px 12px 4px 4px;display:flex;flex-direction:column;align-items:center}
.bar .p{font:800 16px/20px var(--sora);color:#fff;white-space:nowrap}
.bar .u{margin-top:2px;font:600 9px/12.6px var(--sora);letter-spacing:.4px;color:rgba(255,255,255,.91)}
.bar.one .p{color:#202236}.bar.one .u{color:#564800}
.pod-empty{margin:14px 16px 0;padding:22px 20px;border-radius:18px;background:#EAF3FF;border:1px solid #EBEBEB;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.pod-empty .h{font:18px/20.57px var(--lil);color:var(--night)}
.pod-empty .s{font:400 12px/17px var(--sora);color:var(--secondary)}
.rows{margin-top:14px;padding:0 16px;display:flex;flex-direction:column;gap:8px}
.row{height:57px;padding:5px 9px;border-radius:12px;background:var(--card);border:1px solid var(--line);box-shadow:var(--soft);display:flex;align-items:center;color:var(--text)}
[data-act="person"]{cursor:pointer}
.row[data-act="person"]:active,.place[data-act="person"]:active{transform:scale(.98)}
.row.me{height:61px;background:#FFF7DC;border-color:#F5D86B;color:var(--ink2)}
.row .rk{width:24px;flex:none;text-align:center;font:17px/19.43px var(--lil);white-space:nowrap;overflow:hidden}
.row .av{width:33px;margin-left:5px;flex:none;display:flex}
.row .nm{flex:1;min-width:0;margin-left:5px;display:flex;flex-direction:column;justify-content:center}
.row .nm1{display:flex;align-items:center;min-width:0}
.row .nm1 span{font:700 11.5px/17.25px var(--fig);min-width:0}
.you{margin-left:4px;height:14px;padding:0 2.85px;border-radius:5px;background:var(--yellow2);border:1.1px solid var(--ink2);display:flex;align-items:center;
  font:700 8px/12px var(--fig);color:var(--ink2);flex:none}
.row .dp{font:400 8.5px/12.75px var(--fig);color:var(--sub)}
.row.me .dp{color:var(--muted)}
.row .pt{min-width:34px;margin-left:5px;flex:none;font:700 13px/19.5px var(--fig);white-space:nowrap}
.row .mv{min-width:38px;margin-left:5px;flex:none;text-align:right;font:400 13px/19.5px var(--fig);white-space:nowrap}
.mv.up{color:#16A34A}.mv.down{color:#E11D48}
.lb-wait{padding:60px 32px 24px;text-align:center}
.lb-wait p{margin:0;font:400 14px/20px var(--sora);color:var(--secondary)}
.lb-wait button{margin-top:6px;padding:10px 12px;font:700 14px/18px var(--sora);color:var(--night)}
/* the viewer's rank card, stuck to the bottom */
.sticky{position:absolute;left:0;right:0;bottom:0;padding:10px 8px;background:rgba(255,255,255,.08);-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px);z-index:4}
.st-in{height:69px;padding:6px 16px;border-radius:17px;background:var(--yellow2);border:1px solid rgba(22,13,44,.18);box-shadow:0 6px 20px rgba(20,16,40,.16);display:flex;align-items:center}
.st-b{width:58px;flex:none;display:flex}
.st-b .badge{transform:rotate(4deg)}
.badge{width:55px;height:52px;border-radius:12px;background:var(--ink2);box-shadow:0 2px 0 var(--ink2);display:flex;flex-direction:column;align-items:center;justify-content:center}
.badge .r{font:22px/19.8px var(--lil);color:var(--yellow2);white-space:nowrap}
.badge .y{padding-top:3px;font:800 7px/10.5px var(--fig);color:var(--yellow2);white-space:nowrap}
.st-m{flex:1;min-width:0;margin-left:7px;display:flex;flex-direction:column;justify-content:center}
.st-r{display:flex;align-items:center;justify-content:space-between;gap:8px}
.st-r .x{font:20px/22.86px var(--lil);color:var(--ink2);white-space:nowrap}
.st-r .s{font:800 9px/13.5px var(--fig);color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.bar8{height:8px;border-radius:99px;background:var(--cream2);border:1.1px solid rgba(22,13,44,.25);overflow:hidden}
.bar8 i{display:block;height:100%;background:var(--pink2)}
.st-l{padding-top:3px;font:800 8px/12px var(--fig);color:var(--ink2);text-align:center}

#toast{position:fixed;left:50%;bottom:24px;max-width:calc(100% - 48px);transform:translate(-50%,12px);padding:10px 16px;border-radius:14px;background:var(--text);color:var(--cream);
  font:600 13px/18px var(--sora);text-align:center;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;z-index:9}
#toast.on{opacity:1;transform:translate(-50%,0)}
</style>
