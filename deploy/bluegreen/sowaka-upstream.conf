# The API process nginx sends traffic to: /etc/nginx/sowaka-upstream.conf, included by the
# `sowaka_api` upstream (docs/deploy/nginx-sowaka.conf). bluegreen.sh rewrites this one line
# (4000 = blue, 4001 = green), checks the config and reloads nginx; nothing else changes it.
server 127.0.0.1:4000;
